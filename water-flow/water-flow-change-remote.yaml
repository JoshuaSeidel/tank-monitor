# WATER FLOW -- CHANGE. The sealed, battery-powered 1/2" flow meter on the
# water-change hose (drain into the Brute, refill from it), on an AITRIP
# ESP32 Lite (LOLIN32 Lite clone) with a 1S LiPo in its JST socket. Put
# THIS file in the ESPHome dashboard; nothing else lives locally except
# secrets.yaml (the same one the tank-monitor boards use -- it reuses their
# MQTT / OTA / AP secrets).
#
# Builds from GitHub main every time (refresh: 0s). For a change to reach
# the board, push it to main first. Development builds from the working
# tree use water-flow/local-water-flow-change.yaml instead.
#
# On a Seeed XIAO instead: replace the board line below with
#   - water-flow/boards/xiao-esp32s3.yaml   (or xiao-esp32c3.yaml)
# and wire to that board file's pads -- see water-flow/README.md.
#
# The box is sealed: flash it over USB once on the bench, and over the air
# after that (it must be switched on and online for OTA).
substitutions:
  # Exactly this name: Home Assistant's entity ids (sensor.water_flow_change_*)
  # and MQTT topics (water-flow-change/...) derive from it.
  device_name: water-flow-change
  friendly_name: Water Flow Change

packages:
  water_flow:
    url: https://github.com/JoshuaSeidel/tank-monitor
    ref: main
    files:
      - packages/base.yaml
      - water-flow/packages/flow_meter.yaml
      - water-flow/packages/battery.yaml
      - water-flow/packages/water_change.yaml
      - water-flow/boards/esp32-lite.yaml
    # refresh defaults to 1d, which would silently build yesterday's config.
    refresh: 0s
