# Kaiden's 15 gal: what the tank looks like, in inches from the LEFT end.
#
# ONE copy for both devices: the panel's Vessel page and the controller's
# web page draw the same tank from these. A wrapper's own substitutions win
# over these, so nothing here needs repeating there.
#
# LIST THIS AFTER THE BOARD FILE in a wrapper's files. Between packages the
# LATER one's substitutions win, and the 4.3" panel's board file carries the
# 75's layout as its defaults -- listed first, this file loses to them and
# the panel draws the 75 (that shipped once, 2026-11-05).
#
# A 15 long is 24 x 12 x 12. Measured values beat these; change them here.
# Keep the fan ~5 in or more from the probe, or the probe's temperature
# readout overlaps it on the panel.
substitutions:
  tank_title: "15 Gallon"
  dual_system: "false"
  tank_width_in: "24"
  tank_height_in: "12"
  sponge_filters: "true"
  # Not drawn on this tank (sponge filters replace them), but the panel's
  # drawing code names them, so they must be defined.
  spray_bar_len_in: "12"
  intake_from_left_in: "1"
  sponge_from_left_in: "12"
  sponge_spacing_in: "4.5"
  heater_inset_in: "4"
  probe_from_left_in: "7.5"
  fan_from_left_in: "19"
