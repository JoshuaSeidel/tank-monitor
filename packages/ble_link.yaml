# BLE link to the controller -- PHASE 1: coexistence test only.
#
# WHY THIS EXISTS
# ESP-NOW inherits the WiFi station channel, and there is no way to pin it
# independently: ESPHome's schema is cv.OnlyWithout(CONF_CHANNEL, CONF_WIFI),
# so the espnow `channel:` option is rejected on any device that has a wifi
# component. Both boards need wifi. So when the AP goes down and the station
# starts scanning across channels to reconnect, ESP-NOW packets are lost --
# the link degrades during exactly the outage it exists to survive.
#
# BLE has its own channel hopping and no dependency on the AP.
#
# WHAT PHASE 1 IS AND IS NOT
# This carries NO DATA. It brings the BLE stack up alongside ESP-NOW and
# answers one question: do WiFi, ESP-NOW and BLE actually coexist at runtime
# on this board? They compile together. That is not the same thing, and it
# was the largest open risk in BLE-MIGRATION-PLAN.md.
#
# There is deliberately no peer yet. ble_client will scan and fail to find
# ${controller_ble_mac} forever, which is precisely the radio activity the
# test needs. Watch for: ESP-NOW going stale, LVGL stuttering, MQTT dropping,
# or a reboot loop. None of those should happen.
#
# ROLLBACK
# Remove `- packages/ble_link.yaml` from the CYD wrapper and reflash. Nothing
# else in the project references this file, and the C6 is untouched, so the
# tank keeps being regulated either way.

substitutions:
  # Placeholder. Replace with the real controller MAC in phase 2 -- until
  # then this address intentionally does not exist.
  controller_ble_mac: "AA:BB:CC:DD:EE:FF"

esp32_ble_tracker:
  scan_parameters:
    # Deliberately low duty cycle. WiFi, ESP-NOW and BLE share ONE 2.4 GHz
    # radio on this board -- BLE is not separate hardware, it time-slices.
    # A default-rate scan (320ms interval / 30ms window, active) is the
    # worst case for the very contention this test is measuring, so start
    # gentle: if it coexists at this duty cycle the design is viable, and
    # the rate can be raised later with evidence.
    interval: 1100ms
    window: 100ms
    # Passive: listen only, never transmit a scan request. Halves the radio
    # time and we do not need scan-response data from a known peer.
    active: false

ble_client:
  - id: ctrl_ble
    mac_address: ${controller_ble_mac}
    on_connect:
      - lambda: id(r_ble_connected) = true;
    on_disconnect:
      - lambda: id(r_ble_connected) = false;

binary_sensor:
  - platform: template
    name: "BLE Link"
    id: ble_link_up
    device_class: connectivity
    entity_category: diagnostic
    lambda: "return id(r_ble_connected);"

text_sensor:
  # Which transport is actually feeding the panel. During the transition
  # this is the question that matters -- Link Age can say the data is fresh
  # without saying what made it fresh.
  - platform: template
    name: "Link Source"
    id: link_source
    icon: "mdi:transit-connection-variant"
    entity_category: diagnostic
    update_interval: 10s
    lambda: |-
      // Stale beats loyal: if nothing has arrived recently, say so rather
      // than naming whichever transport spoke last.
      if (id(r_stamp_ms) == 0 || (millis() - id(r_stamp_ms)) > 45000)
        return {"none"};
      switch (id(r_src)) {
        case 1: return {"esp-now"};
        case 2: return {"ble"};
        default: return {"unknown"};
      }
