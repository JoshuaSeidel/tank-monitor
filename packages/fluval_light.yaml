# The Fluval bridge: one BLE client, one nightly curve push, and the
# entities to see whether it worked.
#
# Pin-free and board-agnostic, like every package here, so it can ride on
# a dedicated WROOM-32 today and move onto a Freenove all-in-one later
# without being rewritten.
#
# The component is the interesting part -- see components/fluval_light/
# for the protocol and components/fluval_light/daylight.h for the solar
# model it shares (by copy, deliberately) with the Chihiros bridge.

# Pulled from git so this builds in the Home Assistant ESPHome add-on with
# no local files -- same as packages/control.yaml does for tank_controller.
#
# THIS BLOCK BELONGS HERE, NOT IN THE WRAPPER. The wrapper is the one file
# not fetched from git, and load-critical config has silently gone missing
# from it five times in this project now. It went missing again on the
# first flash of this component: the package declared `fluval_light:` and
# nothing told ESPHome where to find it, so the build failed with
# "Component not found: fluval_light". The local validation wrapper had
# its own external_components block, so `esphome compile` passed and the
# gap only appeared on the real board.
#
# refresh: 0s because the ref is a moving branch -- the default caches for
# a day and you would silently build yesterday's component.
external_components:
  - source:
      type: git
      url: https://github.com/JoshuaSeidel/tank-monitor
      ref: main
    components: [fluval_light]
    refresh: 0s

substitutions:
  # The tank's coordinates, and they MUST equal light_latitude /
  # light_longitude in tank-monitor-allinone-freenove-remote.yaml. Both
  # tanks are in the same house and run the same solar model, so the only
  # way their schedules can differ is if these numbers do.
  #
  # Home is 39.7929, -76.7406 (HA zone.home). The 75 gal was given
  # 39.8 / -76.7, under a minute of solar time away, and these match it
  # exactly rather than being more precise than its neighbour -- two
  # configs that are literally the same string cannot drift apart.
  #
  # They were 40.0 / -75.13 until 2026-10-20: a placeholder from the first
  # build, about 85 miles east near Philadelphia, which ran the nano's day
  # 7 minutes ahead of the 75 gal's all month.
  fluval_latitude: "39.8"
  fluval_longitude: "-76.7"
  # Per-emitter level at solar noon, 0-100, one substitution each so a
  # single colour can be trimmed without restating the others. ESPHome
  # substitutions are strings, so a list cannot come through as one value
  # -- five scalars is not a workaround, it is the only shape that works.
  #
  # Per-emitter level at solar noon, 0-100. These are the fixture's REAL
  # channels, read off FluvalConnect's own spectral data via fluvalble
  # (core/color.py, SPECTRAL_XYZ["plant_current"]) and converted to sRGB:
  #
  #   ch1  violet / magenta      ch4  neutral white (~D65)
  #   ch2  deep blue             ch5  warm white / amber
  #   ch3  cool cyan-white
  #
  # White-led, with blue and violet held back -- a planted tank wants the
  # photons, and this one runs CO2 with a possible hair-algae start, where
  # heavy blue is the last thing to add. The warm and neutral whites carry
  # the day; violet is a seasoning.
  #
  # Chosen to hold the SAME luminous output as the old flat 75/75/75/75/75
  # placeholder, within 0.2%, using each channel's measured Y. The midday
  # lux check (45-55 lx) should therefore still read the same -- this is a
  # spectrum change, deliberately not a brightness change.
  fluval_ch1: "25"
  fluval_ch2: "35"
  fluval_ch3: "45"
  fluval_ch4: "85"
  fluval_ch5: "85"
  # Warm shift at low sun, percent, matching the 75 gal's Dawn Warmth 100.
  # Full at the horizon, gone by 12 degrees of elevation.
  fluval_dawn_warmth: "100"
  # Full-equivalent hours per day. Scales brightness, NOT the photoperiod.
  # 7.0 matches the 75 gal's Phase 2.
  fluval_dose_hours: "7.0"
  fluval_mac: "C6:E2:28:EF:62:84"

# A BLE client needs the tracker up, but this board is not a proxy and has
# no reason to scan hard. 300 ms in 1100 ms is enough to find one known
# MAC and leaves the radio mostly idle.
esp32_ble_tracker:
  scan_parameters:
    interval: 1100ms
    window: 300ms
    active: true

ble_client:
  - mac_address: ${fluval_mac}
    id: fluval_ble

fluval_light:
  id: fluval
  ble_client_id: fluval_ble
  time_id: sntp_time
  latitude: ${fluval_latitude}
  longitude: ${fluval_longitude}
  channel_count: 5
  channel_mix: ["${fluval_ch1}", "${fluval_ch2}", "${fluval_ch3}", "${fluval_ch4}", "${fluval_ch5}"]
  dose_cap_hours: ${fluval_dose_hours}
  dawn_warmth: ${fluval_dawn_warmth}
  # 01:30, dark at every latitude this tank will ever sit at. A curve that
  # half-arrives mid-afternoon is visible in the tank; one that half-arrives
  # at 01:30 is overwritten before anything is lit.
  push_hour: 1
  status:
    name: "Fluval Status"
    icon: "mdi:message-text"
    entity_category: diagnostic
  curve:
    name: "Fluval Curve"
    icon: "mdi:chart-bell-curve"
    entity_category: diagnostic
  lamp_state:
    name: "Fluval Lamp State"
    icon: "mdi:script-text"
    entity_category: diagnostic
  points:
    name: "Fluval Curve Points"
    icon: "mdi:dots-horizontal"
    entity_category: diagnostic
  dose:
    name: "Fluval Daily Light"
    icon: "mdi:white-balance-sunny"
  connected:
    name: "Fluval Connected"
    device_class: connectivity

button:
  # Push now, rather than waiting for 01:30. The first one should be
  # pressed while you are standing in front of the tank: until the channel
  # mix is read off the fixture it is a flat white day at full output.
  - platform: template
    name: "Fluval Push Curve"
    icon: "mdi:upload"
    entity_category: config
    on_press:
      - fluval_light.push_curve:
          id: fluval

  # The clock is synced on every connect and before every nightly push.
  # This is for proving it works without waiting for either.
  - platform: template
    name: "Fluval Sync Clock"
    icon: "mdi:clock-check"
    entity_category: config
    on_press:
      - fluval_light.sync_clock:
          id: fluval

  # ---------------------------------------------------------------------
  # Which emitter is which
  # ---------------------------------------------------------------------
  # The channel mix is five equal numbers because the fixture documents
  # neither the order of its emitters nor their colours, and a Pro
  # schedule readback only ever echoes what we wrote. Equal drive on five
  # DIFFERENT emitters is not a neutral white -- it is simply a balance
  # nobody chose, which is why the nano reads so differently from the 75
  # gal's deliberate W45/R36/G20/B14.
  #
  # These five buttons light one emitter at a time at full, in Manual
  # mode. Press one, look at the tank, write down the colour. Five presses
  # and the order is known, after which fluval_ch1..ch5 above can be a
  # real spectrum instead of a placeholder.
  #
  # The lamp stays OUT of its schedule until "Fluval Resume Schedule" is
  # pressed. Best done in daylight, when an hour off-schedule costs the
  # plants nothing.
  - platform: template
    name: "Fluval Identify Ch1"
    icon: "mdi:numeric-1-circle"
    entity_category: diagnostic
    on_press:
      - lambda: 'id(fluval)->set_channels({100, 0, 0, 0, 0});'

  - platform: template
    name: "Fluval Identify Ch2"
    icon: "mdi:numeric-2-circle"
    entity_category: diagnostic
    on_press:
      - lambda: 'id(fluval)->set_channels({0, 100, 0, 0, 0});'

  - platform: template
    name: "Fluval Identify Ch3"
    icon: "mdi:numeric-3-circle"
    entity_category: diagnostic
    on_press:
      - lambda: 'id(fluval)->set_channels({0, 0, 100, 0, 0});'

  - platform: template
    name: "Fluval Identify Ch4"
    icon: "mdi:numeric-4-circle"
    entity_category: diagnostic
    on_press:
      - lambda: 'id(fluval)->set_channels({0, 0, 0, 100, 0});'

  - platform: template
    name: "Fluval Identify Ch5"
    icon: "mdi:numeric-5-circle"
    entity_category: diagnostic
    on_press:
      - lambda: 'id(fluval)->set_channels({0, 0, 0, 0, 100});'

  # The way back. Rebuilds today's curve and returns the lamp to
  # Professional, which is the mode that actually runs a stored schedule --
  # an identify press leaves it in Manual, where it will sit at one colour
  # indefinitely.
  - platform: template
    name: "Fluval Resume Schedule"
    icon: "mdi:calendar-sync"
    entity_category: config
    on_press:
      - fluval_light.push_curve:
          id: fluval

  # Hand the fixture back to its own Auto schedule -- the one programmed
  # from the Fluval Connect app. The way out if a pushed curve is wrong
  # and you want the tank lit correctly tonight rather than after a
  # debugging session.
  - platform: template
    name: "Fluval Mode Auto"
    icon: "mdi:calendar-clock"
    entity_category: config
    on_press:
      - fluval_light.set_mode:
          id: fluval
          mode: 1
