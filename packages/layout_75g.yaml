# The 75 gal, as the 4.3" panel drew it before the P4 wall panel replaced it:
# two heaters, two probes, canister intake and spray bar. Inches from the
# LEFT end. Used by tank-monitor-lg-panel-remote.yaml; see
# packages/layout_15g.yaml for the other tank and why these are not
# defaults in the board file.
substitutions:
  tank_width_in:     "48"    # interior width -- standard 75 gal is 48 x 18 x 21
  heater_inset_in:   "4"     # each heater this far in from its end
  spray_bar_len_in:  "12"    # centred on the back wall
  intake_from_left_in: "1"   # intake pipe, measured from the LEFT end
  # "true": two heaters, two probes, the L-R gradient -- the 75's layout.
  # "false": one heater, one probe; the half/gradient cards show heater and
  # fan duty and the light level instead. Pasted into the lambdas as a C++
  # bool, so it must be exactly true or false.
  dual_system: "true"
  # The header on every page. f_small's glyph set: letters, digits, space
  # and .,:-+/%° only -- an apostrophe would silently not draw.
  tank_title: "Display Tank"
  # Single-system only (dual_system "false"). The heater sits at
  # heater_inset_in from the LEFT; the probe and the rim-clipped cooling
  # fan are placed from the left as well.
  probe_from_left_in: "10"
  fan_from_left_in:   "16"
  # Interior height, inches. Single-system only: the drawing takes its
  # proportions from width:height. The 75 keeps its fixed frame.
  tank_height_in: "21"
  # "true": a dual sponge filter -- two sponges on one lift tube -- standing
  # on the substrate instead of the intake and spray bar. Centred at
  # sponge_from_left_in, sponge_spacing_in centre to centre.
  sponge_filters: "false"
  sponge_from_left_in: "12"
  sponge_spacing_in: "4.5"
