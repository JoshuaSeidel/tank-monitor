# pH, from a DFRobot Gravity industrial probe (SEN0169-V2, wide-voltage).
#
# The board file supplies `ph_voltage` (an adc sensor on whatever pin that
# board has free -- or, on the 75 gal, a template carrying the voltage the
# light pod reads and sends over BLE); everything here is board-agnostic.
# Same split as TDS.
#
# ---------------------------------------------------------------
# CALIBRATION IS NOT OPTIONAL
# ---------------------------------------------------------------
# The two substitutions below are DFRobot's factory defaults, NOT your
# probe. An uncalibrated electrode can read a full pH unit out -- which is
# precisely the failure that made the previous continuous monitor useless.
#
#   1. Set "Cal pH High Value" and "Cal pH Low Value" to what your two
#      buffers actually say. CHOOSE BUFFERS THAT BRACKET THE TANK. A
#      glass electrode is linear from about 4 to 10, so a third point
#      buys nothing -- but a tank at 7.4 calibrated on 6.86 and 4.00 is
#      EXTRAPOLATED above its highest cal point, which is where slope
#      error hurts most. With the NIST set (4.00/6.86/9.18) the right
#      pair is 9.18 and 6.86, not 6.86 and 4.00.
#   2. Rinse the probe in distilled water and BLOT dry. Never wipe the
#      glass bulb: it builds a static charge that takes minutes to bleed
#      off and the reading wanders while it does.
#   3. Stand it in the HIGH buffer, wait 2 min for the voltage to settle,
#      and press "Capture High Point" in Home Assistant.
#   4. Rinse, blot, stand it in the LOW buffer, wait, press
#      "Capture Low Point".
#   5. VERIFY with the third buffer. Stand the probe in it and read
#      "Water pH" -- within ~0.1 means the electrode is linear and
#      healthy. Never calibrate on your check standard; that is what
#      makes it independent evidence rather than a restatement of the
#      calibration.
#
# That is the whole procedure -- no reflash. The captured voltages are
# stored in flash and survive reboots and OTA updates, and each is exposed
# as a sensor so you can write them down or spot one that has drifted.
#
# The substitutions below are now FIRST-BOOT DEFAULTS only. They are
# DFRobot's factory figures, not your probe.
#
# Redo it every few months and any time a reading looks wrong. Being able
# to prove the sensor is right is the entire reason it exists.
#
# ---------------------------------------------------------------
# A DISCONNECTED PROBE READS NEAR pH 7
# ---------------------------------------------------------------
# The BNC input floats to mid-rail, which lands almost exactly on neutral.
# A plausible number is NOT evidence the probe is attached or working. The
# only check that means anything is whether it MOVES when you put it in
# buffer. Until the hardware is wired this reads noise, same as the TDS
# probe did before its probe arrived.

substitutions:
  # FIRST-BOOT DEFAULTS ONLY. A calibrated board keeps its real numbers in
  # NVS and ignores every line below; these decide what a BRAND NEW board
  # reads before anyone has stood a probe in buffer.
  #
  # All four move together or none of them do. Volts are meaningless
  # without the pH they were measured at, which is exactly the trap the
  # old hardcoded 7.00/4.00 set: the volts were editable and the pH values
  # were not, so recording a 9.18 reading left the board claiming it was
  # 7.00. Record a pair, not a voltage.
  #
  # These are the 75 gal's electrode, calibrated 2026-09-23 against the
  # NIST set (slope -0.1724 V/pH, 97% of theoretical, verified at 4.00
  # reading 3.97). Real numbers off a real probe rather than DFRobot's
  # catalogue figures -- but still SOMEBODY ELSE'S PROBE as far as any new
  # board is concerned. Calibrate before trusting a reading.
  ph_cal_high: "9.18"
  ph_v_high: "1.1480"
  ph_cal_low: "6.86"
  ph_v_low: "1.5480"

sensor:
  - platform: template
    name: "pH Probe Voltage"
    id: ph_probe_v
    unit_of_measurement: "V"
    accuracy_decimals: 3
    entity_category: diagnostic
    update_interval: 10s
    lambda: |-
      if (std::isnan(id(ph_voltage).state)) return {};
      return id(ph_voltage).state;

  - platform: template
    name: "Water pH"
    id: water_ph
    unit_of_measurement: "pH"
    icon: "mdi:test-tube"
    accuracy_decimals: 2
    state_class: measurement
    update_interval: 30s
    filters:
      # The electrode is a ~100 MOhm source sitting in water with a mains
      # heater and two pumps. Median rejects the switching spikes that
      # couple in without lagging a value that moves over hours anyway.
      - median:
          window_size: 5
          send_every: 1
    lambda: |-
      // NAN, never {} (no publish), for every way this can fail. A
      // rejected sample that publishes nothing leaves the LAST ACCEPTED
      // value on the dashboard indefinitely: an unplugged electrode showed
      // pH 13.84 for an hour because its floating input had once wandered
      // through 0.3 V. The median filter below skips NaN, so one bad
      // sample is still rejected quietly; five in a row go unknown.
      const float v = id(ph_voltage).state;
      if (std::isnan(v))
        return NAN;

      // Two-point fit. Slope is NEGATIVE on this board: more volts, lower pH.
      // The two points' pH values are configurable rather than fixed at
      // 7.00/4.00: the NIST buffer set is 4.00/6.86/9.18, and capturing a
      // 6.86 buffer as if it were 7.00 corrupts BOTH the offset and the
      // slope -- about +0.17 pH at tank readings, a silent error of the
      // same size as the one that made the previous monitor useless.
      const float v7 = id(cal_ph_v7);
      const float v4 = id(cal_ph_v4);
      const float p_hi = id(cal_ph_hi);
      const float p_lo = id(cal_ph_lo);
      if (fabsf(p_hi - p_lo) < 0.5f)
        return NAN;                                      // points too close to fit
      const float slope25 = (v4 - v7) / (p_lo - p_hi);   // volts per pH at 25 C
      if (fabsf(slope25) < 1e-4f)
        return NAN;                                      // calibration unset

      // The Nernst slope scales with ABSOLUTE temperature, so an electrode
      // calibrated at 25 C reads slightly off at tank temperature. Correcting
      // is free here -- unlike a handheld meter, we already have a water
      // temperature we have verified against a third thermometer.
      float t_c = id(water_temp).state;
      if (std::isnan(t_c))
        t_c = 25.0f;
      const float slope = slope25 * ((t_c + 273.15f) / 298.15f);

      const float ph = p_hi + (v - v7) / slope;
      // 3 to 11, not 0 to 14. The electrode only ever sees tank water or a
      // calibration buffer (4.00, 7.00, occasionally 10.01), all inside
      // this window with room to spare. What lands OUTSIDE it is an input
      // with no electrode on it: a floating ADC pin drifts between 0.03
      // and 0.3 V, and 0.3 V is pH 13.7 -- "legal" under 0-14, and a
      // number that sat on the dashboard for a day as if it meant
      // something. Nothing with a real electrode in real water is lost to
      // this; a tank at pH 3 has bigger problems than a blank reading.
      if (ph < 3.0f || ph > 11.0f)
        return NAN;                                      // no electrode attached
      return ph;

  # The stored calibration, visible so it can be recorded and so a probe
  # that has drifted is obvious. A healthy DFRobot electrode separates the
  # two points by roughly 0.5 V; much less than that means it is tired.
  - platform: template
    name: "Cal pH High Voltage"
    unit_of_measurement: "V"
    accuracy_decimals: 4
    entity_category: diagnostic
    update_interval: 60s
    lambda: "return id(cal_ph_v7);"

  - platform: template
    name: "Cal pH Low Voltage"
    unit_of_measurement: "V"
    accuracy_decimals: 4
    entity_category: diagnostic
    update_interval: 60s
    lambda: "return id(cal_ph_v4);"

  - platform: template
    name: "Cal pH Slope"
    unit_of_measurement: "V/pH"
    accuracy_decimals: 4
    entity_category: diagnostic
    update_interval: 60s
    lambda: "return (id(cal_ph_v4) - id(cal_ph_v7)) / (id(cal_ph_lo) - id(cal_ph_hi));"

globals:
  - id: cal_ph_v7
    type: float
    restore_value: true
    initial_value: '${ph_v_high}'
  - id: cal_ph_v4
    type: float
    restore_value: true
    initial_value: '${ph_v_low}'
  # What the two buffers actually say, not what the button used to assume.
  # Paired with the voltages above: ph_cal_high goes with ph_v_high.
  - id: cal_ph_hi
    type: float
    restore_value: true
    initial_value: '${ph_cal_high}'
  - id: cal_ph_lo
    type: float
    restore_value: true
    initial_value: '${ph_cal_low}'

button:
  # Capture rather than type. Reading a voltage off a dashboard and
  # entering it somewhere else is two chances to transcribe it wrong,
  # while standing at a sink with a wet probe.
  # Named for the ROLE, not a number. These used to say "Capture pH 7.00"
  # and "Capture pH 4.00", which became a lie the moment the buffer on the
  # bench was 6.86 or 9.18. Set the matching Cal pH High/Low Value first.
  - platform: template
    name: "Capture High Point"
    icon: "mdi:arrow-up-box"
    entity_category: config
    on_press:
      - lambda: |-
          const float v = id(ph_voltage).state;
          if (std::isnan(v)) { ESP_LOGW("cal", "high point capture skipped: no probe reading"); return; }
          ESP_LOGI("cal", "pH %.2f point captured at %.4f V (was %.4f)", id(cal_ph_hi), v, id(cal_ph_v7));
          id(cal_ph_v7) = v;

  - platform: template
    name: "Capture Low Point"
    icon: "mdi:arrow-down-box"
    entity_category: config
    on_press:
      - lambda: |-
          const float v = id(ph_voltage).state;
          if (std::isnan(v)) { ESP_LOGW("cal", "low point capture skipped: no probe reading"); return; }
          ESP_LOGI("cal", "pH %.2f point captured at %.4f V (was %.4f)", id(cal_ph_lo), v, id(cal_ph_v4));
          id(cal_ph_v4) = v;

number:
  # Lambda-backed mirrors of the globals, per the repo convention for
  # calibration values: update_interval + lambda + set_action, never
  # optimistic/restore_value -- the global owns the value and survives
  # a flash, the entity is only a window onto it.
  - platform: template
    name: "Cal pH High Value"
    id: cal_ph_hi_num
    icon: "mdi:flask"
    entity_category: config
    unit_of_measurement: "pH"
    min_value: 6.0
    max_value: 11.0
    step: 0.01
    update_interval: 60s
    lambda: "return id(cal_ph_hi);"
    set_action:
      - lambda: id(cal_ph_hi) = x;

  - platform: template
    name: "Cal pH Low Value"
    id: cal_ph_lo_num
    icon: "mdi:flask-outline"
    entity_category: config
    unit_of_measurement: "pH"
    min_value: 3.0
    max_value: 8.0
    step: 0.01
    update_interval: 60s
    lambda: "return id(cal_ph_lo);"
    set_action:
      - lambda: id(cal_ph_lo) = x;
