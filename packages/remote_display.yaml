# Remote display/control package -- the panel half of a two-board split.
#
# The board that loads this runs NO sensors, NO relays and NO control loop.
# It subscribes to another tank-monitor's MQTT topics and renders them. The
# controller stays on the board that has the probe wired to it, which is the
# whole point: the tank keeps being regulated by hardware that is physically
# attached to it, and the panel is just a window onto that.
#
# Why this exists: an all-in-one display board spends nearly every GPIO on
# the panel and the touch controller, so asking it to also read a probe, a
# TDS meter, a light sensor and drive two relays fights the hardware. Split
# the roles and the pin problem disappears entirely -- this board needs no
# GPIO at all beyond its own screen.
#
# Load this INSTEAD OF packages/control.yaml and packages/sensors.yaml.
# Loading it alongside them collides on every id below.
#
# ---------------------------------------------------------------------
# Units
# ---------------------------------------------------------------------
# The source device publishes Fahrenheit, because that is what a human
# reads. The globals here convert back to the units the controller's own
# API used -- setpoint and swing in degC, drift in degC/min -- so that every
# LVGL lambda keeps the arithmetic it already had. It looks redundant, and
# it is: the alternative was editing the unit maths in a dozen places, which
# is a dozen chances to introduce a conversion bug in code that currently
# works. See boards/cyd-esp32-2432s028r.yaml.
#
# ---------------------------------------------------------------------
# Stage 1 of 2
# ---------------------------------------------------------------------
# This carries data over MQTT, so it depends on Wi-Fi and on the broker,
# which runs on Home Assistant. Stage 2 replaces the transport with
# packet_transport over ESP-NOW so the panel keeps working with the router
# and HA both down. Only the transport changes -- every id below, and every
# lambda that reads them, stays as it is.
#
# ---------------------------------------------------------------------
# Known limitation of the MQTT transport: dropped retained messages
# ---------------------------------------------------------------------
# ESPHome's ESP32 MQTT backend holds inbound events in a fixed 32-slot
# queue (MQTT_EVENT_QUEUE_LENGTH, a compile-time constant) and drains ONE
# per main-loop iteration. On connect the broker delivers a retained
# message for every subscription at once, that queue overflows, and the
# excess is discarded -- the device logs "Dropped N inbound MQTT events".
#
# What that means in practice depends on how the source publishes:
#
#   sensors     republish every update_interval, so a dropped retained
#               message costs one cycle and heals itself.
#   number,
#   switch      publish ONLY on change. Their retained message at connect
#               is the single delivery, so dropping it means the value
#               never arrives -- the setpoint stays blank and the switch
#               sits at its default while the controller says otherwise.
#
# That asymmetry is why the setpoint and Adaptive Learning were the two
# things missing after the first flash while everything else populated.
# It cannot be tuned from YAML.
#
# Stage 2 removes the problem rather than working around it:
# packet_transport broadcasts on an interval, so nothing depends on a
# single delivery landing at the one moment the queue is full.

substitutions:
  # Topic prefix of the board that owns the sensors. This is that device's
  # device_name, NOT this one's.
  source_device: tank-monitor

globals:
  # restore_value so a rebooted panel shows the last known reading straight
  # away instead of dashes until the next publish. MQTT retains these too,
  # but the flash copy also covers a broker that is down at boot.
  - id: r_setpoint_c
    type: float
    restore_value: true
    initial_value: 'NAN'
  - id: r_swing_c
    type: float
    restore_value: true
    initial_value: 'NAN'
  - id: r_drift_c_min
    type: float
    restore_value: true
    initial_value: 'NAN'
  - id: r_conf
    type: float
    restore_value: true
    initial_value: '0'
  - id: r_heat
    type: float
    restore_value: true
    initial_value: '0'
  - id: r_fan
    type: float
    restore_value: true
    initial_value: '0'
  - id: r_fault
    type: bool
    restore_value: false
    initial_value: 'false'
  # Set while a widget is being driven from a received value, so the
  # widget's own on_value does not echo that back as a command. Without
  # it, syncing the switch from the controller publishes a command to the
  # controller, which is a loop.
  - id: r_sync
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: r_learn_on
    type: bool
    restore_value: true
    initial_value: 'false'
  # Distinguishes "learning is off" from "never heard". Without it a fresh
  # panel would assert the controller is off when it simply has not been
  # told yet, and then let you toggle from a state that was never real.
  - id: r_learn_known
    type: bool
    restore_value: true
    initial_value: 'false'
  # Set on every inbound message; drives the staleness readout below.
  - id: r_stamp
    type: uint32_t
    restore_value: false
    initial_value: '0'
  # Same event, but on millis(). Link Age wants a wall clock to say "3m
  # ago"; the connectivity sensor must work before SNTP has synced -- and
  # a panel that has just booted with no network is exactly when you want
  # it to admit the link is down.
  - id: r_stamp_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'

script:
  - id: r_seen
    then:
      # Block scalar: a ternary's ':' is not legal in a plain YAML scalar.
      - lambda: |-
          id(r_stamp) = id(sntp_time).now().is_valid()
                        ? id(sntp_time).now().timestamp
                        : 0;
          id(r_stamp_ms) = millis();

espnow:
  id: espnow_link
  auto_add_peer: true

packet_transport:
  - platform: espnow
    id: link_rx
    espnow_id: espnow_link
    # No top-level encryption key here. That one encrypts what this
    # transport SENDS, and this side sends nothing -- commands go out as
    # plain espnow.broadcast actions, not as packet_transport data. The
    # provider key below is what decrypts the controller's broadcasts,
    # and it must match the key on that board.
    providers:
      - name: ${source_device}
        encryption: !secret espnow_key

sensor:
  # ------------------------------------------------------------------
  # Received over ESP-NOW. These keep the ids packages/sensors.yaml would
  # have defined, so the LVGL code does not know or care that they arrived
  # over the air rather than from a probe on this board.
  #
  # remote_id matches the broadcast_id set in packages/espnow_link.yaml.
  # ------------------------------------------------------------------
  - platform: packet_transport
    provider: ${source_device}
    remote_id: wt
    id: water_temp
    internal: true
    on_value:
      - script.execute: r_seen

  - platform: packet_transport
    provider: ${source_device}
    remote_id: td
    id: tds
    internal: true
    on_value:
      - script.execute: r_seen

  - platform: packet_transport
    provider: ${source_device}
    remote_id: lx
    id: tank_lux
    internal: true
    on_value:
      - script.execute: r_seen

  # ------------------------------------------------------------------
  # Controller state, in the units the controller's accessors returned.
  # ------------------------------------------------------------------
  - platform: packet_transport
    provider: ${source_device}
    remote_id: sp
    id: r_sub_setpoint
    internal: true
    on_value:
      - lambda: id(r_setpoint_c) = x;
      - script.execute: r_seen

  - platform: packet_transport
    provider: ${source_device}
    remote_id: sw
    id: r_sub_swing
    internal: true
    on_value:
      - lambda: id(r_swing_c) = x;

  - platform: packet_transport
    provider: ${source_device}
    remote_id: dr
    id: r_sub_drift
    internal: true
    on_value:
      - lambda: id(r_drift_c_min) = x;

  - platform: packet_transport
    provider: ${source_device}
    remote_id: cf
    id: r_sub_conf
    internal: true
    on_value:
      - lambda: id(r_conf) = x;

  - platform: packet_transport
    provider: ${source_device}
    remote_id: ht
    id: r_sub_heat
    internal: true
    on_value:
      - lambda: id(r_heat) = x;

  - platform: packet_transport
    provider: ${source_device}
    remote_id: fn
    id: r_sub_fan
    internal: true
    on_value:
      - lambda: id(r_fan) = x;

binary_sensor:
  # The controller broadcasts every 10s, so 45s is four missed rounds --
  # long enough not to flap on a single lost frame, short enough to notice
  # before you have made a decision based on a stale screen.
  - platform: template
    name: "Controller Link"
    id: controller_link
    device_class: connectivity
    entity_category: diagnostic
    lambda: |-
      if (id(r_stamp_ms) == 0) return false;
      return (millis() - id(r_stamp_ms)) < 45000;

  - platform: packet_transport
    provider: ${source_device}
    remote_id: ft
    id: r_sub_fault
    internal: true
    on_state:
      - lambda: id(r_fault) = x;

  - platform: packet_transport
    provider: ${source_device}
    remote_id: al
    id: r_sub_learning
    internal: true
    on_state:
      - lambda: |-
          id(r_learn_on) = x;
          id(r_learn_known) = true;

text_sensor:
  # How stale the tank data is. The panel is only ever as current as its
  # last packet, and a frozen screen showing plausible numbers is the one
  # failure mode worth making visible -- the same reasoning as Chem Age.
  - platform: template
    name: "Link Age"
    id: link_age
    entity_category: diagnostic
    update_interval: 30s
    lambda: |-
      if (id(r_stamp) == 0) return {"no data"};
      if (!id(sntp_time).now().is_valid()) return {"unknown"};
      const uint32_t age = id(sntp_time).now().timestamp - id(r_stamp);
      char buf[24];
      if (age < 90)         snprintf(buf, sizeof(buf), "%us ago", age);
      else if (age < 5400)  snprintf(buf, sizeof(buf), "%um ago", age / 60);
      else                  snprintf(buf, sizeof(buf), "%uh ago", age / 3600);
      return {buf};

interval:
  # ESP-NOW broadcasts are not acknowledged, so the controller cannot tell
  # whether anything is listening. This is the only way it can know the
  # panel is alive: the panel says so, on a timer.
  - interval: 30s
    then:
      - lambda: |-
          static const uint8_t BCAST[6] = {0xFF,0xFF,0xFF,0xFF,0xFF,0xFF};
          const char *hb = "HB";
          id(espnow_link).send(BCAST, (const uint8_t *) hb, 2);

  # Ask for data instead of waiting for the next scheduled broadcast.
  #
  # Two things delay a cold start otherwise. ESP-NOW shares the radio with
  # Wi-Fi and cannot reliably receive until the station has associated --
  # until then the radio is scanning channels -- and once it can, the
  # controller is on its own 10s timer with no idea anyone just arrived.
  # Together that is the 40-50s of blank screen after plugging in.
  #
  # Asking every 3s while there is no data collapses that to about as long
  # as the association takes. It stops on its own once data flows, and
  # resumes if the feed goes quiet, so it doubles as link recovery.
  - interval: 3s
    then:
      - lambda: |-
          const bool stale = id(r_stamp_ms) == 0 ||
                             (millis() - id(r_stamp_ms)) > 20000;
          if (!stale) return;
          static const uint8_t BCAST[6] = {0xFF,0xFF,0xFF,0xFF,0xFF,0xFF};
          const char *rq = "RQ";
          id(espnow_link).send(BCAST, (const uint8_t *) rq, 2);
