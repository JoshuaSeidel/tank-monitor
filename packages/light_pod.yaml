# LIGHT POD -- the chip-independent half. Light sensors plus the pH
# board's voltage; no actuators.
#
# Loaded BY a board file, never on its own: the board file owns the chip,
# the esp32: block, the two I2C pins (i2c_sda / i2c_scl) and the pH ADC pin
# (ph_adc_pin),
# and includes this. One copy of the sensor and BLE logic, however many
# boards it has lived on:
#   boards/xiao-esp32s3-light-pod.yaml             Seeed XIAO ESP32-S3
#   boards/sparkfun-esp32c6-pocket-light-pod.yaml  SparkFun Qwiic Pocket ESP32-C6
#
# It measures the light over the 75 gal and reads the pH board's voltage.
# No relay, no heater, no control loop. The light side answers two separate
# questions with two separate parts:
#
#   BH1750  -> lux. How much light, in a real unit. This is the one the
#              controller wants: it feeds the thermal model's light-gain
#              term so the loop can pre-empt the daily light-heat bump
#              instead of chasing it.
#
#   AS7341  -> eight visible bands. WHICH channels are on. Lux cannot
#              answer this: it is photopic, weighted near 555 nm, so it
#              discounts deep red (660) and royal blue (450) hardest --
#              exactly the channels the phase presets command. Move red
#              20% -> 36% and the BH1750 barely twitches.
#
# The two travel by DIFFERENT PATHS, on purpose:
#
#   lux      -> BLE, straight to the controller, peer to peer. No broker,
#               no Home Assistant, no router. It is a control input, so it
#               must not depend on anything that can be down.
#   spectral -> MQTT to Home Assistant (all ten channels), plus the compact
#               blue/red/NIR subset in the same BLE frame as lux.
#   pH volts -> BLE, its own frame, to the controller -- see PH below.
#
# Both also publish to MQTT for history. The BLE path is additive.
#
# ---------------------------------------------------------------------
# PH -- the pod reads it, the controller owns it
# ---------------------------------------------------------------------
# The DFRobot Gravity pH board (SEN0169-V2) sits here, on the pod's own
# supply, instead of on the controller's ADS1115. Two reasons, both about
# the controller's analog side, where the pH channel died on 2026-09-24:
#   - no more millivolt-level wiring through the controller's enclosure;
#   - the electrode no longer shares a ground with the TDS probe and the
#     heater relays, which is a known way to get a wandering pH.
#
# The pod sends the board's VOLTAGE, not a pH. The controller keeps
# packages/ph.yaml unchanged: the two-point calibration and its capture
# buttons, the temperature compensation (the pod has no water temperature;
# the controller does), and the "Water pH" entity everything else reads.
# A calibration is still per-converter, though: volts read through this
# board's ADC are not the volts the controller's ADS1115 read, so
# RECALIBRATE after the move.
#
# The Gravity board buffers the electrode, so the ADC sees a low-impedance
# op-amp output between about 1 and 2 V across pH 4-10 -- the ESP32 ADC's
# most linear stretch. Two-point calibration through this same ADC cancels
# its offset and gain error; what is left is a few mV, roughly 0.02-0.05
# pH, inside what the probe itself can tell apart.
#
# ---------------------------------------------------------------------
# WHAT THE SPECTRAL SIDE IS NOT
# ---------------------------------------------------------------------
# Not PAR. The counts are uncalibrated ADC values, not micromoles, and the
# Seneye was returned from this project for exactly that failure -- a
# continuous reading nobody could check, believed for months, wrong the
# whole time. Valid use is DIFFERENTIAL only: this week against last week,
# same sensor, same place, same gain.
#
# The AS7341 must never feed tank_lux. The control loop normalises against
# full_scale_lux and tests light_on_lux, both in real lux. That is what the
# BH1750 on this same bus is for.
#
# ---------------------------------------------------------------------
# MOUNTING -- the readings are worthless if this moves
# ---------------------------------------------------------------------
# Everything the AS7341 produces is relative, so the geometry IS the
# calibration. Fix it permanently. Face it UP at the fixture, never down at
# the water (that measures reflections off a moving surface). Put no glass
# in the light path: a lid BENEATH the sensor is a splash shield, but a lid
# ABOVE it is condensation and mineral film -- a slowly varying attenuation
# indistinguishable from the lamp dimming. Shield the window side; the
# 09:00-16:00 photoperiod runs straight through the brightest part of the
# day.
#
# ---------------------------------------------------------------------
# WHAT THIS PACKAGE OWES AND IS OWED
# ---------------------------------------------------------------------
# Owed by the board file: i2c_sda, i2c_scl, ph_adc_pin and the esp32:
# block. ph_adc_pin must be an ADC1 pin that is NOT a strapping pin: the pH
# board idles near 1.5 V, which would hold a strapping pin at an undefined
# level during boot.
# Owed to nobody: packages/base.yaml supplies wifi, MQTT, OTA, the web
# server and the clock. Never pair this with control.yaml, sensors.yaml
# or ph.yaml: there is no probe, heater or relay here for them to bind to.
#
# Both sensors share one bus with no address conflict: BH1750 at 0x23 (ADDR
# floating) and AS7341 at 0x39 (fixed). Leave the BH1750's ADDR pin alone --
# the 0x5C jumper is only needed when two of them share a bus, and that
# splice is what shorted the 3V3 rail on the last attempt.

substitutions:
  # 10 kHz, the same decision as both controllers. Short leads here do not
  # need it, but it costs nothing on a board reading two sensors a minute
  # and it leaves headroom if a sensor ever ends up on a longer lead.
  i2c_freq: "10kHz"

  # ---- The controller's BLE MAC -- you must set this ----
  # Read it from the controller, do NOT compute it. It publishes the value
  # as sensor.tank_monitor_75_gallon_controller_ble_mac, and it is also in
  # its boot log. On an ESP32-S3 the BLE MAC is the WiFi MAC + 2 in the last
  # octet, but that relationship is not a promise -- read the real one.
  controller_mac: "SET-ME-FROM-THE-CONTROLLER"

  # Nordic UART Service UUIDs, matching packages/ble_link_v3.yaml. The
  # sensor characteristic is 0x...04, deliberately NOT the command
  # characteristic (0x...02) the panel writes setpoints to -- sensor ingress
  # and "move the tank's target temperature" do not share a channel.
  link_service:   "6e400001-b5a3-f393-e0a9-e50e24dcca9e"
  link_sens_char: "6e400004-b5a3-f393-e0a9-e50e24dcca9e"

  # How often lux (and the pH voltage) is pushed to the controller. The thermal model works on
  # 15-minute actuator windows, so a minute is already far finer than it can
  # act on. Each push is a connect / write / disconnect, so this also sets
  # how often the controller briefly holds a second BLE connection.
  lux_push_interval: "60s"

  # ---- AS7341 exposure. These three decide what a "count" means ----
  # Raw counts scale with gain and integration time, so week-over-week
  # comparison is only valid while all three stay put. Changing any of them
  # rebases every historical reading -- treat it like recalibrating a probe
  # and write down the date.
  #
  # Full scale = (atime + 1) * (astep + 1), capped at 65535. 29, 599 -> 18000.
  #
  # Gain X2 is deliberately below the X8 default: this sits under a 138 W
  # fixture, a far brighter scene than X8 assumes. If Spectral Saturated
  # ever turns on, drop it. If every band reads in the low hundreds at full
  # output, raise it.
  as7341_gain: "X2"
  as7341_atime: "29"
  as7341_astep: "599"

  spectral_update: "60s"
  lux_update: "30s"

# ESPHome's default MQTT unique_id generator is "legacy": "ESP" + component
# type + object_id, with NO device name and no MAC in it. Two boards with a
# same-named entity therefore generate byte-identical unique_ids, and Home
# Assistant silently refuses the second one. This board publishes a "Tank
# Light Level" exactly like the 12 gal controller does, so without this it
# would collide on day one.
#
# In the BOARD FILE, not the wrapper -- putting load-critical config in the
# wrapper has silently failed four times in this project.
mqtt:
  discovery_unique_id_generator: mac

i2c:
  sda: ${i2c_sda}
  scl: ${i2c_scl}
  frequency: ${i2c_freq}
  id: bus_a
  scan: true

# BLE client, to push lux at the controller. WiFi + BLE is the supported
# pair on this silicon; ESP-NOW is deliberately absent, because WiFi +
# ESP-NOW + BLE together is the combination that cost this project a link
# and then a web server.
esp32_ble_tracker:
  scan_parameters:
    # Passive and unhurried. This board only ever talks to one known MAC,
    # so there is nothing to discover and no reason to hold the radio.
    interval: 1100ms
    window: 300ms
    active: false

ble_client:
  - mac_address: ${controller_mac}
    id: ctrl_link
    on_connect:
      then:
        # Let the GATT discovery settle before writing. Same shape as the
        # Chihiros bridge: connect, do one thing, disconnect.
        - delay: 500ms
        # The pod connects when EITHER reading is valid, so each frame is
        # guarded on its own: a missing BH1750 must not send "L,0" (a lux
        # of zero is a reading, not silence), and a missing pH board must
        # not send anything at all.
        - if:
            condition:
              lambda: 'return !isnan(id(pod_lux).state);'
            then:
              - ble_client.ble_write:
                  id: ctrl_link
                  service_uuid: ${link_service}
                  characteristic_uuid: ${link_sens_char}
                  # FRAME: L,<lux>,<blue%>,<red%>,<nir/1000>  -- 5 fields, <= 19 bytes.
                  #
                  # The size is not an accident. A BLE write carries 20 bytes of
                  # payload until an MTU negotiation succeeds, and while ESPHome
                  # does request a larger one on connect, the granted size is
                  # whatever both ends agree -- not a promise. A frame that fits
                  # in the default works no matter how that negotiation lands.
                  #
                  # Which is why green is NOT sent: the three shares are computed
                  # over all eight bands and sum to 100, so the controller
                  # reconstructs it as 100 - blue - red. Blue and red are the ends
                  # of the spectrum and the channels actually being tuned; green
                  # is the one that can be inferred.
                  #
                  # -1 means "spectral not ready yet" -- the AS7341 has a slower
                  # update than the BH1750, and lux must not wait on it.
                  value: !lambda |-
                    const float lux = id(pod_lux).state;
                    const float b   = id(sp_share_blue).state;
                    const float r   = id(sp_share_red).state;
                    const float n   = id(sp_nir_ratio).state;
                    int L = isnan(lux) ? 0 : (int) lroundf(lux);
                    if (L < 0) L = 0;
                    if (L > 65535) L = 65535;
                    const int B = isnan(b) ? -1 : (int) lroundf(b);
                    const int R = isnan(r) ? -1 : (int) lroundf(r);
                    int N = isnan(n) ? -1 : (int) lroundf(n * 1000.0f);
                    if (N > 999) N = 999;
                    char buf[24];
                    const int len = snprintf(buf, sizeof(buf), "L,%d,%d,%d,%d", L, B, R, N);
                    return std::vector<uint8_t>(buf, buf + len);
        - delay: 200ms
        - if:
            condition:
              lambda: 'return !isnan(id(pod_ph_v).state);'
            then:
              - ble_client.ble_write:
                  id: ctrl_link
                  service_uuid: ${link_service}
                  characteristic_uuid: ${link_sens_char}
                  # FRAME: P,<volts x 10000>   e.g. "P,14803" = 1.4803 V
                  #
                  # Its own frame rather than a sixth field on L: L already
                  # runs to 19 bytes against a 20-byte write. An integer in
                  # tenths of a millivolt keeps the ADC's resolution (the
                  # electrode moves ~170 mV per pH unit, so 0.1 mV is
                  # 0.0006 pH) without a float parser on the far end.
                  value: !lambda |-
                    int P = (int) lroundf(id(pod_ph_v).state * 10000.0f);
                    if (P < 0) P = 0;
                    if (P > 33000) P = 33000;
                    char buf[12];
                    const int len = snprintf(buf, sizeof(buf), "P,%d", P);
                    return std::vector<uint8_t>(buf, buf + len);
              - delay: 200ms
        # Non-persistent by design. Holding the link open would keep the
        # controller at two BLE connections permanently and give the panel
        # a radio to share all day; this way the overlap is a second a
        # minute. The controller's staleness guard covers the gaps.
        - switch.turn_off: ctrl_conn
    on_disconnect:
      then:
        - logger.log:
            format: "controller link: disconnected"
            level: DEBUG

switch:
  - platform: ble_client
    ble_client_id: ctrl_link
    id: ctrl_conn
    internal: true
    restore_mode: ALWAYS_OFF

interval:
  - interval: ${lux_push_interval}
    then:
      # Never push a NaN. A missing reading must reach the controller as
      # silence, so its staleness guard can time out and drop the light term
      # (or blank the pH) -- not as a number that happens to parse. Connect
      # if there is anything worth sending; on_connect sends only what is.
      - if:
          condition:
            lambda: 'return !isnan(id(pod_lux).state) || !isnan(id(pod_ph_v).state);'
          then:
            - switch.turn_on: ctrl_conn

sensor:
  # -------------------------------------------------------------
  # pH board voltage -- the DFRobot Gravity SEN0169-V2 output.
  # Sent to the controller, which does the pH maths; see PH above.
  # Published here as well so a dead BLE link and a dead probe look
  # different from Home Assistant: this moves and "Water pH" does not
  # means the link, both flat means the probe.
  # -------------------------------------------------------------
  - platform: adc
    pin: ${ph_adc_pin}
    name: "pH Board Voltage"
    id: pod_ph_v
    unit_of_measurement: "V"
    accuracy_decimals: 4
    entity_category: diagnostic
    attenuation: 12db
    # 16 conversions averaged per reading, then the median of the last
    # 30 s: the radio's transmit bursts land on the supply as short spikes,
    # and between the two they cost nothing on a value that moves over
    # hours. One published value every 30 s, two per BLE push.
    samples: 16
    update_interval: 1s
    filters:
      - median:
          window_size: 30
          send_every: 30
          send_first_at: 5

  # -------------------------------------------------------------
  # BH1750 (GY-302) -- real lux, ADDR floating gives 0x23.
  # This is the one the controller consumes.
  # -------------------------------------------------------------
  - platform: bh1750
    name: "Tank Light Level"
    id: pod_lux
    address: 0x23
    update_interval: ${lux_update}
    accuracy_decimals: 0
    filters:
      - filter_out: nan

  # -------------------------------------------------------------
  # AS7341 -- eight visible bands, plus clear and near-infrared.
  # Home Assistant only; never sent to the controller.
  # -------------------------------------------------------------
  - platform: as7341
    address: 0x39
    update_interval: ${spectral_update}
    gain: ${as7341_gain}
    atime: ${as7341_atime}
    astep: ${as7341_astep}
    f1:
      name: "Spectral 415nm"
      id: sp_f1
      accuracy_decimals: 0
    f2:
      name: "Spectral 445nm"
      id: sp_f2
      accuracy_decimals: 0
    f3:
      name: "Spectral 480nm"
      id: sp_f3
      accuracy_decimals: 0
    f4:
      name: "Spectral 515nm"
      id: sp_f4
      accuracy_decimals: 0
    f5:
      name: "Spectral 555nm"
      id: sp_f5
      accuracy_decimals: 0
    f6:
      name: "Spectral 590nm"
      id: sp_f6
      accuracy_decimals: 0
    f7:
      name: "Spectral 630nm"
      id: sp_f7
      accuracy_decimals: 0
    f8:
      name: "Spectral 680nm"
      id: sp_f8
      accuracy_decimals: 0
    clear:
      name: "Spectral Clear"
      id: sp_clear
      accuracy_decimals: 0
    nir:
      name: "Spectral NIR"
      id: sp_nir
      accuracy_decimals: 0

  # -------------------------------------------------------------
  # Derived on the board, not in Home Assistant -- calibration and
  # derived values compute here so every consumer sees the same
  # number. A ratio that only exists in HA is a ratio the device
  # does not have.
  #
  # The shares are the useful output: each band group as a fraction
  # of all eight, so they are INDEPENDENT OF GAIN AND EXPOSURE.
  # Doubling the light or the integration time moves every band
  # together and leaves the shares where they were. That is what
  # makes them comparable across weeks, and what makes them respond
  # to a channel change rather than to a cloud past the window.
  #
  # All eight assigned, so the three sum to 100%:
  #   blue   415 + 445 + 480    royal blue channel lives at 450
  #   green  515 + 555 + 590    white phosphor peaks broad through here
  #   red    630 + 680          deep red channel lives at 660
  # -------------------------------------------------------------
  - platform: template
    name: "Blue Share"
    id: sp_share_blue
    unit_of_measurement: "%"
    accuracy_decimals: 1
    update_interval: ${spectral_update}
    lambda: |-
      const float f1 = id(sp_f1).state, f2 = id(sp_f2).state, f3 = id(sp_f3).state;
      const float f4 = id(sp_f4).state, f5 = id(sp_f5).state, f6 = id(sp_f6).state;
      const float f7 = id(sp_f7).state, f8 = id(sp_f8).state;
      if (isnan(f1) || isnan(f2) || isnan(f3) || isnan(f4) ||
          isnan(f5) || isnan(f6) || isnan(f7) || isnan(f8)) return {};
      const float total = f1 + f2 + f3 + f4 + f5 + f6 + f7 + f8;
      if (total <= 0.0f) return {};
      return 100.0f * (f1 + f2 + f3) / total;

  - platform: template
    name: "Green Share"
    id: sp_share_green
    unit_of_measurement: "%"
    accuracy_decimals: 1
    update_interval: ${spectral_update}
    lambda: |-
      const float f1 = id(sp_f1).state, f2 = id(sp_f2).state, f3 = id(sp_f3).state;
      const float f4 = id(sp_f4).state, f5 = id(sp_f5).state, f6 = id(sp_f6).state;
      const float f7 = id(sp_f7).state, f8 = id(sp_f8).state;
      if (isnan(f1) || isnan(f2) || isnan(f3) || isnan(f4) ||
          isnan(f5) || isnan(f6) || isnan(f7) || isnan(f8)) return {};
      const float total = f1 + f2 + f3 + f4 + f5 + f6 + f7 + f8;
      if (total <= 0.0f) return {};
      return 100.0f * (f4 + f5 + f6) / total;

  - platform: template
    name: "Red Share"
    id: sp_share_red
    unit_of_measurement: "%"
    accuracy_decimals: 1
    update_interval: ${spectral_update}
    lambda: |-
      const float f1 = id(sp_f1).state, f2 = id(sp_f2).state, f3 = id(sp_f3).state;
      const float f4 = id(sp_f4).state, f5 = id(sp_f5).state, f6 = id(sp_f6).state;
      const float f7 = id(sp_f7).state, f8 = id(sp_f8).state;
      if (isnan(f1) || isnan(f2) || isnan(f3) || isnan(f4) ||
          isnan(f5) || isnan(f6) || isnan(f7) || isnan(f8)) return {};
      const float total = f1 + f2 + f3 + f4 + f5 + f6 + f7 + f8;
      if (total <= 0.0f) return {};
      return 100.0f * (f7 + f8) / total;

  # NIR divided by the clear channel -- the daylight discriminator, and the
  # one spectral number the CONTROLLER has a real use for.
  #
  # LEDs emit essentially no near-infrared. Sunlight is full of it, and
  # ordinary window glass passes most of the near band. So this ratio
  # separates "the fixture is lighting the tank" (near 0) from "the sun is
  # up" (substantially above 0) in a way lux cannot -- both look like light
  # to a BH1750.
  #
  # That matters here specifically because the photoperiod moved to
  # 09:00-16:00, straight through the brightest part of the day. Without
  # this, daylight through the window is indistinguishable from the lamp,
  # and the thermal model would learn to attribute room-warming sunshine to
  # a fixture that was switched off.
  - platform: template
    name: "NIR Ratio"
    id: sp_nir_ratio
    accuracy_decimals: 3
    update_interval: ${spectral_update}
    lambda: |-
      const float nir = id(sp_nir).state, clear = id(sp_clear).state;
      if (isnan(nir) || isnan(clear) || clear <= 0.0f) return {};
      return nir / clear;

  # Sum of the eight visible bands. Unlike the shares this DOES scale with
  # gain and exposure, so it is only comparable while those stay untouched.
  # Relative intensity index -- explicitly not lux, explicitly not PAR, and
  # given no unit so nothing downstream can mistake it for either. The
  # BH1750 above is what reports in a real unit.
  - platform: template
    name: "Spectral Visible Total"
    id: sp_visible_total
    accuracy_decimals: 0
    update_interval: ${spectral_update}
    lambda: |-
      const float f1 = id(sp_f1).state, f2 = id(sp_f2).state, f3 = id(sp_f3).state;
      const float f4 = id(sp_f4).state, f5 = id(sp_f5).state, f6 = id(sp_f6).state;
      const float f7 = id(sp_f7).state, f8 = id(sp_f8).state;
      if (isnan(f1) || isnan(f2) || isnan(f3) || isnan(f4) ||
          isnan(f5) || isnan(f6) || isnan(f7) || isnan(f8)) return {};
      return f1 + f2 + f3 + f4 + f5 + f6 + f7 + f8;

binary_sensor:
  # A saturated channel reads a ceiling, not a measurement, and the shares
  # computed from it are wrong in a way that looks entirely plausible -- a
  # pinned red band simply reports as "lots of red". This is the check that
  # makes the numbers above trustworthy rather than merely present.
  #
  # Full scale is (atime + 1) * (astep + 1), hardware-capped at 65535. 95%
  # of that is called saturated, leaving margin for the ADC's nonlinearity
  # near the top of its range.
  - platform: template
    name: "Spectral Saturated"
    id: sp_saturated
    device_class: problem
    entity_category: diagnostic
    lambda: |-
      float full = (${as7341_atime} + 1.0f) * (${as7341_astep} + 1.0f);
      if (full > 65535.0f) full = 65535.0f;   // hardware ceiling
      const float limit = 0.95f * full;
      const float ch[8] = {id(sp_f1).state, id(sp_f2).state, id(sp_f3).state,
                           id(sp_f4).state, id(sp_f5).state, id(sp_f6).state,
                           id(sp_f7).state, id(sp_f8).state};
      bool any = false;
      for (int i = 0; i < 8; i++) {
        if (isnan(ch[i])) return {};
        if (ch[i] >= limit) any = true;
      }
      return any;
