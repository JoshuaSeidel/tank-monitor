# Water chemistry pulled in from Home Assistant over MQTT.
#
# These are values the ESP32 cannot measure: pH and free ammonia come from
# a test kit typed into HA -- pH, ammonia, GH, KH, NO2 and NO3. They arrive on
# retained topics, so the broker replays the last known value the moment
# this device reconnects.
#
# Retention alone is not enough, though: if Home Assistant is down then so
# is its broker, and a device that rebooted in that window would show
# nothing. So every value is also mirrored into a restore_value global and
# stamped with the time it arrived. The display reads the globals, never
# the subscription -- which means the panel always shows the last known
# reading and, honestly, how old it is.
#
# Deliberately NOT in packages/base.yaml: the C6 must not inherit any of
# this. Include it from a board wrapper that wants it.

globals:
  - id: chem_ph
    type: float
    restore_value: true
    initial_value: 'NAN'
  - id: chem_nh3
    type: float
    restore_value: true
    initial_value: 'NAN'
  - id: chem_gh
    type: float
    restore_value: true
    initial_value: 'NAN'
  - id: chem_kh
    type: float
    restore_value: true
    initial_value: 'NAN'
  - id: chem_no2
    type: float
    restore_value: true
    initial_value: 'NAN'
  - id: chem_no3
    type: float
    restore_value: true
    initial_value: 'NAN'
  # Epoch seconds of the most recent arrival of ANY of the above. One
  # stamp, not six: what matters on a small screen is "how stale is this
  # panel", and the oldest value governs that.
  - id: chem_stamp
    type: uint32_t
    restore_value: true
    initial_value: '0'

script:
  - id: chem_stamp_now
    then:
      - lambda: |-
          auto t = id(sntp_time).now();
          if (t.is_valid()) id(chem_stamp) = (uint32_t) t.timestamp;

sensor:
  - platform: mqtt_subscribe
    id: sub_ph
    topic: tank-monitor/chem/ph
    internal: true
    on_value:
      - lambda: id(chem_ph) = x;
      - script.execute: chem_stamp_now
  - platform: mqtt_subscribe
    id: sub_nh3
    topic: tank-monitor/chem/nh3
    internal: true
    on_value:
      - lambda: id(chem_nh3) = x;
      - script.execute: chem_stamp_now
  - platform: mqtt_subscribe
    id: sub_gh
    topic: tank-monitor/chem/gh
    internal: true
    on_value:
      - lambda: id(chem_gh) = x;
      - script.execute: chem_stamp_now
  - platform: mqtt_subscribe
    id: sub_kh
    topic: tank-monitor/chem/kh
    internal: true
    on_value:
      - lambda: id(chem_kh) = x;
      - script.execute: chem_stamp_now
  - platform: mqtt_subscribe
    id: sub_no2
    topic: tank-monitor/chem/no2
    internal: true
    on_value:
      - lambda: id(chem_no2) = x;
      - script.execute: chem_stamp_now
  - platform: mqtt_subscribe
    id: sub_no3
    topic: tank-monitor/chem/no3
    internal: true
    on_value:
      - lambda: id(chem_no3) = x;
      - script.execute: chem_stamp_now

  # The subscriptions above are internal; these publish the CACHED values,
  # which is what the web UI and the panel should both read. Same reason
  # the display reads globals: after a reboot with the broker down, the
  # subscription has nothing and the cache still has the last reading.
  - platform: template
    name: "Chem pH"
    accuracy_decimals: 2
    update_interval: 30s
    entity_category: diagnostic
    lambda: "if (isnan(id(chem_ph))) return {}; return id(chem_ph);"
  - platform: template
    name: "Chem NH3"
    unit_of_measurement: "mg/L"
    accuracy_decimals: 3
    update_interval: 30s
    entity_category: diagnostic
    lambda: "if (isnan(id(chem_nh3))) return {}; return id(chem_nh3);"
  - platform: template
    name: "Chem GH"
    unit_of_measurement: "ppm"
    accuracy_decimals: 0
    update_interval: 30s
    entity_category: diagnostic
    lambda: "if (isnan(id(chem_gh))) return {}; return id(chem_gh);"
  - platform: template
    name: "Chem KH"
    unit_of_measurement: "dKH"
    accuracy_decimals: 1
    update_interval: 30s
    entity_category: diagnostic
    lambda: "if (isnan(id(chem_kh))) return {}; return id(chem_kh);"
  - platform: template
    name: "Chem NO2"
    unit_of_measurement: "ppm"
    accuracy_decimals: 1
    update_interval: 30s
    entity_category: diagnostic
    lambda: "if (isnan(id(chem_no2))) return {}; return id(chem_no2);"
  - platform: template
    name: "Chem NO3"
    unit_of_measurement: "ppm"
    accuracy_decimals: 0
    update_interval: 30s
    entity_category: diagnostic
    lambda: "if (isnan(id(chem_no3))) return {}; return id(chem_no3);"

text_sensor:
  # How stale the chemistry block is, in words. A panel that cannot say
  # how old its numbers are is worse than one showing none.
  - platform: template
    name: "Chem Age"
    update_interval: 30s
    entity_category: diagnostic
    lambda: |-
      if (id(chem_stamp) == 0) return {"never"};
      auto n = id(sntp_time).now();
      if (!n.is_valid()) return {};
      const uint32_t age = (uint32_t) n.timestamp - id(chem_stamp);
      char buf[24];
      if (age < 3600)        snprintf(buf, sizeof(buf), "%um ago", (unsigned) (age / 60));
      else if (age < 172800) snprintf(buf, sizeof(buf), "%uh ago", (unsigned) (age / 3600));
      else                   snprintf(buf, sizeof(buf), "%ud ago", (unsigned) (age / 86400));
      return {buf};
