# Board-independent plumbing: identity, network, MQTT, clock, colours and
# the diagnostics every build wants. No pins here -- anything that names a
# GPIO belongs in a boards/*.yaml file.
substitutions:
  device_name: tank-monitor
  friendly_name: Tank Monitor
  # --- Calibration ---
  # Target water temperature, Fahrenheit. Centre of the 74-75 F band.
  # Everything in this project is Fahrenheit; the controller converts once,
  # internally, and nothing user-facing is ever Celsius.
  target_temp_f: "74.5"

  # --- Display thresholds (all in the units shown on screen) ---
  # Green inside lo..hi, amber just outside, red beyond red_lo..red_hi.
  temp_lo: "74"
  temp_hi: "75"
  temp_red_lo: "73.5"
  temp_red_hi: "75.5"
  # Green also requires the tank to be *steady*: peak-to-peak swing over
  # the last hour must be under this, in F. Being briefly in-band while
  # swinging 3 F is not the same as holding temperature.
  temp_swing_max: "0.5"
  tds_lo: "180"
  tds_hi: "250"
  tds_red_lo: "150"
  tds_red_hi: "300"
  # Above this the tank lights count as on, and the top strip goes amber.
  light_on_lux: "50"
  # K-value for the TDS probe. 1.0 is the factory default.
  # Calibrate with a known solution (e.g. 707ppm / 1413us-cm standard).
  tds_k_factor: "1.0"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

logger:
  level: INFO

# SNTP, not Home Assistant -- the learned light schedule needs a wall clock
# that keeps working when HA is down.
time:
  - platform: sntp
    id: sntp_time
    timezone: !secret timezone

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Fallback AP so the device is recoverable if Wi-Fi drops
  ap:
    ssid: "${device_name} setup"
    password: !secret tank_monitor_ap_password

captive_portal:

# OTA + a local web page for eyeballing live values
ota:
  - platform: esphome
    password: !secret tank_monitor_ota_password

web_server:
  port: 80
  version: 3

mqtt:
  broker: !secret mqtt_broker
  port: 1883
  username: !secret tank_monitor_mqtt_username
  password: !secret tank_monitor_mqtt_password
  discovery: true
  discovery_prefix: homeassistant
  topic_prefix: ${device_name}
  birth_message:
    topic: ${device_name}/status
    payload: online
  will_message:
    topic: ${device_name}/status
    payload: offline

# Shared by every board's display lambda. Panels differ; the palette does
# not -- these are chosen for contrast at 5-8 ft, not for a specific LCD.
color:
  - id: COLOR_INK
    hex: "0A0A0A"
  - id: COLOR_GREEN
    hex: "3ECF6E"
  - id: COLOR_AMBER
    hex: "FFB020"
  - id: COLOR_RED
    hex: "FF4438"
  - id: COLOR_NIGHT
    hex: "10161F"
  - id: COLOR_DIM
    hex: "8A93A0"

sensor:
  - platform: wifi_signal
    name: "Wi-Fi Signal"
    update_interval: 60s
    entity_category: diagnostic

  - platform: uptime
    name: "Uptime"
    entity_category: diagnostic

binary_sensor:
  - platform: status
    name: "Status"

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      entity_category: diagnostic

button:
  - platform: restart
    name: "Restart"
    entity_category: config
