# Board-independent plumbing: identity, network, MQTT, clock, colours and
# the diagnostics every build wants. No pins here -- anything that names a
# GPIO belongs in a boards/*.yaml file.
substitutions:
  device_name: tank-monitor
  friendly_name: Tank Monitor
  # --- Calibration ---
  # Target water temperature, Fahrenheit. Centre of the 75.8-76.5 green
  # band. Everything in this project is Fahrenheit; the controller converts
  # once, internally, and nothing user-facing is ever Celsius.
  target_temp_f: "76.0"

  # --- Display thresholds (Fahrenheit, as shown on screen) ---
  # Six bands, ascending. Colour encodes DIRECTION, brightness encodes
  # SEVERITY -- blue and red are the same alarm at opposite ends, because
  # too cold and too hot are both emergencies for this tank.
  #
  # Shown relative to the setpoint, so this table holds at any target:
  #
  #   below sp-1.9   blue        TOO COLD   <- emergency (mirrors red)
  #   sp-1.9..-1.3   light blue  COLD       <- warning   (mirrors amber)
  #   sp-1.2..-0.3   green-blue  COOL       <- off-target but safe
  #   sp-0.2..+0.5   green       STEADY     <- target sits here
  #   sp+0.6..+1.4   amber       WARM       <- warning
  #   above sp+1.4   red         TOO WARM   <- emergency
  #
  # The cool side has one more tier than the warm side because there is
  # more usable room below target than above it, not because it is safer.
  #
  # Stated as OFFSETS FROM THE SETPOINT, not absolute temperatures, and
  # applied against the live setpoint at render time. Move the target from
  # Home Assistant and the bands move with it -- there is nothing to keep
  # in sync by hand, and no way for the colours to end up describing a
  # target the tank is no longer being held at.
  #
  # The offsets below reproduce the bands above for a 76.0 F target. The
  # asymmetry is deliberate: more usable room below target than above.
  #
  # Each is the midpoint between two bands' stated edges, so any value the
  # display can show (one decimal) lands in the band it is named for.
  # Compared as `t < setpoint + offset`, ascending.
  temp_off_lightblue: "-1.95"
  temp_off_greenblue: "-1.25"
  temp_off_green: "-0.25"
  temp_off_amber: "0.55"
  temp_off_red: "1.45"
  # Edges of the green band as a human reads them, also relative to the
  # setpoint. Display text only -- the offsets above are what decide.
  temp_off_label_lo: "-0.2"
  temp_off_label_hi: "0.5"
  # Green also requires the tank to be *steady*: peak-to-peak swing over
  # the last hour must be under this, in F. Being briefly in-band while
  # swinging 3 F is not the same as holding temperature.
  temp_swing_max: "0.5"
  # No TDS thresholds. The strip reports the number and colours only a
  # dead probe. TDS is the sum of everything dissolved, so it cannot say
  # whether the right minerals are present -- this tank sat at 489 ppm
  # with GH 1.7, which any threshold would have called fine or called an
  # emergency, and both would have been wrong. GH and KH carry that
  # verdict, in Home Assistant, against targets you can adjust.
  # Above this the tank lights count as on, and the top strip goes amber.
  light_on_lux: "50"
  # K-value for the TDS probe. 1.0 is the factory default.
  # Calibrate with a known solution (e.g. 707ppm / 1413us-cm standard).
  tds_k_factor: "1.0"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

logger:
  level: INFO

# SNTP, not Home Assistant -- the learned light schedule needs a wall clock
# that keeps working when HA is down.
time:
  - platform: sntp
    id: sntp_time
    timezone: !secret timezone

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Fallback AP so the device is recoverable if Wi-Fi drops
  ap:
    ssid: "${device_name} setup"
    password: !secret tank_monitor_ap_password

captive_portal:

# OTA + a local web page for eyeballing live values
ota:
  - platform: esphome
    password: !secret tank_monitor_ota_password

# The built-in page is only `<esp-app></esp-app>` plus one script tag, so
# blanking js_url suppresses ESPHome's CDN bundle and whatever js_include
# defines as `esp-app` becomes the whole interface. Everything is served
# from this device's flash: no CDN, no internet, no Home Assistant.
#
# www/tank.js and www/tank.css must sit in the ESPHome config directory
# alongside secrets.yaml. Remote packages fetch the YAML in `files:`, not
# assets these reference, so these two are copied rather than pulled --
# see the README.
web_server:
  port: 80
  version: 3
  js_url: ""
  css_url: ""
  js_include: www/tank.js
  css_include: www/tank.css

mqtt:
  broker: !secret mqtt_broker
  port: 1883
  username: !secret tank_monitor_mqtt_username
  password: !secret tank_monitor_mqtt_password
  discovery: true
  discovery_prefix: homeassistant
  topic_prefix: ${device_name}
  birth_message:
    topic: ${device_name}/status
    payload: online
  will_message:
    topic: ${device_name}/status
    payload: offline

# Shared by every board's display lambda. Panels differ; the palette does
# not -- these are chosen for contrast at 5-8 ft, not for a specific LCD.
color:
  - id: COLOR_INK
    hex: "0A0A0A"
  - id: COLOR_GREEN
    hex: "3ECF6E"
  # Cool-side ladder, pitched to mirror the warm side rung for rung:
  # COLOR_TEAL is the mild tier, COLOR_LIGHTBLUE carries the same weight as
  # COLOR_AMBER, and COLOR_BLUE is as saturated as COLOR_RED because it
  # means the same thing. All three stay light enough that near-black ink
  # still reads across the room -- a darker "looks cold" blue would win the
  # metaphor and lose the legibility, which is the whole point of the panel.
  - id: COLOR_TEAL
    hex: "3ECFB0"
  - id: COLOR_LIGHTBLUE
    hex: "7FC4FF"
  - id: COLOR_BLUE
    hex: "2F80FF"
  - id: COLOR_AMBER
    hex: "FFB020"
  - id: COLOR_RED
    hex: "FF4438"
  - id: COLOR_NIGHT
    hex: "10161F"
  - id: COLOR_DIM
    hex: "8A93A0"

sensor:
  - platform: wifi_signal
    name: "Wi-Fi Signal"
    update_interval: 60s
    entity_category: diagnostic

  - platform: uptime
    name: "Uptime"
    entity_category: diagnostic

binary_sensor:
  - platform: status
    name: "Status"

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      entity_category: diagnostic

button:
  - platform: restart
    name: "Restart"
    entity_category: config
