# The control loop itself: the tank_controller component, the entities that
# tune it, and every sensor derived from its internal state.
#
# Pin-free on purpose. It refers to ids the board package must provide:
#   water_temp (sensor)  tank_lux (sensor)
#   heater_output, fan_output (slow_pwm outputs)
external_components:
  # Pulled from git so this builds in the Home Assistant ESPHome add-on
  # with no local files. refresh: 0s because the ref is a moving branch --
  # the default caches for a day and you'd silently build stale code.
  - source:
      type: git
      url: https://github.com/JoshuaSeidel/tank-monitor
      ref: main
    components: [tank_controller]
    refresh: 0s

tank_controller:
  id: controller
  temperature: water_temp
  illuminance: tank_lux
  heater: heater_output
  fan: fan_output
  time_id: sntp_time
  setpoint: ${target_temp_f}
  # Hard cutouts, Fahrenheit. Outside these the model is ignored entirely.
  # Set wider than the 70-80 F slider so the cutout is a backstop, not a
  # limit you can drive into by moving the target.
  min_temperature: 68.0
  max_temperature: 82.0
  # Bright aquarium light at the sensor, in lux. Used to normalise.
  full_scale_lux: 3000
  # How aggressively to close a temperature error. Longer = gentler.
  # Kept well above the 15 min actuator window so the controller isn't
  # demanding changes faster than the relay can actually resolve them.
  response_time: 30min
  update_interval: 30s

number:
  - platform: template
    name: "Target Temperature"
    id: target_temperature
    icon: "mdi:thermostat"
    # Fahrenheit, because that is what every other temperature in this
    # project is shown in. The controller stores Celsius, so set_action
    # converts on the way in and the lambda converts on the way out.
    unit_of_measurement: "°F"
    device_class: temperature
    min_value: 70.0
    max_value: 80.0
    step: 0.1
    entity_category: config
    # Reads the controller back rather than keeping its own copy, and
    # therefore NOT optimistic/restore_value/initial_value.
    #
    # Those three gave the setpoint two owners: the number persisted its
    # own value, the controller persisted setpoint_pref_, and on boot the
    # number restored its copy and pushed it in -- so whichever was
    # written last silently won. They did diverge: the controller held
    # 76.0 F while the number held 73.9 F, and after a flash the number
    # won and the tank was cooled toward 73.9 with a fan at 100%.
    #
    # The controller already persists the setpoint across reboots and is
    # the thing that acts on it, so it owns it. This entity is now a view
    # onto that one value plus a way to change it. The default for a tank
    # that has never been configured comes from `setpoint:` above.
    lambda: "return id(controller).get_setpoint() * 9.0f / 5.0f + 32.0f;"
    update_interval: 30s
    set_action:
      - tank_controller.set_setpoint:
          id: controller
          setpoint: !lambda "return (x - 32.0f) * 5.0f / 9.0f;"

switch:
  - platform: template
    name: "Adaptive Learning"
    icon: "mdi:brain"
    lambda: "return id(controller).get_learning_enabled();"
    entity_category: config
    # Without this the switch defaults to ALWAYS_OFF, and the boot-time
    # write fires turn_off_action -- silently disabling learning on every
    # single boot. Default on, but remember the user's choice.
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - tank_controller.set_learning:
          id: controller
          learning: true
    turn_off_action:
      - tank_controller.set_learning:
          id: controller
          learning: false

button:
  - platform: template
    name: "Reset Learning"
    icon: "mdi:brain"
    entity_category: config
    on_press:
      - tank_controller.reset_learning:
          id: controller

# Both relay sensors publish only on a transition, so without this they sit
# at "unknown" from boot until the first time that relay closes -- which for
# the fan could be never. Seed them off at startup; slow_pwm's own state at
# boot is off, so this is the truth, not an assumption.
esphome:
  on_boot:
    priority: -100
    then:
      - binary_sensor.template.publish:
          id: heater_relay
          state: false
      - binary_sensor.template.publish:
          id: fan_relay
          state: false

binary_sensor:
  # The relays themselves. Controller State says what the controller is
  # DRIVING this window; these say whether the contacts are closed right
  # now. They differ on purpose: holding a tank at temperature means
  # delivering a fraction of full power, and the only way a switch can do
  # that is by being closed part of the time. At 14% duty on a 15 minute
  # window that is roughly 2 minutes closed and 13 open, all while
  # Controller State reads "heating" -- because it is.
  #
  # Published from slow_pwm's state_change_action in the board file, so
  # this is the actual switching, not an inference from duty.
  - platform: template
    id: heater_relay
    name: "Heater"
    device_class: running
    icon: "mdi:radiator"

  - platform: template
    id: fan_relay
    name: "Fan"
    device_class: running
    icon: "mdi:fan"

  - platform: template
    name: "Temperature Fault"
    device_class: problem
    entity_category: diagnostic
    lambda: "return id(controller).is_safety_tripped();"

  # Heater commanded near full for 45 minutes with no measurable rise.
  # Catches an unplugged or dead heater, a failed relay channel, or a
  # heater whose own thermostat has cut out -- none of which the
  # temperature alarms see until the tank has already drifted cold.
  - platform: template
    name: "Heater Not Responding"
    device_class: problem
    entity_category: diagnostic
    lambda: "return id(controller).is_heater_stalled();"

  # Fan commanded wide open for 45 minutes and the water did not fall at
  # all. Weaker evidence than the heater's version, because passive loss
  # alone should drop this tank over a degF in that time -- flat or rising
  # water under full fan means the fan, the relay channel or the outlet is
  # dead. A merely feeble fan will not trip this; Learned Fan Power is the
  # sensitive measure.
  - platform: template
    name: "Fan Not Responding"
    device_class: problem
    entity_category: diagnostic
    lambda: "return id(controller).is_fan_stalled();"

text_sensor:
  - platform: template
    name: "Seed Status"
    id: seed_status
    entity_category: diagnostic
    update_interval: 30s
    # The "s3" is a build marker. Twice now a migration has failed in a way
    # that looked identical whether the firmware was current or stale, and
    # there was no way to tell them apart from the outside. Bump it with any
    # change to this block; if the device does not report the marker you
    # expect, the build is old and nothing below is worth debugging.
    lambda: |-
      if (id(seed_done)) return {"imported (s3)"};
      if (id(seed_payload).state.empty()) return {"idle (s3)"};
      if (!id(seed_parsed)) return {"bad payload (s3)"};
      return {"parsed, not imported (s3)"};

  # One topic, one subscription, one atomic payload -- six separate topics
  # meant six chances to half-arrive, and the "waiting n/6" state existed
  # only to describe that failure mode. CSV rather than JSON so the parse is
  # a single sscanf with no allocator.
  #
  # This is a NON-internal text_sensor on purpose: it publishes whatever
  # arrived, verbatim. If a seed goes missing again, the question "did the
  # device receive anything at all" is answered by looking, not inferring.
  - platform: mqtt_subscribe
    name: "Seed Payload"
    id: seed_payload
    topic: tank-seed/${device_name}/model
    entity_category: diagnostic
    on_value:
      - lambda: |-
          float v[6];
          id(seed_parsed) = (sscanf(x.c_str(), "%f,%f,%f,%f,%f,%f",
                                    &v[0], &v[1], &v[2], &v[3], &v[4], &v[5]) == 6);
          if (id(seed_parsed)) {
            id(seed_heater) = v[0];
            id(seed_fan)    = v[1];
            id(seed_light)  = v[2];
            id(seed_bias)   = v[3];
            id(seed_tc)     = v[4];
            id(seed_conf)   = v[5];
          }
      - script.execute: try_seed

  - platform: template
    name: "Controller State"
    icon: "mdi:state-machine"
    update_interval: 30s
    lambda: "return {id(controller).get_state_text()};"

sensor:
  # NOTE: there is deliberately no "Target Temperature" sensor here. The
  # number entity above already publishes the setpoint in Fahrenheit and
  # is recorded to InfluxDB like any other entity, so a mirror sensor was
  # a second entity with the same name and the same value. Grafana draws
  # the setpoint line from number.<device>_target_temperature instead.

  - platform: template
    name: "Heater Output"
    id: heater_duty
    unit_of_measurement: "%"
    # Commanded duty, not relay state -- the binary Heater above is the
    # contacts. Diagnostic: useful in Grafana and when working out why the
    # controller did something, not something to watch day to day.
    entity_category: diagnostic
    icon: "mdi:radiator"
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 30s
    lambda: "return id(controller).get_heater_duty();"

  - platform: template
    name: "Fan Output"
    unit_of_measurement: "%"
    entity_category: diagnostic
    icon: "mdi:fan"
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 30s
    lambda: "return id(controller).get_fan_duty();"

  - platform: template
    name: "Predicted Temperature (15 min)"
    unit_of_measurement: "°F"
    device_class: temperature
    accuracy_decimals: 2
    update_interval: 30s
    lambda: |-
      float v = id(controller).get_predicted_temperature();
      if (isnan(v)) return {};
      return v * 9.0f / 5.0f + 32.0f;

  - platform: template
    name: "Temperature Swing (1h)"
    unit_of_measurement: "°F"
    icon: "mdi:arrow-expand-vertical"
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 60s
    lambda: |-
      float v = id(controller).get_swing();
      if (isnan(v)) return {};
      return v * 9.0f / 5.0f;

  - platform: template
    name: "Temperature Drift Rate"
    # F per hour, not C per minute -- a number you can read against the
    # tank rather than one you have to convert twice.
    unit_of_measurement: "°F/h"
    icon: "mdi:trending-up"
    accuracy_decimals: 2
    update_interval: 60s
    entity_category: diagnostic
    lambda: "return id(controller).get_drift_rate() * 60.0f * 9.0f / 5.0f;"

  # Signed: positive means the tank keeps coming out warmer than the model
  # predicted. Diagnostic only -- nothing is gated on it. Watch it against
  # Temperature Drift Rate: a sustained one-signed bias means the model is
  # genuinely off, whereas Drift Rate alone is quantised to 1.35 degF/h
  # steps and a single sample of it will mislead you.
  - platform: template
    name: "Model Bias"
    unit_of_measurement: "°F/h"
    icon: "mdi:compass-off"
    accuracy_decimals: 2
    update_interval: 60s
    entity_category: diagnostic
    lambda: "return id(controller).get_model_bias() * 60.0f * 9.0f / 5.0f;"

  - platform: template
    name: "Model Health"
    id: model_health
    unit_of_measurement: "%"
    icon: "mdi:heart-pulse"
    state_class: measurement
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: 30s
    lambda: "return id(controller).get_model_health() * 100.0f;"

  # Model Confidence is now Model Health multiplied by how much data the
  # model has seen, so it falls when the tank changes and recovers as RLS
  # catches up. Health on its own is the diagnostic: it isolates "the model
  # is wrong" from "the model is new", which the combined number cannot.
  - platform: template
    name: "Model Confidence"
    unit_of_measurement: "%"
    icon: "mdi:brain"
    accuracy_decimals: 0
    update_interval: 60s
    entity_category: diagnostic
    lambda: "return id(controller).get_confidence();"

  - platform: template
    name: "Tank Time Constant"
    unit_of_measurement: "min"
    icon: "mdi:timer-sand"
    accuracy_decimals: 0
    update_interval: 300s
    entity_category: diagnostic
    lambda: |-
      float v = id(controller).get_time_constant();
      if (isnan(v)) return {};
      return v;

  - platform: template
    name: "Learned Heater Power"
    unit_of_measurement: "°F/h"
    icon: "mdi:fire"
    accuracy_decimals: 2
    update_interval: 300s
    entity_category: diagnostic
    lambda: "return id(controller).get_heater_gain() * 60.0f * 9.0f / 5.0f;"

  # The fan's counterpart to Learned Heater Power, and the honest answer to
  # "is the fan doing anything". Heater Output and Fan Output are commanded
  # duty -- the controller reading back its own decision, with no current
  # sensing and no proof the relay closed. These learned gains are inferred
  # from how the water actually responded, so they are the closest thing to
  # a measurement of delivery. Sits near its -0.002 floor once the fan has
  # run for a while = the fan is not cooling.
  - platform: template
    name: "Learned Fan Power"
    unit_of_measurement: "°F/h"
    icon: "mdi:fan"
    accuracy_decimals: 2
    update_interval: 300s
    entity_category: diagnostic
    lambda: "return id(controller).get_fan_gain() * 60.0f * 9.0f / 5.0f;"

  - platform: template
    name: "Learned Light Heat Gain"
    unit_of_measurement: "°F/h"
    icon: "mdi:white-balance-sunny"
    accuracy_decimals: 2
    update_interval: 300s
    entity_category: diagnostic
    lambda: "return id(controller).get_light_gain() * 60.0f * 9.0f / 5.0f;"

  - platform: template
    name: "Predicted Light Load"
    unit_of_measurement: "%"
    icon: "mdi:lightbulb-on-outline"
    accuracy_decimals: 0
    update_interval: 60s
    entity_category: diagnostic
    lambda: "return id(controller).get_predicted_light_load() * 100.0f;"


# --- migrating a learned model between boards -------------------------
# Lives in this package, which every board loads, rather than an opt-in
# one. The opt-in version failed twice for the same reason: the board
# wrapper is the single file NOT pulled from git, so "add a line to your
# wrapper" is a step that silently does not happen and leaves a device
# that looks healthy and quietly ignores the seed.
#
# Cost of always loading it: one MQTT subscription and eight globals.
# The topic is device-scoped (tank-seed/<device_name>/model), so two
# boards cannot seed each other, and a board with nothing retained never
# fires.
#
# The topic deliberately sits OUTSIDE the device's own mqtt topic_prefix.
# An earlier version scoped it as <device_name>/seed/..., i.e. under the
# prefix, and the device silently received nothing there while happily
# receiving tank-monitor/chem/... on the same connection. Moving it out
# did not on its own fix the migration, so the prefix is not proven to be
# the cause -- but every topic known to work in this project sits outside
# the prefix, and there is no reason to put this one back inside.
#
# Publish ONE retained CSV payload to tank-seed/<new_device_name>/model:
#
#   heater_f_per_h,fan_f_per_h,light_f_per_h,bias_f_per_h,tc_min,confidence
#
# Import fires the moment it parses. Then clear the retained topic, or it
# re-seeds on every boot over whatever has been learned since.
globals:
  - id: seed_heater
    type: float
    initial_value: 'NAN'
  - id: seed_fan
    type: float
    initial_value: 'NAN'
  - id: seed_light
    type: float
    initial_value: 'NAN'
  - id: seed_bias
    type: float
    initial_value: 'NAN'
  - id: seed_tc
    type: float
    initial_value: 'NAN'
  - id: seed_conf
    type: float
    initial_value: 'NAN'
  - id: seed_parsed
    type: bool
    initial_value: 'false'
  # Guards against re-importing on every subsequent message in the burst.
  - id: seed_done
    type: bool
    initial_value: 'false'

script:
  - id: try_seed
    then:
      - if:
          condition:
            lambda: |-
              return !id(seed_done) && id(seed_parsed);
          then:
            - logger.log: "Seed complete - importing thermal model from the previous controller"
            - tank_controller.import_model:
                id: controller
                heater_f_per_h: !lambda "return id(seed_heater);"
                fan_f_per_h: !lambda "return id(seed_fan);"
                light_f_per_h: !lambda "return id(seed_light);"
                bias_f_per_h: !lambda "return id(seed_bias);"
                time_constant_min: !lambda "return id(seed_tc);"
                confidence_pct: !lambda "return id(seed_conf);"
            - lambda: id(seed_done) = true;
