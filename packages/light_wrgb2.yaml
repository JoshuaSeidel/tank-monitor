# The tank light, driven from the tank's own board.
#
# A Chihiros WRGB II / WRGB II Pro, controlled over BLE from the same chip
# that runs the heaters, using the protocol helpers in the
# JoshuaSeidel/chihiros-esphome fork. This replaces the separate
# aquarium-light-bridge ESP32 AND the Home Assistant automation that used to
# re-push the schedule every half hour. Everything here runs on the board:
# Home Assistant only reports it, exactly as it does for the heaters.
#
# TUNING NEEDS NO FLASH. The phase table is stored in flash memory, not
# compiled in: "Light White/Red/Green/Blue/Ramp/On Time/Off Time" edit the
# selected phase, save it, and push it within a couple of seconds. The
# numbers in light_seed_table are first-boot defaults and what "Reset
# Light Phase to Defaults" restores -- nothing else.
#
# Needs from the including build:
#   ${light_mac}      the lamp's BLE MAC (the board file sets it)
#   sensor tank_lux   LAMP-ONLY lux -- daylight already unmixed out by NIR
#   global cal_nir_ref  the learned daylight reference (ble_link_v3.yaml)
#   time sntp_time    packages/base.yaml
#   esp32_ble         packages/ble_link_v3.yaml (the panel server)
#   ble_guard         packages/ble_link_v3.yaml (disconnect reasons)
#
# ---------------------------------------------------------------------
# WHY THE LINK IS HELD OPEN
# ---------------------------------------------------------------------
# The upstream bridge connects, pushes, and disconnects, and scans
# continuously so it can reconnect at any moment. On a board that also runs
# the heaters and serves the panel, a scanner that never stops is radio time
# taken from Wi-Fi and the panel link for no reason. Here the tracker scans
# from boot only until the lamp connects, then stops; it scans again only if
# the link drops. With both links up, the radio does not scan at all.
#
# Held open, the link also means the Chihiros app CANNOT connect -- the lamp
# takes one connection at a time. That is the point: nothing overrides the
# phase selected here. "Release Light for App" hands the lamp over for 30
# minutes and then takes it back, re-pushing the selected phase, so whatever
# was done in the app is undone automatically. A release cannot be left on.
#
# ---------------------------------------------------------------------
# DETECTION -- "the schedule says lit and the lamp is dark"
# ---------------------------------------------------------------------
# The lamp cannot report its state, so this looks at it instead. tank_lux is
# lamp-only light (daylight is removed by its near-infrared signature, see
# the board file), so it answers "is the fixture actually on" even with the
# window open. Room LEDs have no NIR either and DO leak into it, which is why
# the lit level is LEARNED rather than guessed -- a guessed lux threshold was
# wrong on this project for a year once already:
#
#   * During the plateau of a lit phase, while the reading looks lit, the
#     plateau lux is tracked as an average ("Light Learned Lux").
#   * Plateau and reading below max(20 lx, a quarter of the learned level)
#     for 5 minutes = the lamp is dark when it should be lit. Re-push.
#   * Outside the photoperiod and reading above 5% of the learned level
#     (floor 10 lx; 15 lx before anything is learned) for 5 minutes = lit
#     when it should be dark (lights left on overnight is the algae case):
#     "Light Brighter Than Schedule", and a re-push. Waits for the daylight
#     reference (cal_nir_ref) or the sun below -6 deg: tank_lux passes
#     sunlight through as lamp light until the reference is learned. (Was
#     HALF the learned level, which a lamp creeping back on at 1 lx/min
#     after sunset on 2026-10-19 never reached.)
#   * On the daylight curve, well above the curve (1.5x + 5%) for 5 minutes also
#     counts, and suspends the curve until midnight: the single scene is
#     pushed instead, which darkens / corrects the lamp at once.
#   * No more than one fix per 15 minutes; after 3 fixes that did not take,
#     stop pushing and raise "Light Not Responding" rather than hammering the
#     radio. It clears the moment the lamp matches again.
#
# Ramps are excluded (5 min margin each side on top of the ramp itself) --
# mid-ramp the lux is legitimately anywhere. Assumes the photoperiod does
# not cross midnight; none of the phases do.
#
# ---------------------------------------------------------------------
# THE DAYLIGHT CURVE -- a real day, stored in the lamp
# ---------------------------------------------------------------------
# A sun-following phase ("Light Follows Sun" on) with "Light Day Shape" =
# Daylight is not one fade-in/fade-out schedule. The board writes a
# multi-point day into the lamp's own CUSTOM-CURVE controller (0x5a/0x06
# points, the My Chihiros app's point-curve auto mode; frames in
# chihiros-esphome chihiros_devices.h prepare_curve). The lamp stores the
# points and runs them off its own RTC like any auto schedule, so a board or
# BLE failure cannot freeze it mid-day. Why not several 0x19 scenes: the app
# allows one scene per weekday (max 7) and each fades from and to 0 on its
# own, so scenes cannot be chained into one smooth day.
#
# Shape (math in chihiros-esphome daylight.h): the sun's real elevation at
# the tank (light_latitude/longitude) drives a clear-sky illuminance model
# (direct sun + sky, civil twilight below the horizon), normalised so solar
# noon = the phase's full W/R/G/B:
#   level = (E(h) / E(noon)) ^ g      g = "Light Daylight Exponent" (0.5)
# g = 1 is literal photometry, which is dimmer than a sine for the first
# ~1.5 h and invisible through twilight (below the lamp's 1% step). 0.5
# compresses it the way vision does: a glow from civil dawn, a fast first
# hour, a flat midday. The day runs civil dawn (sun -6 deg) to civil dusk:
# ~11.9 h in late October, ~10.3 h at the December solstice, ~16 h in June.
# At low sun the mix is warmed toward golden white ("Light Dawn Warmth":
# more W, less R, much less B) and back to the phase's ratio by 12 deg; no
# channel ever exceeds the phase's full value.
#
# Total light is natural: whatever the day gives (full-equivalent hours,
# "Light Daily Light"; 8.0 h on 2026-10-20 at g 0.5). "Light Full
# Brightness Hours" is now an optional CAP (0 = natural, the default): a
# day that would deliver more is scaled down to it.
#
# Points: civil dawn, sunrise, sunset, civil dusk exactly; every "Light
# Curve Edge Step" (30 min) within 2 h of dawn and dusk where the curve is
# steep; every "Light Curve Step" (60 min) between. 19 points on 2026-10-20,
# 24 in June (the cap; steps double past it). The lamp interpolates between
# them (confirmed 2026-10-19: smooth 1% steps); worst error ~4% of full for
# a few minutes before sunset. Pushed after midnight while the lamp is dark.
# After a push the lamp's own snapshot is checked: a stored time the board
# did not send (the 2026-10-19 failure) suspends the curve for the day.
#
# Detection follows the curve: "Light Expected Level" is the computed
# brightness now; the learned lux is the lux at the phase's FULL values,
# learned while the curve is above 70% of its peak (sun high, no warm
# shift) and scaled by the level (lux / level).

substitutions:
  # The Nordic UART service every Chihiros device speaks. Fixed by the
  # lamp, not a setting. The panel server in ble_link_v3.yaml advertises the
  # same service UUID -- no clash: that is the board's own GATT server, this
  # is a client connection to a different device.
  light_ble_service: "6e400001-b5a3-f393-e0a9-e50e24dcca9e"
  light_ble_tx:      "6e400002-b5a3-f393-e0a9-e50e24dcca9e"
  light_ble_rx:      "6e400003-b5a3-f393-e0a9-e50e24dcca9e"
  # "true" for a WRGB II Pro (independent white channel).
  light_pro: "true"

external_components:
  - source:
      type: git
      url: https://github.com/JoshuaSeidel/chihiros-esphome
      ref: main
    components: [chihiros_ble]
    # The default 1d would silently build yesterday's protocol code.
    refresh: 0s

# Pulls in the protocol headers (frame builder, WRGB2Device). No options.
chihiros_ble:

# Scans from boot until the lamp is found; the ble_client's on_connect stops
# it. Same timing the upstream bridge uses; active, because the lamp's name
# rides in the scan response.
esp32_ble_tracker:
  scan_parameters:
    active: true
    interval: 320ms
    window: 60ms
    continuous: true

ble_client:
  - mac_address: ${light_mac}
    id: light_ble
    on_connect:
      then:
        - lambda: |-
            id(light_linked) = true;
            id(light_up_ms) = millis();
        - esp32_ble_tracker.stop_scan:
        - logger.log:
            level: INFO
            format: "light: linked, scanning stopped"
        # Always re-push on (re)connect: whatever happened while the link was
        # down -- a reboot, a release to the app -- is overwritten here.
        - delay: 500ms
        - script.execute: light_push
    # Fires on ESP_GATTC_CLOSE_EVT only. ESPHome has two ways to end a link
    # WITHOUT that event: its 10 s "Timeout waiting for CLOSE_EVT, forcing
    # IDLE" path in BLEClientBase::loop(), and a BLE stack teardown. Either
    # one left Light Linked stuck on and the scan never restarted -- the
    # watchdog interval below is what catches those.
    on_disconnect:
      then:
        - script.execute:
            id: light_link_down
            cause: 1

globals:
  - id: light_device
    type: chihiros::WRGB2Device
    restore_value: false
  - id: light_linked
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: light_released
    type: bool
    restore_value: false
    initial_value: 'false'
  # Link diagnostics. Not restored: they describe this boot's link, and
  # millis() stamps mean nothing after a reboot. "Light Link Drops" is
  # total_increasing, so Home Assistant handles the reset to 0.
  #   light_down_cause  0 none yet, 1 disconnect event, 2 found by watchdog
  - id: light_link_drops
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: light_up_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: light_down_cause
    type: int
    restore_value: false
    initial_value: '0'
  # Consecutive 10 s watchdog checks that disagreed with the real client
  # state / found the scan not running. Two in a row before acting, so a
  # transition caught mid-flight is not "corrected".
  - id: light_wd_strikes
    type: int
    restore_value: false
    initial_value: '0'
  - id: light_scan_strikes
    type: int
    restore_value: false
    initial_value: '0'
  # The selected phase, resolved from the table in light_select_phase.
  # Detection compares the lamp against THIS, not against what was last
  # successfully pushed.
  - id: lp_valid
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: lp_auto
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: lp_on_min
    type: int
    restore_value: false
    initial_value: '540'
  - id: lp_off_min
    type: int
    restore_value: false
    initial_value: '840'
  - id: lp_ramp
    type: int
    restore_value: false
    initial_value: '30'
  - id: lp_r
    type: int
    restore_value: false
    initial_value: '0'
  - id: lp_g
    type: int
    restore_value: false
    initial_value: '0'
  - id: lp_b
    type: int
    restore_value: false
    initial_value: '0'
  - id: lp_w
    type: int
    restore_value: false
    initial_value: '0'
  # Learned plateau lux. Persisted: a reboot should not forget what "on"
  # looks like. Zeroed on a phase change, because the new phase is a
  # different brightness. NAN until restored (see RESTORED SETTINGS).
  - id: light_learned_lux
    type: float
    restore_value: true
    initial_value: 'NAN'
  - id: light_mismatch_min
    type: int
    restore_value: false
    initial_value: '0'
  - id: light_fix_attempts
    type: int
    restore_value: false
    initial_value: '0'
  - id: light_last_fix_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: light_not_responding
    type: bool
    restore_value: false
    initial_value: 'false'
  # 0 unknown, 1 off phase, 2 dark (outside the photoperiod), 3 ramping,
  # 4 lit (plateau). Drives detection and "Light Expected".
  - id: light_expected
    type: int
    restore_value: false
    initial_value: '0'
  # ---------------------------------------------------------------------
  # RESTORED SETTINGS -- and how a lost one is caught
  # ---------------------------------------------------------------------
  # ESPHome restores a global by loading its stored bytes; when that load
  # fails (nothing stored yet, a size change, an NVS fault) it silently keeps
  # initial_value. So every restored setting here starts from a value it can
  # never legitimately hold (-1, NAN), and light_validate_settings checks
  # each one at boot: a value still on its sentinel, or out of range, did not
  # restore. It is logged at WARNING, replaced by its default, and named in
  # "Light Settings Restored". Defaults are the user's standing requirement:
  # every lit phase FOLLOWS THE SUN (a real dawn-to-dusk day), daily light
  # uncapped. Nothing is ever downgraded on the strength of a missing value.
  #
  # The storage keys are ESPHome's: md5 of the global's id. Renaming an id,
  # or changing its type or array length, is a new key -- the old value is
  # orphaned and the setting comes back as its default (and is reported as
  # such). Do neither without a migration.
  #
  # THE PHASE TABLE, stored in flash so it is tuned from Home Assistant or the
  # board's own page and survives reboots and reflashes -- changing a
  # brightness never needs a build. Five phases x seven fields, in select
  # order: [on_min, off_min, ramp, W, R, G, B]. A row that did not restore
  # (or is out of range) is re-seeded from light_seed_table, which is the
  # ONLY place default values are written down.
  - id: light_table
    type: std::array<int, 35>
    restore_value: true
    initial_value: '[] { std::array<int, 35> a; a.fill(-1); return a; }()'
  # DAILY-LIGHT CAP, per phase, in select order, minutes of
  # FULL-BRIGHTNESS-EQUIVALENT light ("Light Full Brightness Hours"). 0 =
  # natural (default). Whether a phase follows the sun is light_sun_follow.
  # Kept apart from light_table so adding it did not discard the stored
  # table.
  - id: light_sun_plateau
    type: std::array<int, 5>
    restore_value: true
    initial_value: 'std::array<int, 5>{-1, -1, -1, -1, -1}'
  # The selected phase follows the sun: lp_on/off/ramp are computed, not
  # read from the table. lp_sun_day is the day of year they were computed
  # for (-1 = not yet), so the minute tick recomputes after midnight and
  # once the clock first syncs.
  - id: lp_sun
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: lp_sun_day
    type: int
    restore_value: false
    initial_value: '-1'
  # Per phase: 1 = follows the sun (the daylight curve / single fade from
  # today's sun), 0 = the table's fixed times. Phase 0 (Off) never does.
  # Written ONLY by an explicit "Light Follows Sun" turn on/off after boot,
  # by "Reset Light Phase to Defaults", and by light_validate_settings when
  # the stored value is missing (-> 1). In particular NOT by the switch's own
  # setup: see the switch.
  - id: light_sun_follow
    type: std::array<int, 5>
    restore_value: true
    initial_value: 'std::array<int, 5>{-1, -1, -1, -1, -1}'
  # Backup of the "Light Phase" select's index. The select restores itself
  # from its own preference; if that fails it comes up on its initial option
  # (Phase 1) with nothing to say so. This copy lets the boot check notice
  # and put the stored phase back. -1 = never written.
  - id: light_phase_saved
    type: int
    restore_value: true
    initial_value: '-1'
  # Board-wide shape settings (see THE DAYLIGHT CURVE).
  - id: light_day_expo
    type: float
    restore_value: true
    initial_value: 'NAN'
  - id: light_dawn_warmth
    type: int
    restore_value: true
    initial_value: '-1'
  - id: light_curve_edge
    type: int
    restore_value: true
    initial_value: '-1'
  # Set at the end of on_boot. The Follows Sun actions refuse to act before
  # it: whatever ESPHome does with a switch during setup, it cannot rewrite
  # light_sun_follow.
  - id: light_boot_done
    type: bool
    restore_value: false
    initial_value: 'false'
  # Written by the first boot that runs light_validate_settings; see there.
  - id: light_store_marker
    type: uint32_t
    restore_value: true
    initial_value: '0'
  # What the boot check found, for "Light Settings Restored".
  - id: light_restore_status
    type: std::string
    restore_value: false
    initial_value: '"not checked yet"'
  # Today's resolved day (sun events, curve, bright window).
  - id: lp_plan
    type: chihiros::daylight::Plan
    restore_value: false
  # The minutes last written to the lamp as a curve, and when the read-back
  # (the lamp's answer to the closing status query) is due. 0 = not armed.
  - id: light_sent_min
    type: std::vector<int>
    restore_value: false
  - id: light_readback_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  # The lamp's snapshot after a curve push listed a time the board did not
  # send ("Light Curve Rejected"). Cleared by the next clean read-back.
  - id: light_curve_rejected
    type: bool
    restore_value: false
    initial_value: 'false'
  # Fraction of the curve's own peak that counts as "bright" (Light Bright
  # Start/End, which the CO2 schedule in HA keys off). Percent.
  # The Light Day Shape option last acted on, so its restore at boot is not
  # taken for a change. -1 = never set.
  - id: light_shape_last
    type: int
    restore_value: true
    initial_value: '-1'
  - id: light_bright_pct
    type: int
    restore_value: true
    initial_value: '-1'
  # Spacing of the points written to the lamp, minutes.
  - id: light_curve_step
    type: int
    restore_value: true
    initial_value: '-1'
  # The resolved curve for the selected phase (light_select_phase).
  #   lp_curve      the lamp runs the multi-point daylight curve (else one scene)
  #   lp_peak       today's peak, fraction of full (<1 only under a cap)
  #   lp_dose       full-equivalent minutes the day actually delivers
  #   lp_natural    full-equivalent minutes of the natural day (no cap)
  #   lp_bright_*   the window at or above light_bright_pct of the peak, min
  #   lp_frac_now   the computed brightness this minute, fraction of full
  - id: lp_curve
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: lp_peak
    type: float
    restore_value: false
    initial_value: '1.0'
  - id: lp_natural
    type: float
    restore_value: false
    initial_value: '0.0'
  - id: lp_dose
    type: float
    restore_value: false
    initial_value: '0.0'
  - id: lp_bright_on
    type: int
    restore_value: false
    initial_value: '-1'
  - id: lp_bright_off
    type: int
    restore_value: false
    initial_value: '-1'
  # Lit / brighter than the schedule for 5 min ("Light Brighter Than
  # Schedule").
  - id: light_over
    type: bool
    restore_value: false
    initial_value: 'false'
  # Day of year the daylight curve was suspended for (the lamp went brighter than
  # the curve); the phase runs as the single scene until midnight. Restored,
  # so a reboot that evening does not put the suspect curve back. -1 = none.
  - id: light_curve_off_day
    type: int
    restore_value: true
    initial_value: '-1'
  # millis() of the last push, so the lamp's answers to it are logged at
  # INFO (DEBUG otherwise; the lamp may also notify unprompted).
  - id: light_push_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: lp_frac_now
    type: float
    restore_value: false
    initial_value: '0.0'

# Sun position is computed on the board (chihiros-esphome daylight.h,
# NOAA low-precision ephemeris) from the clock and light_latitude /
# light_longitude, so a sun-following phase keeps working with Home
# Assistant down. The tank is in south-central Pennsylvania; one decimal
# (~10 km) is well under a minute of sunrise. Override them in the board
# file if it moves.

# List form: a mapping on_boot in a package can be dropped when packages
# merge. Late priority, so the select has already restored its option and
# every global has loaded. This only checks the stored settings and resolves
# the phase; the push itself happens on connect.
esphome:
  on_boot:
    - priority: -100
      then:
        - script.execute: light_validate_settings
        - script.wait: light_validate_settings
        - script.execute: light_select_phase
        - text_sensor.template.publish:
            id: light_restore_text
            state: !lambda return id(light_restore_status);
        - lambda: id(light_boot_done) = true;

select:
  - platform: template
    name: "Light Phase"
    id: light_phase
    icon: mdi:weather-sunny
    optimistic: true
    restore_value: true
    initial_option: "Phase 1 - Plants in"
    options:
      - "Off (cycling)"
      - "Phase 1 - Plants in"
      - "Phase 2 - Shrimp"
      - "Phase 3 - Fish"
      - "Phase 4 - Mature"
    on_value:
      then:
        # At setup this runs before the globals load, so the stored backup
        # overwrites it; light_validate_settings compares the two.
        - lambda: id(light_phase_saved) = (int) i;
        - script.execute: light_select_phase
        - lambda: |-
            // New phase, new brightness: what "lit" looked like before no
            // longer applies. Detection falls back to the 20 lx floor for
            // "should be lit" and stays off for "should be dark" until the
            // next plateau relearns it.
            id(light_learned_lux) = 0.0f;
            id(light_mismatch_min) = 0;
            id(light_fix_attempts) = 0;
            id(light_not_responding) = false;
            id(light_over) = false;
            id(light_curve_off_day) = -1;
        - script.execute: light_refresh_controls
        - script.execute: light_push

  # How a sun-following phase spreads its light over the day. Daylight: a
  # multi-point day in the lamp following real outdoor light from civil dawn
  # to civil dusk (see THE DAYLIGHT CURVE above). Single fade: one scene,
  # sunrise to sunset, linear ramps and a plateau, delivering the same daily
  # light (the cap if set, else the natural day's). Fixed-time phases always
  # run as one scene. Single fade is also the automatic fallback when the
  # lamp goes brighter than the curve or its read-back shows foreign points.
  - platform: template
    name: "Light Day Shape"
    id: light_shape
    icon: mdi:chart-bell-curve-cumulative
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: "Daylight"
    # Index 0 was "Sun curve" (a sine) before the daylight model; boards that
    # stored it come up on Daylight.
    options:
      - "Daylight"
      - "Single fade"
    on_value:
      then:
        - lambda: |-
            // A different shape is a different level at every minute. Only on
            // a real change: the restored option is also published at boot,
            // and a reboot must not forget what lit looks like.
            const int now_i = (int) i;
            if (now_i == id(light_shape_last)) return;
            id(light_shape_last) = now_i;
            id(light_curve_off_day) = -1;     // an explicit choice ends a suspension
            id(light_over) = false;
            id(light_learned_lux) = 0.0f;
            id(light_mismatch_min) = 0;
            id(light_fix_attempts) = 0;
            id(light_not_responding) = false;
        - script.execute: light_changed

script:
  # DEFAULTS -- the one place default values are written down. Times in
  # minutes since midnight; W is the dimming lever, R/G/B track it at
  # roughly 0.8 / 0.45 / 0.3. Sized for PAR at the substrate of the 75
  # (lamp on its stock legs, ~46 cm of water), estimated from a PAR sweep
  # of a WRGB II Pro 90 (Chihiros publishes none), so +/-30%:
  #   Phase 1 ~32-37  bottom of the 30-50 band for a fertilised, no-CO2 tank
  #   Phase 2 ~40-50  the no-CO2 ceiling; past ~50-60 algae outgrows plants
  #   Phase 3 ~55-65  CO2 on (hold here 1-2 weeks while CO2 settles)
  #   Phase 4 ~75-90  CO2 dialled in; what the red stems want
  # The previous ladder (W25..W45) put the substrate at ~16-37, i.e. the
  # old ceiling was the bottom of the right band. Writes every phase (only: -1) on first boot, or just
  # one phase for "Reset Light Phase to Defaults". After that the stored
  # table (light_table) is the truth and these numbers are never read.
  - id: light_seed_table
    parameters:
      only: int
    then:
      - lambda: |-
          static const int defaults[35] = {
            540, 840, 30,  0,  0,  0,  0,   // Off (cycling)
            540, 960, 45, 45, 36, 20, 14,   // Phase 1 - Plants in
            540, 960, 45, 55, 45, 28, 20,   // Phase 2 - Shrimp
            540, 990, 45, 60, 50, 32, 24,   // Phase 3 - Fish
            540, 990, 45, 70, 60, 38, 30,   // Phase 4 - Mature
          };
          for (int ph = 0; ph < 5; ph++) {
            if (only != -1 && ph != only) continue;
            for (int f = 0; f < 7; f++) id(light_table)[ph * 7 + f] = defaults[ph * 7 + f];
          }
          ESP_LOGI("light", "phase defaults written (%s)", only < 0 ? "all" : "one phase");

  # "Reset Light Phase to Defaults": the table row and the sun settings.
  - id: light_seed_defaults
    parameters:
      only: int
    then:
      - script.execute:
          id: light_seed_table
          only: !lambda return only;
      - script.wait: light_seed_table
      - script.execute:
          id: light_seed_sun
          only: !lambda return only;
      - script.wait: light_seed_sun

  # Follow-the-sun defaults: every lit phase follows the sun, daily light
  # natural (cap 0). The daylight curve on 2026-10-20 delivers 8.0 h
  # full-equivalent (the sine it replaced was set to 7.5 h); 6.9 h at the
  # December solstice, 10.75 h at the June one -- set a cap before spring if
  # the CO2 phases should not track that.
  #   only = phase index, -1 every phase.
  - id: light_seed_sun
    parameters:
      only: int
    then:
      - lambda: |-
          for (int ph = 0; ph < 5; ph++) {
            if (only != -1 && ph != only) continue;
            id(light_sun_follow)[ph] = ph > 0 ? 1 : 0;
            id(light_sun_plateau)[ph] = 0;
          }

  # BOOT CHECK of every restored setting (see RESTORED SETTINGS). Runs once,
  # from on_boot, after all globals have loaded and before anything acts on
  # them. A field still on its sentinel did not restore; one out of range is
  # corrupt. Either is replaced by its default, logged at WARNING and named
  # in light_restore_status. It never turns a stored "follows the sun" off:
  # the only value it writes to light_sun_follow is 1 (or 0 for the Off
  # phase, which cannot follow).
  - id: light_validate_settings
    then:
      - lambda: |-
          // light_store_marker is written at the end of the first boot that
          // runs this check. Before it, a setting on its sentinel may simply
          // never have been stored: ESPHome only writes a global once it
          // differs from its initial value, and these were sitting on their
          // (equal) old defaults. So on that boot a sentinel is "never
          // stored, default kept" (INFO); on every later boot it is a lost
          // setting (WARNING, and reported).
          static constexpr uint32_t MARKER = 0x4C535431;   // "LST1"
          const bool first_check = id(light_store_marker) != MARKER;
          std::string lost, fixed, never;
          int n_lost = 0, n_checked = 0;
          auto add = [](std::string &to, const char *what) {
            if (!to.empty()) to += ", ";
            to += what;
          };
          // A value on its sentinel (did not load) or out of range (corrupt).
          auto bad = [&](bool sentinel, const char *what, const char *then) {
            if (sentinel) {
              if (first_check) {
                add(never, what);
                ESP_LOGI("light", "settings: %s: none stored yet; %s", what, then);
                return;
              }
              add(lost, what);
            } else {
              add(fixed, what);
            }
            ESP_LOGW("light", "settings: %s: %s; %s", what, sentinel ? "DID NOT RESTORE" : "out of range", then);
          };
          auto in = [](int v, int lo, int hi) { return v >= lo && v <= hi; };

          // Per-phase arrays are reported once per array, listing phases:
          // "follow-sun phases 3,4".
          struct Group { std::string missing, corrupt; };
          auto mark = [](std::string &list, int ph) {
            if (!list.empty()) list += ",";
            list += (char) ('0' + ph);
          };
          auto report = [&](Group &g, const char *what, const char *then) {
            std::string label;
            if (!g.missing.empty()) {
              label = std::string(what) + (g.missing.size() > 1 ? " phases " : " phase ") + g.missing;
              bad(true, label.c_str(), then);
            }
            if (!g.corrupt.empty()) {
              label = std::string(what) + (g.corrupt.size() > 1 ? " phases " : " phase ") + g.corrupt;
              bad(false, label.c_str(), then);
            }
          };

          // The phase table, row by row.
          {
            Group g;
            auto &t = id(light_table);
            for (int ph = 0; ph < 5; ph++) {
              const int b = ph * 7;
              bool sentinel = true;
              for (int f = 0; f < 7; f++) sentinel = sentinel && t[b + f] == -1;
              bool ok = in(t[b], 0, 1439) && in(t[b + 1], 0, 1439) && in(t[b + 2], 0, 150);
              for (int f = 3; f < 7; f++) ok = ok && in(t[b + f], 0, 100);
              n_checked++;
              if (ok) continue;
              if (sentinel) { mark(g.missing, ph); n_lost++; } else mark(g.corrupt, ph);
              id(light_seed_table).execute(ph);
            }
            report(g, "table", "phase defaults written");
          }

          // Follow the sun. Missing or garbage -> follows (every lit phase).
          {
            Group g;
            for (int ph = 0; ph < 5; ph++) {
              int &v = id(light_sun_follow)[ph];
              n_checked++;
              if (ph == 0) {                   // the Off phase never follows
                if (v == -1) n_lost++;
                v = 0;
                continue;
              }
              if (v == 0 || v == 1) continue;
              if (v == -1) { mark(g.missing, ph); n_lost++; } else mark(g.corrupt, ph);
              v = 1;
            }
            report(g, "follow-sun", "follows the sun (the default)");
          }

          // Daily-light cap. Missing or garbage -> 0, the natural day.
          {
            Group g;
            for (int ph = 0; ph < 5; ph++) {
              int &v = id(light_sun_plateau)[ph];
              n_checked++;
              if (in(v, 0, 12 * 60)) continue;
              if (v == -1) { mark(g.missing, ph); n_lost++; } else mark(g.corrupt, ph);
              v = 0;
            }
            report(g, "cap", "cap off (natural day)");
          }

          // Board-wide shape settings.
          auto check_int = [&](int &v, int lo, int hi, int def, const char *what) {
            n_checked++;
            if (in(v, lo, hi)) return;
            if (v == -1) n_lost++;
            bad(v == -1, what, "default kept");
            v = def;
          };
          n_checked++;
          {
            float &e = id(light_day_expo);
            if (std::isnan(e) || e < 0.3f || e > 1.0f) {
              if (std::isnan(e)) n_lost++;
              bad(std::isnan(e), "daylight exponent", "default 0.5");
              e = 0.5f;
            }
          }
          check_int(id(light_dawn_warmth), 0, 100, 100, "dawn warmth");
          check_int(id(light_curve_edge), 15, 60, 30, "curve edge step");
          check_int(id(light_curve_step), 30, 120, 60, "curve step");
          check_int(id(light_bright_pct), 50, 90, 65, "bright threshold");

          // Learned state, not settings: a loss costs a relearn, not the day.
          if (std::isnan(id(light_learned_lux)) || id(light_learned_lux) < 0.0f) {
            if (first_check) ESP_LOGI("light", "settings: learned lux: none stored yet; relearning");
            else ESP_LOGW("light", "settings: learned lux did not restore; relearning");
            id(light_learned_lux) = 0.0f;
          }
          if (!in(id(light_curve_off_day), -1, 366)) id(light_curve_off_day) = -1;
          if (!in(id(light_shape_last), -1, 1)) id(light_shape_last) = -1;

          // The phase select restores itself; its backup copy says what it
          // should have restored to.
          {
            auto idx = id(light_phase).active_index();
            const int sel = idx.has_value() ? (int) *idx : -1;
            const int saved = id(light_phase_saved);
            if (in(saved, 0, 4) && sel != saved) {
              ESP_LOGW("light", "settings: Light Phase came up as %d but %d was stored; putting %d back",
                       sel, saved, saved);
              add(fixed, "phase (put back from its backup)");
              auto call = id(light_phase).make_call();
              call.set_index(saved);
              call.perform();
            } else if (!in(saved, 0, 4) && sel >= 0) {
              id(light_phase_saved) = sel;
            }
          }

          std::string st;
          if (n_lost == n_checked) {
            st = "defaults (nothing stored: first boot or storage erased)";
          } else if (lost.empty() && fixed.empty()) {
            st = "ok";
            if (!never.empty()) st += " (first check; none stored yet, defaults kept: " + never + ")";
          } else {
            st = "defaults for ";
            st += lost.empty() ? fixed : lost;
            st += lost.empty() ? " (out of range)" : " (did not restore)";
            if (!lost.empty() && !fixed.empty()) st += "; corrected " + fixed + " (out of range)";
          }
          if (st.size() > 250) st = st.substr(0, 247) + "...";
          id(light_restore_status) = st;
          id(light_store_marker) = MARKER;
          if (lost.empty() && fixed.empty() && n_lost < n_checked)
            ESP_LOGI("light", "settings restored: %s; follows sun (phases 1-4): %d %d %d %d", st.c_str(),
                     id(light_sun_follow)[1], id(light_sun_follow)[2], id(light_sun_follow)[3], id(light_sun_follow)[4]);
          else
            ESP_LOGW("light", "SETTINGS NOT RESTORED: %s; follows sun (phases 1-4): %d %d %d %d", st.c_str(),
                     id(light_sun_follow)[1], id(light_sun_follow)[2], id(light_sun_follow)[3], id(light_sun_follow)[4]);

  # Resolve the selected phase from the stored table into lp_*. "Off
  # (cycling)" is manual mode at 0 whatever its stored values say: the lamp
  # stays dark regardless of its clock.
  - id: light_select_phase
    then:
      - lambda: |-
          auto idx = id(light_phase).active_index();
          if (!idx.has_value() || *idx >= 5) {
            id(lp_valid) = false;
            ESP_LOGW("light", "no valid phase selected; nothing will be pushed");
            return;
          }
          const int ph = (int) *idx, b = ph * 7;
          auto &t = id(light_table);
          auto clampi = [](int v, int lo, int hi) { return v < lo ? lo : (v > hi ? hi : v); };
          id(lp_auto) = ph != 0;
          id(lp_on_min) = clampi(t[b + 0], 0, 1439);
          id(lp_off_min) = clampi(t[b + 1], 0, 1439);
          id(lp_ramp) = clampi(t[b + 2], 0, 150);
          id(lp_w) = ph ? clampi(t[b + 3], 0, 100) : 0;
          id(lp_r) = ph ? clampi(t[b + 4], 0, 100) : 0;
          id(lp_g) = ph ? clampi(t[b + 5], 0, 100) : 0;
          id(lp_b) = ph ? clampi(t[b + 6], 0, 100) : 0;
          id(lp_valid) = true;

          // Follow the sun: today's sun at the tank, computed on the board
          // (chihiros::daylight). Daylight = the multi-point curve from civil
          // dawn to civil dusk; Single fade = one scene sunrise..sunset with
          // the same daily light. `cap` (Light Full Brightness Hours) > 0
          // limits the day's full-equivalent light; 0 = natural. Without a
          // valid clock the table's fixed times stand in.
          id(lp_sun) = false;
          id(lp_curve) = false;
          id(lp_peak) = 1.0f;
          id(lp_natural) = 0.0f;
          const bool follow = ph > 0 && id(light_sun_follow)[ph] != 0;
          const int cap = ph ? std::max(0, id(light_sun_plateau)[ph]) : 0;
          const float th = clampi(id(light_bright_pct), 50, 90) / 100.0f;
          auto now = id(sntp_time).now();
          if (follow) {
            id(lp_sun_day) = now.is_valid() ? now.day_of_year : -1;
            if (now.is_valid()) {
              const time_t mid = now.timestamp - (time_t) (now.hour * 3600 + now.minute * 60 + now.second);
              const float expo = std::max(0.3f, std::min(1.0f, id(light_day_expo)));
              auto p = chihiros::daylight::plan(mid, ${light_latitude}, ${light_longitude}, expo, cap, th);
              if (p.ok && p.d.rise > p.d.dawn && p.d.set > p.d.rise && p.d.dusk > p.d.set) {
                id(lp_plan) = p;
                id(lp_natural) = p.natural_h * 60.0f;
                if (id(light_shape).active_index().value_or(0) == 0 &&
                    id(light_curve_off_day) != now.day_of_year) {
                  id(lp_curve) = true;
                  id(lp_peak) = p.scale;
                  id(lp_dose) = p.dose_h * 60.0f;
                  id(lp_on_min) = p.d.dawn;
                  id(lp_off_min) = p.d.dusk;
                  id(lp_bright_on) = p.bright_on;
                  id(lp_bright_off) = p.bright_off;
                  id(lp_ramp) = p.bright_on > 0 ? p.bright_on - p.d.dawn : 0;   // read-out: dawn to bright
                } else {
                  // One scene, sunrise..sunset. Two linear ramps of R deliver
                  // R between them, so dose = plateau + R. R is limited to
                  // 15..150 (the lamp's range here); what does not fit trims
                  // the span symmetrically around solar noon.
                  int on = p.d.rise, off = p.d.set;
                  const int day = off - on;
                  const int dose = cap > 0 ? cap : (int) lroundf(p.natural_h * 60.0f);
                  int ramp = day - dose, plat = 2 * dose - day;
                  if (ramp > 150) { ramp = 150; plat = dose - 150; }
                  if (plat < 0) { plat = 0; ramp = dose < 15 ? 15 : dose; }
                  if (ramp < 15) { ramp = 15; plat = day - 30; }
                  const int noon = (on + off) / 2, span = plat + 2 * ramp;
                  on = noon - span / 2;
                  off = on + span;
                  id(lp_ramp) = ramp;
                  id(lp_dose) = (float) (plat + ramp);
                  id(lp_on_min) = clampi(on, 0, 1439);
                  id(lp_off_min) = clampi(off, 0, 1439);
                }
                id(lp_sun) = true;
              }
            }
            if (!id(lp_sun))
              ESP_LOGW("light", "phase %d follows the sun but the sun is not computable yet; fixed times until it is", ph);
          }
          if (!id(lp_curve)) {
            // One scene (fixed times or Single fade): the bright window is
            // where the linear ramps pass the same fraction of full.
            const int on = id(lp_on_min), off = id(lp_off_min), ramp = id(lp_ramp);
            if (!id(lp_sun)) id(lp_dose) = (float) std::max(0, off - on - ramp);
            id(lp_bright_on) = on + (int) lroundf(th * ramp);
            id(lp_bright_off) = off - (int) lroundf(th * ramp);
          }
          if (!id(lp_auto) || id(lp_bright_off) <= id(lp_bright_on)) {
            id(lp_bright_on) = -1;
            id(lp_bright_off) = -1;
            if (!id(lp_auto)) id(lp_dose) = 0.0f;
          }
          if (id(light_curve_off_day) == now.day_of_year && id(lp_sun) && !id(lp_curve))
            ESP_LOGW("light", "daylight curve suspended today (lamp went brighter than it or held foreign points); single scene until midnight");
          ESP_LOGI("light", "phase %d: %s%s %02d:%02d-%02d:%02d ramp %d W%d R%d G%d B%d",
                   ph, ph ? "auto" : "manual-off",
                   id(lp_curve) ? " (daylight)" : id(lp_sun) ? " (sun, single fade)" : "",
                   id(lp_on_min) / 60, id(lp_on_min) % 60,
                   id(lp_off_min) / 60, id(lp_off_min) % 60,
                   id(lp_ramp), id(lp_w), id(lp_r), id(lp_g), id(lp_b));
          if (id(lp_auto) && id(lp_sun))
            ESP_LOGI("light", "  dawn %02d:%02d rise %02d:%02d noon %02d:%02d set %02d:%02d dusk %02d:%02d, noon %.0f klx clear-sky",
                     id(lp_plan).d.dawn / 60, id(lp_plan).d.dawn % 60, id(lp_plan).d.rise / 60, id(lp_plan).d.rise % 60,
                     id(lp_plan).d.noon / 60, id(lp_plan).d.noon % 60, id(lp_plan).d.set / 60, id(lp_plan).d.set % 60,
                     id(lp_plan).d.dusk / 60, id(lp_plan).d.dusk % 60, id(lp_plan).d.e_noon / 1000.0);
          if (id(lp_auto))
            ESP_LOGI("light", "  peak %.0f%% exponent %.2f, daily light %.2f h (natural %.2f h, cap %.2f h), bright (>=%d%% of peak) %02d:%02d-%02d:%02d",
                     id(lp_peak) * 100.0f, id(light_day_expo), id(lp_dose) / 60.0f, id(lp_natural) / 60.0f, cap / 60.0f,
                     (int) (th * 100.0f + 0.5f),
                     std::max(0, id(lp_bright_on)) / 60, std::max(0, id(lp_bright_on)) % 60,
                     std::max(0, id(lp_bright_off)) / 60, std::max(0, id(lp_bright_off)) % 60);

  # The seven controls read the ACTIVE phase's slot; after a phase change
  # they are told to re-read at once rather than waiting for their poll.
  - id: light_refresh_controls
    then:
      - component.update: light_ctl_white
      - component.update: light_ctl_red
      - component.update: light_ctl_green
      - component.update: light_ctl_blue
      - component.update: light_ctl_ramp
      - component.update: light_ctl_on
      - component.update: light_ctl_off
      - component.update: light_ctl_sun_hours
      - component.update: light_bright_start
      - component.update: light_bright_end
      - component.update: light_daily_light
      - component.update: light_curve_peak

  # A control was changed. Debounced, so dragging a slider sends one push
  # when it settles rather than one per step; restart, so the last value
  # wins.
  - id: light_changed
    mode: restart
    then:
      - delay: 1500ms
      - script.execute: light_select_phase
      - script.execute: light_refresh_controls
      - script.execute: light_push

  # Send the selected phase to the lamp. restart: the newest request wins,
  # so any number of rapid phase changes ends on the last one picked --
  # prepare() clears whatever was still queued from the interrupted run.
  - id: light_push
    mode: restart
    then:
      - if:
          condition:
            lambda: return !id(lp_valid);
          then:
            - script.execute: light_select_phase
      - if:
          condition:
            lambda: return id(light_linked) && id(lp_valid);
          then:
            - lambda: |-
                const bool pro = ${light_pro};
                id(light_push_ms) = millis();
                id(light_readback_ms) = 0;
                id(light_sent_min).clear();
                if (id(lp_auto) && id(lp_curve)) {
                  // The daylight curve as points (chihiros::daylight::points):
                  // civil dawn / sunrise / sunset / civil dusk exactly, the
                  // edge step near dawn and dusk, the main step between, at
                  // most 24 per channel.
                  const int step = std::max(30, std::min(120, id(light_curve_step)));
                  const int edge = std::max(15, std::min(60, id(light_curve_edge)));
                  const float warmth = std::max(0, std::min(100, id(light_dawn_warmth))) / 100.0f;
                  auto pts = chihiros::daylight::points(id(lp_plan), id(lp_r), id(lp_g), id(lp_b),
                                                        pro ? id(lp_w) : 0, warmth, step, edge, 120, 24);
                  for (const auto &p : pts) {
                    ESP_LOGI("light", "  point %02d:%02d  elev %5.1f  level %3.0f%%  W%d R%d G%d B%d",
                             p.minute / 60, p.minute % 60, chihiros::daylight::elev_at(id(lp_plan), p.minute),
                             chihiros::daylight::frac_at(id(lp_plan), p.minute) * 100.0f,
                             pro ? p.w : 0, p.r, p.g, p.b);
                    id(light_sent_min).push_back(p.minute);
                  }
                  ESP_LOGI("light", "daylight curve: %d points x %d channels", (int) pts.size(), pro ? 4 : 3);
                  id(light_device).prepare_curve(id(sntp_time).now(), pts, pro);
                } else {
                  id(light_device).prepare(
                    id(sntp_time).now(), id(lp_auto),
                    id(lp_on_min) / 60, id(lp_on_min) % 60,
                    id(lp_off_min) / 60, id(lp_off_min) % 60,
                    (uint8_t) id(lp_ramp),
                    (uint8_t) id(lp_r), (uint8_t) id(lp_g), (uint8_t) id(lp_b),
                    pro ? (uint8_t) id(lp_w) : chihiros::data::SKIP);
                }
            - while:
                condition:
                  lambda: return id(light_linked) && id(light_device).has_next();
                then:
                  # The last frame of a curve push is the status query: arm
                  # the read-back check for the lamp's answer to it.
                  - lambda: |-
                      if (id(light_device).pending() == 1 && !id(light_sent_min).empty())
                        id(light_readback_ms) = millis();
                  - ble_client.ble_write:
                      id: light_ble
                      service_uuid: ${light_ble_service}
                      characteristic_uuid: ${light_ble_tx}
                      value: !lambda return id(light_device).next();
                  - delay: 200ms
            - logger.log:
                level: INFO
                format: "light: phase pushed"
          else:
            - logger.log:
                level: INFO
                format: "light: not linked; the phase goes out on connect"

  # The link is down, however that was found out. One place, so the
  # disconnect event and the watchdog cannot disagree about what "down"
  # does: clear Light Linked, count the drop (not when the lamp was handed
  # to the app on purpose), and scan to reconnect unless released.
  - id: light_link_down
    mode: queued
    parameters:
      cause: int
    then:
      - lambda: |-
          if (id(light_linked) && !id(light_released)) {
            id(light_link_drops)++;
            id(light_down_cause) = cause;
          }
          id(light_linked) = false;
      - if:
          condition:
            lambda: return !id(light_released);
          then:
            - logger.log:
                level: WARN
                format: "light: link lost (%s), scanning to reconnect"
                args: ['cause == 2 ? "found by watchdog" : "disconnect event"']
            - esp32_ble_tracker.start_scan:
                continuous: true

  # Hand the lamp to the Chihiros app for 30 minutes, then take it back.
  # restart: pressing again extends the window rather than stacking.
  - id: light_release
    mode: restart
    then:
      - globals.set:
          id: light_released
          value: 'true'
      - esp32_ble_tracker.stop_scan:
      - switch.turn_off: light_link
      - logger.log:
          level: INFO
          format: "light: released to the app for 30 min"
      - delay: 30min
      - globals.set:
          id: light_released
          value: 'false'
      - switch.turn_on: light_link
      - esp32_ble_tracker.start_scan:
          continuous: true
      - logger.log:
          level: INFO
          format: "light: taken back; the phase is re-pushed on connect"

switch:
  # The selected phase follows the sun (on) or runs the table's fixed On/Off
  # Time and Ramp (off). Not available on "Off (cycling)".
  #
  # restore_mode: DISABLED is load-bearing. A template switch's default is
  # ALWAYS_OFF, and ESPHome's TemplateSwitch::setup() acts on it: it calls
  # turn_off(), which RUNS turn_off_action -- every boot. The phase select
  # (and the globals) are already set up by then, so that wrote 0 into
  # light_sun_follow for the active phase: the 75 came up on fixed
  # 09:00-16:00 times after the 2026-10-27 17:11 reflash. (Same trap as
  # "Adaptive Learning" in packages/control.yaml.) The state lives in
  # light_sun_follow, so the switch has nothing to restore: DISABLED, and
  # the actions also refuse to run before on_boot has finished, so no
  # future change to switch setup can write the flag either.
  - platform: template
    name: "Light Follows Sun"
    id: light_ctl_follow
    icon: mdi:sun-clock
    restore_mode: DISABLED
    lambda: |-
      auto i = id(light_phase).active_index();
      return i.has_value() && *i > 0 && *i < 5 && id(light_sun_follow)[*i] == 1;
    turn_on_action:
      - if:
          condition:
            lambda: return id(light_boot_done);
          then:
            - lambda: |-
                auto i = id(light_phase).active_index();
                if (i.has_value() && *i > 0 && *i < 5) {
                  id(light_sun_follow)[*i] = 1;
                  ESP_LOGI("light", "phase %d now follows the sun", (int) *i);
                }
            - script.execute: light_changed
          else:
            - logger.log:
                level: WARN
                tag: light
                format: "Light Follows Sun: turn on during boot ignored (the stored setting stands)"
    turn_off_action:
      - if:
          condition:
            lambda: return id(light_boot_done);
          then:
            - lambda: |-
                auto i = id(light_phase).active_index();
                if (i.has_value() && *i > 0 && *i < 5) {
                  id(light_sun_follow)[*i] = 0;
                  ESP_LOGW("light", "phase %d no longer follows the sun: fixed On/Off Time from now on", (int) *i);
                }
            - script.execute: light_changed
          else:
            - logger.log:
                level: WARN
                tag: light
                format: "Light Follows Sun: turn off during boot ignored (the stored setting stands)"

  # Enables/disables the client. On = hold the link. Only light_release
  # turns it off, and only for a bounded time.
  - platform: ble_client
    ble_client_id: light_ble
    id: light_link
    internal: true
    restore_mode: ALWAYS_ON

interval:
  # LINK WATCHDOG. Light Linked is set and cleared by the client's connect
  # and close events, and both can be missed (see on_disconnect above). This
  # compares it with the client's real state every 10 s and fixes whichever
  # way it is wrong, then checks that an unlinked lamp is actually being
  # scanned for -- the scan is what reconnects it, and nothing else restarts
  # a scan that has stopped.
  - interval: 10s
    then:
      - lambda: |-
          using esphome::esp32_ble_tracker::ClientState;
          using esphome::esp32_ble_tracker::ScannerState;
          if (id(light_released)) {           // handed to the app on purpose
            id(light_wd_strikes) = 0;
            id(light_scan_strikes) = 0;
            return;
          }
          const bool real = id(light_ble).connected();
          if (id(light_linked) != real) {
            if (++id(light_wd_strikes) < 2) return;
            id(light_wd_strikes) = 0;
            if (!real) {
              ESP_LOGW("light", "watchdog: Light Linked was on but the client is %s -- its disconnect was never "
                       "reported; clearing it and scanning", esphome::esp32_ble_tracker::client_state_to_string(id(light_ble).state()));
              id(light_link_down).execute(2);
            } else {
              ESP_LOGW("light", "watchdog: the client is connected but Light Linked was off -- its connect was "
                       "never reported; setting it and pushing the phase");
              id(light_linked) = true;
              id(light_up_ms) = millis();
              id(light_push).execute();
            }
            return;
          }
          id(light_wd_strikes) = 0;
          // Unlinked, idle, and nobody scanning: the lamp can never come back.
          auto *trk = esphome::esp32_ble_tracker::global_esp32_ble_tracker;
          if (!real && trk != nullptr && id(light_ble).state() == ClientState::IDLE &&
              trk->get_scanner_state() == ScannerState::IDLE) {
            if (++id(light_scan_strikes) < 2) return;
            id(light_scan_strikes) = 0;
            ESP_LOGW("light", "watchdog: lamp unlinked and no scan running; restarting the scan");
            trk->set_scan_continuous(true);
            trk->start_scan();
          } else {
            id(light_scan_strikes) = 0;
          }

  - interval: 1min
    then:
      - lambda: |-
          auto now = id(sntp_time).now();
          if (!now.is_valid() || !id(lp_valid)) { id(light_expected) = 0; return; }
          const int m = now.hour * 60 + now.minute;

          // Daily clock resync at 03:00, while the lamp is dark anyway, so
          // its RTC never drifts off the schedule's edges.
          if (now.hour == 3 && now.minute == 0) id(light_push).execute();

          // A sun-following phase moves every day: recompute after midnight
          // (and once the clock first syncs) and push while the lamp is dark.
          {
            auto i = id(light_phase).active_index();
            if (i.has_value() && *i > 0 && *i < 5 && id(light_sun_follow)[*i] != 0 &&
                id(lp_sun_day) != now.day_of_year) {
              id(light_select_phase).execute();
              id(light_refresh_controls).execute();
              id(light_push).execute();
              return;
            }
          }

          // What the lamp should be giving now, as a fraction of the phase's
          // full W/R/G/B: the daylight curve, or one scene's linear ramps.
          const int on = id(lp_on_min), off = id(lp_off_min), ramp = id(lp_ramp);
          float frac = 0.0f;
          if (id(lp_auto) && m > on && m < off) {
            if (id(lp_curve))
              frac = chihiros::daylight::frac_at(id(lp_plan), m);
            else if (ramp <= 0 || (m >= on + ramp && m <= off - ramp))
              frac = 1.0f;
            else
              frac = std::min(m - on, off - m) / (float) ramp;
          }
          id(lp_frac_now) = frac;
          const float rel = id(lp_peak) > 0.0f ? frac / id(lp_peak) : 0.0f;   // of today's peak

          // lit: half the peak or more (5 min clear of the ends, which absorbs
          // a lamp clock a few minutes off). A scene's plateau is rel 1.
          int expect;
          if (!id(lp_auto)) expect = 1;                                         // off phase
          else if (rel >= 0.5f && m >= on + 5 && m < off - 5) expect = 4;       // lit
          else if (m >= on - 5 && m < off + 5) expect = 3;                      // ramping
          else expect = 2;                                                      // dark
          id(light_expected) = expect;

          // Nothing to judge while the lamp is handed to the app, while the
          // link is down (that is its own alarm), or without a lux reading.
          const float lux = id(tank_lux).state;
          if (id(light_released) || !id(light_linked) || std::isnan(lux)) {
            id(light_mismatch_min) = 0;
            return;
          }

          // learned = lux at the phase's FULL values. A scene learns on its
          // plateau only (its ramps are the lamp's own, shape unknown); the
          // daylight curve learns above 70% of its peak, as lux / level. Once
          // learned, a sample outside 0.6-1.4x of it is not learned from: an
          // overshoot (the 2026-10-19 15:30 bump, ~2.3x) must not teach the
          // board that the overshoot is normal.
          //
          // Two kinds of mismatch:
          //   dark  the lamp is darker than it should be      -> re-push, x3
          //   over  the lamp is lit when it should be dark, or (daylight curve)
          //         well above the curve                      -> Light
          //         Brighter Than Schedule; a curve is suspended for the rest
          //         of the day and the scene pushed instead, which darkens
          //         the lamp at once (it did at 18:58 on 2026-10-19).
          float &learned = id(light_learned_lux);
          bool dark = false, over = false;
          if (expect == 4) {
            const float dark_below = std::max(20.0f, 0.25f * learned * frac);
            const bool learn = id(lp_curve) ? rel >= 0.7f
                                            : (m >= on + ramp + 5 && m < off - ramp - 5);
            if (lux < dark_below) {
              dark = true;
            } else if (learn && frac > 0.0f) {
              const float full = lux / frac;
              if (learned <= 0.0f) learned = full;                     // first sample
              else if (full > 0.6f * learned && full < 1.4f * learned)
                learned += 0.05f * (full - learned);                    // ~20 min average
            }
          }
          if (expect == 1 || expect == 2) {
            // Lit when it should be dark. tank_lux fails OPEN until the
            // daylight reference is learned (sunlight passes through as lamp
            // light), so before that the check waits for the sun to be well
            // down (civil dusk, -6 deg). 5% of full, floor 10 lx; 15 lx
            // before anything is learned. Room LEDs leak into tank_lux, but
            // the evening before this check was written read 0 throughout.
            const bool daylight_ok = id(cal_nir_ref) > 0.0f ||
                chihiros::daylight::elevation(now.timestamp, ${light_latitude}, ${light_longitude}) < -6.0;
            const float limit = learned > 0.0f ? std::max(10.0f, 0.05f * learned) : 15.0f;
            if (daylight_ok && lux > limit) over = true;
          } else if (id(lp_curve) && learned > 0.0f && !dark) {
            // On the curve the level is known all day: well above it is a
            // point the lamp holds that the board did not write.
            if (lux > 1.5f * learned * frac + std::max(15.0f, 0.05f * learned)) over = true;
          }

          if (!dark && !over) {
            if (id(light_not_responding) || id(light_over))
              ESP_LOGI("light", "lamp matches the schedule again");
            id(light_mismatch_min) = 0;
            id(light_fix_attempts) = 0;
            id(light_not_responding) = false;
            id(light_over) = false;
            return;
          }

          id(light_mismatch_min)++;
          ESP_LOGW("light", "lamp does not match: %s (expected level %.0f%%), lamp lux %.0f, learned at full %.0f (%d min)",
                   dark ? "darker than the schedule" : "brighter than the schedule",
                   frac * 100.0f, lux, learned, id(light_mismatch_min));
          if (id(light_mismatch_min) < 5) return;

          if (over) {
            if (!id(light_over))
              ESP_LOGE("light", "lamp lit / brighter than the schedule for 5 min");
            id(light_over) = true;
            if (id(lp_curve)) {
              // Re-pushing the same curve would not help if the lamp holds
              // points it should not; the scene is the lamp's proven path.
              ESP_LOGE("light", "daylight curve suspended until midnight; pushing the single scene instead");
              id(light_curve_off_day) = now.day_of_year;
              id(light_mismatch_min) = 0;
              id(light_last_fix_ms) = millis();
              id(light_select_phase).execute();
              id(light_refresh_controls).execute();
              id(light_push).execute();
              return;
            }
          }
          if (id(light_not_responding)) return;
          if (id(light_last_fix_ms) != 0 && millis() - id(light_last_fix_ms) < 15UL * 60UL * 1000UL) return;

          if (id(light_fix_attempts) >= 3) {
            id(light_not_responding) = true;
            ESP_LOGE("light", "3 re-pushes did not fix it; stopping until the lamp matches again");
            return;
          }
          id(light_fix_attempts)++;
          id(light_last_fix_ms) = millis();
          ESP_LOGW("light", "re-pushing the phase (attempt %d of 3)", id(light_fix_attempts));
          id(light_push).execute();

# THE CONTROLS -- a window onto the ACTIVE phase's slot in light_table.
# Change one and that phase is saved (flash, survives reboot and reflash)
# and pushed to the lamp; pick another phase and they show its values. The
# repo pattern for stored values: update_interval + lambda + set_action, the
# global owns the value, the entity is only a view of it. "Off (cycling)" is
# always manual-off; editing its slot has no effect on the lamp.
number:
  - platform: template
    name: "Light White"
    id: light_ctl_white
    icon: mdi:white-balance-sunny
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 1
    mode: box
    update_interval: 60s
    lambda: |-
      auto i = id(light_phase).active_index();
      if (!i.has_value() || *i >= 5) return {};
      return (float) id(light_table)[*i * 7 + 3];
    set_action:
      - lambda: |-
          auto i = id(light_phase).active_index();
          if (!i.has_value() || *i >= 5) return;
          id(light_table)[*i * 7 + 3] = (int) x;
          id(light_learned_lux) = 0.0f;   // new brightness: relearn what lit looks like
      - script.execute: light_changed
  - platform: template
    name: "Light Red"
    id: light_ctl_red
    icon: mdi:alpha-r-circle
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 1
    mode: box
    update_interval: 60s
    lambda: |-
      auto i = id(light_phase).active_index();
      if (!i.has_value() || *i >= 5) return {};
      return (float) id(light_table)[*i * 7 + 4];
    set_action:
      - lambda: |-
          auto i = id(light_phase).active_index();
          if (!i.has_value() || *i >= 5) return;
          id(light_table)[*i * 7 + 4] = (int) x;
          id(light_learned_lux) = 0.0f;   // new brightness: relearn what lit looks like
      - script.execute: light_changed
  - platform: template
    name: "Light Green"
    id: light_ctl_green
    icon: mdi:alpha-g-circle
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 1
    mode: box
    update_interval: 60s
    lambda: |-
      auto i = id(light_phase).active_index();
      if (!i.has_value() || *i >= 5) return {};
      return (float) id(light_table)[*i * 7 + 5];
    set_action:
      - lambda: |-
          auto i = id(light_phase).active_index();
          if (!i.has_value() || *i >= 5) return;
          id(light_table)[*i * 7 + 5] = (int) x;
          id(light_learned_lux) = 0.0f;   // new brightness: relearn what lit looks like
      - script.execute: light_changed
  - platform: template
    name: "Light Blue"
    id: light_ctl_blue
    icon: mdi:alpha-b-circle
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 1
    mode: box
    update_interval: 60s
    lambda: |-
      auto i = id(light_phase).active_index();
      if (!i.has_value() || *i >= 5) return {};
      return (float) id(light_table)[*i * 7 + 6];
    set_action:
      - lambda: |-
          auto i = id(light_phase).active_index();
          if (!i.has_value() || *i >= 5) return;
          id(light_table)[*i * 7 + 6] = (int) x;
          id(light_learned_lux) = 0.0f;   // new brightness: relearn what lit looks like
      - script.execute: light_changed
  - platform: template
    name: "Light Ramp"
    id: light_ctl_ramp
    icon: mdi:sun-angle
    unit_of_measurement: "min"
    min_value: 0
    # 150 is the lamp's limit for a set ramp; a daylight curve READS back the
    # (longer) time from sunrise to its bright window, hence the wider range.
    max_value: 360
    step: 5
    mode: box
    update_interval: 60s
    lambda: |-
      auto i = id(light_phase).active_index();
      if (!i.has_value() || *i >= 5) return {};
      if (id(lp_sun)) return (float) id(lp_ramp);   // computed from the sun
      return (float) id(light_table)[*i * 7 + 2];
    set_action:
      - lambda: |-
          auto i = id(light_phase).active_index();
          if (!i.has_value() || *i >= 5) return;
          if (id(light_sun_follow)[*i]) {
            ESP_LOGW("light", "this phase follows the sun; its ramp is computed. Turn Light Follows Sun off to set it");
            id(light_ctl_ramp).publish_state(id(lp_ramp));
            return;
          }
          if (x > 150) ESP_LOGW("light", "ramp %.0f min is past the lamp's 150; stored as 150", x);
          id(light_table)[*i * 7 + 2] = std::min(150, (int) x);
      - script.execute: light_changed

  # Follow-the-sun phases only: an optional CAP on the day's total light, in
  # hours at the phase's full brightness (a 2 h ramp at an even fade counts
  # 1 h). 0 = natural (the default): the day gives what the daylight curve
  # gives ("Light Daily Light"). Above 0, a day that would deliver more is
  # scaled down to it ("Light Curve Peak" drops below 100); Single fade uses
  # it as its daily light. Following the sun is "Light Follows Sun".
  - platform: template
    name: "Light Full Brightness Hours"
    id: light_ctl_sun_hours
    icon: mdi:weather-sunny-alert
    unit_of_measurement: "h"
    min_value: 0
    max_value: 12
    step: 0.25
    mode: box
    update_interval: 60s
    lambda: |-
      auto i = id(light_phase).active_index();
      if (!i.has_value() || *i >= 5) return {};
      return id(light_sun_plateau)[*i] / 60.0f;
    set_action:
      - lambda: |-
          auto i = id(light_phase).active_index();
          if (!i.has_value() || *i == 0 || *i >= 5) return;
          id(light_sun_plateau)[*i] = (int) lroundf(x * 60.0f);
      - script.execute: light_changed

  # What counts as the bright part of the day, as a share of the curve's own
  # peak: Light Bright Start/End, which the CO2 schedule in Home Assistant
  # keys off. 65% default: photosynthesis is still light-limited below about
  # half of a moderate peak, so CO2 demand is low there; above ~2/3 it is
  # near its daily plateau. Board-wide, not per phase. Moves no light, so it
  # only re-resolves (no push).
  - platform: template
    name: "Light Bright Threshold"
    id: light_ctl_bright_pct
    icon: mdi:brightness-percent
    entity_category: config
    unit_of_measurement: "%"
    min_value: 50
    max_value: 90
    step: 5
    mode: box
    update_interval: 60s
    lambda: return (float) id(light_bright_pct);
    set_action:
      - lambda: id(light_bright_pct) = (int) x;
      - script.execute: light_select_phase
      - script.execute: light_refresh_controls

  # Spacing of the daylight curve's points through the middle of the day
  # (60 min; the lamp fades between points, confirmed 2026-10-19).
  - platform: template
    name: "Light Curve Step"
    id: light_ctl_curve_step
    icon: mdi:chart-timeline-variant
    entity_category: config
    unit_of_measurement: "min"
    min_value: 30
    max_value: 120
    step: 15
    mode: box
    update_interval: 60s
    lambda: return (float) id(light_curve_step);
    set_action:
      - lambda: id(light_curve_step) = (int) x;
      - script.execute: light_changed

  # Point spacing within 2 h of civil dawn and dusk, where the daylight
  # curve is steep. 30 min: 19 points on 2026-10-20 (24 at most, steps
  # double past that); 15 halves the worst interpolation error (~4% -> ~3%)
  # for ~7 more points.
  - platform: template
    name: "Light Curve Edge Step"
    id: light_ctl_curve_edge
    icon: mdi:chart-timeline-variant-shimmer
    entity_category: config
    unit_of_measurement: "min"
    min_value: 15
    max_value: 60
    step: 5
    mode: box
    update_interval: 60s
    lambda: return (float) id(light_curve_edge);
    set_action:
      - lambda: id(light_curve_edge) = (int) x;
      - script.execute: light_changed

  # How the real outdoor light is mapped onto the lamp: level =
  # (illuminance / noon illuminance) ^ this. 1.0 = literal photometry (dark
  # until sunrise, a slow first hour); 0.5 (default) = how daylight looks --
  # a glow from civil dawn, a fast first hour, a flat midday. Lower = more
  # daily light (0.5: 8.0 h on 2026-10-20; 0.6: 7.65 h; 1.0: 6.6 h).
  - platform: template
    name: "Light Daylight Exponent"
    id: light_ctl_day_expo
    icon: mdi:sun-wireless
    entity_category: config
    min_value: 0.3
    max_value: 1.0
    step: 0.05
    mode: box
    update_interval: 60s
    lambda: return id(light_day_expo);
    set_action:
      - lambda: id(light_day_expo) = x;
      - script.execute: light_changed

  # Golden dawn and dusk: how far the mix moves toward warm white at low sun
  # (100% = W +35%, G +10%, R -40%, B -70% at the horizon, fading to the
  # phase's own ratio by 12 deg; brightness held). 0 = the phase's ratio
  # all day (reads pink at low levels).
  - platform: template
    name: "Light Dawn Warmth"
    id: light_ctl_dawn_warmth
    icon: mdi:weather-sunset
    entity_category: config
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 10
    mode: box
    update_interval: 60s
    lambda: return (float) id(light_dawn_warmth);
    set_action:
      - lambda: id(light_dawn_warmth) = (int) x;
      - script.execute: light_changed

# Text, not datetime: ESPHome publishes a datetime over MQTT as JSON
# ({"hour":9,...}) and Home Assistant's MQTT time entity only accepts
# "HH:MM:SS" -- both directions failed, so the times sat at "unknown" in HA
# and could not be set from it. HH:MM text round-trips cleanly; anything
# else is refused on the device and the stored value republished.
text:
  - platform: template
    name: "Light On Time"
    id: light_ctl_on
    icon: mdi:weather-sunset-up
    mode: text
    min_length: 4
    max_length: 5
    pattern: "^([01]?[0-9]|2[0-3]):[0-5][0-9]$"
    update_interval: 60s
    lambda: |-
      auto i = id(light_phase).active_index();
      if (!i.has_value() || *i >= 5) return {};
      // Following the sun: show today's computed time, not the table's.
      const int v = id(lp_sun) ? id(lp_on_min) : id(light_table)[*i * 7 + 0];
      char buf[16];
      snprintf(buf, sizeof(buf), "%02d:%02d", v / 60, v % 60);
      return std::string(buf);
    set_action:
      - lambda: |-
          auto i = id(light_phase).active_index();
          if (!i.has_value() || *i >= 5) return;
          int h = -1, m = -1;
          if (sscanf(x.c_str(), "%d:%d", &h, &m) != 2 || h < 0 || h > 23 || m < 0 || m > 59) {
            ESP_LOGW("light", "Light On Time '%s' is not HH:MM; kept the stored value", x.c_str());
            id(light_ctl_on).publish_state(id(light_ctl_on).state);
            return;
          }
          if (id(light_sun_follow)[*i]) {
            ESP_LOGW("light", "this phase follows the sun; turn Light Follows Sun off to use fixed times");
            id(light_ctl_on).publish_state(id(light_ctl_on).state);
            return;
          }
          id(light_table)[*i * 7 + 0] = h * 60 + m;
      - script.execute: light_changed
  - platform: template
    name: "Light Off Time"
    id: light_ctl_off
    icon: mdi:weather-sunset-down
    mode: text
    min_length: 4
    max_length: 5
    pattern: "^([01]?[0-9]|2[0-3]):[0-5][0-9]$"
    update_interval: 60s
    lambda: |-
      auto i = id(light_phase).active_index();
      if (!i.has_value() || *i >= 5) return {};
      // Following the sun: show today's computed time, not the table's.
      const int v = id(lp_sun) ? id(lp_off_min) : id(light_table)[*i * 7 + 1];
      char buf[16];
      snprintf(buf, sizeof(buf), "%02d:%02d", v / 60, v % 60);
      return std::string(buf);
    set_action:
      - lambda: |-
          auto i = id(light_phase).active_index();
          if (!i.has_value() || *i >= 5) return;
          int h = -1, m = -1;
          if (sscanf(x.c_str(), "%d:%d", &h, &m) != 2 || h < 0 || h > 23 || m < 0 || m > 59) {
            ESP_LOGW("light", "Light Off Time '%s' is not HH:MM; kept the stored value", x.c_str());
            id(light_ctl_off).publish_state(id(light_ctl_off).state);
            return;
          }
          if (id(light_sun_follow)[*i]) {
            ESP_LOGW("light", "this phase follows the sun; turn Light Follows Sun off to use fixed times");
            id(light_ctl_off).publish_state(id(light_ctl_off).state);
            return;
          }
          id(light_table)[*i * 7 + 1] = h * 60 + m;
      - script.execute: light_changed

button:
  - platform: template
    name: "Release Light for App (30 min)"
    icon: mdi:cellphone-link
    on_press:
      - script.execute: light_release

  - platform: template
    name: "Push Light Phase Now"
    icon: mdi:clock-edit
    entity_category: diagnostic
    on_press:
      - script.execute: light_push

  - platform: template
    name: "Reset Light Phase to Defaults"
    icon: mdi:restore
    entity_category: config
    on_press:
      - script.execute:
          id: light_seed_defaults
          only: !lambda |-
            auto i = id(light_phase).active_index();
            return (i.has_value() && *i < 5) ? (int) *i : -2;
      - lambda: id(light_learned_lux) = 0.0f;
      - script.execute: light_changed

  - platform: template
    name: "Relearn Light Level"
    icon: mdi:refresh
    entity_category: config
    on_press:
      - lambda: |-
          ESP_LOGI("light", "learned lux cleared (was %.0f); relearning", id(light_learned_lux));
          id(light_learned_lux) = 0.0f;

binary_sensor:
  - platform: template
    trigger_on_initial_state: true
    name: "Light Linked"
    icon: mdi:bluetooth-connect
    device_class: connectivity
    entity_category: diagnostic
    lambda: return id(light_linked);

  - platform: template
    trigger_on_initial_state: true
    name: "Light Not Responding"
    device_class: problem
    lambda: return id(light_not_responding);

  # The lamp lit when it should be dark (5% of full for 5 min), or well
  # above the daylight curve. On the curve this also suspends it until midnight.
  - platform: template
    trigger_on_initial_state: true
    name: "Light Brighter Than Schedule"
    device_class: problem
    lambda: return id(light_over);

  # After a daylight-curve push the lamp listed a stored time the board did
  # not send. The curve is suspended until midnight (single scene instead).
  - platform: template
    trigger_on_initial_state: true
    name: "Light Curve Rejected"
    device_class: problem
    lambda: return id(light_curve_rejected);

sensor:
  # Link health. Drops counts every unplanned loss of the lamp link (not a
  # release to the app); a steady climb with "supervision timeout" in Light
  # Link Last Drop is a radio-range problem, "peer closed it" is the lamp.
  - platform: template
    name: "Light Link Drops"
    icon: mdi:bluetooth-off
    entity_category: diagnostic
    state_class: total_increasing
    accuracy_decimals: 0
    update_interval: 60s
    lambda: return (float) id(light_link_drops);

  # Minutes since the link last came up; unknown while it is down.
  - platform: template
    name: "Light Link Uptime"
    icon: mdi:timer-outline
    entity_category: diagnostic
    unit_of_measurement: min
    device_class: duration
    accuracy_decimals: 0
    update_interval: 60s
    lambda: |-
      if (!id(light_linked)) return NAN;
      return (float) ((millis() - id(light_up_ms)) / 60000UL);

  # Lux the lamp gives at the phase's FULL values (on the daylight curve learned
  # as lux / level near the peak; on a scene, the plateau lux).
  - platform: template
    name: "Light Learned Lux"
    unit_of_measurement: lx
    icon: mdi:brightness-6
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: 60s
    lambda: return id(light_learned_lux);

  # The brightness the lamp should be at now, % of the phase's full W/R/G/B.
  - platform: template
    name: "Light Expected Level"
    unit_of_measurement: "%"
    icon: mdi:chart-bell-curve
    accuracy_decimals: 0
    state_class: measurement
    update_interval: 60s
    lambda: |-
      if (!id(lp_valid)) return NAN;
      return id(lp_frac_now) * 100.0f;

  # learned lux x expected level: what Lamp Lux should read now. Unknown
  # until a lit stretch has been learned.
  - platform: template
    name: "Light Expected Lux"
    unit_of_measurement: lx
    icon: mdi:brightness-auto
    accuracy_decimals: 0
    entity_category: diagnostic
    state_class: measurement
    update_interval: 60s
    lambda: |-
      if (!id(lp_valid) || id(light_learned_lux) <= 0.0f) return NAN;
      return id(light_learned_lux) * id(lp_frac_now);

  # Full-equivalent hours of today's NATURAL daylight curve (no cap). With a
  # cap set the lamp delivers less: Light Curve Peak shows the scaling.
  - platform: template
    id: light_daily_light
    name: "Light Daily Light"
    unit_of_measurement: "h"
    icon: mdi:sun-clock
    accuracy_decimals: 2
    update_interval: 60s
    lambda: |-
      if (!id(lp_valid)) return NAN;
      if (id(lp_sun)) return id(lp_natural) / 60.0f;      // the natural day (cap: see Curve Peak)
      return id(lp_dose) / 60.0f;

  # Today's peak, % of the phase's full values: under 100 when the target
  # (Light Full Brightness Hours) is below what the natural day gives.
  - platform: template
    id: light_curve_peak
    name: "Light Curve Peak"
    unit_of_measurement: "%"
    icon: mdi:summit
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: 60s
    lambda: |-
      if (!id(lp_valid) || !id(lp_auto)) return NAN;
      return id(lp_peak) * 100.0f;

  # Whatever the lamp says back. Logged, not decoded: if the lamp turns out
  # to report its own state here, that is real readback and detection can
  # stop relying on lux alone.
  - platform: ble_client
    type: characteristic
    ble_client_id: light_ble
    service_uuid: ${light_ble_service}
    characteristic_uuid: ${light_ble_rx}
    id: light_notification
    notify: true
    internal: true
    lambda: |-
      // Reassembled into whole 0x5b frames. Within a minute of a push (the
      // push opens and, for the daylight curve, closes with a status query) they
      // are logged at INFO and a schedule snapshot -- what the lamp says it
      // stores -- goes to "Light Lamp Report".
      static chihiros::NotifyAssembler asm_;
      const bool loud = millis() - id(light_push_ms) < 60000UL;
      if (loud) {
        ESP_LOGI("light", "notify (%d bytes): %s", (int) x.size(), chihiros::hex_dump(x).c_str());
      } else {
        ESP_LOGD("light", "notify (%d bytes): %s", (int) x.size(), chihiros::hex_dump(x).c_str());
      }
      if (asm_.feed(x)) {
        const auto &f = asm_.frame();
        if (chihiros::is_schedule_snapshot(f)) {
          int n = 0;
          const std::string pts = chihiros::decode_schedule_snapshot(f, &n);
          ESP_LOGI("light", "lamp snapshot fw %u, %d bytes: %s", f[1], (int) f.size(), chihiros::hex_dump(f).c_str());
          ESP_LOGI("light", "  decoded (A2 layout) %d points: %s", n, pts.c_str());
          std::string rep = std::to_string(n) + " pts: " + pts;
          // The answer to a curve push's closing status query: every time the
          // lamp lists must be one the board just sent. A time it did not send
          // is a stored point that will shape the day (the 2026-10-19 bump
          // and relight). Fewer times than sent is only reported -- the
          // snapshot may be size-limited -- and the lux check covers it.
          if (id(light_readback_ms) != 0 && millis() - id(light_readback_ms) < 15000UL) {
            id(light_readback_ms) = 0;
            const auto got = chihiros::snapshot_minutes(f);
            const auto &sent = id(light_sent_min);
            int foreign = 0, missing = 0;
            for (int t : got) if (std::find(sent.begin(), sent.end(), t) == sent.end()) foreign++;
            for (int t : sent) if (std::find(got.begin(), got.end(), t) == got.end()) missing++;
            if (foreign > 0) {
              rep = "FOREIGN " + std::to_string(foreign) + " | " + rep;
              ESP_LOGE("light", "read-back: the lamp holds %d time(s) the board did not send; curve suspended until midnight, pushing the single scene", foreign);
              id(light_curve_rejected) = true;
              auto now = id(sntp_time).now();
              if (now.is_valid()) id(light_curve_off_day) = now.day_of_year;
              id(light_select_phase).execute();
              id(light_refresh_controls).execute();
              id(light_push).execute();
            } else {
              id(light_curve_rejected) = false;
              rep = (missing ? "lists " + std::to_string((int) got.size()) + " of " + std::to_string((int) sent.size()) + " | "
                             : std::string("match | ")) + rep;
              if (missing) ESP_LOGW("light", "read-back: the lamp lists %d of the %d times sent (snapshot may be size-limited)", (int) got.size(), (int) sent.size());
              else ESP_LOGI("light", "read-back: the lamp holds exactly the %d times sent", (int) sent.size());
            }
          }
          if (rep.size() > 250) rep = rep.substr(0, 247) + "...";
          id(light_lamp_report).publish_state(rep);
        }
      }
      return NAN;

text_sensor:
  # What the boot check of the stored light settings found
  # (light_validate_settings): "ok", or which settings came back as their
  # defaults and why. Anything but "ok" after a flash means a setting was
  # lost and replaced -- look at it before the evening.
  - platform: template
    id: light_restore_text
    name: "Light Settings Restored"
    icon: mdi:content-save-check
    entity_category: diagnostic
    update_interval: never
    lambda: return id(light_restore_status);

  # Why the lamp link last ended: the radio's own disconnect reason, as the
  # board's GATT layer saw it (packages/ble_link_v3.yaml's ble_link_guard),
  # or that the disconnect was never reported and the watchdog found it.
  - platform: template
    name: "Light Link Last Drop"
    icon: mdi:bluetooth-off
    entity_category: diagnostic
    update_interval: 60s
    lambda: |-
      if (id(light_down_cause) == 0) return {"none since boot"};
      const int r = id(ble_guard).last_disconnect_reason(id(light_ble).get_address());
      char b[96];
      if (r < 0)
        snprintf(b, sizeof(b), "%s, no reason reported",
                 id(light_down_cause) == 2 ? "lost without an event (watchdog)" : "disconnected");
      else
        snprintf(b, sizeof(b), "%s%s (0x%02X)",
                 id(light_down_cause) == 2 ? "watchdog; last radio reason: " : "",
                 esphome::ble_link_guard::BLELinkGuard::reason_str(r), r);
      return {std::string(b)};

  # The bright part of the day: the curve at or above Light Bright
  # Threshold of its peak (a scene: its ramps past that share). The CO2
  # schedule in Home Assistant starts its lead before Start and stops before
  # End. "--:--" on the off phase, which HA's helpers read as no window.
  - platform: template
    id: light_bright_start
    name: "Light Bright Start"
    icon: mdi:weather-sunny
    update_interval: 60s
    lambda: |-
      const int v = id(lp_bright_on);
      if (!id(lp_valid) || v < 0) return {"--:--"};   // published, so a stale time cannot linger
      char buf[16];
      snprintf(buf, sizeof(buf), "%02d:%02d", v / 60, v % 60);
      return {std::string(buf)};
  - platform: template
    id: light_bright_end
    name: "Light Bright End"
    icon: mdi:weather-sunset
    update_interval: 60s
    lambda: |-
      const int v = id(lp_bright_off);
      if (!id(lp_valid) || v < 0) return {"--:--"};   // published, so a stale time cannot linger
      char buf[16];
      snprintf(buf, sizeof(buf), "%02d:%02d", v / 60, v % 60);
      return {std::string(buf)};

  # The lamp's own schedule snapshot after a push: the points it says it
  # stores, decoded in the one documented layout (A2). Read with the raw
  # frame in the log until a WRGB II Pro's layout is confirmed.
  - platform: template
    id: light_lamp_report
    name: "Light Lamp Report"
    icon: mdi:clipboard-text-clock
    entity_category: diagnostic

  - platform: template
    name: "Light Expected"
    icon: mdi:calendar-clock
    entity_category: diagnostic
    update_interval: 60s
    lambda: |-
      if (id(light_released)) return {"released to app"};
      if (!id(light_linked)) return {"no link"};
      switch (id(light_expected)) {
        case 1: return {"off phase"};
        case 2: return {id(light_curve_off_day) >= 0 && id(light_curve_off_day) == id(lp_sun_day) ? "dark (curve suspended)" : "dark"};
        case 3: return {id(light_curve_off_day) >= 0 && id(light_curve_off_day) == id(lp_sun_day) ? "ramping (curve suspended)" : "ramping"};
        case 4: return {id(light_curve_off_day) >= 0 && id(light_curve_off_day) == id(lp_sun_day) ? "lit (curve suspended)" : "lit"};
        default: return {"unknown"};
      }
