script:
- id: ro_send_target
  mode: restart
  then:
  - delay: 1500ms
  - if:
      condition:
        lambda: return !std::isnan(id(ro_target_pending));
      then:
      - mqtt.publish:
          topic: water-flow-ro/number/fill_target/command
          payload: !lambda |-
            char b[12]; snprintf(b, sizeof(b), "%.1f", id(ro_target_pending));
            return std::string(b);
      - delay: 6s
      - lambda: id(ro_target_pending) = NAN;
interval:
- interval: 1s
  then:
  - lambda: |-
          // ---------------------------------------------------------------- helpers
          const uint32_t now_ms = millis();
          auto txt = [](lv_obj_t *o, const char *fmt, ...) {
            char b[160];
            va_list ap; va_start(ap, fmt); vsnprintf(b, sizeof(b), fmt, ap); va_end(ap);
            if (strcmp(lv_label_get_text(o), b) != 0) lv_label_set_text(o, b);
          };
          auto col = [](lv_obj_t *o, uint32_t c) { lv_obj_set_style_text_color(o, lv_color_hex(c), 0); };
          auto bg = [](lv_obj_t *o, uint32_t fill, uint32_t border) {
            lv_obj_set_style_bg_color(o, lv_color_hex(fill), 0);
            lv_obj_set_style_border_color(o, lv_color_hex(border), 0);
          };
          auto show = [](lv_obj_t *o, bool on) {
            if (on) lv_obj_remove_flag(o, LV_OBJ_FLAG_HIDDEN); else lv_obj_add_flag(o, LV_OBJ_FLAG_HIDDEN);
          };
          auto age = [](uint32_t ms, char *b, size_t n) {
            const uint32_t s = ms / 1000;
            if (s < 90) snprintf(b, n, "%us", (unsigned) s);
            else if (s < 5400) snprintf(b, n, "%um", (unsigned) (s / 60));
            else snprintf(b, n, "%uh", (unsigned) (s / 3600));
          };
          // Place a target-range track's band and marker. NaN bound = open-ended.
          auto range = [](lv_obj_t *trk, lv_obj_t *band, lv_obj_t *mark, float v,
                          float lo, float hi, float mn, float mx, uint32_t mark_col) {
            const int w = lv_obj_get_width(trk);
            auto px = [&](float x) { return (int) roundf((std::min(mx, std::max(mn, x)) - mn) / (mx - mn) * (w - 4)); };
            const int a = std::isnan(lo) ? 0 : px(lo), b = std::isnan(hi) ? w : px(hi);
            lv_obj_set_pos(band, a, 0); lv_obj_set_width(band, std::max(4, b - a));
            if (std::isnan(v)) { lv_obj_add_flag(mark, LV_OBJ_FLAG_HIDDEN); return; }
            lv_obj_remove_flag(mark, LV_OBJ_FLAG_HIDDEN);
            lv_obj_set_pos(mark, px(v), -2);
            lv_obj_set_style_bg_color(mark, lv_color_hex(mark_col), 0);
          };
          const bool night = id(night_on);
          const uint32_t C_TEXT = night ? 0x8C9CAE : 0xF8FAFC;
          const uint32_t C_HEAD = night ? 0xC28238 : 0xF8FAFC;
          const uint32_t C_UNIT = night ? 0x7D5627 : 0x38BDF8;
          const uint32_t C_CARD = night ? 0x080D13 : 0x131B24;
          const uint32_t C_CARD2 = night ? 0x0A1118 : 0x19232F;
          const uint32_t C_BORDER = night ? 0x131C26 : 0x223142;
          lv_obj_set_style_bg_color(id(page_home)->obj, lv_color_hex(night ? 0x040608 : 0x0B1015), 0);

          // ----------------------------------------------------------- top bar
          auto tnow = id(sntp_time).now();
          if (tnow.is_valid()) {
            txt(id(clock_lbl), "%s", tnow.strftime("%-I:%M %p").c_str());
            txt(id(date), "%s", tnow.strftime("%a %b %-d").c_str());
          }
          const bool mqtt_ok = id(mqtt_up);
          txt(id(mqtt_pill_l), mqtt_ok ? "MQTT Connected" : "MQTT Down");
          col(id(mqtt_pill_l), mqtt_ok ? 0xCBD5E1 : 0xFBBF24);
          bg(id(mqtt_pill), mqtt_ok ? 0x131B24 : 0x291B07, mqtt_ok ? 0x223142 : 0xD97706);
          const bool l75 = id(t75_stamp_ms) != 0 && now_ms - id(t75_stamp_ms) < 45000;
          const bool l16 = id(t16_stamp_ms) != 0 && now_ms - id(t16_stamp_ms) < 45000;
          txt(id(ble_pill_l), "BLE %d/2", (int) l75 + (int) l16);
          col(id(ble_pill_l), (l75 && l16) ? 0xCBD5E1 : 0xFBBF24);

          // ------------------------------------------------------------ alerts
          int n_crit = 0, n_warn = 0;
          std::string top_title, top_msg;
          bool top_is_crit = false;
          for (auto &kv : id(alerts)) {
            // "level|title|message"
            const std::string &v = kv.second;
            const size_t a = v.find('|'), b = v.find('|', a == std::string::npos ? 0 : a + 1);
            if (a == std::string::npos || b == std::string::npos) continue;
            const bool crit = v.compare(0, a, "critical") == 0;
            if (crit) n_crit++; else n_warn++;
            if (top_title.empty() || (crit && !top_is_crit)) {
              top_title = v.substr(a + 1, b - a - 1);
              top_msg = v.substr(b + 1);
              top_is_crit = crit;
            }
          }
          const int n_alerts = n_crit + n_warn;
          show(id(alert_banner), n_alerts > 0);
          // The banner covers the left of the top bar; keep only the clock beside it.
          show(id(mqtt_pill), n_alerts == 0);
          show(id(ble_pill), n_alerts == 0);
          if (n_alerts > 0) {
            txt(id(alert_title), "%s", top_title.c_str());
            txt(id(alert_msg), "%s", top_msg.c_str());
            bg(id(alert_banner), top_is_crit ? 0x2D0E12 : 0x291B07, top_is_crit ? 0xDC2626 : 0xD97706);
            col(id(alert_icon), top_is_crit ? 0xEF4444 : 0xFBBF24);
            const bool is75 = top_title.find("75") != std::string::npos;
            const bool is16 = !is75 && (top_title.find("Nano") != std::string::npos ||
                                        top_title.find("nano") != std::string::npos);
            id(alert_target) = is75 ? 1 : (is16 ? 2 : 0);
            show(id(alert_btn), is75 || is16);
            txt(id(alert_btn_l), is75 ? "OPEN 75 GALLON" : "OPEN NANO");
          }
          {
            char b[64]; uint32_t fill, border, text;
            if (n_crit > 0) {
              snprintf(b, sizeof(b), "%d CRITICAL ALERT%s", n_crit, n_crit > 1 ? "S" : "");
              fill = 0x2D0E12; border = 0xDC2626; text = 0xEF4444;
            } else if (!l75 || !l16) {
              char a[12]; age(now_ms - (!l75 ? id(t75_stamp_ms) : id(t16_stamp_ms)), a, sizeof(a));
              const bool never = (!l75 ? id(t75_stamp_ms) : id(t16_stamp_ms)) == 0;
              if (never) snprintf(b, sizeof(b), "WAITING FOR %s LINK", !l75 ? "75 GALLON" : "NANO");
              else snprintf(b, sizeof(b), "%s LINK DOWN %s", !l75 ? "75 GALLON" : "NANO", a);
              fill = 0x291B07; border = 0xD97706; text = 0xFBBF24;
            } else if (n_warn > 0) {
              snprintf(b, sizeof(b), "%d WARNING%s", n_warn, n_warn > 1 ? "S" : "");
              fill = 0x291B07; border = 0xD97706; text = 0xFBBF24;
            } else {
              snprintf(b, sizeof(b), "ALL SYSTEMS NORMAL");
              fill = 0x0F291E; border = 0x059669; text = 0x10B981;
            }
            if (night) { fill = 0x080D13; border = 0x131C26; text = text == 0x10B981 ? 0x366B56 : text; }
            txt(id(status_pill_l), "%s", b);
            col(id(status_pill_l), text);
            bg(id(status_pill), fill, border);
          }

          // ----------------------------------------------------- bottom strip
          {
            for (lv_obj_t *c : {id(ro_card), id(wc_card), id(ha_card)}) bg(c, C_CARD, C_BORDER);
            bg(id(wc_open), night ? 0x0A1118 : 0x0284C7, night ? 0x131C26 : 0x38BDF8);
            bg(id(logo), night ? 0x080D13 : 0x0C4A6E, night ? 0x131C26 : 0x0284C7);
            col(id(brand), C_TEXT);
            col(id(clock_lbl), C_TEXT);
            const bool ro_on = id(ro_online);
            if (!ro_on) { txt(id(ro_pill_l), "OFFLINE"); col(id(ro_pill_l), 0xFBBF24); bg(id(ro_pill), 0x291B07, 0xD97706); }
            else if (id(ro_flowing)) { txt(id(ro_pill_l), "FLOWING %.2f GPM", std::isnan(id(ro_rate)) ? 0.0f : id(ro_rate)); col(id(ro_pill_l), 0x38BDF8); bg(id(ro_pill), 0x0C4A6E, 0x0284C7); }
            else { txt(id(ro_pill_l), "IDLE"); col(id(ro_pill_l), 0x94A3B8); bg(id(ro_pill), 0x19232F, 0x334155); }
            if (std::isnan(id(ro_fill))) txt(id(ro_val), "--"); else txt(id(ro_val), "%.1f", id(ro_fill));
            lv_obj_update_layout(id(ro_val));
            lv_obj_align_to(id(ro_of), id(ro_val), LV_ALIGN_OUT_RIGHT_BOTTOM, 6, -5);
            if (std::isnan(id(ro_target))) txt(id(ro_of), "/ -- gal"); else txt(id(ro_of), "/ %.1f gal", id(ro_target));
            const bool pct_ok = !std::isnan(id(ro_fill)) && !std::isnan(id(ro_target)) && id(ro_target) > 0;
            const int pct = pct_ok ? (int) roundf(id(ro_fill) / id(ro_target) * 100.0f) : 0;
            if (pct_ok) txt(id(ro_pct), "%d%% of target", pct); else txt(id(ro_pct), "");
            lv_bar_set_value(id(ro_bar), std::min(100, pct), LV_ANIM_OFF);
            txt(id(ro_reached_w), "Target reached: %s", id(ro_reached) ? "YES" : "NO");
            if (std::isnan(id(ro_total))) txt(id(ro_total_w), ""); else txt(id(ro_total_w), "Lifetime: %.0f gal", id(ro_total));

            if (!id(wc_online)) { txt(id(wc_batt_h), "Offline"); col(id(wc_batt_h), 0xFBBF24); }
            else if (std::isnan(id(wc_batt))) { txt(id(wc_batt_h), "Battery --"); col(id(wc_batt_h), 0x94A3B8); }
            else { txt(id(wc_batt_h), "Battery %.0f%%", id(wc_batt)); col(id(wc_batt_h), id(wc_batt_low) ? 0xFBBF24 : 0x10B981); }
            if (id(wc_last_start) == 0) txt(id(wc_last_h), "No change recorded yet");
            else {
              auto t = ESPTime::from_epoch_local(id(wc_last_start));
              const int days = tnow.is_valid() ? (int) ((tnow.timestamp - id(wc_last_start)) / 86400) : -1;
              if (days >= 0) txt(id(wc_last_h), "Last change: %s (%dd ago)", t.strftime("%b %-d").c_str(), days);
              else txt(id(wc_last_h), "Last change: %s", t.strftime("%b %-d").c_str());
            }
            txt(id(wc_mode_h), "Mode: %s  ·  %s", id(wc_draining) ? "Draining" : "Refilling",
                id(wc_flowing) ? "flowing" : "not flowing");

            if (std::isnan(id(ha_livestock_days)) || !mqtt_ok) txt(id(ha_v1), "--");
            else txt(id(ha_v1), "%.0f days", id(ha_livestock_days));
            if (!mqtt_ok) { txt(id(ha_v2), "--"); col(id(ha_v2), 0xF8FAFC); }
            else { txt(id(ha_v2), "%d", n_alerts); col(id(ha_v2), n_crit ? 0xEF4444 : (n_warn ? 0xFBBF24 : 0x10B981)); }
            auto dusk = id(sun_pa).sunset(-6.0);
            if (dusk.has_value()) txt(id(ha_v3), "%s", dusk->strftime("%-I:%M %p").c_str()); else txt(id(ha_v3), "--");
          }

          // ---------------------------------------------------- water change page
          {
            const bool dr = id(wc_draining);
            bg(id(wc_drain), dr ? 0x261711 : 0x1E293B, dr ? 0xEA580C : 0x334155);
            bg(id(wc_fill), !dr ? 0x0C4A6E : 0x1E293B, !dr ? 0x0284C7 : 0x334155);
            col(id(wc_drain_l), dr ? 0xFB923C : 0x94A3B8);
            col(id(wc_fill_l), !dr ? 0x38BDF8 : 0x94A3B8);
            if (!id(wc_online)) txt(id(wc_state_l), "METER OFFLINE");
            else if (!id(wc_flowing)) txt(id(wc_state_l), "%s  ·  IDLE", dr ? "DRAINING" : "REFILLING");
            else if (std::isnan(id(wc_rate))) txt(id(wc_state_l), "%s", dr ? "DRAINING" : "REFILLING");
            else txt(id(wc_state_l), "%s  ·  %.1f GPM", dr ? "DRAINING" : "REFILLING", id(wc_rate));
            if (std::isnan(id(wc_batt))) txt(id(wc_batt_l), "Hose battery --");
            else txt(id(wc_batt_l), "Hose battery %.0f%%%s", id(wc_batt), id(wc_batt_low) ? " (LOW)" : "");
            col(id(wc_batt_l), id(wc_batt_low) ? 0xFBBF24 : 0x10B981);
            bg(id(wc_batt_pill), id(wc_batt_low) ? 0x291B07 : 0x0F291E, id(wc_batt_low) ? 0xD97706 : 0x059669);
            txt(id(wc_mqtt_l), mqtt_ok ? "MQTT Live" : "MQTT Down");
            const float big = dr ? id(wc_removed) : id(wc_added);
            txt(id(wc_big_cap), dr ? "WATER REMOVED THIS CHANGE" : "WATER ADDED THIS CHANGE");
            col(id(wc_big_cap), dr ? 0xFB923C : 0x38BDF8);
            if (std::isnan(big)) txt(id(wc_big), "--"); else txt(id(wc_big), "%.1f", big);
            lv_obj_update_layout(id(wc_big));
            lv_obj_align_to(id(wc_big_u), id(wc_big), LV_ALIGN_OUT_RIGHT_BOTTOM, 8, -10);
            if (std::isnan(id(wc_volume))) txt(id(wc_vol), "");
            else txt(id(wc_vol), "%.0f gal of water", id(wc_volume));
            if (std::isnan(id(wc_pct))) txt(id(wc_pct_w), "--"); else txt(id(wc_pct_w), "%.1f%%", id(wc_pct));
            lv_arc_set_value(id(wc_arc), std::isnan(id(wc_pct)) ? 0 : (int) std::min(1000.0f, id(wc_pct) * 10.0f));
            lv_obj_set_style_arc_color(id(wc_arc), lv_color_hex(dr ? 0xFB923C : 0x0284C7), LV_PART_INDICATOR);
            if (std::isnan(id(wc_rate))) txt(id(wc_rate_w), "--"); else txt(id(wc_rate_w), "%.2f gpm", id(wc_rate));
            txt(id(wc_flowing_w), "Flowing: %s", id(wc_flowing) ? "YES" : "NO");
            if (std::isnan(id(wc_added))) txt(id(wc_added_w), "--"); else txt(id(wc_added_w), "%.1f gal", id(wc_added));
            if (std::isnan(id(wc_removed))) txt(id(wc_removed2), "--"); else txt(id(wc_removed2), "%.1f gal", id(wc_removed));
            if (std::isnan(id(wc_net))) txt(id(wc_net_w), "--");
            else { txt(id(wc_net_w), "%+.1f gal", id(wc_net)); col(id(wc_net_w), id(wc_net) < -0.05f ? 0xFB923C : 0xF8FAFC); }
            if (!std::isnan(id(wc_removed)) && !std::isnan(id(wc_added)))
              txt(id(wc_other), dr ? "Added so far: %.1f gal" : "Removed this change: %.1f gal", dr ? id(wc_added) : id(wc_removed));
            else txt(id(wc_other), "");
            txt(id(ro_online_l), id(ro_online) ? "MQTT ONLINE" : "OFFLINE");
            if (std::isnan(id(ro_fill))) txt(id(ro_d_val), "--"); else txt(id(ro_d_val), "%.2f gal", id(ro_fill));
            const float tgt = std::isnan(id(ro_target_pending)) ? id(ro_target) : id(ro_target_pending);
            if (std::isnan(tgt)) { txt(id(ro_d_of), ""); txt(id(ro_d_tgt), "--"); }
            else {
              txt(id(ro_d_tgt), "%.1f gal", tgt);
              if (!std::isnan(id(ro_fill)) && tgt > 0) txt(id(ro_d_of), "of %.1f (%d%%)", tgt, (int) roundf(id(ro_fill) / tgt * 100));
              else txt(id(ro_d_of), "of %.1f", tgt);
            }
            lv_bar_set_value(id(ro_d_bar), (!std::isnan(id(ro_fill)) && !std::isnan(tgt) && tgt > 0)
                             ? std::min(100, (int) roundf(id(ro_fill) / tgt * 100)) : 0, LV_ANIM_OFF);
            if (id(ro_flowing) && !std::isnan(id(ro_rate))) txt(id(ro_d_flow), "Flowing  ·  %.2f gpm", id(ro_rate));
            else txt(id(ro_d_flow), "Not flowing");
            txt(id(ro_d_reached), id(ro_reached) ? "YES" : "NO");
            col(id(ro_d_reached), id(ro_reached) ? 0x10B981 : 0xF8FAFC);
            if (std::isnan(id(ro_total))) txt(id(ro_d_total), "--"); else txt(id(ro_d_total), "%.0f gal", id(ro_total));
            if (std::isnan(id(wc_batt))) txt(id(wc_d_batt), "--");
            else txt(id(wc_d_batt), "%.0f%%%s", id(wc_batt), id(wc_batt_low) ? "  LOW" : "");
            if (id(wc_last_start) == 0) txt(id(wc_d_last), "--");
            else txt(id(wc_d_last), "%s", ESPTime::from_epoch_local(id(wc_last_start)).strftime("%b %-d, %-I:%M %p").c_str());
            if (std::isnan(id(wc_volume))) txt(id(wc_d_vol), "--"); else txt(id(wc_d_vol), "%.1f gal", id(wc_volume));
          }

          // =========================================================== tank t75
          {
            const bool live = id(t75_stamp_ms) != 0 && now_ms - id(t75_stamp_ms) < 45000;
            const bool ever = id(t75_stamp_ms) != 0;
            const float temp = id(t75_temp), sp = id(t75_sp);
            const bool crit = live && (id(t75_fault) ||
                              (!std::isnan(temp) && !std::isnan(sp) && fabsf(temp - sp) > 2.0f));
            // Card frame.
            if (!live) {
              lv_obj_set_style_bg_color(id(t75_card), lv_color_hex(night ? 0x080D13 : 0x0E141B), 0);
              lv_obj_set_style_border_color(id(t75_card), lv_color_hex(0x475569), 0);
              lv_obj_set_style_border_width(id(t75_card), 1, 0);
            } else if (crit) {
              lv_obj_set_style_bg_color(id(t75_card), lv_color_hex(C_CARD), 0);
              lv_obj_set_style_border_color(id(t75_card), lv_color_hex(0xEF4444), 0);
              lv_obj_set_style_border_width(id(t75_card), 2, 0);
            } else {
              lv_obj_set_style_bg_color(id(t75_card), lv_color_hex(C_CARD), 0);
              lv_obj_set_style_border_color(id(t75_card), lv_color_hex(C_BORDER), 0);
              lv_obj_set_style_border_width(id(t75_card), 1, 0);
            }
            bg(id(t75_hero), crit ? 0x2D0E12 : (live ? C_CARD2 : 0x0E141B), crit ? 0xDC2626 : (live ? (night ? 0x131C26 : 0x243447) : 0x475569));
            col(id(t75_title), live ? C_TEXT : 0x94A3B8);
            show(id(t75_tag), live);
            show(id(t75_stale), !live);
            char a[12]; age(now_ms - id(t75_stamp_ms), a, sizeof(a));
            if (live) {
              txt(id(t75_link_w), "BLE Live  ·  %us ago", (unsigned) ((now_ms - id(t75_stamp_ms)) / 1000));
              col(id(t75_link_w), night ? 0x506173 : 0x38BDF8);
            } else if (!ever && id(t75_stamp) == 0) {
              txt(id(t75_link_w), "Waiting for Bluetooth link");
              col(id(t75_link_w), 0xFBBF24);
              txt(id(t75_stale_l), "NO DATA");
            } else {
              if (id(t75_stamp) != 0) {
                txt(id(t75_link_w), "Link lost  ·  values from %s",
                    ESPTime::from_epoch_local(id(t75_stamp)).strftime("%-I:%M:%S %p").c_str());
              } else {
                txt(id(t75_link_w), "Bluetooth link lost");
              }
              col(id(t75_link_w), 0xFBBF24);
              if (ever) txt(id(t75_stale_l), "STALE %s", a); else txt(id(t75_stale_l), "STALE");
            }

            // Hero temperature.
            if (std::isnan(temp)) txt(id(t75_temp_w), "--"); else txt(id(t75_temp_w), "%.1f", temp);
            col(id(t75_temp_w), !live ? 0x64748B : (crit ? 0xEF4444 : C_HEAD));
            lv_obj_set_style_text_decor(id(t75_temp_w), live || std::isnan(temp) ? LV_TEXT_DECOR_NONE : LV_TEXT_DECOR_STRIKETHROUGH, 0);
            col(id(t75_unit), !live ? 0x475569 : (crit ? 0xEF4444 : C_UNIT));
            lv_obj_update_layout(id(t75_temp_w));
            lv_obj_align_to(id(t75_unit), id(t75_temp_w), LV_ALIGN_OUT_RIGHT_BOTTOM, 6, -8);
            const float swing = id(t75_swing);
            if (std::isnan(sp)) txt(id(t75_sp_w), "Setpoint --");
            else if (std::isnan(swing)) txt(id(t75_sp_w), "Setpoint  %.1f °F", sp);
            else txt(id(t75_sp_w), "Setpoint  %.1f °F  (±%.1f°)", sp, swing);
            col(id(t75_sp_w), live ? (crit ? 0xEF4444 : (night ? 0x7D5627 : 0x38BDF8)) : 0x64748B);
            bg(id(t75_sp_box), C_CARD, night ? 0x131C26 : 0x334155);
            if (true) {
              const float tb = id(t75_temp_b), g = id(t75_grad);
              char pa[12], pb[12], pg[16];
              if (std::isnan(temp)) snprintf(pa, sizeof(pa), "--"); else snprintf(pa, sizeof(pa), "%.1f°", temp);
              if (std::isnan(tb)) snprintf(pb, sizeof(pb), "--"); else snprintf(pb, sizeof(pb), "%.1f°", tb);
              if (std::isnan(g)) snprintf(pg, sizeof(pg), "--"); else snprintf(pg, sizeof(pg), "%+.1f °F", g);
              txt(id(t75_probes), "A  %s  ·  B  %s  ·  A-B  %s", pa, pb, pg);
            } else {
              txt(id(t75_probes), "Single probe");
            }
            const float dr = id(t75_drift);
            if (!live || std::isnan(dr)) { txt(id(t75_drift_w), live ? "" : "Drift --"); col(id(t75_drift_w), 0x64748B); }
            else {
              const bool falling = dr < -0.02f, rising = dr > 0.02f;
              txt(id(t75_drift_w), "%+.2f °F/min  %s", dr, falling ? "(falling)" : (rising ? "(rising)" : "(stable)"));
              col(id(t75_drift_w), crit && falling ? 0xEF4444 : (night ? 0x366B56 : 0x10B981));
            }

            // Heater / fan tiles.
            {
              const float h = id(t75_heat), f = id(t75_fan);
              const bool hon = id(t75_heat_on), fon = id(t75_fan_on);
              const bool hstall = crit && hon && h >= 99.0f && !std::isnan(dr) && dr < 0;
              if (!live) {
                txt(id(t75_heat_val), "--  (unknown)"); txt(id(t75_fan_val), "--  (unknown)");
                col(id(t75_heat_val), 0xFBBF24); col(id(t75_fan_val), 0xFBBF24);
                txt(id(t75_heat_cap), "HEATER DUTY"); txt(id(t75_fan_cap), "FAN DUTY");
                bg(id(t75_heat_tile), 0x0E141B, 0x334155); bg(id(t75_fan_tile), 0x0E141B, 0x334155);
                col(id(t75_heat_icon), 0x475569); col(id(t75_fan_icon), 0x475569);
              } else {
                txt(id(t75_heat_cap), hstall ? "HEATER  NOT HEATING" : (hon ? "HEATER  ·  ON" : "HEATER  ·  IDLE"));
                txt(id(t75_heat_val), "%.0f%% duty", std::isnan(h) ? 0.0f : h);
                col(id(t75_heat_cap), hstall ? 0xEF4444 : (hon ? 0xFB923C : 0x94A3B8));
                col(id(t75_heat_val), hstall ? 0xEF4444 : (hon ? (night ? 0xB47834 : 0xFB923C) : C_TEXT));
                bg(id(t75_heat_tile), hstall ? 0x2D0E12 : (hon ? 0x261711 : (night ? 0x0A1118 : 0x16202C)),
                   hstall ? 0xDC2626 : (hon ? 0xEA580C : C_BORDER));
                col(id(t75_heat_icon), hon ? 0xFB923C : 0x64748B);
                txt(id(t75_fan_cap), fon ? "FAN  ·  ON" : "FAN  ·  IDLE");
                txt(id(t75_fan_val), "%.0f%% duty", std::isnan(f) ? 0.0f : f);
                col(id(t75_fan_cap), fon ? 0x38BDF8 : 0x94A3B8);
                col(id(t75_fan_val), C_TEXT);
                bg(id(t75_fan_tile), fon ? 0x0C4A6E : (night ? 0x0A1118 : 0x16202C), fon ? 0x0284C7 : C_BORDER);
                col(id(t75_fan_icon), fon ? 0x38BDF8 : 0x64748B);
              }
              lv_bar_set_value(id(t75_heat_bar), live && !std::isnan(h) ? (int) h : 0, LV_ANIM_OFF);
              lv_bar_set_value(id(t75_fan_bar), live && !std::isnan(f) ? (int) f : 0, LV_ANIM_OFF);
            }

            // TDS / pH tiles.
            {
              const float tds = id(t75_tds), tm = id(t75_tds_mean);
              const uint32_t vc = live ? C_TEXT : 0x64748B;
              if (std::isnan(tds)) txt(id(t75_tds_val), "--"); else txt(id(t75_tds_val), "%.0f", tds);
              col(id(t75_tds_val), vc);
              lv_obj_update_layout(id(t75_tds_val));
              lv_obj_align_to(id(t75_tds_unit), id(t75_tds_val), LV_ALIGN_OUT_RIGHT_BOTTOM, 6, -5);
              if (std::isnan(tm)) txt(id(t75_tds_side), ""); else txt(id(t75_tds_side), "1 h avg %.0f", tm);
              const float lo = 200.0f, hi = 225.0f, al = 260.0f;
              const float judge = std::isnan(tm) ? tds : tm;
              uint32_t tcol = 0x10B981; const char *ts = "In target";
              if (std::isnan(judge)) { tcol = 0x94A3B8; ts = ""; }
              else if (judge >= al) { tcol = 0xEF4444; ts = "Above alert"; }
              else if (!std::isnan(hi) && judge > hi) { tcol = 0xFBBF24; ts = "Above target"; }
              else if (!std::isnan(lo) && judge < lo) { tcol = 0xFBBF24; ts = "Below target"; }
              if (std::isnan(lo)) txt(id(t75_tds_tgt), "Target < %.0f", hi);
              else txt(id(t75_tds_tgt), "Target %.0f-%.0f", lo, hi);
              if (!live) { txt(id(t75_tds_tgt), "CACHED"); col(id(t75_tds_tgt), 0xFBBF24); }
              else col(id(t75_tds_tgt), 0x94A3B8);
              range(id(t75_tds_trk), id(t75_tds_trk_band), id(t75_tds_trk_mark), live ? judge : NAN,
                    lo, hi, 150.0f, 320.0f, tcol);
              // Detail screen.
              if (std::isnan(tds)) txt(id(t75_d_tds), "--"); else txt(id(t75_d_tds), "%.0f", tds);
              col(id(t75_d_tds), vc);
              lv_obj_update_layout(id(t75_d_tds));
              lv_obj_align_to(id(t75_d_tds_u), id(t75_d_tds), LV_ALIGN_OUT_RIGHT_BOTTOM, 8, -6);
              if (std::isnan(tm)) txt(id(t75_d_tds_m), ""); else txt(id(t75_d_tds_m), "1 h mean %.0f", tm);
              txt(id(t75_d_tds_st), "%s", live ? ts : "Stale");
              col(id(t75_d_tds_st), live ? tcol : 0xFBBF24);
              if (std::isnan(lo)) txt(id(t75_d_tds_tgt), "Target under %.0f ppm", hi);
              else txt(id(t75_d_tds_tgt), "Target %.0f-%.0f  ·  alert %.0f ppm", lo, hi, al);
              range(id(t75_d_tds_trk), id(t75_d_tds_trk_band), id(t75_d_tds_trk_mark), live ? judge : NAN,
                    lo, hi, 150.0f, 320.0f, tcol);

              const float ph = id(t75_ph);
              const bool ph_live = id(t75_ph_ms) != 0 && now_ms - id(t75_ph_ms) < 3600000;
              const float plo = 7.0f, phi = 7.5f;
              uint32_t pcol = 0x10B981; const char *ps = "In target";
              if (std::isnan(ph)) { pcol = 0x94A3B8; ps = ""; }
              else if (!std::isnan(plo) && ph < plo) { pcol = ph < plo - 0.2f ? 0xEF4444 : 0xFBBF24; ps = "Below target"; }
              else if (!std::isnan(phi) && ph > phi) { pcol = 0xFBBF24; ps = "Above target"; }
              if (std::isnan(ph)) txt(id(t75_ph_val), "--"); else txt(id(t75_ph_val), "%.2f", ph);
              col(id(t75_ph_val), ph_live ? C_TEXT : 0x64748B);
              lv_obj_update_layout(id(t75_ph_val));
              lv_obj_align_to(id(t75_ph_unit), id(t75_ph_val), LV_ALIGN_OUT_RIGHT_BOTTOM, 6, -5);
              if (std::isnan(phi)) txt(id(t75_ph_tgt), "Target >= %.1f", plo);
              else txt(id(t75_ph_tgt), "Target %.1f-%.1f", plo, phi);
              if (!ph_live && !std::isnan(ph)) { txt(id(t75_ph_tgt), "CACHED"); col(id(t75_ph_tgt), 0xFBBF24); }
              else col(id(t75_ph_tgt), 0x94A3B8);
              txt(id(t75_ph_side), "%s", ph_live ? ps : "");
              col(id(t75_ph_side), pcol);
              range(id(t75_ph_trk), id(t75_ph_trk_band), id(t75_ph_trk_mark), ph_live ? ph : NAN,
                    plo, phi, 6.4f, 8.0f, pcol);
              if (std::isnan(ph)) txt(id(t75_d_ph), "--"); else txt(id(t75_d_ph), "%.2f", ph);
              col(id(t75_d_ph), ph_live ? C_TEXT : 0x64748B);
              txt(id(t75_d_ph_st), "%s", ph_live ? ps : (std::isnan(ph) ? "No data" : "Stale"));
              col(id(t75_d_ph_st), ph_live ? pcol : 0xFBBF24);
              if (std::isnan(phi)) txt(id(t75_d_ph_tgt), "Target >= %.2f", plo);
              else txt(id(t75_d_ph_tgt), "Target %.2f-%.2f", plo, phi);
              range(id(t75_d_ph_trk), id(t75_d_ph_trk_band), id(t75_d_ph_trk_mark), ph_live ? ph : NAN,
                    plo, phi, 6.4f, 8.0f, pcol);
            }

            // Footer + detail info card.
            {
              const float lux = id(t75_lux);
              if (!live || std::isnan(lux)) txt(id(t75_f_lux), "-- lux"); else txt(id(t75_f_lux), "%.0f lux", lux);
              const int co2 = id(ha_co2_t75), bub = id(ha_bubbler_t75);
              txt(id(t75_f_co2), "CO2 %s", co2 < 0 ? "--" : (co2 ? "On" : "Off"));
              col(id(t75_f_co2), co2 == 1 ? (night ? 0x506173 : 0x38BDF8) : (night ? 0x506173 : 0x94A3B8));
              txt(id(t75_f_bub), "Bubbler %s", bub < 0 ? "--" : (bub ? "On" : "Off"));
              col(id(t75_f_bub), bub == 1 ? (night ? 0x506173 : 0x38BDF8) : (night ? 0x506173 : 0x94A3B8));
              const float conf = id(t75_conf);
              if (!live) { txt(id(t75_f_model), "Model --"); col(id(t75_f_model), 0x94A3B8); }
              else if (id(t75_fault)) { txt(id(t75_f_model), "SAFETY TRIPPED"); col(id(t75_f_model), 0xEF4444); }
              else if (std::isnan(conf)) txt(id(t75_f_model), "Model --");
              else { txt(id(t75_f_model), "Model  %.0f%%", conf); col(id(t75_f_model), conf < 70 ? 0xFBBF24 : 0x94A3B8); }

              if (!live || std::isnan(lux)) txt(id(t75_d_lux), "-- lux"); else txt(id(t75_d_lux), "%.0f lux", lux);
              auto dawn = id(sun_pa).sunrise(-6.0); auto dusk = id(sun_pa).sunset(-6.0);
              if (dawn.has_value() && dusk.has_value())
                txt(id(t75_d_sun), "Civil dawn  %s  ·  dusk  %s", dawn->strftime("%-I:%M").c_str(), dusk->strftime("%-I:%M").c_str());
              txt(id(t75_d_co2), "CO2 %s", co2 < 0 ? "--" : (co2 ? "ON" : "OFF"));
              col(id(t75_d_co2), co2 == 1 ? 0x38BDF8 : 0xF8FAFC);
              txt(id(t75_d_bub), "Bubbler %s", bub < 0 ? "--" : (bub ? "on" : "off"));
              col(id(t75_d_bub), bub == 1 ? 0x10B981 : 0x94A3B8);
              if (!live) { txt(id(t75_d_safe2), "--"); col(id(t75_d_safe2), 0x94A3B8); }
              else { txt(id(t75_d_safe2), id(t75_fault) ? "SAFETY TRIPPED" : "Safety OK"); col(id(t75_d_safe2), id(t75_fault) ? 0xEF4444 : 0x10B981); }
              if (std::isnan(conf)) txt(id(t75_d_model), "Model confidence --");
              else txt(id(t75_d_model), "Model confidence  %.0f%%", conf);
            }

            // Detail header + setpoint + actuators.
            {
              if (live) txt(id(t75_d_link_l), "BLE Live  ·  %us ago", (unsigned) ((now_ms - id(t75_stamp_ms)) / 1000));
              else txt(id(t75_d_link_l), "Link lost  ·  %s", ever ? a : "no data yet");
              col(id(t75_d_link_l), live ? 0x38BDF8 : 0xFBBF24);
              txt(id(t75_d_safety_l), !live ? "SAFETY --" : (id(t75_fault) ? "SAFETY TRIPPED" : "SAFETY OK"));
              col(id(t75_d_safety_l), !live ? 0x94A3B8 : (id(t75_fault) ? 0xEF4444 : 0x10B981));
              bg(id(t75_d_safety), !live ? 0x131B24 : (id(t75_fault) ? 0x2D0E12 : 0x0F291E),
                 !live ? 0x334155 : (id(t75_fault) ? 0xDC2626 : 0x059669));
              const float shown = std::isnan(id(t75_sp_pending)) ? sp : id(t75_sp_pending);
              if (std::isnan(shown)) txt(id(t75_d_sp), "--"); else txt(id(t75_d_sp), "%.1f", shown);
              col(id(t75_d_sp), std::isnan(id(t75_sp_pending)) ? 0xF8FAFC : 0xFBBF24);
              if (!std::isnan(id(t75_sp_pending))) txt(id(t75_d_band), "Sending...");
              else if (std::isnan(sp) || std::isnan(swing)) txt(id(t75_d_band), "");
              else txt(id(t75_d_band), "Control band  %.1f-%.1f °F", sp - swing, sp + swing);
              if (std::isnan(swing)) txt(id(t75_d_swing), ""); else txt(id(t75_d_swing), "SWING ±%.1f °F", swing);
              const float conf = id(t75_conf);
              if (std::isnan(conf)) txt(id(t75_d_conf), "Confidence --");
              else txt(id(t75_d_conf), "Confidence  %.0f%%", conf);
              const bool ln = id(t75_learn);
              txt(id(t75_learn_l), ln ? "LEARNING ON" : "LEARNING OFF");
              col(id(t75_learn_l), ln ? 0x10B981 : 0x94A3B8);
              bg(id(t75_learn_w), ln ? 0x0F291E : 0x1E293B, ln ? 0x059669 : 0x334155);
              if (std::isnan(temp)) txt(id(t75_d_pa), "--"); else txt(id(t75_d_pa), "%.1f °F", temp);
              col(id(t75_d_pa), live ? 0xF8FAFC : 0x64748B);
              {
                const float tb = id(t75_temp_b), g = id(t75_grad);
                if (std::isnan(tb)) txt(id(t75_d_pb), "--"); else txt(id(t75_d_pb), "%.1f °F", tb);
                col(id(t75_d_pb), live ? 0xF8FAFC : 0x64748B);
                if (std::isnan(g)) txt(id(t75_d_grad), "--"); else txt(id(t75_d_grad), "%+.2f °F", g);
              }
              if (!live || std::isnan(dr)) txt(id(t75_d_drift), "");
              else txt(id(t75_d_drift), "%+.2f °F/min", dr);
              const float h = id(t75_heat), f = id(t75_fan);
              const bool hon = id(t75_heat_on), fon = id(t75_fan_on);
              txt(id(t75_d_heat_cap), hon ? "HEATER: DEMAND ON" : "HEATER: IDLE");
              col(id(t75_d_heat_cap), hon ? 0xFB923C : 0x94A3B8);
              txt(id(t75_d_heat_sub), "Duty cycle");
              if (!live || std::isnan(h)) txt(id(t75_d_heat_pct), "--"); else txt(id(t75_d_heat_pct), "%.0f%%", h);
              bg(id(t75_d_heat), hon ? 0x261711 : 0x16202C, hon ? 0xEA580C : 0x223142);
              col(id(t75_d_heat_icon), hon ? 0xFB923C : 0x64748B);
              lv_bar_set_value(id(t75_d_heat_bar), live && !std::isnan(h) ? (int) h : 0, LV_ANIM_OFF);
              txt(id(t75_d_fan_cap), fon ? "COOLING FAN: ON" : "COOLING FAN: OFF");
              col(id(t75_d_fan_cap), fon ? 0x38BDF8 : 0x94A3B8);
              txt(id(t75_d_fan_sub), "Duty cycle");
              if (!live || std::isnan(f)) txt(id(t75_d_fan_pct), "--"); else txt(id(t75_d_fan_pct), "%.0f%%", f);
              bg(id(t75_d_fan), fon ? 0x0C4A6E : 0x16202C, fon ? 0x0284C7 : 0x223142);
              col(id(t75_d_fan_icon), fon ? 0x38BDF8 : 0x64748B);
              lv_bar_set_value(id(t75_d_fan_bar), live && !std::isnan(f) ? (int) f : 0, LV_ANIM_OFF);
            }
          }

          // =========================================================== tank t16
          {
            const bool live = id(t16_stamp_ms) != 0 && now_ms - id(t16_stamp_ms) < 45000;
            const bool ever = id(t16_stamp_ms) != 0;
            const float temp = id(t16_temp), sp = id(t16_sp);
            const bool crit = live && (id(t16_fault) ||
                              (!std::isnan(temp) && !std::isnan(sp) && fabsf(temp - sp) > 2.0f));
            // Card frame.
            if (!live) {
              lv_obj_set_style_bg_color(id(t16_card), lv_color_hex(night ? 0x080D13 : 0x0E141B), 0);
              lv_obj_set_style_border_color(id(t16_card), lv_color_hex(0x475569), 0);
              lv_obj_set_style_border_width(id(t16_card), 1, 0);
            } else if (crit) {
              lv_obj_set_style_bg_color(id(t16_card), lv_color_hex(C_CARD), 0);
              lv_obj_set_style_border_color(id(t16_card), lv_color_hex(0xEF4444), 0);
              lv_obj_set_style_border_width(id(t16_card), 2, 0);
            } else {
              lv_obj_set_style_bg_color(id(t16_card), lv_color_hex(C_CARD), 0);
              lv_obj_set_style_border_color(id(t16_card), lv_color_hex(C_BORDER), 0);
              lv_obj_set_style_border_width(id(t16_card), 1, 0);
            }
            bg(id(t16_hero), crit ? 0x2D0E12 : (live ? C_CARD2 : 0x0E141B), crit ? 0xDC2626 : (live ? (night ? 0x131C26 : 0x243447) : 0x475569));
            col(id(t16_title), live ? C_TEXT : 0x94A3B8);
            show(id(t16_tag), live);
            show(id(t16_stale), !live);
            char a[12]; age(now_ms - id(t16_stamp_ms), a, sizeof(a));
            if (live) {
              txt(id(t16_link_w), "BLE Live  ·  %us ago", (unsigned) ((now_ms - id(t16_stamp_ms)) / 1000));
              col(id(t16_link_w), night ? 0x506173 : 0x38BDF8);
            } else if (!ever && id(t16_stamp) == 0) {
              txt(id(t16_link_w), "Waiting for Bluetooth link");
              col(id(t16_link_w), 0xFBBF24);
              txt(id(t16_stale_l), "NO DATA");
            } else {
              if (id(t16_stamp) != 0) {
                txt(id(t16_link_w), "Link lost  ·  values from %s",
                    ESPTime::from_epoch_local(id(t16_stamp)).strftime("%-I:%M:%S %p").c_str());
              } else {
                txt(id(t16_link_w), "Bluetooth link lost");
              }
              col(id(t16_link_w), 0xFBBF24);
              if (ever) txt(id(t16_stale_l), "STALE %s", a); else txt(id(t16_stale_l), "STALE");
            }

            // Hero temperature.
            if (std::isnan(temp)) txt(id(t16_temp_w), "--"); else txt(id(t16_temp_w), "%.1f", temp);
            col(id(t16_temp_w), !live ? 0x64748B : (crit ? 0xEF4444 : C_HEAD));
            lv_obj_set_style_text_decor(id(t16_temp_w), live || std::isnan(temp) ? LV_TEXT_DECOR_NONE : LV_TEXT_DECOR_STRIKETHROUGH, 0);
            col(id(t16_unit), !live ? 0x475569 : (crit ? 0xEF4444 : C_UNIT));
            lv_obj_update_layout(id(t16_temp_w));
            lv_obj_align_to(id(t16_unit), id(t16_temp_w), LV_ALIGN_OUT_RIGHT_BOTTOM, 6, -8);
            const float swing = id(t16_swing);
            if (std::isnan(sp)) txt(id(t16_sp_w), "Setpoint --");
            else if (std::isnan(swing)) txt(id(t16_sp_w), "Setpoint  %.1f °F", sp);
            else txt(id(t16_sp_w), "Setpoint  %.1f °F  (±%.1f°)", sp, swing);
            col(id(t16_sp_w), live ? (crit ? 0xEF4444 : (night ? 0x7D5627 : 0x38BDF8)) : 0x64748B);
            bg(id(t16_sp_box), C_CARD, night ? 0x131C26 : 0x334155);
            if (false) {
              const float tb = id(t16_temp_b), g = id(t16_grad);
              char pa[12], pb[12], pg[16];
              if (std::isnan(temp)) snprintf(pa, sizeof(pa), "--"); else snprintf(pa, sizeof(pa), "%.1f°", temp);
              if (std::isnan(tb)) snprintf(pb, sizeof(pb), "--"); else snprintf(pb, sizeof(pb), "%.1f°", tb);
              if (std::isnan(g)) snprintf(pg, sizeof(pg), "--"); else snprintf(pg, sizeof(pg), "%+.1f °F", g);
              txt(id(t16_probes), "A  %s  ·  B  %s  ·  A-B  %s", pa, pb, pg);
            } else {
              txt(id(t16_probes), "Single probe");
            }
            const float dr = id(t16_drift);
            if (!live || std::isnan(dr)) { txt(id(t16_drift_w), live ? "" : "Drift --"); col(id(t16_drift_w), 0x64748B); }
            else {
              const bool falling = dr < -0.02f, rising = dr > 0.02f;
              txt(id(t16_drift_w), "%+.2f °F/min  %s", dr, falling ? "(falling)" : (rising ? "(rising)" : "(stable)"));
              col(id(t16_drift_w), crit && falling ? 0xEF4444 : (night ? 0x366B56 : 0x10B981));
            }

            // Heater / fan tiles.
            {
              const float h = id(t16_heat), f = id(t16_fan);
              const bool hon = id(t16_heat_on), fon = id(t16_fan_on);
              const bool hstall = crit && hon && h >= 99.0f && !std::isnan(dr) && dr < 0;
              if (!live) {
                txt(id(t16_heat_val), "--  (unknown)"); txt(id(t16_fan_val), "--  (unknown)");
                col(id(t16_heat_val), 0xFBBF24); col(id(t16_fan_val), 0xFBBF24);
                txt(id(t16_heat_cap), "HEATER DUTY"); txt(id(t16_fan_cap), "FAN DUTY");
                bg(id(t16_heat_tile), 0x0E141B, 0x334155); bg(id(t16_fan_tile), 0x0E141B, 0x334155);
                col(id(t16_heat_icon), 0x475569); col(id(t16_fan_icon), 0x475569);
              } else {
                txt(id(t16_heat_cap), hstall ? "HEATER  NOT HEATING" : (hon ? "HEATER  ·  ON" : "HEATER  ·  IDLE"));
                txt(id(t16_heat_val), "%.0f%% duty", std::isnan(h) ? 0.0f : h);
                col(id(t16_heat_cap), hstall ? 0xEF4444 : (hon ? 0xFB923C : 0x94A3B8));
                col(id(t16_heat_val), hstall ? 0xEF4444 : (hon ? (night ? 0xB47834 : 0xFB923C) : C_TEXT));
                bg(id(t16_heat_tile), hstall ? 0x2D0E12 : (hon ? 0x261711 : (night ? 0x0A1118 : 0x16202C)),
                   hstall ? 0xDC2626 : (hon ? 0xEA580C : C_BORDER));
                col(id(t16_heat_icon), hon ? 0xFB923C : 0x64748B);
                txt(id(t16_fan_cap), fon ? "FAN  ·  ON" : "FAN  ·  IDLE");
                txt(id(t16_fan_val), "%.0f%% duty", std::isnan(f) ? 0.0f : f);
                col(id(t16_fan_cap), fon ? 0x38BDF8 : 0x94A3B8);
                col(id(t16_fan_val), C_TEXT);
                bg(id(t16_fan_tile), fon ? 0x0C4A6E : (night ? 0x0A1118 : 0x16202C), fon ? 0x0284C7 : C_BORDER);
                col(id(t16_fan_icon), fon ? 0x38BDF8 : 0x64748B);
              }
              lv_bar_set_value(id(t16_heat_bar), live && !std::isnan(h) ? (int) h : 0, LV_ANIM_OFF);
              lv_bar_set_value(id(t16_fan_bar), live && !std::isnan(f) ? (int) f : 0, LV_ANIM_OFF);
            }

            // TDS / pH tiles.
            {
              const float tds = id(t16_tds), tm = id(t16_tds_mean);
              const uint32_t vc = live ? C_TEXT : 0x64748B;
              if (std::isnan(tds)) txt(id(t16_tds_val), "--"); else txt(id(t16_tds_val), "%.0f", tds);
              col(id(t16_tds_val), vc);
              lv_obj_update_layout(id(t16_tds_val));
              lv_obj_align_to(id(t16_tds_unit), id(t16_tds_val), LV_ALIGN_OUT_RIGHT_BOTTOM, 6, -5);
              if (std::isnan(tm)) txt(id(t16_tds_side), ""); else txt(id(t16_tds_side), "1 h avg %.0f", tm);
              const float lo = NAN, hi = 300.0f, al = 300.0f;
              const float judge = std::isnan(tm) ? tds : tm;
              uint32_t tcol = 0x10B981; const char *ts = "In target";
