                  lv_obj_set_y(id(w_t75_tds_trk), 66); lv_obj_set_y(id(w_t75_ph_trk), 66);
                  lv_obj_set_y(id(w_t75_sep), 350); lv_obj_set_y(id(w_t75_foot), 358);
                  lv_obj_set_y(id(w_t75_details), 355); lv_obj_set_y(id(w_t75_reconn), 370);
                }
              }
            }

            // ---- card frame and header
            if (stale) bg(id(w_t75_card), night ? 0x080D13 : 0x0E141B, 0x475569);
            else if (crit) bg(id(w_t75_card), night ? 0x080D13 : 0x1A1114, 0xEF4444);
            else bg(id(w_t75_card), C_CARD, C_BORDER);
            lv_obj_set_style_border_width(id(w_t75_card), crit ? 2 : 1, 0);
            show(id(w_t75_head), !stale);
            show(id(w_t75_link), !stale);
            show(id(w_t75_lost), stale);
            show(id(w_t75_frozen), stale && ever);
            col(id(w_t75_title), crit ? 0xEF4444 : C_TEXT);
            if (live) {
              txt(id(w_t75_link_l), "BLE Live • %us ago", (unsigned) ((now_ms - id(t75_stamp_ms)) / 1000));
              col(id(w_t75_link_l), C_CYAN); fill(id(w_t75_link_dot), C_CYAN);
            } else {
              txt(id(w_t75_lost_t), "%s", ever ? "BLUETOOTH LINK LOST" : "WAITING FOR BLUETOOTH LINK");
              if (id(t75_stamp) != 0)
                txt(id(w_t75_lost_s), "Showing values from %s • offline %s",
                    ESPTime::from_epoch_local(id(t75_stamp)).strftime("%-I:%M:%S").c_str(), ever ? a : "since boot");
              else
                txt(id(w_t75_lost_s), "No data from the controller since the panel started");
              if (ever) txt(id(w_t75_lost_pl), "STALE %s", as); else txt(id(w_t75_lost_pl), "NO DATA");
            }

            // ---- hero
            bg(id(w_t75_hero), crit ? 0x2D0E12 : (live ? C_CARD2 : 0x0E141B),
               crit ? 0xDC2626 : (live ? (night ? 0x131C26 : 0x243447) : 0x475569));
            if (std::isnan(temp)) txt(id(w_t75_temp), "--"); else txt(id(w_t75_temp), "%.1f", temp);
            col(id(w_t75_temp), stale ? 0x64748B : (crit ? 0xEF4444 : C_HEAD));
            lv_obj_set_style_text_decor(id(w_t75_temp), stale && !std::isnan(temp) ? LV_TEXT_DECOR_STRIKETHROUGH : LV_TEXT_DECOR_NONE, 0);
            col(id(w_t75_unit), stale ? 0x475569 : (crit ? 0xEF4444 : C_UNIT));
            lv_obj_update_layout(id(w_t75_temp));
            lv_obj_align_to(id(w_t75_unit), id(w_t75_temp), LV_ALIGN_OUT_RIGHT_BOTTOM, 8, -8);
            txt(id(w_t75_sp_k), "%s", compact || stale ? "Target:" : "Setpoint:");
            if (std::isnan(sp)) txt(id(w_t75_sp_v), "--"); else txt(id(w_t75_sp_v), "%.1f °F", sp);
            if (stale) txt(id(w_t75_sp_s), "(Unknown)");
            else if (crit && !std::isnan(temp) && !std::isnan(sp)) txt(id(w_t75_sp_s), "(%+.1f° %s)", temp - sp, temp < sp ? "Deficit" : "Over");
            else if (std::isnan(swing)) txt(id(w_t75_sp_s), ""); else txt(id(w_t75_sp_s), "(±%.1f°)", swing);
            col(id(w_t75_sp_k), stale ? 0x64748B : C_TEXT);
            col(id(w_t75_sp_v), stale ? 0x64748B : (crit ? 0xEF4444 : C_CYAN));
            col(id(w_t75_sp_s), crit ? 0xEF4444 : 0x64748B);
            bg(id(w_t75_sp), C_CARD, crit ? 0xEF4444 : (night ? 0x131C26 : 0x334155));
            {
              const float tb = id(t75_temp_b), g = id(t75_grad);
              char pa[12], pb[12];
              if (std::isnan(temp)) snprintf(pa, sizeof(pa), "--"); else snprintf(pa, sizeof(pa), "%.1f°", temp);
              if (std::isnan(tb)) snprintf(pb, sizeof(pb), "--"); else snprintf(pb, sizeof(pb), "%.1f°", tb);
              if (stale) txt(id(w_t75_probes), "Dual Probe • Stale");
              else txt(id(w_t75_probes), "A: %s  •  B: %s  •", pa, pb);
              show(id(w_t75_grad), !stale);
              if (std::isnan(g)) txt(id(w_t75_grad_l), "Δ --"); else txt(id(w_t75_grad_l), "Δ %+.1f °F", g);
              col(id(w_t75_grad_l), crit ? 0xEF4444 : C_CYAN);
              bg(id(w_t75_grad), C_CARD, crit ? 0xDC2626 : (night ? 0x131C26 : 0x0284C7));
            }
            col(id(w_t75_probes), stale ? 0x64748B : (crit ? 0xEF4444 : C_LABEL));
            if (stale) { txt(id(w_t75_drift), "Drift: -- °F/min (Frozen)"); col(id(w_t75_drift), 0xFBBF24); }
            else if (std::isnan(dr)) txt(id(w_t75_drift), "");
            else {
              const bool falling = dr < -0.02f, rising = dr > 0.02f;
              const char *arrow = dr < -0.005f ? "↘" : (dr > 0.005f ? "↗" : "→");
              if (crit && falling) txt(id(w_t75_drift), "%s %+.2f °F/min (RAPID FALL)", arrow, dr);
              else txt(id(w_t75_drift), "%s %+.2f °F/min (%s)", arrow, dr, falling ? "Falling" : (rising ? "Rising" : "Stable"));
              col(id(w_t75_drift), crit && falling ? 0xEF4444 : (night ? 0x366B56 : (dr < -0.005f ? 0x94A3B8 : 0x10B981)));
            }

            // ---- heater / fan tiles
            {
              const float h = id(t75_heat), f = id(t75_fan);
              const bool hon = id(t75_heat_on), fon = id(t75_fan_on);
              const bool hstall = crit && hon && h >= 99.0f && !std::isnan(dr) && dr < 0;
              if (stale) {
                txt(id(w_t75_heat_cap), "HEATER DUTY"); txt(id(w_t75_fan_cap), "FAN DUTY");
                txt(id(w_t75_heat_val), "--%% (UNKNOWN)"); txt(id(w_t75_fan_val), "--%% (UNKNOWN)");
                col(id(w_t75_heat_val), 0xFBBF24); col(id(w_t75_fan_val), 0xFBBF24);
                col(id(w_t75_heat_cap), 0x94A3B8); col(id(w_t75_fan_cap), 0x94A3B8);
                bg(id(w_t75_heat), 0x0E141B, 0x334155); bg(id(w_t75_fan), 0x0E141B, 0x334155);
                show(id(w_t75_heat_i), false); show(id(w_t75_fan_i), false);
                show(id(w_t75_heat_bar), false); show(id(w_t75_fan_bar), false);
              } else {
                show(id(w_t75_heat_i), true); show(id(w_t75_fan_i), true);
                show(id(w_t75_heat_bar), true); show(id(w_t75_fan_bar), true);
                txt(id(w_t75_heat_cap), "%s", hstall ? "HEATER (STALLED)" : (hon ? "HEATER (DEMAND ON)" : "HEATER (IDLE)"));
                if (hstall) txt(id(w_t75_heat_val), "%.0f%% • NO HEAT", h);
                else if (hon) txt(id(w_t75_heat_val), "%.0f%% Duty", std::isnan(h) ? 0.0f : h);
                else txt(id(w_t75_heat_val), "%.0f%% Duty (OFF)", std::isnan(h) ? 0.0f : h);
                col(id(w_t75_heat_cap), hstall ? 0xEF4444 : (hon ? 0xFB923C : C_LABEL));
                col(id(w_t75_heat_val), hstall ? 0xEF4444 : (hon ? (night ? 0xB47834 : 0xFB923C) : C_TEXT));
                bg(id(w_t75_heat), hstall ? 0x3B1216 : (hon ? (night ? 0x150E0A : 0x261711) : C_CARD3),
                   hstall ? 0xEF4444 : (hon ? (night ? 0x7D5627 : 0xEA580C) : C_BORDER));
                col(id(w_t75_heat_i), hstall ? 0xEF4444 : (hon ? 0xFB923C : 0x64748B));
                txt(id(w_t75_fan_cap), "%s", fon ? "COOLING FAN (ON)" : "COOLING FAN");
                if (fon) txt(id(w_t75_fan_val), "%.0f%% Duty", std::isnan(f) ? 0.0f : f);
                else txt(id(w_t75_fan_val), "%.0f%% Duty (OFF)", std::isnan(f) ? 0.0f : f);
                col(id(w_t75_fan_cap), fon ? 0x38BDF8 : C_LABEL);
                col(id(w_t75_fan_val), C_TEXT);
                bg(id(w_t75_fan), fon ? 0x0C4A6E : C_CARD3, fon ? 0x0284C7 : C_BORDER);
                col(id(w_t75_fan_i), fon ? 0x38BDF8 : 0x64748B);
              }
              lv_bar_set_value(id(w_t75_heat_bar), live && !std::isnan(h) ? (int) h : 0, LV_ANIM_OFF);
              lv_bar_set_value(id(w_t75_fan_bar), live && !std::isnan(f) ? (int) f : 0, LV_ANIM_OFF);
            }

            // ---- TDS / pH tiles and detail cards
            {
              const float tds = id(t75_tds), tm = id(t75_tds_mean);
              const float lo = 200.0f, hi = 225.0f, al = 260.0f, mx = 300.0f;
              const float jv = std::isnan(tm) ? tds : tm;
              const int tj = judge(jv, lo, hi, al, 15.0f);
              const uint32_t tcol = tj < 0 ? 0x94A3B8 : J_COL[tj];
              const char *TJ[] = {"In Target Band", "Above Target", "Above Alert"};
              txt(id(w_t75_tds_cap), "%s", stale ? "TDS (CACHED)" : "TDS (PURITY)");
              if (std::isnan(tds)) txt(id(w_t75_tds_val), "--"); else txt(id(w_t75_tds_val), "%.0f", tds);
              col(id(w_t75_tds_val), stale ? 0x64748B : C_TEXT);
              lv_obj_update_layout(id(w_t75_tds_val));
              lv_obj_align_to(id(w_t75_tds_unit), id(w_t75_tds_val), LV_ALIGN_OUT_RIGHT_BOTTOM, 6, -5);
              if (stale) { txt(id(w_t75_tds_tgt), "STALE"); col(id(w_t75_tds_tgt), 0xFBBF24); }
              else {
                if (compact) txt(id(w_t75_tds_tgt), "%s", tj == 0 ? "In Target" : (tj > 0 ? TJ[tj] : ""));
                else if (std::isnan(lo)) txt(id(w_t75_tds_tgt), "Target: < %.0f", hi);
                else txt(id(w_t75_tds_tgt), "Band: %.0f–%.0f", lo, hi);
                col(id(w_t75_tds_tgt), compact && tj >= 0 ? tcol : C_LABEL);
              }
              if (std::isnan(tm)) txt(id(w_t75_tds_side), ""); else txt(id(w_t75_tds_side), "1h avg: %.0f", tm);
              col(id(w_t75_tds_side), stale ? 0x64748B : C_CYAN);
              range(id(w_t75_tds_trk), id(w_t75_tds_trk_band), id(w_t75_tds_trk_mark), live ? jv : NAN,
                    lo, hi, 150.0f, 320.0f, tcol);
              // detail
              if (std::isnan(tds)) txt(id(w_t75_d_tds), "--"); else txt(id(w_t75_d_tds), "%.0f", tds);
              col(id(w_t75_d_tds), stale ? 0x64748B : 0xF8FAFC);
              lv_obj_update_layout(id(w_t75_d_tds));
              lv_obj_align_to(id(w_t75_d_tds_u), id(w_t75_d_tds), LV_ALIGN_OUT_RIGHT_BOTTOM, 8, -6);
              if (std::isnan(tm)) txt(id(w_t75_d_tds_m), ""); else txt(id(w_t75_d_tds_m), "1h Mean: %.0f ppm", tm);
              txt(id(w_t75_d_tds_st), "%s", stale ? "Stale" : (tj < 0 ? "" : TJ[tj]));
              col(id(w_t75_d_tds_st), stale ? 0xFBBF24 : tcol);
              if (std::isnan(lo)) txt(id(w_t75_d_tds_t1), "Target: < %.0f ppm", hi);
              else txt(id(w_t75_d_tds_t1), "Target: %.0f–%.0f ppm", lo, hi);
              txt(id(w_t75_d_tds_t2), "Alert: %.0f", al);
              if (std::isnan(mx)) txt(id(w_t75_d_tds_t3), "%s", ""); else txt(id(w_t75_d_tds_t3), "Max: %.0f", mx);
              range(id(w_t75_d_tds_trk), id(w_t75_d_tds_trk_band), id(w_t75_d_tds_trk_mark), live ? jv : NAN,
                    lo, hi, 150.0f, 320.0f, tcol);

              const float ph = id(t75_ph);
              const bool ph_live = id(t75_ph_ms) != 0 && now_ms - id(t75_ph_ms) < 3600000;
              const float plo = 7.0f, phi = 7.5f;
              const int pj = judge(ph, plo, phi, NAN, 0.15f);
              const uint32_t pcol = pj < 0 ? 0x94A3B8 : J_COL[pj];
              const char *PJ[] = {"Optimal", "Near Band", "Out of Band"};
              if (!ph_live && !std::isnan(ph)) txt(id(w_t75_ph_cap), "%s", "WATER PH (CACHED)");
              else txt(id(w_t75_ph_cap), "%s", "WATER PH");
              if (std::isnan(ph)) txt(id(w_t75_ph_val), "--"); else txt(id(w_t75_ph_val), "%.2f", ph);
              col(id(w_t75_ph_val), ph_live ? C_TEXT : 0x64748B);
              lv_obj_update_layout(id(w_t75_ph_val));
              lv_obj_align_to(id(w_t75_ph_unit), id(w_t75_ph_val), LV_ALIGN_OUT_RIGHT_BOTTOM, 6, -5);
              if (!ph_live && !std::isnan(ph)) { txt(id(w_t75_ph_tgt), "STALE"); col(id(w_t75_ph_tgt), 0xFBBF24); }
              else {
                if (compact) txt(id(w_t75_ph_tgt), "%s", pj < 0 ? "" : PJ[pj]);
                else txt(id(w_t75_ph_tgt), "Target: %.1f–%.1f", plo, phi);
                col(id(w_t75_ph_tgt), compact && pj >= 0 ? pcol : C_LABEL);
              }
              if (!ph_live) { txt(id(w_t75_ph_side), "%s", std::isnan(ph) ? "" : "Wi-Fi Link Stale"); col(id(w_t75_ph_side), 0x64748B); }
              else if (compact) { txt(id(w_t75_ph_side), "Target %.1f–%.1f", plo, phi); col(id(w_t75_ph_side), pj > 0 ? pcol : C_LABEL); }
              else { txt(id(w_t75_ph_side), "%s", pj < 0 ? "" : PJ[pj]); col(id(w_t75_ph_side), night && pj == 0 ? 0x366B56 : pcol); }
              range(id(w_t75_ph_trk), id(w_t75_ph_trk_band), id(w_t75_ph_trk_mark), ph_live ? ph : NAN,
                    plo, phi, 6.8f, 7.8f, pcol);
              if (std::isnan(ph)) txt(id(w_t75_d_ph), "--"); else txt(id(w_t75_d_ph), "%.2f", ph);
              col(id(w_t75_d_ph), ph_live ? 0xF8FAFC : 0x64748B);
              lv_obj_update_layout(id(w_t75_d_ph));
              lv_obj_align_to(id(w_t75_d_ph_u), id(w_t75_d_ph), LV_ALIGN_OUT_RIGHT_BOTTOM, 8, -6);
              txt(id(w_t75_d_ph_st), "%s", ph_live ? (pj < 0 ? "" : PJ[pj]) : (std::isnan(ph) ? "No data" : "Stale"));
              col(id(w_t75_d_ph_st), ph_live ? pcol : 0xFBBF24);
              txt(id(w_t75_d_ph_tgt), "Target: %.2f – %.2f", plo, phi);
              txt(id(w_t75_d_ph_t1), "Min: %.2f", 6.8f);
              txt(id(w_t75_d_ph_t2), "Target Band: %.2f – %.2f", plo, phi);
              txt(id(w_t75_d_ph_t3), "Max: %.2f", 7.8f);
              range(id(w_t75_d_ph_trk), id(w_t75_d_ph_trk_band), id(w_t75_d_ph_trk_mark), ph_live ? ph : NAN,
                    plo, phi, 6.8f, 7.8f, pcol);
              bg(id(w_t75_tds), stale ? 0x0E141B : C_CARD3, stale ? 0x334155 : C_BORDER);
              bg(id(w_t75_ph), (stale && !ph_live) ? 0x0E141B : C_CARD3, (stale && !ph_live) ? 0x334155 : C_BORDER);
            }

            // ---- footer + detail info card
            {
              const float lux = id(t75_lux);
              const int co2 = id(ha_co2_t75), bub = id(ha_bubbler_t75);
              const float conf = id(t75_conf);
              const bool dark = live && !std::isnan(lux) && lux < 18.0f;
              if (!live || std::isnan(lux)) txt(id(w_t75_f_lux), "-- lux");
              else if (dark) txt(id(w_t75_f_lux), "%s", "Lights Off");
              else txt(id(w_t75_f_lux), "%.0f lux", lux);
              lv_label_set_text(id(w_t75_fi_lux), dark ? "󰖔" : "󰖙");
              col(id(w_t75_fi_lux), night ? 0x506173 : 0xFBBF24);
              col(id(w_t75_f_lux), C_LABEL);
              txt(id(w_t75_f_co2), "CO2 %s", co2 < 0 ? "--" : (co2 ? "On" : "Off"));
              col(id(w_t75_f_co2), co2 == 1 ? C_CYAN : C_LABEL); col(id(w_t75_fi_co2), co2 == 1 ? C_CYAN : 0x64748B);
              txt(id(w_t75_f_bub), "Bubbler %s", bub < 0 ? "--" : (bub ? "On" : "Off"));
              col(id(w_t75_f_bub), bub == 1 ? C_CYAN : C_LABEL); col(id(w_t75_fi_bub), bub == 1 ? C_CYAN : 0x64748B);
              if (stale) { txt(id(w_t75_f_model), "BLE Down"); col(id(w_t75_f_model), 0xFBBF24); col(id(w_t75_fi_model), 0xFBBF24); }
              else if (id(t75_fault)) { txt(id(w_t75_f_model), "Safety Tripped"); col(id(w_t75_f_model), 0xEF4444); col(id(w_t75_fi_model), 0xEF4444); }
              else if (std::isnan(conf)) { txt(id(w_t75_f_model), "Model --"); col(id(w_t75_f_model), C_LABEL); }
              else { txt(id(w_t75_f_model), "Model %.0f%%", conf); col(id(w_t75_f_model), conf < 70 ? 0xFBBF24 : C_LABEL); col(id(w_t75_fi_model), conf < 70 ? 0xFBBF24 : 0x64748B); }
              show(id(w_t75_details), !stale);
              show(id(w_t75_reconn), stale && ever);
              bg(id(w_t75_details), crit ? 0x3B1216 : (night ? 0x0A1118 : 0x1E293B), crit ? 0xDC2626 : (night ? 0x131C26 : 0x334155));
              fill(id(w_t75_sep), C_BORDER);

              if (!live || std::isnan(lux)) txt(id(w_t75_d_lux), "-- lux");
              else if (dark) txt(id(w_t75_d_lux), "%.0f lux (Lights Off)", lux);
              else txt(id(w_t75_d_lux), "%.0f lux", lux);
              auto dawn = id(sun_pa).sunrise(-6.0); auto dusk = id(sun_pa).sunset(-6.0);
              if (dawn.has_value() && dusk.has_value())
                txt(id(w_t75_d_sun), "Civil Dawn (%s) – Dusk (%s)", dawn->strftime("%-I:%M").c_str(), dusk->strftime("%-I:%M").c_str());
              txt(id(w_t75_d_co2), "%s", co2 < 0 ? "--" : (co2 ? "ON" : "OFF"));
              col(id(w_t75_d_co2), co2 == 1 ? 0x38BDF8 : 0xF8FAFC);
              // Schedule notes from Home Assistant: "(Schedule off)", "(7:31–3:10)".
              const std::string &cn = id(ha_co2_note_t75), &bn = id(ha_bubbler_note_t75);
              if (cn.empty()) txt(id(w_t75_d_co2_n), "%s", ""); else txt(id(w_t75_d_co2_n), "(%s)", cn.c_str());
              if (bn.empty()) txt(id(w_t75_d_bub), "Bubbler: %s", bub < 0 ? "--" : (bub ? "ON" : "OFF"));
              else txt(id(w_t75_d_bub), "Bubbler: %s (%s)", bub < 0 ? "--" : (bub ? "ON" : "OFF"), bn.c_str());
              col(id(w_t75_d_bub), bub == 1 ? 0x10B981 : 0x94A3B8);
              lv_label_set_text(id(w_t75_d_bub_i), bub == 1 ? "󰗡" : "󰍷");
              col(id(w_t75_d_bub_i), bub == 1 ? 0x10B981 : 0x94A3B8);
              if (!live) { txt(id(w_t75_d_safe2), "Safety Tripped: --"); col(id(w_t75_d_safe2), 0x94A3B8); }
              else { txt(id(w_t75_d_safe2), "Safety Tripped: %s", id(t75_fault) ? "YES" : "NO"); col(id(w_t75_d_safe2), id(t75_fault) ? 0xEF4444 : 0x10B981); }
              if (live) txt(id(w_t75_d_ctrl), "Controller BLE: Live (%s ago)", as);
              else txt(id(w_t75_d_ctrl), "Controller BLE: Down (%s)", ever ? as : "no data yet");
            }

            // ---- detail header, setpoint, probes, actuators
            {
              if (live) txt(id(w_t75_d_link_l), "BLE Live • %s ago", as);
              else txt(id(w_t75_d_link_l), "BLE Down • %s", ever ? a : "no data yet");
              col(id(w_t75_d_link_l), live ? 0x38BDF8 : 0xFBBF24); fill(id(w_t75_d_link_dot), live ? 0x38BDF8 : 0xFBBF24);
              if (!live) txt(id(w_t75_d_safety_l), "SAFETY: UNKNOWN (LINK DOWN)");
              else txt(id(w_t75_d_safety_l), "%s", id(t75_fault) ? "SAFETY TRIPPED: YES" : "SAFETY TRIPPED: NO (NORMAL)");
              const uint32_t sc = !live ? 0xFBBF24 : (id(t75_fault) ? 0xEF4444 : 0x10B981);
              col(id(w_t75_d_safety_l), sc); col(id(w_t75_d_safety_i), sc);
              bg(id(w_t75_d_safety), !live ? 0x291B07 : (id(t75_fault) ? 0x2D0E12 : 0x0F291E),
                 !live ? 0xD97706 : (id(t75_fault) ? 0xDC2626 : 0x059669));
              const float shown = std::isnan(id(t75_sp_pending)) ? sp : id(t75_sp_pending);
              if (std::isnan(shown)) txt(id(w_t75_d_sp), "--"); else txt(id(w_t75_d_sp), "%.1f", shown);
              col(id(w_t75_d_sp), std::isnan(id(t75_sp_pending)) ? 0xF8FAFC : 0xFBBF24);
              if (!std::isnan(id(t75_sp_pending))) txt(id(w_t75_d_band), "Sending to controller…");
              else if (std::isnan(sp) || std::isnan(swing)) txt(id(w_t75_d_band), "%s", "");
              else txt(id(w_t75_d_band), "Control Band: %.1f° – %.1f°F", sp - swing, sp + swing);
              if (std::isnan(swing)) txt(id(w_t75_d_swing_l), "SWING --"); else txt(id(w_t75_d_swing_l), "SWING ±%.1f °F", swing);
              const float conf = id(t75_conf);
              if (std::isnan(conf)) txt(id(w_t75_d_conf), "Confidence: --");
              else txt(id(w_t75_d_conf), "Confidence: %.0f%%", conf);
              const bool ln = id(t75_learn);
              txt(id(w_t75_learn_l), "%s", ln ? "LEARNING ON" : "LEARNING OFF");
              col(id(w_t75_learn_l), ln ? 0x10B981 : 0x94A3B8);
              bg(id(w_t75_learn), ln ? 0x0F291E : 0x1E293B, ln ? 0x059669 : 0x334155);
              if (std::isnan(temp)) txt(id(w_t75_d_pa), "--"); else txt(id(w_t75_d_pa), "%.1f", temp);
              col(id(w_t75_d_pa), live ? 0xF8FAFC : 0x64748B);
              lv_obj_update_layout(id(w_t75_d_pa));
              lv_obj_align_to(id(w_t75_d_pa_u), id(w_t75_d_pa), LV_ALIGN_OUT_RIGHT_BOTTOM, 6, -5);
              {
                const float tb = id(t75_temp_b), g = id(t75_grad);
                if (std::isnan(tb)) txt(id(w_t75_d_pb), "--"); else txt(id(w_t75_d_pb), "%.1f", tb);
                col(id(w_t75_d_pb), live ? 0xF8FAFC : 0x64748B);
                lv_obj_update_layout(id(w_t75_d_pb));
                lv_obj_align_to(id(w_t75_d_pb_u), id(w_t75_d_pb), LV_ALIGN_OUT_RIGHT_BOTTOM, 6, -5);
                if (std::isnan(g)) txt(id(w_t75_d_grad), "--"); else txt(id(w_t75_d_grad), "%+.2f °F", g);
                if (!live || std::isnan(dr)) txt(id(w_t75_d_drift), "%s", "");
                else txt(id(w_t75_d_drift), "%s %+.2f °F/min Drift", dr < -0.005f ? "↘" : (dr > 0.005f ? "↗" : "→"), dr);
              }
              const float h = id(t75_heat), f = id(t75_fan);
              const bool hon = id(t75_heat_on), fon = id(t75_fan_on);
              txt(id(w_t75_d_heat_cap), "%s", hon ? "HEATER DEMAND: ON" : "HEATER DEMAND: OFF");
              col(id(w_t75_d_heat_cap), hon ? 0xFB923C : 0x94A3B8);
              if (!live || std::isnan(h)) { txt(id(w_t75_d_heat_pct), "--"); txt(id(w_t75_d_heat_sub), "Duty Cycle: --"); }
              else { txt(id(w_t75_d_heat_pct), "%.0f%%", h); if (hon) txt(id(w_t75_d_heat_sub), "Duty Cycle: %.0f%%", h); else txt(id(w_t75_d_heat_sub), "Duty Cycle: %.0f%% (Idle)", h); }
              col(id(w_t75_d_heat_pct), hon ? 0xFB923C : 0x94A3B8);
              bg(id(w_t75_d_heat), hon ? 0x261711 : 0x16202C, hon ? 0xEA580C : 0x223142);
              col(id(w_t75_d_heat_i), hon ? 0xFB923C : 0x64748B);
              lv_bar_set_value(id(w_t75_d_heat_bar), live && !std::isnan(h) ? (int) h : 0, LV_ANIM_OFF);
              txt(id(w_t75_d_fan_cap), "%s", fon ? "COOLING FAN DEMAND: ON" : "COOLING FAN DEMAND: OFF");
              col(id(w_t75_d_fan_cap), fon ? 0x38BDF8 : 0x94A3B8);
              if (!live || std::isnan(f)) { txt(id(w_t75_d_fan_pct), "--"); txt(id(w_t75_d_fan_sub), "Duty Cycle: --"); }
              else { txt(id(w_t75_d_fan_pct), "%.0f%%", f); if (fon) txt(id(w_t75_d_fan_sub), "Duty Cycle: %.0f%%", f); else txt(id(w_t75_d_fan_sub), "Duty Cycle: %.0f%% (Idle)", f); }
              col(id(w_t75_d_fan_pct), fon ? 0x38BDF8 : 0x94A3B8);
              bg(id(w_t75_d_fan), fon ? 0x0C4A6E : 0x16202C, fon ? 0x0284C7 : 0x223142);
              col(id(w_t75_d_fan_i), fon ? 0x38BDF8 : 0x64748B);
              lv_bar_set_value(id(w_t75_d_fan_bar), live && !std::isnan(f) ? (int) f : 0, LV_ANIM_OFF);
            }
          }

          // =========================================================== tank t16
          {
            const bool live = id(t16_stamp_ms) != 0 && now_ms - id(t16_stamp_ms) < 45000;
            const bool ever = id(t16_stamp_ms) != 0;
            const bool stale = !live;
            const float temp = id(t16_temp), sp = id(t16_sp), swing = id(t16_swing), dr = id(t16_drift);
            const bool crit = live && (id(t16_fault) ||
                              (!std::isnan(temp) && !std::isnan(sp) && fabsf(temp - sp) > 2.0f));
            char a[16]; age(now_ms - id(t16_stamp_ms), a, sizeof(a));
            char as[12]; age_short(now_ms - id(t16_stamp_ms), as, sizeof(as));

            // ---- layout: normal, or compact under the alert banner
            {
              static int last = -1;
              if (last != (int) compact) {
                last = compact;
                if (compact) {
                  lv_obj_set_pos(id(w_t16_card), 518, 122); lv_obj_set_height(id(w_t16_card), 356);
                  lv_obj_set_y(id(w_t16_head), 8); lv_obj_set_y(id(w_t16_link), 12);
                  lv_obj_set_y(id(w_t16_lost), 8);
                  lv_obj_set_y(id(w_t16_hero), 48); lv_obj_set_height(id(w_t16_hero), 80);
                  lv_obj_set_y(id(w_t16_frozen), 39);
                  for (lv_obj_t *o : {id(w_t16_heat), id(w_t16_fan)}) { lv_obj_set_y(o, 138); lv_obj_set_height(o, 52); }
                  for (lv_obj_t *o : {id(w_t16_tds), id(w_t16_ph)}) { lv_obj_set_y(o, 200); lv_obj_set_height(o, 80); }
                  lv_obj_set_y(id(w_t16_tds_trk), 62); lv_obj_set_y(id(w_t16_ph_trk), 62);
                  lv_obj_set_y(id(w_t16_sep), 292); lv_obj_set_y(id(w_t16_foot), 300);
                  lv_obj_set_y(id(w_t16_details), 304); lv_obj_set_y(id(w_t16_reconn), 314);
                } else {
                  lv_obj_set_pos(id(w_t16_card), 518, 66); lv_obj_set_height(id(w_t16_card), 406);
                  lv_obj_set_y(id(w_t16_head), 12); lv_obj_set_y(id(w_t16_link), 16);
                  lv_obj_set_y(id(w_t16_lost), 10);
                  lv_obj_set_y(id(w_t16_hero), 64); lv_obj_set_height(id(w_t16_hero), 92);
                  lv_obj_set_y(id(w_t16_frozen), 55);
                  for (lv_obj_t *o : {id(w_t16_heat), id(w_t16_fan)}) { lv_obj_set_y(o, 178); lv_obj_set_height(o, 52); }
                  for (lv_obj_t *o : {id(w_t16_tds), id(w_t16_ph)}) { lv_obj_set_y(o, 248); lv_obj_set_height(o, 84); }
                  lv_obj_set_y(id(w_t16_tds_trk), 66); lv_obj_set_y(id(w_t16_ph_trk), 66);
                  lv_obj_set_y(id(w_t16_sep), 350); lv_obj_set_y(id(w_t16_foot), 358);
                  lv_obj_set_y(id(w_t16_details), 355); lv_obj_set_y(id(w_t16_reconn), 370);
                }
              }
            }

            // ---- card frame and header
            if (stale) bg(id(w_t16_card), night ? 0x080D13 : 0x0E141B, 0x475569);
            else if (crit) bg(id(w_t16_card), night ? 0x080D13 : 0x1A1114, 0xEF4444);
            else bg(id(w_t16_card), C_CARD, C_BORDER);
            lv_obj_set_style_border_width(id(w_t16_card), crit ? 2 : 1, 0);
            show(id(w_t16_head), !stale);
            show(id(w_t16_link), !stale);
            show(id(w_t16_lost), stale);
            show(id(w_t16_frozen), stale && ever);
            col(id(w_t16_title), crit ? 0xEF4444 : C_TEXT);
            if (live) {
              txt(id(w_t16_link_l), "BLE Live • %us ago", (unsigned) ((now_ms - id(t16_stamp_ms)) / 1000));
              col(id(w_t16_link_l), C_CYAN); fill(id(w_t16_link_dot), C_CYAN);
            } else {
              txt(id(w_t16_lost_t), "%s", ever ? "BLUETOOTH LINK LOST" : "WAITING FOR BLUETOOTH LINK");
              if (id(t16_stamp) != 0)
                txt(id(w_t16_lost_s), "Showing values from %s • offline %s",
                    ESPTime::from_epoch_local(id(t16_stamp)).strftime("%-I:%M:%S").c_str(), ever ? a : "since boot");
              else
                txt(id(w_t16_lost_s), "No data from the controller since the panel started");
              if (ever) txt(id(w_t16_lost_pl), "STALE %s", as); else txt(id(w_t16_lost_pl), "NO DATA");
            }

            // ---- hero
            bg(id(w_t16_hero), crit ? 0x2D0E12 : (live ? C_CARD2 : 0x0E141B),
               crit ? 0xDC2626 : (live ? (night ? 0x131C26 : 0x243447) : 0x475569));
            if (std::isnan(temp)) txt(id(w_t16_temp), "--"); else txt(id(w_t16_temp), "%.1f", temp);
            col(id(w_t16_temp), stale ? 0x64748B : (crit ? 0xEF4444 : C_HEAD));
            lv_obj_set_style_text_decor(id(w_t16_temp), stale && !std::isnan(temp) ? LV_TEXT_DECOR_STRIKETHROUGH : LV_TEXT_DECOR_NONE, 0);
            col(id(w_t16_unit), stale ? 0x475569 : (crit ? 0xEF4444 : C_UNIT));
            lv_obj_update_layout(id(w_t16_temp));
            lv_obj_align_to(id(w_t16_unit), id(w_t16_temp), LV_ALIGN_OUT_RIGHT_BOTTOM, 8, -8);
            txt(id(w_t16_sp_k), "%s", compact || stale ? "Target:" : "Setpoint:");
            if (std::isnan(sp)) txt(id(w_t16_sp_v), "--"); else txt(id(w_t16_sp_v), "%.1f °F", sp);
            if (stale) txt(id(w_t16_sp_s), "(Unknown)");
            else if (crit && !std::isnan(temp) && !std::isnan(sp)) txt(id(w_t16_sp_s), "(%+.1f° %s)", temp - sp, temp < sp ? "Deficit" : "Over");
            else if (std::isnan(swing)) txt(id(w_t16_sp_s), ""); else txt(id(w_t16_sp_s), "(±%.1f°)", swing);
            col(id(w_t16_sp_k), stale ? 0x64748B : C_TEXT);
            col(id(w_t16_sp_v), stale ? 0x64748B : (crit ? 0xEF4444 : C_CYAN));
            col(id(w_t16_sp_s), crit ? 0xEF4444 : 0x64748B);
            bg(id(w_t16_sp), C_CARD, crit ? 0xEF4444 : (night ? 0x131C26 : 0x334155));
            txt(id(w_t16_probes), "%s", stale ? "Single Probe • Stale" : "Single Probe Active");
            col(id(w_t16_probes), stale ? 0x64748B : (crit ? 0xEF4444 : C_LABEL));
            if (stale) { txt(id(w_t16_drift), "Drift: -- °F/min (Frozen)"); col(id(w_t16_drift), 0xFBBF24); }
            else if (std::isnan(dr)) txt(id(w_t16_drift), "");
            else {
              const bool falling = dr < -0.02f, rising = dr > 0.02f;
              const char *arrow = dr < -0.005f ? "↘" : (dr > 0.005f ? "↗" : "→");
              if (crit && falling) txt(id(w_t16_drift), "%s %+.2f °F/min (RAPID FALL)", arrow, dr);
              else txt(id(w_t16_drift), "%s %+.2f °F/min (%s)", arrow, dr, falling ? "Falling" : (rising ? "Rising" : "Stable"));
              col(id(w_t16_drift), crit && falling ? 0xEF4444 : (night ? 0x366B56 : (dr < -0.005f ? 0x94A3B8 : 0x10B981)));
            }

            // ---- heater / fan tiles
            {
              const float h = id(t16_heat), f = id(t16_fan);
              const bool hon = id(t16_heat_on), fon = id(t16_fan_on);
              const bool hstall = crit && hon && h >= 99.0f && !std::isnan(dr) && dr < 0;
              if (stale) {
                txt(id(w_t16_heat_cap), "HEATER DUTY"); txt(id(w_t16_fan_cap), "FAN DUTY");
                txt(id(w_t16_heat_val), "--%% (UNKNOWN)"); txt(id(w_t16_fan_val), "--%% (UNKNOWN)");
                col(id(w_t16_heat_val), 0xFBBF24); col(id(w_t16_fan_val), 0xFBBF24);
                col(id(w_t16_heat_cap), 0x94A3B8); col(id(w_t16_fan_cap), 0x94A3B8);
                bg(id(w_t16_heat), 0x0E141B, 0x334155); bg(id(w_t16_fan), 0x0E141B, 0x334155);
                show(id(w_t16_heat_i), false); show(id(w_t16_fan_i), false);
                show(id(w_t16_heat_bar), false); show(id(w_t16_fan_bar), false);
              } else {
                show(id(w_t16_heat_i), true); show(id(w_t16_fan_i), true);
                show(id(w_t16_heat_bar), true); show(id(w_t16_fan_bar), true);
                txt(id(w_t16_heat_cap), "%s", hstall ? "HEATER (STALLED)" : (hon ? "HEATER (DEMAND ON)" : "HEATER (IDLE)"));
                if (hstall) txt(id(w_t16_heat_val), "%.0f%% • NO HEAT", h);
                else if (hon) txt(id(w_t16_heat_val), "%.0f%% Duty", std::isnan(h) ? 0.0f : h);
                else txt(id(w_t16_heat_val), "%.0f%% Duty (OFF)", std::isnan(h) ? 0.0f : h);
                col(id(w_t16_heat_cap), hstall ? 0xEF4444 : (hon ? 0xFB923C : C_LABEL));
                col(id(w_t16_heat_val), hstall ? 0xEF4444 : (hon ? (night ? 0xB47834 : 0xFB923C) : C_TEXT));
                bg(id(w_t16_heat), hstall ? 0x3B1216 : (hon ? (night ? 0x150E0A : 0x261711) : C_CARD3),
                   hstall ? 0xEF4444 : (hon ? (night ? 0x7D5627 : 0xEA580C) : C_BORDER));
                col(id(w_t16_heat_i), hstall ? 0xEF4444 : (hon ? 0xFB923C : 0x64748B));
                txt(id(w_t16_fan_cap), "%s", fon ? "COOLING FAN (ON)" : "COOLING FAN");
                if (fon) txt(id(w_t16_fan_val), "%.0f%% Duty", std::isnan(f) ? 0.0f : f);
                else txt(id(w_t16_fan_val), "%.0f%% Duty (OFF)", std::isnan(f) ? 0.0f : f);
                col(id(w_t16_fan_cap), fon ? 0x38BDF8 : C_LABEL);
                col(id(w_t16_fan_val), C_TEXT);
                bg(id(w_t16_fan), fon ? 0x0C4A6E : C_CARD3, fon ? 0x0284C7 : C_BORDER);
                col(id(w_t16_fan_i), fon ? 0x38BDF8 : 0x64748B);
              }
              lv_bar_set_value(id(w_t16_heat_bar), live && !std::isnan(h) ? (int) h : 0, LV_ANIM_OFF);
              lv_bar_set_value(id(w_t16_fan_bar), live && !std::isnan(f) ? (int) f : 0, LV_ANIM_OFF);
            }

            // ---- TDS / pH tiles and detail cards
            {
              const float tds = id(t16_tds), tm = id(t16_tds_mean);
              const float lo = 330.0f, hi = 390.0f, al = 410.0f, mx = NAN;
              const float jv = std::isnan(tm) ? tds : tm;
              const int tj = judge(jv, lo, hi, al, 15.0f);
              const uint32_t tcol = tj < 0 ? 0x94A3B8 : J_COL[tj];
              const char *TJ[] = {"In Target Band", "Above Target", "Above Alert"};
              txt(id(w_t16_tds_cap), "%s", stale ? "TDS (CACHED)" : "TDS (PURITY)");
              if (std::isnan(tds)) txt(id(w_t16_tds_val), "--"); else txt(id(w_t16_tds_val), "%.0f", tds);
              col(id(w_t16_tds_val), stale ? 0x64748B : C_TEXT);
              lv_obj_update_layout(id(w_t16_tds_val));
              lv_obj_align_to(id(w_t16_tds_unit), id(w_t16_tds_val), LV_ALIGN_OUT_RIGHT_BOTTOM, 6, -5);
              if (stale) { txt(id(w_t16_tds_tgt), "STALE"); col(id(w_t16_tds_tgt), 0xFBBF24); }
              else {
                if (compact) txt(id(w_t16_tds_tgt), "%s", tj == 0 ? "In Target" : (tj > 0 ? TJ[tj] : ""));
                else if (std::isnan(lo)) txt(id(w_t16_tds_tgt), "Target: < %.0f", hi);
                else txt(id(w_t16_tds_tgt), "Band: %.0f–%.0f", lo, hi);
                col(id(w_t16_tds_tgt), compact && tj >= 0 ? tcol : C_LABEL);
              }
              if (std::isnan(tm)) txt(id(w_t16_tds_side), ""); else txt(id(w_t16_tds_side), "1h avg: %.0f", tm);
              col(id(w_t16_tds_side), stale ? 0x64748B : C_CYAN);
              range(id(w_t16_tds_trk), id(w_t16_tds_trk_band), id(w_t16_tds_trk_mark), live ? jv : NAN,
                    lo, hi, 280.0f, 450.0f, tcol);
              // detail
              if (std::isnan(tds)) txt(id(w_t16_d_tds), "--"); else txt(id(w_t16_d_tds), "%.0f", tds);
              col(id(w_t16_d_tds), stale ? 0x64748B : 0xF8FAFC);
              lv_obj_update_layout(id(w_t16_d_tds));
              lv_obj_align_to(id(w_t16_d_tds_u), id(w_t16_d_tds), LV_ALIGN_OUT_RIGHT_BOTTOM, 8, -6);
              if (std::isnan(tm)) txt(id(w_t16_d_tds_m), ""); else txt(id(w_t16_d_tds_m), "1h Mean: %.0f ppm", tm);
              txt(id(w_t16_d_tds_st), "%s", stale ? "Stale" : (tj < 0 ? "" : TJ[tj]));
              col(id(w_t16_d_tds_st), stale ? 0xFBBF24 : tcol);
              if (std::isnan(lo)) txt(id(w_t16_d_tds_t1), "Target: < %.0f ppm", hi);
              else txt(id(w_t16_d_tds_t1), "Target: %.0f–%.0f ppm", lo, hi);
              txt(id(w_t16_d_tds_t2), "Alert: %.0f", al);
              if (std::isnan(mx)) txt(id(w_t16_d_tds_t3), "%s", ""); else txt(id(w_t16_d_tds_t3), "Max: %.0f", mx);
              range(id(w_t16_d_tds_trk), id(w_t16_d_tds_trk_band), id(w_t16_d_tds_trk_mark), live ? jv : NAN,
                    lo, hi, 280.0f, 450.0f, tcol);

              const float ph = id(t16_ph);
              const bool ph_live = id(t16_ph_ms) != 0 && now_ms - id(t16_ph_ms) < 3600000;
              const float plo = 7.0f, phi = 7.4f;
              const int pj = judge(ph, plo, phi, NAN, 0.15f);
              const uint32_t pcol = pj < 0 ? 0x94A3B8 : J_COL[pj];
              const char *PJ[] = {"Optimal", "Near Band", "Out of Band"};
              if (!ph_live && !std::isnan(ph)) txt(id(w_t16_ph_cap), "%s", "PH (WI-FI) (CACHED)");
              else txt(id(w_t16_ph_cap), "%s", "PH (WI-FI)");
              if (std::isnan(ph)) txt(id(w_t16_ph_val), "--"); else txt(id(w_t16_ph_val), "%.2f", ph);
              col(id(w_t16_ph_val), ph_live ? C_TEXT : 0x64748B);
              lv_obj_update_layout(id(w_t16_ph_val));
              lv_obj_align_to(id(w_t16_ph_unit), id(w_t16_ph_val), LV_ALIGN_OUT_RIGHT_BOTTOM, 6, -5);
              if (!ph_live && !std::isnan(ph)) { txt(id(w_t16_ph_tgt), "STALE"); col(id(w_t16_ph_tgt), 0xFBBF24); }
              else {
                if (compact) txt(id(w_t16_ph_tgt), "%s", pj < 0 ? "" : PJ[pj]);
                else txt(id(w_t16_ph_tgt), "Target: %.1f–%.1f", plo, phi);
                col(id(w_t16_ph_tgt), compact && pj >= 0 ? pcol : C_LABEL);
              }
              if (!ph_live) { txt(id(w_t16_ph_side), "%s", std::isnan(ph) ? "" : "Wi-Fi Link Stale"); col(id(w_t16_ph_side), 0x64748B); }
              else if (compact) { txt(id(w_t16_ph_side), "Target %.1f–%.1f", plo, phi); col(id(w_t16_ph_side), pj > 0 ? pcol : C_LABEL); }
              else { txt(id(w_t16_ph_side), "%s", pj < 0 ? "" : PJ[pj]); col(id(w_t16_ph_side), night && pj == 0 ? 0x366B56 : pcol); }
              range(id(w_t16_ph_trk), id(w_t16_ph_trk_band), id(w_t16_ph_trk_mark), ph_live ? ph : NAN,
                    plo, phi, 6.8f, 7.8f, pcol);
              if (std::isnan(ph)) txt(id(w_t16_d_ph), "--"); else txt(id(w_t16_d_ph), "%.2f", ph);
              col(id(w_t16_d_ph), ph_live ? 0xF8FAFC : 0x64748B);
              lv_obj_update_layout(id(w_t16_d_ph));
              lv_obj_align_to(id(w_t16_d_ph_u), id(w_t16_d_ph), LV_ALIGN_OUT_RIGHT_BOTTOM, 8, -6);
              txt(id(w_t16_d_ph_st), "%s", ph_live ? (pj < 0 ? "" : PJ[pj]) : (std::isnan(ph) ? "No data" : "Stale"));
              col(id(w_t16_d_ph_st), ph_live ? pcol : 0xFBBF24);
              txt(id(w_t16_d_ph_tgt), "Target: %.2f – %.2f", plo, phi);
              txt(id(w_t16_d_ph_t1), "Min: %.2f", 6.8f);
