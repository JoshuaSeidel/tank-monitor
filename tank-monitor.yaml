substitutions:
  device_name: tank-monitor
  friendly_name: Tank Monitor
  # --- Calibration ---
  # Target water temperature, in Celsius. Centre of the 74-75 F band:
  # 23.6 C = 74.5 F.
  target_temp: "23.6"

  # --- Display thresholds (all in the units shown on screen) ---
  # Green inside lo..hi, amber just outside, red beyond red_lo..red_hi.
  temp_lo: "74"
  temp_hi: "75"
  temp_red_lo: "73.5"
  temp_red_hi: "75.5"
  # Green also requires the tank to be *steady*: peak-to-peak swing over
  # the last hour must be under this, in F. Being briefly in-band while
  # swinging 3 F is not the same as holding temperature.
  temp_swing_max: "0.5"
  tds_lo: "180"
  tds_hi: "250"
  tds_red_lo: "150"
  tds_red_hi: "300"
  # Above this the tank lights count as on, and the top strip goes amber.
  light_on_lux: "50"
  # K-value for the TDS probe. 1.0 is the factory default.
  # Calibrate with a known solution (e.g. 707ppm / 1413us-cm standard).
  tds_k_factor: "1.0"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  variant: esp32c6
  flash_size: 4MB
  framework:
    type: esp-idf

external_components:
  # Pulled from git so this builds in the Home Assistant ESPHome add-on
  # with no local files. refresh: 0s because the ref is a moving branch --
  # the default caches for a day and you'd silently build stale code.
  - source:
      type: git
      url: https://github.com/JoshuaSeidel/tank-monitor
      ref: main
    components: [tank_controller]
    refresh: 0s

logger:
  level: INFO

# SNTP, not Home Assistant -- the learned light schedule needs a wall clock
# that keeps working when HA is down.
time:
  - platform: sntp
    id: sntp_time
    timezone: !secret timezone

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Fallback AP so the device is recoverable if Wi-Fi drops
  ap:
    ssid: "${device_name} setup"
    password: !secret tank_monitor_ap_password

captive_portal:

# OTA + a local web page for eyeballing live values
ota:
  - platform: esphome
    password: !secret tank_monitor_ota_password

web_server:
  port: 80
  version: 3

mqtt:
  broker: !secret mqtt_broker
  port: 1883
  username: !secret tank_monitor_mqtt_username
  password: !secret tank_monitor_mqtt_password
  discovery: true
  discovery_prefix: homeassistant
  topic_prefix: ${device_name}
  birth_message:
    topic: ${device_name}/status
    payload: online
  will_message:
    topic: ${device_name}/status
    payload: offline

# On-board 1.47" 172x320 ST7789V panel. `mipi_spi` rather than the plain
# st7789v driver: with a 90 degree rotation the older driver needs a full
# framebuffer and the C6 (512KB SRAM, no PSRAM) runs out of memory.
spi:
  clk_pin: GPIO7
  mosi_pin: GPIO6

display:
  - platform: mipi_spi
    id: tank_display
    # Board preset -- supplies cs/dc/reset pins, 34px offset and colour
    # inversion for this exact panel.
    model: WAVESHARE-ESP32-C6-LCD-1.47
    # 270, not 90: the board is mounted with the USB end the other way up.
    rotation: 270
    # 5s, not 1s: a full redraw of this panel takes ~470ms, and water
    # temperature does not change meaningfully in a second. Redrawing
    # every second spent half the CPU blocking on SPI for nothing.
    update_interval: 5s
    # The lambda paints every pixel itself (two full-width bars), so the
    # automatic clear before each frame is a wasted full-screen fill.
    auto_clear_enabled: false
    # Full framebuffer, 320*172*2 = 110kB. Without PSRAM, ESPHome
    # defaults to a ~20kB buffer and renders in stripes -- which means
    # running this lambda once *per stripe*, re-rasterising the 150px
    # font every pass. That was the ~470ms redraw. The C6 has the heap
    # for the whole frame, so draw it in one go.
    buffer_size: 100%
    # One screen, always on -- no page cycling. Temperature owns the top
    # two thirds, TDS the bottom third, and each zone's *background*
    # carries its own status colour so both read from across the room.
    lambda: |-
      // ---- temperature zone -------------------------------------------
      const float t = id(water_temp).state;
      const bool t_ok = !isnan(t);
      const float t_f = t_ok ? t * 9.0f / 5.0f + 32.0f : NAN;

      // Peak-to-peak swing over the last hour, converted to F. NAN for
      // the first ten minutes after a boot.
      const float swing_c = id(controller).get_swing();
      const float swing_f = isnan(swing_c) ? NAN : swing_c * 9.0f / 5.0f;
      const bool steady = isnan(swing_f) || swing_f <= ${temp_swing_max};

      Color t_bg = COLOR_GREEN;
      const char *t_label = "STEADY";
      if (!t_ok || id(controller).is_safety_tripped()) {
        t_bg = COLOR_RED;
        t_label = "PROBE FAULT";
      } else if (t_f < ${temp_red_lo} || t_f > ${temp_red_hi}) {
        t_bg = COLOR_RED;
        t_label = t_f < ${temp_lo} ? "TOO COLD" : "TOO WARM";
      } else if (t_f < ${temp_lo} || t_f > ${temp_hi}) {
        t_bg = COLOR_AMBER;
        t_label = t_f < ${temp_lo} ? "COOL" : "WARM";
      } else if (!steady) {
        // In band right now, but the tank is moving through it rather
        // than holding. That is not a green condition.
        t_bg = COLOR_AMBER;
        t_label = "SWINGING";
      }

      // ---- TDS zone ---------------------------------------------------
      const float ppm = id(tds).state;
      const bool d_ok = !isnan(ppm);

      Color d_bg = COLOR_GREEN;
      const char *d_label = "TDS OK";
      if (!d_ok) {
        d_bg = COLOR_RED;
        d_label = "NO READING";
      } else if (ppm < ${tds_red_lo} || ppm > ${tds_red_hi}) {
        d_bg = COLOR_RED;
        d_label = ppm < ${tds_lo} ? "TDS VERY LOW" : "TDS VERY HIGH";
      } else if (ppm < ${tds_lo} || ppm > ${tds_hi}) {
        d_bg = COLOR_AMBER;
        d_label = ppm < ${tds_lo} ? "TDS LOW" : "TDS HIGH";
      }

      // Near-black on every band -- highest contrast at a distance, and
      // it stays legible on all three colours.
      const Color ink = COLOR_INK;

      // ---- light strip ------------------------------------------------
      const float lux = id(tank_lux).state;
      const bool l_ok = !isnan(lux);
      const bool lights_on = l_ok && lux >= ${light_on_lux};
      // Amber when the tank lights are on, dark when they are off. The
      // controller predicts their heat load, so seeing their actual state
      // next to the temperature is worth the strip.
      const Color l_bg = lights_on ? COLOR_AMBER : COLOR_NIGHT;
      const Color l_ink = lights_on ? COLOR_INK : COLOR_DIM;

      // ---- draw -------------------------------------------------------
      // 172px of panel: 26 light strip, 114 temperature, 32 TDS. The
      // number is sized to whatever is left after those, not the other
      // way round.
      it.filled_rectangle(0, 0, 320, 26, l_bg);
      it.filled_rectangle(0, 26, 320, 114, t_bg);
      it.filled_rectangle(0, 140, 320, 32, d_bg);
      it.horizontal_line(0, 26, 320, COLOR_INK);
      it.horizontal_line(0, 139, 320, COLOR_INK);

      if (l_ok)
        it.printf(6, 20, id(font_strip), l_ink, TextAlign::BASELINE_LEFT, "LIGHT %.0f", lux);
      else
        it.print(6, 20, id(font_strip), l_ink, TextAlign::BASELINE_LEFT, "LIGHT --");
      it.print(314, 19, id(font_small), l_ink, TextAlign::BASELINE_RIGHT,
               lights_on ? "lights on" : "dark");

      // "74.5" at 150px em renders 306px wide on a 320px panel, so the
      // number owns the full width -- nothing else can share these rows.
      // BASELINE, not TOP. ESPHome positions text by the font's line box
      // (ascender to descender, ~1.17em -- 148px at this size), not by the
      // ink of the glyphs (~0.71em, 90px). Anchoring the top therefore
      // pushes digits ~28px lower than they look like they should sit,
      // which is what drove them through the status row. The baseline is
      // exactly where digits rest, so it is the one reference that does
      // not depend on font metrics.
      if (!t_ok) {
        it.print(160, 120, id(font_huge), ink, TextAlign::BASELINE_CENTER, "--.-");
      } else if (t_f >= 100.0f || t_f < 0.0f) {
        // Three digits plus a decimal will not fit. In a genuine
        // emergency, whole degrees are enough.
        it.printf(160, 120, id(font_huge), ink, TextAlign::BASELINE_CENTER, "%.0f", t_f);
      } else {
        it.printf(160, 120, id(font_huge), ink, TextAlign::BASELINE_CENTER, "%.1f", t_f);
      }

      // Bottom strip: TDS, on its own status colour. Close-up detail --
      // not meant to be read from across the room.
      if (d_ok)
        it.printf(6, 164, id(font_strip), ink, TextAlign::BASELINE_LEFT, "TDS %.0f", ppm);
      else
        it.print(6, 164, id(font_strip), ink, TextAlign::BASELINE_LEFT, "TDS --");
      it.print(314, 163, id(font_small), ink, TextAlign::BASELINE_RIGHT, d_label);

      // One status row beneath the number, in the 22px left over. Walk-up
      // detail only -- target band, hourly swing, heater duty. Putting any
      // of this beside the number is what caused the overlap.
      it.print(6, 135, id(font_small), ink, TextAlign::BASELINE_LEFT, t_label);
      if (isnan(swing_f))
        it.printf(314, 135, id(font_small), ink, TextAlign::BASELINE_RIGHT,
                  "${temp_lo}-${temp_hi}  |  heat %.0f%%",
                  id(controller).get_heater_duty());
      else
        it.printf(314, 135, id(font_small), ink, TextAlign::BASELINE_RIGHT,
                  "${temp_lo}-${temp_hi}  |  sw %.1f  |  heat %.0f%%", swing_f,
                  id(controller).get_heater_duty());

color:
  - id: COLOR_INK
    hex: "0A0A0A"
  - id: COLOR_GREEN
    hex: "3ECF6E"
  - id: COLOR_AMBER
    hex: "FFB020"
  - id: COLOR_RED
    hex: "FF4438"
  - id: COLOR_NIGHT
    hex: "10161F"
  - id: COLOR_DIM
    hex: "8A93A0"

font:
  - file: "gfonts://Roboto@700"
    id: font_small
    size: 13
    # Includes "|" (0x7C) -- the status row separator. A glyph missing from
    # this list is not a compile error: it warns once per frame at runtime
    # and draws nothing.
    glyphs: "0123456789.-+%| ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz\u00b0"
  - file: "gfonts://Roboto@700"
    id: font_strip
    size: 22
    glyphs: "0123456789.- ADSTLIGH"
  # Sized to the space left after the two strips: at 130px em the digits
  # are ~9.7mm tall and "74.5" renders 264x94px, which fits the 96px band
  # between the light strip and the status row.
  - file: "gfonts://Roboto@900"
    id: font_huge
    size: 126
    glyphs: "0123456789.-"

i2c:
  sda: GPIO19
  scl: GPIO20
  scan: true

# ---------------------------------------------------------------
# DS18B20 temperature probe -- data on GPIO4, 4.7k pull-up to 3.3V
# ---------------------------------------------------------------
one_wire:
  - platform: gpio
    pin: GPIO18

# ---------------------------------------------------------------
# Heater and fan, driven through a CZH-Labs D-1584TL 2-channel relay
# outlet module (optocoupled inputs, active high -- no `inverted:` needed).
#
# Time-proportional rather than on/off: over each 15 minute window the
# heater is on for `duty` of the window. This is what removes the 3 degF
# hysteresis swing -- the heater delivers 30% power instead of slamming
# between 0% and 100%.
#
# 15 min rather than 5 is set by relay wear, not by control quality: these
# are mechanical contacts, and 5 min windows would burn ~288 cycles/day.
# Swap in an SSR and this can drop back to 300s.
# ---------------------------------------------------------------
output:
  - platform: slow_pwm
    id: heater_output
    pin: GPIO23
    period: 900s
    restart_cycle_on_state_change: false

  - platform: ledc
    id: backlight_output
    pin: GPIO22

  - platform: slow_pwm
    id: fan_output
    # GPIO3, not GPIO10: GPIO10 is not broken out on this board's headers.
    # Avoid GPIO22 too -- it is exposed on the header but is also the LCD
    # backlight net, and GPIO13 is USB D+.
    pin: GPIO3
    period: 900s
    restart_cycle_on_state_change: false

tank_controller:
  id: controller
  temperature: water_temp
  illuminance: tank_lux
  heater: heater_output
  fan: fan_output
  time_id: sntp_time
  setpoint: ${target_temp}
  # Hard cutouts. Outside these the model is ignored entirely.
  min_temperature: 21.0
  max_temperature: 27.0
  # Bright aquarium light at the sensor, in lux. Used to normalise.
  full_scale_lux: 3000
  # How aggressively to close a temperature error. Longer = gentler.
  # Kept well above the 15 min actuator window so the controller isn't
  # demanding changes faster than the relay can actually resolve them.
  response_time: 30min
  update_interval: 30s

number:
  - platform: template
    name: "Target Temperature"
    id: target_temperature
    icon: "mdi:thermostat"
    unit_of_measurement: "°C"
    min_value: 21.0
    max_value: 27.0
    step: 0.1
    optimistic: true
    restore_value: false
    initial_value: ${target_temp}
    entity_category: config
    set_action:
      - tank_controller.set_setpoint:
          id: controller
          setpoint: !lambda "return x;"

light:
  - platform: monochromatic
    name: "Display Backlight"
    output: backlight_output
    restore_mode: ALWAYS_ON
    default_transition_length: 250ms

switch:
  - platform: template
    name: "Adaptive Learning"
    icon: "mdi:brain"
    lambda: "return id(controller).get_learning_enabled();"
    entity_category: config
    # Without this the switch defaults to ALWAYS_OFF, and the boot-time
    # write fires turn_off_action -- silently disabling learning on every
    # single boot. Default on, but remember the user's choice.
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - tank_controller.set_learning:
          id: controller
          learning: true
    turn_off_action:
      - tank_controller.set_learning:
          id: controller
          learning: false

# ---------------------------------------------------------------
# TDS meter analog output -> GPIO1 (ADC)
# ---------------------------------------------------------------
sensor:
  - platform: dallas_temp
    # Leave `address` off for a single probe; run once and copy the
    # address the log prints if you ever add a second one.
    name: "Water Temperature"
    id: water_temp
    # 10s, not 2s. The control loop runs at 30s and the tank's time
    # constant is hours -- 2s sampling just multiplied the row count in
    # InfluxDB by 5x for no extra information.
    update_interval: 10s
    accuracy_decimals: 2
    filters:
      - filter_out: nan
      # Median of the last 5 kills single-sample glitches on the bus
      - median:
          window_size: 5
          send_every: 1
          send_first_at: 1

  # Raw probe voltage. Internal-only; feeds the TDS calculation.
  - platform: adc
    pin: GPIO1
    id: tds_voltage
    update_interval: 500ms
    attenuation: 12db
    raw: false
    internal: true
    filters:
      # 20 samples smoothed -- the probe output is noisy AC-excited
      - median:
          window_size: 20
          send_every: 4
          send_first_at: 4

  - platform: template
    name: "TDS"
    id: tds
    unit_of_measurement: "ppm"
    icon: "mdi:water-opacity"
    accuracy_decimals: 0
    state_class: measurement
    update_interval: 30s
    lambda: |-
      const float v = id(tds_voltage).state;
      if (isnan(v)) return {};

      // Temperature-compensate to the 25 degC reference the probe's
      // polynomial is defined at. Fall back to 25 if the probe is absent.
      float t = id(water_temp).state;
      if (isnan(t)) t = 25.0f;
      const float coeff = 1.0f + 0.02f * (t - 25.0f);
      if (coeff <= 0.0f) return {};
      const float vc = v / coeff;

      // DFRobot/Keyestudio gravity TDS polynomial (V -> ppm), then the
      // 0.5 TDS-to-conductivity factor, then the user K-value.
      float ppm = (133.42f * vc * vc * vc
                   - 255.86f * vc * vc
                   + 857.39f * vc) * 0.5f * ${tds_k_factor};
      if (ppm < 0.0f) ppm = 0.0f;
      return ppm;
    filters:
      - clamp:
          min_value: 0
          max_value: 2000

  # Electrical conductivity, derived from the same reading
  - platform: template
    name: "Electrical Conductivity"
    unit_of_measurement: "µS/cm"
    icon: "mdi:flash"
    accuracy_decimals: 0
    state_class: measurement
    update_interval: 30s
    lambda: |-
      if (isnan(id(tds).state)) return {};
      return id(tds).state * 2.0f;

  # Diagnostics
  - platform: template
    name: "TDS Probe Voltage"
    unit_of_measurement: "V"
    accuracy_decimals: 3
    state_class: measurement
    update_interval: 10s
    entity_category: diagnostic
    lambda: |-
      if (isnan(id(tds_voltage).state)) return {};
      return id(tds_voltage).state;

  # -------------------------------------------------------------
  # BH1750 (GY-302) ambient light -- ADDR floating gives 0x23
  # -------------------------------------------------------------
  - platform: bh1750
    name: "Tank Light Level"
    id: tank_lux
    address: 0x23
    update_interval: 30s
    accuracy_decimals: 0
    filters:
      - filter_out: nan

  # -------------------------------------------------------------
  # Controller state
  # -------------------------------------------------------------
  - platform: template
    name: "Water Temperature F"
    unit_of_measurement: "°F"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 10s
    lambda: |-
      if (isnan(id(water_temp).state)) return {};
      return id(water_temp).state * 9.0f / 5.0f + 32.0f;

  # Target in F as its own series, so Grafana can draw the setpoint line
  # over the temperature plot without converting units in the query.
  - platform: template
    name: "Target Temperature F"
    unit_of_measurement: "°F"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 30s
    lambda: "return id(controller).get_setpoint() * 9.0f / 5.0f + 32.0f;"

  - platform: template
    name: "Heater Output"
    id: heater_duty
    unit_of_measurement: "%"
    icon: "mdi:radiator"
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 30s
    lambda: "return id(controller).get_heater_duty();"

  - platform: template
    name: "Fan Output"
    unit_of_measurement: "%"
    icon: "mdi:fan"
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 30s
    lambda: "return id(controller).get_fan_duty();"

  - platform: template
    name: "Predicted Temperature (15 min)"
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 2
    update_interval: 30s
    lambda: |-
      float v = id(controller).get_predicted_temperature();
      if (isnan(v)) return {};
      return v;

  - platform: template
    name: "Temperature Swing (1h)"
    unit_of_measurement: "°F"
    icon: "mdi:arrow-expand-vertical"
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 60s
    lambda: |-
      float v = id(controller).get_swing();
      if (isnan(v)) return {};
      return v * 9.0f / 5.0f;

  - platform: template
    name: "Temperature Drift Rate"
    unit_of_measurement: "°C/min"
    icon: "mdi:trending-up"
    accuracy_decimals: 4
    update_interval: 60s
    entity_category: diagnostic
    lambda: "return id(controller).get_drift_rate();"

  - platform: template
    name: "Model Confidence"
    unit_of_measurement: "%"
    icon: "mdi:brain"
    accuracy_decimals: 0
    update_interval: 60s
    entity_category: diagnostic
    lambda: "return id(controller).get_confidence();"

  - platform: template
    name: "Tank Time Constant"
    unit_of_measurement: "min"
    icon: "mdi:timer-sand"
    accuracy_decimals: 0
    update_interval: 300s
    entity_category: diagnostic
    lambda: |-
      float v = id(controller).get_time_constant();
      if (isnan(v)) return {};
      return v;

  - platform: template
    name: "Learned Heater Power"
    unit_of_measurement: "°C/min"
    icon: "mdi:fire"
    accuracy_decimals: 4
    update_interval: 300s
    entity_category: diagnostic
    lambda: "return id(controller).get_heater_gain();"

  - platform: template
    name: "Learned Light Heat Gain"
    unit_of_measurement: "°C/min"
    icon: "mdi:white-balance-sunny"
    accuracy_decimals: 4
    update_interval: 300s
    entity_category: diagnostic
    lambda: "return id(controller).get_light_gain();"

  - platform: template
    name: "Predicted Light Load"
    unit_of_measurement: "%"
    icon: "mdi:lightbulb-on-outline"
    accuracy_decimals: 0
    update_interval: 60s
    entity_category: diagnostic
    lambda: "return id(controller).get_predicted_light_load() * 100.0f;"

  - platform: wifi_signal
    name: "Wi-Fi Signal"
    update_interval: 60s
    entity_category: diagnostic

  - platform: uptime
    name: "Uptime"
    entity_category: diagnostic

binary_sensor:
  - platform: status
    name: "Status"

  - platform: template
    name: "Temperature Fault"
    device_class: problem
    entity_category: diagnostic
    lambda: "return id(controller).is_safety_tripped();"

text_sensor:
  - platform: template
    name: "Controller State"
    icon: "mdi:state-machine"
    update_interval: 30s
    lambda: "return {id(controller).get_state_text()};"

  - platform: wifi_info
    ip_address:
      name: "IP Address"
      entity_category: diagnostic

button:
  - platform: template
    name: "Reset Learning"
    icon: "mdi:brain"
    entity_category: config
    on_press:
      - tank_controller.reset_learning:
          id: controller

  - platform: restart
    name: "Restart"
    entity_category: config
