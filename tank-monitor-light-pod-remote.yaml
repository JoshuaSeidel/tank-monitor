# LIGHT POD -- XIAO ESP32-S3, a BH1750, an AS7341 and the Gravity pH board,
# over the 75 gal. (A SparkFun Qwiic Pocket ESP32-C6 build also exists, as
# boards/sparkfun-esp32c6-pocket-light-pod.yaml; swap the board line below to
# use it. It is not deployed: with non-Qwiic sensors it bought nothing over
# the XIAO, and it has half the flash.)
# Put THIS file in the ESPHome dashboard. Nothing else lives locally except
# secrets.yaml, so a push to main is all the next build needs.
#
# ---------------------------------------------------------------------
# Two sensors, two jobs, two paths
# ---------------------------------------------------------------------
#   BH1750  -> lux, pushed to the 75 gal controller over BLE, peer to
#              peer. It feeds the thermal model's light-gain term, so the
#              loop can pre-empt the daily light-heat bump instead of
#              chasing it. A control input must not depend on the broker,
#              Home Assistant or the router, so it does not use any of
#              them.
#   AS7341  -> eight visible bands, MQTT to Home Assistant only. The
#              controller has no consumer for it and is never sent it.
#
# Both also publish to MQTT for history; the BLE path is additive.
#
# ---------------------------------------------------------------------
# Failure is contained here, by construction
# ---------------------------------------------------------------------
# The last lux attempt put two BH1750s on 4-5 ft Cat6 runs sharing the
# controller's own I2C bus and 3V3 rail, and when those runs shorted the
# casualty was the board driving two heaters and both temperature probes.
# A sensor that can brown out the thermostat is not worth the reading.
#
# This board has its own supply, its own bus and its own enclosure. If it
# dies, stops publishing, or is unplugged for a month, the controller's
# staleness guard times the lux out after three missed pushes and the
# light term drops to zero -- which is exactly how the tank has been
# regulated since the BH1750s came out. Nothing else changes.
#
# ---------------------------------------------------------------------
# controller_mac -- you must set this
# ---------------------------------------------------------------------
# Read it from the controller, do NOT compute it. It publishes the value
# as sensor.tank_monitor_75_gallon_controller_ble_mac, and it is in its
# boot log. On an ESP32-S3 the BLE MAC is the WiFi MAC + 2 in the last
# octet, but that is an observation, not a promise.
#
# The controller must also be running a build with max_clients: 2 (see
# packages/ble_link_v3.yaml) or this pod will never attach: ESPHome's BLE
# server defaults to a single client, and the panel is already holding it.
#
# ---------------------------------------------------------------------
# What it is actually for
# ---------------------------------------------------------------------
# Verifying that the Chihiros WRGB II Pro 120 does what Home Assistant
# tells it. The phase presets command white, red, green and blue
# independently; until now the only evidence a push landed was the lamp's
# own say-so. Watch "Red Share" across a phase change: if the commanded
# red moved and the share did not, the push did not take.
#
# Read the three shares, not the raw bands. They are ratios, so they are
# independent of gain and exposure, and they respond to a channel change
# rather than to a cloud going past the window.
#
# ---------------------------------------------------------------------
# device_name
# ---------------------------------------------------------------------
# Must not collide with tank-monitor-s3, -s3mini, -round, -v2, -w32,
# -75-gallon, -75g (the panel) or aquarium-light-bridge. Deliberately NOT
# "tank-monitor-75g-spectral": that string has the panel's name as a
# prefix, and a wildcard MQTT subscription one day would pick up both.
#
# The name sets the MQTT topic prefix, discovery object ids, mDNS hostname
# and fallback AP name all at once.
#
# ---------------------------------------------------------------------
# Secrets
# ---------------------------------------------------------------------
# No new ones. This uses the same keys every other board here does:
# wifi_ssid, wifi_password, timezone, tank_monitor_ap_password,
# tank_monitor_ota_password, mqtt_broker, tank_monitor_mqtt_username and
# tank_monitor_mqtt_password. The dashboard keeps its own copy of
# secrets.yaml -- if a key is missing there, add it by hand.
substitutions:
  device_name: tank-monitor-light-pod
  friendly_name: Tank Monitor Light Pod

  # ---- REPLACE THIS with the controller's BLE MAC (see above) ----
  controller_mac: "SET-ME-FROM-THE-CONTROLLER"

  # ---- I2C pads. Only touch these if SDA/SCL went on the wrong way ----
  # Default is SDA on D6 (GPIO43), SCL on D7 (GPIO44) -- the same two pads
  # every other XIAO in this project uses. If the boot log finds neither
  # 0x23 nor 0x39, swap these and reflash before reaching for the iron.
  # i2c_sda: "44"
  # i2c_scl: "43"

  # ---- Exposure. Changing any of these rebases every past reading ----
  # Treat it like recalibrating a probe: do it deliberately, and write
  # down the date. If "Spectral Saturated" turns on, drop the gain one
  # step. If every band sits in the low hundreds at full light, raise it.
  # as7341_gain: "X1"

packages:
  tank_monitor:
    url: https://github.com/JoshuaSeidel/tank-monitor
    ref: main
    files:
      # base only. NOT control.yaml, sensors.yaml or ph.yaml -- there is
      # no probe, heater or relay on this board for them to bind to, and
      # they would fail the build looking for ids it does not define.
      - packages/base.yaml
      # The board file pulls in packages/light_pod.yaml itself -- do not
      # list it here as well.
      - boards/xiao-esp32s3-light-pod.yaml
    # refresh defaults to 1d, which would silently build yesterday's config.
    refresh: 0s
