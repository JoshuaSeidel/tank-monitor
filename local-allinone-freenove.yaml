# LOCAL validation wrapper for boards/allinone-freenove.yaml.
#
# Every package is !include'd from the working tree, so `esphome config` and
# `esphome compile` on this file test what you just edited rather than what
# is on main. A TEST harness, not the deploy wrapper -- that one is
# tank-monitor-allinone-freenove-remote.yaml and pulls from git.
#
# device_name carries a -test suffix so a stray flash of a half-edited build
# cannot impersonate the live controller on MQTT.
substitutions:
  device_name: tank-monitor-aio-test
  friendly_name: Tank Monitor AIO TEST
packages:
  base: !include packages/base.yaml
  webui: !include packages/webui.yaml
  control: !include packages/control.yaml
  sensors: !include packages/sensors.yaml
  ph: !include packages/ph.yaml
  ble: !include packages/ble_link_v3.yaml
  board: !include boards/allinone-freenove.yaml

# The component from the working tree, not from main.
external_components:
  - source:
      type: local
      path: components
    components: [tank_controller]
