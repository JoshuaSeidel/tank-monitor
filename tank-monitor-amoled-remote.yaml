# Waveshare ESP32-S3-Touch-AMOLED-1.75 round panel. Put THIS in the dashboard.
#
# This panel pairs with the XIAO ESP32-S3 controller over BLE, and with
# nothing else. It does not speak ESP-NOW and cannot be pointed at the C6 --
# that was Phase A, a temporary arrangement so the new UI could be built
# against live data while the S3 controller did not exist yet. It does now
# (packages/ble_link.yaml), so Phase A is over.
#
# ---------------------------------------------------------------------
# One radio pair, chosen at build time
# ---------------------------------------------------------------------
# A panel may run WiFi + ESP-NOW, or WiFi + BLE. Never all three. With all
# three live the CYD lost its ESP-NOW link and then stopped answering HTTP
# altogether, at the gentlest useful scan setting. So the transport is a
# whole-file choice: loading packages/remote_display.yaml (ESP-NOW) beside
# packages/ble_link_panel.yaml (BLE) would collide on every id below AND
# bring up two radios. Never do it.
#
# The CYD keeps ESP-NOW and keeps working, untouched, until it retires.
#
# ---------------------------------------------------------------------
# s3_ble_mac -- you must set this
# ---------------------------------------------------------------------
# ESPHome's ble_client can only address a peer by MAC; there is no name- or
# service-based connect. Find the controller's at its boot log:
#
#   [esp32_ble:...] ESP-IDF BLE MAC address: AA:BB:CC:DD:EE:FF
#
# It is NOT the WiFi MAC and NOT the OTA/mDNS name.
#
# The value shipped below is deliberately NOT a valid MAC, so ESPHome's
# address validator rejects it and the build stops until you replace it.
# A real-looking placeholder would compile cleanly and then simply never
# connect -- silently, forever -- which is the failure this project keeps
# meeting. Better to fail at the keyboard than at the tank.
#
# ---------------------------------------------------------------------
# device_name
# ---------------------------------------------------------------------
# Must NOT collide with the CYD or the controller. Same name means the same
# MQTT topic prefix, discovery ids, mDNS hostname and LWT, and the boards
# overwrite each other's Home Assistant entities as fast as they appear.
substitutions:
  device_name: tank-monitor-round
  friendly_name: Tank Monitor Round
  # ---- REPLACE THIS with the S3 controller's BLE MAC (see above) ----
  s3_ble_mac: "SET-ME-FROM-THE-S3-BOOT-LOG"

packages:
  tank_monitor:
    url: https://github.com/JoshuaSeidel/tank-monitor
    ref: main
    files:
      - packages/base.yaml
      - packages/webui.yaml
      # Display-only: this REPLACES control.yaml and sensors.yaml. Loading
      # either alongside it collides on every id.
      - packages/ble_link_panel.yaml
      - packages/chemistry.yaml
      - boards/waveshare-amoled-175.yaml
    refresh: 0s

mqtt:
  discovery_unique_id_generator: mac
