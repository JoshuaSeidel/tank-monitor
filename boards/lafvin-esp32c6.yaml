# LAFVIN ESP32-C6 dev board with the on-board 1.47" 172x320 ST7789V panel.
# Everything pin- and panel-specific for that board lives here; pair it
# with packages/base.yaml, packages/control.yaml and packages/sensors.yaml.
esp32:
  variant: esp32c6
  flash_size: 4MB
  framework:
    type: esp-idf

# On-board 1.47" 172x320 ST7789V panel. `mipi_spi` rather than the plain
# st7789v driver: with a 90 degree rotation the older driver needs a full
# framebuffer and the C6 (512KB SRAM, no PSRAM) runs out of memory.
spi:
  clk_pin: GPIO7
  mosi_pin: GPIO6

i2c:
  sda: GPIO19
  scl: GPIO20
  scan: true

# ---------------------------------------------------------------
# DS18B20 temperature probe -- 4.7k pull-up to 3.3V
# ---------------------------------------------------------------
one_wire:
  - platform: gpio
    pin: GPIO18

# ---------------------------------------------------------------
# Heater and fan, driven through a CZH-Labs D-1584TL 2-channel relay
# outlet module (optocoupled inputs, active high -- no `inverted:` needed).
#
# Time-proportional rather than on/off: over each 15 minute window the
# heater is on for `duty` of the window. This is what removes the 3 degF
# hysteresis swing -- the heater delivers 30% power instead of slamming
# between 0% and 100%.
#
# 15 min rather than 5 is set by relay wear, not by control quality: these
# are mechanical contacts, and 5 min windows would burn ~288 cycles/day.
# Swap in an SSR and this can drop back to 300s.
# ---------------------------------------------------------------
output:
  - platform: slow_pwm
    id: heater_output
    # GPIO2/GPIO3 are adjacent on the 5-4-3-2-1-0 header, so both relay
    # wires land side by side. Neither is reserved for anything.
    pin: GPIO2
    period: 900s
    restart_cycle_on_state_change: false
    state_change_action:
      - binary_sensor.template.publish:
          id: heater_relay
          state: !lambda "return state;"

  - platform: slow_pwm
    id: fan_output
    # Not GPIO10 (not broken out) and not GPIO12/13 (USB-Serial-JTAG --
    # claiming those costs USB logging and USB flashing).
    pin: GPIO3
    period: 900s
    restart_cycle_on_state_change: false
    state_change_action:
      - binary_sensor.template.publish:
          id: fan_relay
          state: !lambda "return state;"

  - platform: ledc
    id: backlight_output
    pin: GPIO22

light:
  - platform: monochromatic
    id: display_backlight
    name: "Display Backlight"
    output: backlight_output
    restore_mode: ALWAYS_ON
    default_transition_length: 250ms

sensor:
  # TDS meter analog output -> GPIO1 (ADC1)
  # Raw probe voltage. Internal-only; feeds the TDS calculation.
  - platform: adc
    pin: GPIO1
    id: tds_voltage
    update_interval: 500ms
    attenuation: 12db
    raw: false
    internal: true
    filters:
      # 20 samples smoothed -- the probe output is noisy AC-excited
      - median:
          window_size: 20
          send_every: 4
          send_first_at: 4

  # pH probe (DFRobot Gravity industrial SEN0169-V2) -> packages/ph.yaml.
  #
  # GPIO0 is the last free ADC pin on this board, and it is SAFE here:
  # the C6's strapping pins are {4, 5, 8, 9, 15}, per ESPHome's own
  # validator (gpio_esp32_c6.py). GPIO0 is a strapping pin on the classic
  # ESP32, not on this one. 4 and 5 are doubly out -- strapping AND wired
  # to this board's microSD socket.
  - platform: adc
    pin: GPIO0
    id: ph_voltage
    update_interval: 1s
    attenuation: 12db
    raw: false
    internal: true
    filters:
      - median:
          window_size: 10
          send_every: 5
          send_first_at: 5

font:
  - file: "gfonts://Roboto@700"
    id: font_small
    size: 13
    # Includes "|" (0x7C) -- the status row separator. A glyph missing from
    # this list is not a compile error: it warns once per frame at runtime
    # and draws nothing.
    glyphs: "0123456789.-+%| ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz°"
  - file: "gfonts://Roboto@700"
    id: font_strip
    size: 22
    glyphs: "0123456789.- ADSTLIGH"
  # Sized to the space left after the two strips: at 126px em the digits
  # are ~9.7mm tall and "74.5" renders 264x94px, which fits the 96px band
  # between the light strip and the status row.
  - file: "gfonts://Roboto@900"
    id: font_huge
    size: 126
    glyphs: "0123456789.-"

display:
  - platform: mipi_spi
    id: tank_display
    # Board preset -- supplies cs/dc/reset pins, 34px offset and colour
    # inversion for this exact panel.
    model: WAVESHARE-ESP32-C6-LCD-1.47
    # 270, not 90: the board is mounted with the USB end the other way up.
    rotation: 270
    # 5s, not 1s: a full redraw of this panel takes ~470ms, and water
    # temperature does not change meaningfully in a second. Redrawing
    # every second spent half the CPU blocking on SPI for nothing.
    update_interval: 5s
    # The lambda paints every pixel itself (two full-width bars), so the
    # automatic clear before each frame is a wasted full-screen fill.
    auto_clear_enabled: false
    # Full framebuffer, 320*172*2 = 110kB. Without PSRAM, ESPHome
    # defaults to a ~20kB buffer and renders in stripes -- which means
    # running this lambda once *per stripe*, re-rasterising the 126px
    # font every pass. That was the ~470ms redraw. The C6 has the heap
    # for the whole frame, so draw it in one go.
    buffer_size: 100%
    # One screen, always on -- no page cycling. Temperature owns the top
    # two thirds, TDS the bottom third, and each zone's *background*
    # carries its own status colour so both read from across the room.
    lambda: |-
      // ---- temperature zone -------------------------------------------
      const float t = id(water_temp).state;
      const bool t_ok = !isnan(t);
      const float t_f = t_ok ? t * 9.0f / 5.0f + 32.0f : NAN;

      // Peak-to-peak swing over the last hour, converted to F. NAN for
      // the first ten minutes after a boot.
      const float swing_c = id(controller).get_swing();
      const float swing_f = isnan(swing_c) ? NAN : swing_c * 9.0f / 5.0f;
      const bool steady = isnan(swing_f) || swing_f <= ${temp_swing_max};

      // Bands are offsets from the LIVE setpoint, not fixed temperatures,
      // so changing the target in Home Assistant moves every colour with
      // it. Read here rather than baked in at compile time.
      const float sp_f = id(controller).get_setpoint() * 9.0f / 5.0f + 32.0f;

      // Six bands, ascending, offsets from packages/base.yaml applied
      // to the live setpoint. Colour
      // says which way the tank is off; how loud the colour is says how
      // much trouble it is in. Blue and red are the same alarm pointed in
      // opposite directions -- both are emergencies.
      Color t_bg;
      const char *t_label;
      // Set for the two outer bands, so the swing label below cannot
      // paint over an alarm.
      bool t_alarm = false;
      if (!t_ok || id(controller).is_safety_tripped()) {
        t_bg = COLOR_RED;
        t_label = "PROBE FAULT";
        t_alarm = true;
      } else if (t_f < sp_f + (${temp_off_lightblue})) {
        t_bg = COLOR_BLUE;
        t_label = "TOO COLD";
        t_alarm = true;
      } else if (t_f < sp_f + (${temp_off_greenblue})) {
        t_bg = COLOR_LIGHTBLUE;
        t_label = "COLD";
      } else if (t_f < sp_f + (${temp_off_green})) {
        t_bg = COLOR_TEAL;
        t_label = "COOL";
      } else if (t_f < sp_f + (${temp_off_amber})) {
        t_bg = COLOR_GREEN;
        t_label = "STEADY";
      } else if (t_f < sp_f + (${temp_off_red})) {
        t_bg = COLOR_AMBER;
        t_label = "WARM";
      } else {
        t_bg = COLOR_RED;
        t_label = "TOO WARM";
        t_alarm = true;
      }

      // Swing changes the *label* only, never the colour: the ladder above
      // is a statement about absolute temperature, and overloading amber to
      // also mean "moving" would make 76.2-while-drifting look identical to
      // a genuinely too-warm tank.
      //
      // Suppressed in the alarm bands. "TOO COLD" outranks "SWINGING" --
      // if the tank is at 73 and moving, the temperature is the thing you
      // need off the screen from eight feet away.
      if (!t_alarm && !steady)
        t_label = "SWINGING";

      // ---- TDS zone ---------------------------------------------------
      const float ppm = id(tds).state;
      const bool d_ok = !isnan(ppm);

      // TDS is reported, not judged. Colour-coding it implies a verdict
      // the number cannot support: TDS is the sum of everything dissolved,
      // so the same 450 ppm can be a correctly remineralised tank or a
      // mineral-starved one full of sodium and nitrate. This tank is the
      // first case -- GH 1.7 at 489 ppm proved the point -- so a red strip
      // was calling a deliberate, correct remineralisation a fault.
      //
      // GH and KH carry the verdict, and they are test-kit values that
      // live in Home Assistant. The one state still worth colouring is a
      // dead probe, which is a fault rather than an opinion.
      Color d_bg = COLOR_NIGHT;
      const char *d_label = "";
      if (!d_ok) {
        d_bg = COLOR_RED;
        d_label = "NO READING";
      }

      // Near-black on every band -- highest contrast at a distance, and
      // it stays legible on all the light status colours.
      const Color ink = COLOR_INK;

      // The TDS strip is dark now that it no longer carries a verdict, so
      // near-black ink would vanish into it. Light ink on the neutral
      // strip, near-black on the red fault strip.
      const Color d_ink = d_ok ? COLOR_DIM : COLOR_INK;

      // ---- light strip ------------------------------------------------
      const float lux = id(tank_lux).state;
      const bool l_ok = !isnan(lux);
      const bool lights_on = l_ok && lux >= ${light_on_lux};
      // Amber when the tank lights are on, dark when they are off. The
      // controller predicts their heat load, so seeing their actual state
      // next to the temperature is worth the strip.
      const Color l_bg = lights_on ? COLOR_AMBER : COLOR_NIGHT;
      const Color l_ink = lights_on ? COLOR_INK : COLOR_DIM;

      // ---- draw -------------------------------------------------------
      // 172px of panel: 26 light strip, 114 temperature, 32 TDS. The
      // number is sized to whatever is left after those, not the other
      // way round.
      it.filled_rectangle(0, 0, 320, 26, l_bg);
      it.filled_rectangle(0, 26, 320, 114, t_bg);
      it.filled_rectangle(0, 140, 320, 32, d_bg);
      it.horizontal_line(0, 26, 320, COLOR_INK);
      it.horizontal_line(0, 139, 320, COLOR_INK);

      if (l_ok)
        it.printf(6, 20, id(font_strip), l_ink, TextAlign::BASELINE_LEFT, "LIGHT %.0f", lux);
      else
        it.print(6, 20, id(font_strip), l_ink, TextAlign::BASELINE_LEFT, "LIGHT --");
      it.print(314, 19, id(font_small), l_ink, TextAlign::BASELINE_RIGHT,
               lights_on ? "lights on" : "dark");

      // "74.5" at 126px em renders 264px wide on a 320px panel, so the
      // number owns the full width -- nothing else can share these rows.
      // BASELINE, not TOP. ESPHome positions text by the font's line box
      // (ascender to descender, ~1.17em), not by the ink of the glyphs
      // (~0.71em). Anchoring the top therefore pushes digits lower than
      // they look like they should sit, which is what drove them through
      // the status row. The baseline is exactly where digits rest, so it
      // is the one reference that does not depend on font metrics.
      if (!t_ok) {
        it.print(160, 120, id(font_huge), ink, TextAlign::BASELINE_CENTER, "--.-");
      } else if (t_f >= 100.0f || t_f < 0.0f) {
        // Three digits plus a decimal will not fit. In a genuine
        // emergency, whole degrees are enough.
        it.printf(160, 120, id(font_huge), ink, TextAlign::BASELINE_CENTER, "%.0f", t_f);
      } else {
        it.printf(160, 120, id(font_huge), ink, TextAlign::BASELINE_CENTER, "%.1f", t_f);
      }

      // Bottom strip: TDS, on its own status colour. Close-up detail --
      // not meant to be read from across the room.
      if (d_ok)
        it.printf(6, 164, id(font_strip), d_ink, TextAlign::BASELINE_LEFT, "TDS %.0f", ppm);
      else
        it.print(6, 164, id(font_strip), d_ink, TextAlign::BASELINE_LEFT, "TDS --");
      it.print(314, 163, id(font_small), d_ink, TextAlign::BASELINE_RIGHT, d_label);

      // One status row beneath the number, in the 22px left over. Walk-up
      // detail only -- target band, hourly swing, heater duty. Putting any
      // of this beside the number is what caused the overlap.
      it.print(6, 135, id(font_small), ink, TextAlign::BASELINE_LEFT, t_label);
      if (isnan(swing_f))
        it.printf(314, 135, id(font_small), ink, TextAlign::BASELINE_RIGHT,
                  "%.1f-%.1f  |  heat %.0f%%",
                  sp_f + (${temp_off_label_lo}), sp_f + (${temp_off_label_hi}),
                  id(controller).get_heater_duty());
      else
        it.printf(314, 135, id(font_small), ink, TextAlign::BASELINE_RIGHT,
                  "%.1f-%.1f  |  sw %.1f  |  heat %.0f%%",
                  sp_f + (${temp_off_label_lo}), sp_f + (${temp_off_label_hi}), swing_f,
                  id(controller).get_heater_duty());
