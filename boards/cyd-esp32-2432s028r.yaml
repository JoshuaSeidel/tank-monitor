# "CYD" ESP32-2432S028R -- ESP32-WROOM-32E with a 2.8" 240x320 ILI9341 and
# a resistive XPT2046 touch panel. Pair with packages/base.yaml,
# packages/control.yaml and packages/sensors.yaml.
#
# ---------------------------------------------------------------
# Pin budget
# ---------------------------------------------------------------
# Almost every GPIO on this board is spoken for internally: 12-15 display,
# 25/32/33/36/39 touch, 5/18/19/23 microSD, 4/16/17 RGB LED, 21 backlight,
# 26 speaker, 34 onboard LDR. What is left on the JST connectors is IO22,
# IO27 and IO35 ("Expand Input"), IO26 (speaker) and IO1/IO3 (UART).
# Every wire below lands on a connector -- no soldering to pads.
#
#   TDS analog   IO35   Expand Input.  Input-only, ADC1. ADC2 is unusable
#                       while Wi-Fi is on, so 32-39 is the only choice and
#                       35 is the only free one.
#   DS18B20      IO22   Expand Input.  4.7k pull-up to 3V3.
#   Heater relay IO27   Expand Input.
#   Fan relay    IO26   Speaker header.
#   BH1750 SDA   IO1    UART header (TX).
#   BH1750 SCL   IO3    UART header (RX).
#
# The relay module needs its own 5V supply -- nothing on this board brings
# 5V out to a connector. The CZH-Labs D-1584TL inputs are optocoupled, so
# a separate supply sharing ground with the board is the intended wiring.
#
# TWO CONSEQUENCES OF PUTTING I2C ON THE UART PINS, both real:
#   1. Serial logging is off (baud_rate: 0 below). This device is OTA-only,
#      which is fine, but it also means no USB console if it fails to boot.
#   2. IO1/IO3 are how the on-board CH340 talks to the ESP32, so the very
#      first USB flash must be done with the BH1750 UNPLUGGED. After that
#      it is OTA and the sensor can stay connected.
esp32:
  board: esp32dev
  flash_size: 4MB
  framework:
    type: esp-idf

# Overrides packages/base.yaml. 0 disables the UART entirely so the logger
# does not fight the BH1750 for IO1/IO3.
logger:
  level: INFO
  baud_rate: 0

spi:
  # Display bus (HSPI pins). MISO is wired but the panel never talks back;
  # it is here because the driver expects a complete bus.
  - id: display_bus
    clk_pin: GPIO14
    mosi_pin: GPIO13
    miso_pin:
      # GPIO12 is a strapping pin (MTDI selects flash voltage at reset).
      # That is the board's own wiring, not a choice made here, and the
      # panel never drives MISO -- so the warning is noise.
      number: GPIO12
      ignore_strapping_warning: true
  # Touch is on its own bus, not shared: the CYD wires XPT2046 to a
  # completely separate set of pins rather than to HSPI.
  - id: touch_bus
    clk_pin: GPIO25
    mosi_pin: GPIO32
    miso_pin: GPIO39

i2c:
  sda: GPIO1
  scl: GPIO3
  scan: true

one_wire:
  - platform: gpio
    pin: GPIO22

# Time-proportional heater/fan drive -- see boards/lafvin-esp32c6.yaml for
# why the window is 900s rather than 300s (mechanical relay wear).
output:
  - platform: slow_pwm
    id: heater_output
    pin: GPIO27
    period: 900s
    restart_cycle_on_state_change: false

  - platform: slow_pwm
    id: fan_output
    # Speaker header. Confirm with a meter that this connector taps IO26
    # directly and not the output side of the audio amplifier -- if it is
    # post-amp it cannot drive a relay input and the fan has to move to
    # IO2 on the SPI header instead (a strapping pin, so it would need a
    # pulldown to stay low at boot).
    pin: GPIO26
    period: 900s
    restart_cycle_on_state_change: false

  - platform: ledc
    id: backlight_output
    pin: GPIO21

light:
  - platform: monochromatic
    id: display_backlight
    name: "Display Backlight"
    output: backlight_output
    restore_mode: ALWAYS_ON
    default_transition_length: 250ms

# Tap anywhere to kill or restore the backlight. A lit 2.8" panel next to
# a tank is bright in a dark room, and this is the only physical control
# the enclosure exposes. Coordinates are ignored, so no calibration needed.
touchscreen:
  - platform: xpt2046
    id: tank_touch
    spi_id: touch_bus
    cs_pin: GPIO33
    interrupt_pin: GPIO36
    update_interval: 50ms
    threshold: 400
    # The stock CYD calibration. Nothing here reads touch *coordinates* --
    # any press toggles the backlight -- so these numbers only need to be
    # plausible, not accurate. They matter if you ever add touch regions.
    calibration:
      x_min: 280
      x_max: 3860
      y_min: 340
      y_max: 3860
    on_touch:
      - light.toggle: display_backlight

sensor:
  # TDS meter analog output -> GPIO35 (ADC1, input-only)
  - platform: adc
    pin: GPIO35
    id: tds_voltage
    update_interval: 500ms
    attenuation: 12db
    raw: false
    internal: true
    filters:
      # 20 samples smoothed -- the probe output is noisy AC-excited
      - median:
          window_size: 20
          send_every: 4
          send_first_at: 4

font:
  - file: "gfonts://Roboto@700"
    id: font_small
    size: 15
    # Includes "|" (0x7C) -- the status row separator. A glyph missing from
    # this list is not a compile error: it warns once per frame at runtime
    # and draws nothing.
    glyphs: "0123456789.-+%| ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz°"
  - file: "gfonts://Roboto@700"
    id: font_strip
    size: 26
    glyphs: "0123456789.- ADSTLIGH"
  # Roboto 900 digits run ~2.1x the em in width for "74.5", so 134px em is
  # ~281px on a 320px panel -- the largest that still leaves a margin. Ink
  # height is ~95px, which fits the 126px band above the status row.
  - file: "gfonts://Roboto@900"
    id: font_huge
    size: 134
    glyphs: "0123456789.-"

display:
  - platform: mipi_spi
    id: tank_display
    # Board preset: supplies data_rate, cs_pin GPIO15 and dc_pin GPIO2,
    # both already flagged ignore_strapping_warning. Using it instead of
    # hand-rolled ili9xxx pins is not just tidier -- mipi_spi supports
    # buffer_size, and ili9xxx does not. See the RAM note below.
    #
    # IF THE PANEL IS BLANK, GARBLED OR COLOUR-INVERTED, THIS LINE IS WHY.
    # "CYD" covers several boards that differ only in display controller,
    # and the seller's listing is not evidence. ESPHome's presets split
    # them by USB connector:
    #   ESP32-2432S028        Micro USB      ILI9341   <- listing claims this
    #   ESP32-2432S028-7789   USB-C + Micro  ST7789V
    #   ESP32-2432S028-9342   USB-C + Micro  ILI9342
    # The photographed board has USB-C, which points at one of the lower
    # two, while the listing says ILI9341. Cheap clones mislabel routinely
    # and this cannot be settled without the hardware in hand, so start
    # with the listing's claim and swap this one string if it comes up
    # wrong. That one-line swap is the other reason to be on mipi_spi.
    model: ESP32-2432S028
    spi_id: display_bus
    # Native orientation is 240x320 portrait. 90 gives 320x240 landscape
    # with the USB-C edge on the left.
    rotation: 90
    # Same reasoning as the C6 board: a full redraw is expensive and water
    # temperature does not move in a second.
    update_interval: 5s
    # The lambda paints every pixel itself, so the automatic pre-frame
    # clear is a wasted full-screen fill.
    auto_clear_enabled: false
    # 50%, NOT 100% -- and this is the whole reason for the driver switch.
    # A full 320*240*2 = 154kB framebuffer does not fit: this board has no
    # PSRAM, and the build leaves roughly 125kB of the tracked DRAM segment
    # once statics are placed, before Wi-Fi and MQTT take theirs. ili9xxx
    # allocates all 154kB in one go with no partial-buffer mode, and on
    # failure calls mark_failed() -- the screen simply never appears while
    # every other component runs fine. mipi_spi renders in stripes instead.
    # The cost is that this lambda runs once per stripe, re-rasterising the
    # 134px font each pass, which is affordable at a 5s interval.
    buffer_size: 50%
    lambda: |-
      // ---- temperature zone -------------------------------------------
      const float t = id(water_temp).state;
      const bool t_ok = !isnan(t);
      const float t_f = t_ok ? t * 9.0f / 5.0f + 32.0f : NAN;

      // Peak-to-peak swing over the last hour, converted to F. NAN for
      // the first ten minutes after a boot.
      const float swing_c = id(controller).get_swing();
      const float swing_f = isnan(swing_c) ? NAN : swing_c * 9.0f / 5.0f;
      const bool steady = isnan(swing_f) || swing_f <= ${temp_swing_max};

      // Bands are offsets from the LIVE setpoint, not fixed temperatures,
      // so changing the target in Home Assistant moves every colour with
      // it. Read here rather than baked in at compile time.
      const float sp_f = id(controller).get_setpoint() * 9.0f / 5.0f + 32.0f;

      // Six bands, ascending, offsets from packages/base.yaml applied
      // to the live setpoint. Colour
      // says which way the tank is off; how loud the colour is says how
      // much trouble it is in. Blue and red are the same alarm pointed in
      // opposite directions -- both are emergencies.
      Color t_bg;
      const char *t_label;
      // Set for the two outer bands, so the swing label below cannot
      // paint over an alarm.
      bool t_alarm = false;
      if (!t_ok || id(controller).is_safety_tripped()) {
        t_bg = COLOR_RED;
        t_label = "PROBE FAULT";
        t_alarm = true;
      } else if (t_f < sp_f + (${temp_off_lightblue})) {
        t_bg = COLOR_BLUE;
        t_label = "TOO COLD";
        t_alarm = true;
      } else if (t_f < sp_f + (${temp_off_greenblue})) {
        t_bg = COLOR_LIGHTBLUE;
        t_label = "COLD";
      } else if (t_f < sp_f + (${temp_off_green})) {
        t_bg = COLOR_TEAL;
        t_label = "COOL";
      } else if (t_f < sp_f + (${temp_off_amber})) {
        t_bg = COLOR_GREEN;
        t_label = "STEADY";
      } else if (t_f < sp_f + (${temp_off_red})) {
        t_bg = COLOR_AMBER;
        t_label = "WARM";
      } else {
        t_bg = COLOR_RED;
        t_label = "TOO WARM";
        t_alarm = true;
      }

      // Swing changes the *label* only, never the colour: the ladder above
      // is a statement about absolute temperature, and overloading amber to
      // also mean "moving" would make 76.2-while-drifting look identical to
      // a genuinely too-warm tank.
      //
      // Suppressed in the alarm bands. "TOO COLD" outranks "SWINGING" --
      // if the tank is at 73 and moving, the temperature is the thing you
      // need off the screen from eight feet away.
      if (!t_alarm && !steady)
        t_label = "SWINGING";

      // ---- TDS zone ---------------------------------------------------
      const float ppm = id(tds).state;
      const bool d_ok = !isnan(ppm);

      Color d_bg = COLOR_GREEN;
      const char *d_label = "TDS OK";
      if (!d_ok) {
        d_bg = COLOR_RED;
        d_label = "NO READING";
      } else if (ppm < ${tds_red_lo} || ppm > ${tds_red_hi}) {
        d_bg = COLOR_RED;
        d_label = ppm < ${tds_lo} ? "TDS VERY LOW" : "TDS VERY HIGH";
      } else if (ppm < ${tds_lo} || ppm > ${tds_hi}) {
        d_bg = COLOR_AMBER;
        d_label = ppm < ${tds_lo} ? "TDS LOW" : "TDS HIGH";
      }

      // Near-black on every band -- highest contrast at a distance, and
      // it stays legible on all three colours.
      const Color ink = COLOR_INK;

      // ---- light strip ------------------------------------------------
      const float lux = id(tank_lux).state;
      const bool l_ok = !isnan(lux);
      const bool lights_on = l_ok && lux >= ${light_on_lux};
      const Color l_bg = lights_on ? COLOR_AMBER : COLOR_NIGHT;
      const Color l_ink = lights_on ? COLOR_INK : COLOR_DIM;

      // ---- draw -------------------------------------------------------
      // 240px of panel, 68 more than the C6 board. All of it goes to the
      // two side strips: 34 light, 150 temperature, 56 TDS. The
      // temperature number keeps owning the middle.
      it.filled_rectangle(0, 0, 320, 34, l_bg);
      it.filled_rectangle(0, 34, 320, 150, t_bg);
      it.filled_rectangle(0, 184, 320, 56, d_bg);
      it.horizontal_line(0, 34, 320, COLOR_INK);
      it.horizontal_line(0, 183, 320, COLOR_INK);

      if (l_ok)
        it.printf(8, 26, id(font_strip), l_ink, TextAlign::BASELINE_LEFT, "LIGHT %.0f", lux);
      else
        it.print(8, 26, id(font_strip), l_ink, TextAlign::BASELINE_LEFT, "LIGHT --");
      it.print(312, 25, id(font_small), l_ink, TextAlign::BASELINE_RIGHT,
               lights_on ? "lights on" : "dark");

      // BASELINE, not TOP. ESPHome positions text by the font's line box
      // (ascender to descender, ~1.17em), not by the ink of the glyphs
      // (~0.71em), so anchoring the top drops digits well below where
      // they look like they should sit. The baseline is exactly where
      // digits rest and is the one reference independent of metrics.
      if (!t_ok) {
        it.print(160, 148, id(font_huge), ink, TextAlign::BASELINE_CENTER, "--.-");
      } else if (t_f >= 100.0f || t_f < 0.0f) {
        // Three digits plus a decimal will not fit. In a genuine
        // emergency, whole degrees are enough.
        it.printf(160, 148, id(font_huge), ink, TextAlign::BASELINE_CENTER, "%.0f", t_f);
      } else {
        it.printf(160, 148, id(font_huge), ink, TextAlign::BASELINE_CENTER, "%.1f", t_f);
      }

      // Status row inside the temperature band -- walk-up detail only.
      it.print(8, 176, id(font_small), ink, TextAlign::BASELINE_LEFT, t_label);
      if (isnan(swing_f))
        it.printf(312, 176, id(font_small), ink, TextAlign::BASELINE_RIGHT,
                  "%.1f-%.1f  |  heat %.0f%%",
                  sp_f + (${temp_off_label_lo}), sp_f + (${temp_off_label_hi}),
                  id(controller).get_heater_duty());
      else
        it.printf(312, 176, id(font_small), ink, TextAlign::BASELINE_RIGHT,
                  "%.1f-%.1f  |  sw %.1f  |  heat %.0f%%",
                  sp_f + (${temp_off_label_lo}), sp_f + (${temp_off_label_hi}), swing_f,
                  id(controller).get_heater_duty());

      // Bottom strip: TDS on its own status colour. Close-up detail.
      if (d_ok)
        it.printf(8, 216, id(font_strip), ink, TextAlign::BASELINE_LEFT, "TDS %.0f", ppm);
      else
        it.print(8, 216, id(font_strip), ink, TextAlign::BASELINE_LEFT, "TDS --");
      it.print(312, 234, id(font_small), ink, TextAlign::BASELINE_RIGHT, d_label);
