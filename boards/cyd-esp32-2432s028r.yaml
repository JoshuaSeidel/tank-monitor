# Widgets are static until something updates them. Driven from here rather
# than from sensor on_value triggers, because those sensors live in the
# shared packages/ and the C6 must not inherit any of this.
interval:
  - interval: 2s
    then:
      - lambda: |-
          const float sp_f = id(controller).get_setpoint() * 9.0f / 5.0f + 32.0f;
          const float t = id(water_temp).state;
          const bool ok = !isnan(t);
          const float t_f = ok ? t * 9.0f / 5.0f + 32.0f : NAN;

          // The arc spans the same band the colours use: setpoint-relative,
          // so it follows the target instead of a fixed scale.
          const float lo = sp_f + (${temp_off_lightblue});
          const float hi = sp_f + (${temp_off_red});
          int pct = 0;
          if (ok) {
            float f = (t_f - lo) / (hi - lo);
            pct = (int) (f < 0 ? 0 : (f > 1 ? 100 : f * 100));
          }

          uint32_t accent = 0x3ECF6E;
          const char *state = "STEADY";
          if (!ok || id(controller).is_safety_tripped()) { accent = 0xFF4438; state = "NO PROBE"; }
          else if (t_f < sp_f + (${temp_off_lightblue})) { accent = 0x2F80FF; state = "TOO COLD"; }
          else if (t_f < sp_f + (${temp_off_greenblue})) { accent = 0x7FC4FF; state = "COLD"; }
          else if (t_f < sp_f + (${temp_off_green})) { accent = 0x3ECFB0; state = "COOL"; }
          else if (t_f < sp_f + (${temp_off_amber})) { accent = 0x3ECF6E; state = "STEADY"; }
          else if (t_f < sp_f + (${temp_off_red})) { accent = 0xFFB020; state = "WARM"; }
          else { accent = 0xFF4438; state = "TOO WARM"; }

          lv_arc_set_value(id(temp_arc), pct);
          lv_obj_set_style_arc_color(id(temp_arc), lv_color_hex(accent), LV_PART_INDICATOR);
          lv_label_set_text(id(temp_state), state);
          lv_obj_set_style_text_color(id(temp_state), lv_color_hex(accent), 0);

          if (ok) lv_label_set_text_fmt(id(temp_value), "%.1f", t_f);
          else    lv_label_set_text(id(temp_value), "--.-");
          lv_label_set_text_fmt(id(target_value), "%.1f", sp_f);

          const int h = (int) id(controller).get_heater_duty();
          const int f2 = (int) id(controller).get_fan_duty();
          lv_bar_set_value(id(heat_bar), h, LV_ANIM_ON);
          lv_bar_set_value(id(fan_bar), f2, LV_ANIM_ON);
          lv_label_set_text_fmt(id(heat_value), "%d%%", h);
          lv_label_set_text_fmt(id(fan_value), "%d%%", f2);

          if (!isnan(id(tank_lux).state))
            lv_label_set_text_fmt(id(hdr_light), "LIGHT %.0f", id(tank_lux).state);
          if (!isnan(id(tds).state))
            lv_label_set_text_fmt(id(chip_tds), "TDS %.0f", id(tds).state);
          const float sw = id(controller).get_swing();
          if (!isnan(sw)) lv_label_set_text_fmt(id(chip_swing), "SWING %.1f", sw * 9.0f / 5.0f);
          lv_label_set_text_fmt(id(chip_conf), "LEARN %.0f%%", id(controller).get_confidence());

          // --- control page ---
          lv_label_set_text_fmt(id(set_value), "%.1f", sp_f);

          // --- water page ---
          if (!isnan(id(tds).state)) {
            lv_label_set_text_fmt(id(w_tds), "%.0f", id(tds).state);
            lv_label_set_text_fmt(id(w_ec), "%.0f uS/cm", id(tds).state * 2.0f);
          }
          if (!isnan(id(tank_lux).state)) {
            lv_label_set_text_fmt(id(w_lux), "%.0f", id(tank_lux).state);
            lv_label_set_text(id(w_lux_state), id(tank_lux).state >= ${light_on_lux} ? "lights on" : "dark");
          }
          if (!isnan(sw)) lv_label_set_text_fmt(id(w_swing), "%.2f F", sw * 9.0f / 5.0f);
          lv_label_set_text_fmt(id(w_drift), "%+.2f F/h", id(controller).get_drift_rate() * 60.0f * 9.0f / 5.0f);
          lv_label_set_text_fmt(id(w_conf), "%.0f%%", id(controller).get_confidence());

          // --- chemistry, from the flash-cached globals (never the live
          // subscription) so a broker outage shows the last reading and
          // its age rather than blanking the panel.
          if (isnan(id(chem_ph)))  lv_label_set_text(id(c_ph),  "pH --");
          else lv_label_set_text_fmt(id(c_ph),  "pH %.2f", id(chem_ph));
          if (isnan(id(chem_nh3))) lv_label_set_text(id(c_nh3), "NH3 --");
          else lv_label_set_text_fmt(id(c_nh3), "NH3 %.3f", id(chem_nh3));
          if (isnan(id(chem_gh)))  lv_label_set_text(id(c_gh),  "GH --");
          else lv_label_set_text_fmt(id(c_gh),  "GH %.0f", id(chem_gh));
          if (isnan(id(chem_kh)))  lv_label_set_text(id(c_kh),  "KH --");
          else lv_label_set_text_fmt(id(c_kh),  "KH %.0f", id(chem_kh));
          lv_label_set_text_fmt(id(c_no), "NO2 %.1f  NO3 %.0f",
                                isnan(id(chem_no2)) ? 0.0f : id(chem_no2),
                                isnan(id(chem_no3)) ? 0.0f : id(chem_no3));

          if (id(chem_stamp) == 0) {
            lv_label_set_text(id(c_age), "never");
          } else {
            auto nowt = id(sntp_time).now();
            if (nowt.is_valid()) {
              const uint32_t age = (uint32_t) nowt.timestamp - id(chem_stamp);
              if (age < 3600)        lv_label_set_text_fmt(id(c_age), "%um ago", age / 60);
              else if (age < 172800) lv_label_set_text_fmt(id(c_age), "%uh ago", age / 3600);
              else                   lv_label_set_text_fmt(id(c_age), "%ud ago", age / 86400);
            }
          }
