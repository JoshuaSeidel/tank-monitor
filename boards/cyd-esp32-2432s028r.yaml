# Widgets are static until something updates them. Driven from here rather
# than from sensor on_value triggers, because those sensors live in the
# shared packages/ and the C6 must not inherit any of this.
interval:
  - interval: 2s
    then:
      - lambda: |-
          const float sp_f = id(r_setpoint_c) * 9.0f / 5.0f + 32.0f;
          const float t = id(water_temp).state;
          const bool ok = !isnan(t);
          const float t_f = ok ? t * 9.0f / 5.0f + 32.0f : NAN;

          // The arc spans the same band the colours use: setpoint-relative,
          // so it follows the target instead of a fixed scale.
          const float lo = sp_f + (${temp_off_lightblue});
          const float hi = sp_f + (${temp_off_red});
          int pct = 0;
          if (ok) {
            float f = (t_f - lo) / (hi - lo);
            pct = (int) (f < 0 ? 0 : (f > 1 ? 100 : f * 100));
          }

          uint32_t accent = 0x3ECF6E;
          const char *state = "STEADY";
          if (!ok || id(r_fault)) { accent = 0xFF4438; state = "NO PROBE"; }
          else if (t_f < sp_f + (${temp_off_lightblue})) { accent = 0x2F80FF; state = "TOO COLD"; }
          else if (t_f < sp_f + (${temp_off_greenblue})) { accent = 0x7FC4FF; state = "COLD"; }
          else if (t_f < sp_f + (${temp_off_green})) { accent = 0x3ECFB0; state = "COOL"; }
          else if (t_f < sp_f + (${temp_off_amber})) { accent = 0x3ECF6E; state = "STEADY"; }
          else if (t_f < sp_f + (${temp_off_red})) { accent = 0xFFB020; state = "WARM"; }
          else { accent = 0xFF4438; state = "TOO WARM"; }

          lv_arc_set_value(id(temp_arc), pct);
          lv_obj_set_style_arc_color(id(temp_arc), lv_color_hex(accent), LV_PART_INDICATOR);
          lv_label_set_text(id(temp_state), state);
          lv_obj_set_style_text_color(id(temp_state), lv_color_hex(accent), 0);

          if (ok) lv_label_set_text_fmt(id(temp_value), "%.1f", t_f);
          else    lv_label_set_text(id(temp_value), "--.-");
          lv_label_set_text_fmt(id(target_value), "%.1f", sp_f);

          // ON/OFF is the real contact state; the bar underneath is the
          // commanded duty over the 15-minute window. A plug has no partial
          // setting, so a percentage as the headline reads as a fault
          // whenever the fan is silent between cycles -- which at 40% duty
          // is most of the time.
          // No duty bar. A part-filled bar is a percentage whether or not
          // a number is printed beside it, so "OFF" next to a 41%-filled
          // bar contradicts itself. Controller State already says whether
          // the tank is heating, cooling or holding, which is what the bar
          // actually conveyed; the commanded duty stays in Home Assistant
          // as a diagnostic for anyone who wants the number.
          lv_label_set_text(id(heat_value), id(r_heat_on) ? "ON" : "OFF");
          lv_label_set_text(id(fan_value),  id(r_fan_on)  ? "ON" : "OFF");
          lv_obj_set_style_text_color(id(heat_value),
              lv_color_hex(id(r_heat_on) ? 0xFFB020 : 0x5A6B83), 0);
          lv_obj_set_style_text_color(id(fan_value),
              lv_color_hex(id(r_fan_on) ? 0x2F80FF : 0x5A6B83), 0);

          if (!isnan(id(tank_lux).state))
            lv_label_set_text_fmt(id(hdr_light), "LIGHT %.0f", id(tank_lux).state);
          if (!isnan(id(tds).state))
            lv_label_set_text_fmt(id(chip_tds), "TDS %.0f", id(tds).state);
          const float sw = id(r_swing_c);
          if (!isnan(sw)) lv_label_set_text_fmt(id(chip_swing), "SWING %.1f", sw * 9.0f / 5.0f);

          // --- link status icons ---
          {
            const uint32_t GOOD = 0x3ECF6E, BAD = 0xFF4438;
            const bool wifi_up = wifi::global_wifi_component != nullptr &&
                                 wifi::global_wifi_component->is_connected();
            // Same 45s window the Controller Link entity uses: four missed
            // broadcasts, so a single lost frame does not flicker it.
            const bool now_up = id(r_stamp_ms) != 0 &&
                                (millis() - id(r_stamp_ms)) < 45000;
            const uint32_t wc = wifi_up ? GOOD : BAD;
            const uint32_t nc = now_up ? GOOD : BAD;
            lv_obj_set_style_arc_color(id(wifi_a3), lv_color_hex(wc), LV_PART_MAIN);
            lv_obj_set_style_arc_color(id(wifi_a2), lv_color_hex(wc), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(wifi_dot), lv_color_hex(wc), 0);
            lv_obj_set_style_arc_color(id(now_left), lv_color_hex(nc), LV_PART_MAIN);
            lv_obj_set_style_arc_color(id(now_right), lv_color_hex(nc), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(now_dot), lv_color_hex(nc), 0);
          }

          // --- battery, drawn over every page ---
          {
            const float bv = id(batt_voltage).state;
            const float bp = id(batt_pct).state;
            if (isnan(bv) || bv < ${battery_absent_v} || isnan(bp)) {
              // No pack, or no divider fitted. Hidden beats a confident 0%.
              lv_obj_add_flag(id(batt_box), LV_OBJ_FLAG_HIDDEN);
            } else {
              lv_obj_remove_flag(id(batt_box), LV_OBJ_FLAG_HIDDEN);
              const int pct = (int) (bp < 0 ? 0 : (bp > 100 ? 100 : bp));
              // 22px of inner width; keep 1px visible at 0% so the outline
              // does not read as "no battery fitted".
              int w = (int) (22.0f * pct / 100.0f);
              if (w < 1) w = 1;
              lv_obj_set_width(id(batt_fill), w);
              const uint32_t c = pct <= 15 ? 0xFF4438
                               : pct <= 40 ? 0xFFB020
                                           : 0x3ECF6E;
              lv_obj_set_style_bg_color(id(batt_fill), lv_color_hex(c), 0);
              const float hrs = id(batt_hours).state;
              if (id(batt_charging)) {
                // Blue, and said in words. Colour alone would be ambiguous
                // with the level bands, and a runtime estimate means
                // nothing while the pack is filling.
                lv_obj_set_style_bg_color(id(batt_fill), lv_color_hex(0x2F80FF), 0);
                if (pct >= 99) lv_label_set_text(id(batt_text), "FULL");
                else           lv_label_set_text_fmt(id(batt_text), "%d%% CHG", pct);
              } else if (!isnan(hrs) && hrs > 0.0f && hrs < 240.0f) {
                if (hrs >= 1.0f) lv_label_set_text_fmt(id(batt_text), "%d%% %.0fh", pct, hrs);
                else             lv_label_set_text_fmt(id(batt_text), "%d%% %.0fm", pct, hrs * 60.0f);
              } else {
                // No usable discharge slope yet -- takes ~20 min of
                // readings. Showing the percentage alone beats a made-up
                // runtime that halves on the next sample.
                lv_label_set_text_fmt(id(batt_text), "%d%%", pct);
              }
            }
          }

          // --- control page ---
          lv_label_set_text_fmt(id(set_value), "%.1f", sp_f);

          // Reflect the controller's actual switch state. Without this the
          // toggle only ever shows what was last pressed here, which is
          // wrong the moment anything changes it from Home Assistant or the
          // controller's own web UI -- and wrong on every boot.
          if (id(r_learn_known)) {
            const bool want = id(r_learn_on);
            if (want != lv_obj_has_state(id(sw_learn), LV_STATE_CHECKED)) {
              id(r_sync) = true;
              if (want) lv_obj_add_state(id(sw_learn), LV_STATE_CHECKED);
              else      lv_obj_remove_state(id(sw_learn), LV_STATE_CHECKED);
              id(r_sync) = false;
            }
          }

          // --- water page ---
          if (!isnan(id(tds).state)) {
            lv_label_set_text_fmt(id(w_tds), "%.0f", id(tds).state);
            lv_label_set_text_fmt(id(w_ec), "%.0f uS/cm", id(tds).state * 2.0f);
          }
          if (!isnan(id(tank_lux).state)) {
            lv_label_set_text_fmt(id(w_lux), "%.0f", id(tank_lux).state);
            lv_label_set_text(id(w_lux_state), id(tank_lux).state >= ${light_on_lux} ? "lights on" : "dark");
          }
          if (!isnan(sw)) lv_label_set_text_fmt(id(w_swing), "%.2f F", sw * 9.0f / 5.0f);
          lv_label_set_text_fmt(id(w_drift), "%+.2f F/h", id(r_drift_c_min) * 60.0f * 9.0f / 5.0f);
          lv_label_set_text_fmt(id(w_conf), "%.0f%%", id(r_conf));

          // --- chemistry, from the flash-cached globals (never the live
          // subscription) so a broker outage shows the last reading and
          // its age rather than blanking the panel.
          if (isnan(id(chem_ph)))  lv_label_set_text(id(c_ph),  "pH --");
          else lv_label_set_text_fmt(id(c_ph),  "pH %.2f", id(chem_ph));
          if (isnan(id(chem_nh3))) lv_label_set_text(id(c_nh3), "NH3 --");
          else lv_label_set_text_fmt(id(c_nh3), "NH3 %.3f", id(chem_nh3));
          if (isnan(id(chem_gh)))  lv_label_set_text(id(c_gh),  "GH --");
          else lv_label_set_text_fmt(id(c_gh),  "GH %.0f", id(chem_gh));
          if (isnan(id(chem_kh)))  lv_label_set_text(id(c_kh),  "KH --");
          else lv_label_set_text_fmt(id(c_kh),  "KH %.0f", id(chem_kh));
          lv_label_set_text_fmt(id(c_no), "NO2 %.1f  NO3 %.0f",
                                isnan(id(chem_no2)) ? 0.0f : id(chem_no2),
                                isnan(id(chem_no3)) ? 0.0f : id(chem_no3));

          if (id(chem_stamp) == 0) {
            lv_label_set_text(id(c_age), "never");
          } else {
            auto nowt = id(sntp_time).now();
            if (nowt.is_valid()) {
              const uint32_t age = (uint32_t) nowt.timestamp - id(chem_stamp);
              if (age < 3600)        lv_label_set_text_fmt(id(c_age), "%um ago", age / 60);
              else if (age < 172800) lv_label_set_text_fmt(id(c_age), "%uh ago", age / 3600);
              else                   lv_label_set_text_fmt(id(c_age), "%ud ago", age / 86400);
            }
          }

  # Ten minutes between samples, because the estimate is a slope: over one
  # minute the ADC noise is larger than the real change and the remaining
  # time would swing wildly.
  - interval: 10min
    then:
      - lambda: |-
          const float pct = id(batt_pct).state;
          const uint32_t now = millis() / 1000;
          if (isnan(pct)) { id(batt_pct_prev) = NAN; return; }
          if (!isnan(id(batt_pct_prev)) && id(batt_prev_t) != 0) {
            const float hrs = (now - id(batt_prev_t)) / 3600.0f;
            if (hrs > 0.05f) {
              const float drop = id(batt_pct_prev) - pct;
              if (drop > 0.0f) {
                const float r = drop / hrs;
                // Exponential smoothing: a single interval's drop is mostly
                // quantisation, and an unsmoothed estimate jumps between
                // "2 hours" and "40 hours" on consecutive samples.
                id(batt_rate_pph) = isnan(id(batt_rate_pph))
                                    ? r
                                    : 0.75f * id(batt_rate_pph) + 0.25f * r;
              } else if (drop < -1.0f) {
                // Charging, or just plugged in. The discharge estimate is
                // meaningless now, so drop it rather than show a stale one.
                id(batt_rate_pph) = NAN;
              }
            }
          }
          id(batt_pct_prev) = pct;
          id(batt_prev_t) = now;

  # Charge detection, by trend. There is no charge-status pin broken out on
  # this board, so the only evidence available is which way the pack is
  # moving. Five minutes between samples: a 500mA charge on a small pack
  # lifts the cell roughly 0.03V in that time, which clears the ADC noise,
  # while one minute would not.
  - interval: 5min
    then:
      - lambda: |-
          const float v = id(batt_voltage).state;
          if (isnan(v) || v < ${battery_absent_v}) {
            id(batt_charging) = false;
            id(batt_v_prev) = NAN;
            return;
          }
          if (!isnan(id(batt_v_prev))) {
            const float d = v - id(batt_v_prev);
            // Asymmetric thresholds, deliberately. Rising needs real
            // evidence; falling only has to be unambiguous. Between the two
            // the previous answer stands, so a pack resting flat does not
            // flip the label back and forth.
            if (d > 0.02f)       id(batt_charging) = true;
            else if (d < -0.005f) id(batt_charging) = false;
          }
          id(batt_v_prev) = v;
