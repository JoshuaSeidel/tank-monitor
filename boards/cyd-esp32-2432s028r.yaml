# "CYD" ESP32-2432S028R -- ESP32-WROOM-32E with a 2.8" 240x320 ILI9341 and
# a resistive XPT2046 touch panel. Pair with packages/base.yaml,
# packages/control.yaml and packages/sensors.yaml.
#
# ---------------------------------------------------------------
# Pin budget
# ---------------------------------------------------------------
# Almost every GPIO on this board is spoken for internally: 12-15 display,
# 25/32/33/36/39 touch, 4/16/17 RGB LED, 21 backlight, 26 speaker,
# 34 onboard LDR. The connectors on this revision expose:
#
#   3.3V / IO35 / GND          3-pin header
#   IO23 IO19 IO18 IO27        4-pin header silkscreened SPI
#   RXD(IO3) TXD(IO1) GND 5V   4-pin header silkscreened UART
#   speaker (2-pin), BAT (2-pin)
#
# IO18/19/23 are the microSD bus. Nothing here uses the card, so they are
# free GPIO -- which is what makes this build fit without the speaker
# header. Every wire lands on a connector; nothing solders to the board.
#
#   TDS analog   IO35   3-pin header. Input-only, ADC1. ADC2 is unusable
#                       while Wi-Fi is on, so 32-39 is the only choice and
#                       35 is the only free one. Not negotiable.
#   Heater relay IO27   SPI header (CS).
#   Fan relay    IO18   SPI header (SCK).
#   DS18B20      IO19   SPI header (MISO). 4.7k pull-up to 3V3.
#   BH1750 SDA   IO1    UART header (TXD).
#   BH1750 SCL   IO3    UART header (RXD).
#
# IO23 is left spare.
#
# NOT IO22: it is not broken out on this board revision. An earlier version
# of this file put the DS18B20 there, which cannot work here.
#
# NOT the speaker header: IO26 reaches it through the audio amplifier on
# this revision, so it cannot drive a relay input. With three GPIOs free on
# the SPI header there is no reason to try.
#
# POWER THE BH1750 FROM THE 3.3V PIN, NOT THE UART HEADER'S 5V. The GY-302
# pulls SDA and SCL up to its own VCC, and the ESP32's GPIOs are not 5V
# tolerant -- 5V there would drive 5V into IO1/IO3. Splice the sensor's VCC
# with the TDS module's onto the 3.3V pin.
#
# The D-1584TL's inputs are optocoupled and draw little current, so its
# grounds tie to the board's ground. 5V is available on the UART header if
# the module needs it.
#
# TWO CONSEQUENCES OF PUTTING I2C ON THE UART PINS, both real:
#   1. Serial logging is off (baud_rate: 0 below). This device is OTA-only,
#      which is fine, but it also means no USB console if it fails to boot.
#   2. IO1/IO3 are how the on-board CH340 talks to the ESP32, so the very
#      first USB flash must be done with the BH1750 UNPLUGGED. After that
#      it is OTA and the sensor can stay connected.
esp32:
  board: esp32dev
  flash_size: 4MB
  framework:
    type: esp-idf

# Overrides packages/base.yaml. 0 disables the UART entirely so the logger
# does not fight the BH1750 for IO1/IO3.
logger:
  level: INFO
  baud_rate: 0

# ESPHome's default MQTT unique_id generator is "legacy", which builds
# "ESP" + component_type + object_id and includes neither the device name
# nor the MAC. Two boards running the same package set therefore publish
# byte-identical unique_ids -- "ESPsensorwater_temperature" on both -- and
# Home Assistant silently drops the second registration. The symptom is
# entities that never appear, with no error anywhere, and renaming the
# device does not help because the name was never part of the id.
#
# Only the chemistry sensors got through, being the sole entities the
# other board does not also have.
#
# "mac" generates MAC + component_type + hash(friendly_name), which is
# unique per board. Set here rather than in base.yaml on purpose: changing
# it on the C6 would regenerate every one of its unique_ids, orphaning its
# existing entities and their history.
mqtt:
  discovery_unique_id_generator: mac

spi:
  # Display bus (HSPI pins). MISO is wired but the panel never talks back;
  # it is here because the driver expects a complete bus.
  - id: display_bus
    clk_pin: GPIO14
    mosi_pin: GPIO13
    miso_pin:
      # GPIO12 is a strapping pin (MTDI selects flash voltage at reset).
      # That is the board's own wiring, not a choice made here, and the
      # panel never drives MISO -- so the warning is noise.
      number: GPIO12
      ignore_strapping_warning: true
  # Touch is on its own bus, not shared: the CYD wires XPT2046 to a
  # completely separate set of pins rather than to HSPI.
  - id: touch_bus
    clk_pin: GPIO25
    mosi_pin: GPIO32
    miso_pin: GPIO39

i2c:
  sda: GPIO1
  scl: GPIO3
  scan: true

one_wire:
  - platform: gpio
    # SPI header, silkscreened MISO. A microSD data line, free because
    # nothing here uses the card. Needs the 4.7k pull-up to 3V3.
    pin: GPIO19

# Time-proportional heater/fan drive -- see boards/lafvin-esp32c6.yaml for
# why the window is 900s rather than 300s (mechanical relay wear).
output:
  - platform: slow_pwm
    id: heater_output
    pin: GPIO27
    period: 900s
    restart_cycle_on_state_change: false
    state_change_action:
      - binary_sensor.template.publish:
          id: heater_relay
          state: !lambda "return state;"

  - platform: slow_pwm
    id: fan_output
    # SPI header, silkscreened SCK. Another free microSD line. This used to
    # be IO26 on the speaker header, which reaches the pin through the audio
    # amplifier on this board revision and cannot drive a relay input.
    pin: GPIO18
    period: 900s
    restart_cycle_on_state_change: false
    state_change_action:
      - binary_sensor.template.publish:
          id: fan_relay
          state: !lambda "return state;"

  - platform: ledc
    id: backlight_output
    pin: GPIO21

light:
  - platform: monochromatic
    id: display_backlight
    name: "Display Backlight"
    output: backlight_output
    restore_mode: ALWAYS_ON
    default_transition_length: 250ms

# Tap anywhere to kill or restore the backlight. A lit 2.8" panel next to
# a tank is bright in a dark room, and this is the only physical control
# the enclosure exposes. Coordinates are ignored, so no calibration needed.
touchscreen:
  - platform: xpt2046
    id: tank_touch
    spi_id: touch_bus
    cs_pin: GPIO33
    interrupt_pin: GPIO36
    update_interval: 50ms
    threshold: 400
    # swap_xy here too, and for a different reason than the display's.
    #
    # Touchscreen::add_raw_touch_position_ swaps the axes BEFORE storing
    # x_raw/y_raw, so the (616, 3578) reported by the diagnostic was
    # already swapped -- the digitiser actually read (3578, 616). Reading
    # that pair as if it were unswapped is what made "no transform" look
    # right; it is not.
    #
    # Worked through with the real algorithm, tapping HOME:
    #   swap        -> x_raw=616, y_raw=3578
    #   normalise x -> (616-280)/3580  = 0.094 -> x = 0.094*320 = 30
    #   normalise y -> (3578-340)/3520 = 0.920 -> y = 0.920*240 = 221
    # (30, 221) is inside HOME's box: x 8-74, y 208-232.
    #
    # Note the calibration pairs are applied AFTER the swap, so x_min/x_max
    # bound the digitiser's y axis and vice versa. Do not "fix" that.
    transform:
      swap_xy: true
      mirror_x: false
      mirror_y: false
    # Stock CYD calibration. These now matter: LVGL hit-tests real
    # coordinates against real widgets, where before any press anywhere
    # just toggled the backlight.
    calibration:
      x_min: 280
      x_max: 3860
      y_min: 340
      y_max: 3860
    # Reports where the driver thinks each press landed. Tap the nav
    # buttons and compare against their coordinates -- HOME is x 8-74,
    # SET 80-146, WATER 152-218, all at y 208-232.
    #
    # This publishes to an entity rather than logging. The previous
    # version used logger.log, which defaults to DEBUG while this board
    # runs the logger at INFO, so it printed nothing and the calibration
    # question stayed open for as long as the diagnostic looked present.
    # An entity can be read over HTTP with no log stream and no guessing
    # about levels.
    on_touch:
      - text_sensor.template.publish:
          id: last_touch
          state: !lambda |-
            char b[56];
            snprintf(b, sizeof(b), "x=%d y=%d (raw %d,%d)",
                     touch.x, touch.y, touch.x_raw, touch.y_raw);
            return {b};

text_sensor:
  - platform: template
    name: "Last Touch"
    id: last_touch
    entity_category: diagnostic

sensor:
  # TDS meter analog output -> GPIO35 (ADC1, input-only)
  - platform: adc
    pin: GPIO35
    id: tds_voltage
    update_interval: 500ms
    attenuation: 12db
    raw: false
    internal: true
    filters:
      # 20 samples smoothed -- the probe output is noisy AC-excited
      - median:
          window_size: 20
          send_every: 4
          send_first_at: 4

font:
  # LVGL references these by id. Glyph sets stay tight -- a 44px face with
  # the full alphabet is a lot of flash for characters nothing renders.
  #
  # A character that is rendered but absent here does NOT fail the build.
  # LVGL draws a placeholder box and the config looks fine, so the only
  # symptom is a square on the panel. Three shipped that way: '&' in the
  # WATER & MODEL header, '/' in "uS/cm" and "F/h", and '+' on the setpoint
  # button and the %+ drift sign.
  #
  # When adding or editing any rendered string, check every character in it
  # against the face it will use -- including signs a printf conversion can
  # emit ("%+.2f" produces '+' as well as '-') and the separators inside
  # unit strings. Which face a label uses may come from a style rather than
  # a text_font: the caption style is font_sm.
  - file: "gfonts://Roboto@700"
    id: font_xl
    size: 44
    # '+' for the setpoint button; '-' already covers its partner.
    glyphs: "0123456789.-+"
  # The Water & Model cards carry a caption and a sub-line as well as the
  # number, which font_xl (52px line box) cannot fit in a card that also
  # has to leave room for two more rows below it. font_xl stays as it is
  # for the home page, where the temperature is the headline and owns the
  # card on its own.
  - file: "gfonts://Roboto@700"
    id: font_lg
    size: 27
    glyphs: "0123456789.-"
  - file: "gfonts://Roboto@700"
    id: font_md
    size: 18
    glyphs: "0123456789.-+/&% ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz°"
  - file: "gfonts://Roboto@500"
    id: font_sm
    size: 13
    glyphs: "0123456789.-+/&% ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz°"

display:
  - platform: mipi_spi
    id: tank_display
    # Board preset: supplies data_rate, cs_pin GPIO15 and dc_pin GPIO2,
    # both already flagged ignore_strapping_warning. Using it instead of
    # hand-rolled ili9xxx pins is not just tidier -- mipi_spi supports
    # buffer_size, and ili9xxx does not. See the RAM note below.
    #
    # IF THE PANEL IS BLANK, GARBLED OR COLOUR-INVERTED, THIS LINE IS WHY.
    # "CYD" covers several boards that differ only in display controller,
    # and the seller's listing is not evidence. ESPHome's presets split
    # them by USB connector:
    #   ESP32-2432S028        Micro USB      ILI9341   <- listing claims this
    #   ESP32-2432S028-7789   USB-C + Micro  ST7789V
    #   ESP32-2432S028-9342   USB-C + Micro  ILI9342
    # The photographed board has USB-C, which points at one of the lower
    # two, while the listing says ILI9341. Cheap clones mislabel routinely
    # and this cannot be settled without the hardware in hand, so start
    # with the listing's claim and swap this one string if it comes up
    # wrong. That one-line swap is the other reason to be on mipi_spi.
    model: ESP32-2432S028
    spi_id: display_bus
    # Landscape is done HERE, in the panel's own MADCTL, not in LVGL.
    #
    # LVGL's rotation: 90 leaves the display reporting its native 240x320
    # and rotates in software -- mipi_spi does not advertise hardware
    # rotation, so LVGL cannot delegate it (only it8951 and epaper_spi do).
    # The touchscreen takes its dimensions from the display, so touch came
    # back in portrait while every widget was laid out in landscape: a tap
    # on HOME reported x=217 y=294, and a y of 294 cannot exist on a
    # 240-tall canvas. No mirror_/swap_ setting fixes that -- they flip and
    # swap axes, they do not rescale 240 into 320 -- and the clamp in
    # Touchscreen::normalize_ rules out stretching it via calibration.
    #
    # swap_xy ALONE. This is MADCTL MV, the standard ILI9341 landscape
    # value. The three settings here replace the model's defaults outright
    # rather than adding to them (get_base_transform takes config over
    # defaults), and this driver defaults to mirror_x=True for portrait --
    # so writing swap_xy + mirror_x yields MV|MX, which is a transpose
    # plus a mirror. That is a reflection, not a rotation, and it renders
    # the UI unusable. The ILI9341 set is: MX portrait, MV landscape,
    # MY portrait-180, MX|MY|MV landscape-180.
    #
    # MV keeps the same physical orientation the LVGL-rotated build had:
    # HOME's centre lands at physical column 220, row 41, which is where
    # the measured tap (raw 3578, 616) fell. The 180 variant would put it
    # in the opposite corner.
    #
    # Rotating here is also free -- the display controller does it, not
    # the CPU, on a board with no PSRAM.
    # Declaring a transform means declaring dimensions too. These are the
    # size AFTER the swap, not the panel's native 240x320: ESPHome swaps
    # the model's native geometry when swap_xy is set and then checks the
    # declared size against it, so 240x320 here fails validation with
    # "Invalid offsets" (it computes a negative pad).
    dimensions:
      width: 320
      height: 240
    transform:
      swap_xy: true
      mirror_x: false
      mirror_y: false
    # Same reasoning as the C6 board: a full redraw is expensive and water
    # temperature does not move in a second.
    update_interval: 5s
    # The lambda paints every pixel itself, so the automatic pre-frame
    # clear is a wasted full-screen fill.
    auto_clear_enabled: false
    # 50%, NOT 100% -- and this is the whole reason for the driver switch.
    # A full 320*240*2 = 154kB framebuffer does not fit: this board has no
    # PSRAM, and the build leaves roughly 125kB of the tracked DRAM segment
    # once statics are placed, before Wi-Fi and MQTT take theirs. ili9xxx
    # allocates all 154kB in one go with no partial-buffer mode, and on
    # failure calls mark_failed() -- the screen simply never appears while
    # every other component runs fine. mipi_spi renders in stripes instead.
    # LVGL keeps its own draw buffer on top of this, so this one only has
    # to be big enough to flush a stripe.
    buffer_size: 25%

# ---------------------------------------------------------------------
# LVGL UI. Only this board -- the C6's hand-drawn screen is untouched and
# stays exactly as it is.
#
# Why LVGL here and not there: this panel is 320x240 with a touchscreen,
# and LVGL brings real compositing -- gradients, alpha, anti-aliased
# rounded corners, shadows -- none of which the raw display API can do.
# The C6 has a 320x172 strip, no touch, and a layout already tuned to be
# read across a room; LVGL there would cost flash and buy nothing.
# ---------------------------------------------------------------------
lvgl:
  displays: [tank_display]
  touchscreens: [tank_touch]
  # Without PSRAM this is the knob that matters. LVGL warns if it cannot
  # allocate; 12% of 320x240x2 is ~18kB, which draws in bands.
  buffer_size: 12%
  # Native panel is 240x320 portrait; 90 gives 320x240 landscape with the
  # USB-C edge on the left.
  bg_color: 0x0B1220

  style_definitions:
    # One card style, reused. Soft shadow and a 14px radius are what make
    # this read as a modern UI rather than boxes -- both are genuine LVGL
    # compositing, not shapes faking it.
    - id: card
      bg_color: 0x141F30
      bg_grad_color: 0x0F1826
      bg_grad_dir: VER
      bg_opa: COVER
      radius: 14
      border_width: 0
      shadow_width: 10
      shadow_offset_y: 3
      shadow_color: 0x000000
      shadow_opa: 60%
      pad_all: 8
    - id: caption
      text_font: font_sm
      text_color: 0x7C8AA0

  pages:
    - id: page_home
      bg_color: 0x0B1220
      bg_grad_color: 0x101B2B
      bg_grad_dir: VER
      bg_opa: COVER
      widgets:
        # ---- header ------------------------------------------------
        - label:
            id: hdr_title
            x: 14
            y: 10
            text: "AQUARIUM"
            text_font: font_sm
            text_color: 0x5A6b83
        - label:
            id: hdr_light
            x: 200
            y: 10
            width: 106
            text_align: RIGHT
            text: "LIGHT --"
            text_font: font_sm
            text_color: 0x5A6b83

        # ---- temperature arc ---------------------------------------
        - arc:
            id: temp_arc
            x: 12
            y: 34
            width: 168
            height: 168
            start_angle: 135
            end_angle: 45
            min_value: 0
            max_value: 100
            value: 50
            adjustable: false
            arc_width: 12
            arc_color: 0x1B2739
            indicator:
              arc_width: 12
              arc_color: 0x3ECF6E
              arc_rounded: true
        - label:
            id: temp_value
            x: 12
            y: 92
            width: 168
            text_align: CENTER
            text: "--.-"
            text_font: font_xl
            text_color: 0xF2F6FC
        - label:
            id: temp_unit
            x: 12
            y: 140
            width: 168
            text_align: CENTER
            text: "\u00b0F"
            text_font: font_sm
            text_color: 0x7C8AA0
        - label:
            id: temp_state
            x: 12
            y: 162
            width: 168
            text_align: CENTER
            text: "STARTING"
            text_font: font_md
            text_color: 0x3ECF6E

        # ---- right column: target ----------------------------------
        - obj:
            id: card_target
            x: 190
            y: 34
            width: 118
            height: 52
            styles: card
            widgets:
              - label:
                  x: 0
                  y: 0
                  text: "TARGET"
                  styles: caption
              - label:
                  id: target_value
                  x: 0
                  y: 15
                  text: "--.-"
                  text_font: font_md
                  text_color: 0x00C8FF

        # ---- right column: heater ----------------------------------
        - obj:
            id: card_heat
            x: 190
            y: 92
            width: 118
            height: 52
            styles: card
            widgets:
              - label:
                  x: 0
                  y: 0
                  text: "HEATER"
                  styles: caption
              - label:
                  id: heat_value
                  x: 70
                  y: 0
                  width: 30
                  text_align: RIGHT
                  text: "0%"
                  styles: caption
              - bar:
                  id: heat_bar
                  x: 0
                  y: 22
                  width: 100
                  height: 10
                  min_value: 0
                  max_value: 100
                  value: 0
                  bg_color: 0x1B2739
                  radius: 5
                  indicator:
                    bg_color: 0xFFB020
                    bg_grad_color: 0xFF7A00
                    bg_grad_dir: HOR
                    radius: 5

        # ---- right column: fan -------------------------------------
        - obj:
            id: card_fan
            x: 190
            y: 150
            width: 118
            height: 52
            styles: card
            widgets:
              - label:
                  x: 0
                  y: 0
                  text: "FAN"
                  styles: caption
              - label:
                  id: fan_value
                  x: 70
                  y: 0
                  width: 30
                  text_align: RIGHT
                  text: "0%"
                  styles: caption
              - bar:
                  id: fan_bar
                  x: 0
                  y: 22
                  width: 100
                  height: 10
                  min_value: 0
                  max_value: 100
                  value: 0
                  bg_color: 0x1B2739
                  radius: 5
                  indicator:
                    bg_color: 0x00C8FF
                    bg_grad_color: 0x0077FF
                    bg_grad_dir: HOR
                    radius: 5

        # ---- footer chips ------------------------------------------
        - label:
            id: chip_tds
            x: 14
            y: 186
            text: "TDS --"
            styles: caption
        - label:
            id: chip_swing
            x: 110
            y: 186
            text: "SWING --"
            styles: caption
        - label:
            id: chip_conf
            x: 210
            y: 186
            width: 96
            text_align: RIGHT
            text: "LEARN --"
            styles: caption

        # ---- page nav ----------------------------------------------
        # Buttons, not swipes. Resistive touch resolves a tap reliably and
        # a drag poorly, so discrete targets beat gestures on this panel.
        - button:
            id: nav_0_0
            x: 8
            y: 208
            width: 66
            height: 24
            radius: 12
            bg_color: 1976893
            bg_opa: COVER
            border_width: 0
            shadow_width: 0
            widgets:
              - label:
                  align: CENTER
                  text: "HOME"
                  text_font: font_sm
                  text_color: 15922940
            on_release:
              - lvgl.page.show: page_home
        - button:
            id: nav_1_0
            x: 80
            y: 208
            width: 66
            height: 24
            radius: 12
            bg_color: 1252652
            bg_opa: COVER
            border_width: 0
            shadow_width: 0
            widgets:
              - label:
                  align: CENTER
                  text: "SET"
                  text_font: font_sm
                  text_color: 5925763
            on_release:
              - lvgl.page.show: page_control
        - button:
            id: nav_2_0
            x: 152
            y: 208
            width: 66
            height: 24
            radius: 12
            bg_color: 1252652
            bg_opa: COVER
            border_width: 0
            shadow_width: 0
            widgets:
              - label:
                  align: CENTER
                  text: "WATER"
                  text_font: font_sm
                  text_color: 5925763
            on_release:
              - lvgl.page.show: page_water

    # -----------------------------------------------------------------
    - id: page_control
      bg_color: 0x0B1220
      bg_grad_color: 0x101B2B
      bg_grad_dir: VER
      bg_opa: COVER
      widgets:
        - label:
            x: 14
            y: 10
            text: "TARGET TEMPERATURE"
            styles: caption

        # Big steppers rather than a slider: a resistive panel tracks a
        # drag badly, and 0.5 F per press is the resolution that matters.
        - button:
            id: btn_down
            x: 18
            y: 58
            width: 62
            height: 62
            radius: 31
            bg_color: 0x1B2739
            bg_grad_color: 0x131D2C
            bg_grad_dir: VER
            bg_opa: COVER
            border_width: 0
            shadow_width: 10
            shadow_offset_y: 3
            shadow_color: 0x000000
            shadow_opa: 60%
            widgets:
              - label:
                  align: CENTER
                  text: "-"
                  text_font: font_xl
                  text_color: 0x00C8FF
            on_release:
              - lambda: |-
                  float f = id(controller).get_setpoint() * 9.0f / 5.0f + 32.0f - 0.5f;
                  id(controller).set_setpoint((f - 32.0f) * 5.0f / 9.0f);
                  id(target_temperature).publish_state(f);

        - label:
            id: set_value
            x: 90
            y: 62
            width: 140
            text_align: CENTER
            text: "--.-"
            text_font: font_xl
            text_color: 0xF2F6FC
        - label:
            x: 90
            y: 108
            width: 140
            text_align: CENTER
            text: "\u00b0F"
            styles: caption

        - button:
            id: btn_up
            x: 240
            y: 58
            width: 62
            height: 62
            radius: 31
            bg_color: 0x1B2739
            bg_grad_color: 0x131D2C
            bg_grad_dir: VER
            bg_opa: COVER
            border_width: 0
            shadow_width: 10
            shadow_offset_y: 3
            shadow_color: 0x000000
            shadow_opa: 60%
            widgets:
              - label:
                  align: CENTER
                  text: "+"
                  text_font: font_xl
                  text_color: 0x00C8FF
            on_release:
              - lambda: |-
                  float f = id(controller).get_setpoint() * 9.0f / 5.0f + 32.0f + 0.5f;
                  id(controller).set_setpoint((f - 32.0f) * 5.0f / 9.0f);
                  id(target_temperature).publish_state(f);

        - obj:
            x: 14
            y: 136
            width: 292
            height: 58
            styles: card
            widgets:
              - label:
                  x: 0
                  y: 4
                  text: "ADAPTIVE LEARNING"
                  styles: caption
              - label:
                  x: 0
                  y: 24
                  text: "BACKLIGHT"
                  styles: caption
              - switch:
                  id: sw_learn
                  x: 208
                  y: 0
                  width: 60
                  height: 20
                  on_value:
                    - lambda: id(controller).set_learning_enabled(x);
              - switch:
                  id: sw_light
                  x: 208
                  y: 22
                  width: 60
                  height: 20
