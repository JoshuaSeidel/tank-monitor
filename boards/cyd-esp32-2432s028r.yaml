# "CYD" ESP32-2432S028R -- ESP32-WROOM-32E with a 2.8" 240x320 ILI9341 and
# a resistive XPT2046 touch panel.
#
# DISPLAY ONLY. Pair with packages/base.yaml, packages/remote_display.yaml
# and packages/chemistry.yaml -- NOT control.yaml or sensors.yaml.
#
# ---------------------------------------------------------------
# Why this board runs no sensors
# ---------------------------------------------------------------
# Almost every GPIO here is spoken for internally: 12-15 display,
# 25/32/33/36/39 touch, 4/16/17 RGB LED, 21 backlight, 26 speaker,
# 34 onboard LDR, 5/18/19/23 microSD. What reaches a connector on this
# revision is IO35, the SPI header (IO23/19/18/27) and the UART pins.
#
# That is barely enough for a probe, a TDS meter, a light sensor and two
# relays, and getting there meant repurposing the microSD bus, powering
# the light sensor off a pin that also flashes the chip, and metering the
# speaker header to find out whether it reached the pin or an amplifier.
# Every one of those is a real constraint fighting a real requirement.
#
# So the roles are split instead. The C6 keeps the probe, the relays and
# the control loop -- the tank is regulated by hardware bolted to it, and
# keeps being regulated whether or not this panel is plugged in. This
# board subscribes to the C6's values and draws them. It needs no GPIO at
# all beyond its own screen: no pull-up, no relay wiring, no ADC pin, and
# the microSD slot is free for use again.
#
# The sensor pin map that used to live here is gone with the hardware it
# described. If this board is ever converted back to a controller, the
# assignment was: TDS IO35, heater IO27, fan IO18, DS18B20 IO19 (with a
# 4.7k pull-up), BH1750 on IO1/IO3, and NOT IO22 -- which this revision
# does not break out -- and NOT the speaker header, which reaches IO26
# through the audio amplifier.
#
# ---------------------------------------------------------------
# Battery (optional)
# ---------------------------------------------------------------
# The BAT connector on this board feeds the charger; on this revision
# nothing routes battery voltage to an ADC, so the panel cannot read it
# without a divider. Two resistors from BAT+ to IO35 (free now that this
# board runs no sensors) and battery_divider set to the ratio:
#
#   BAT+ ---[ R1 ]---+--- IO35
#                    |
#                   [ R2 ]
#                    |
#   BAT- / GND ------+
#
# 100k/100k gives a ratio of 2.0 and halves 4.2V to 2.1V, inside ADC1's
# range at 12db. Equal resistors also mean the divider itself only draws
# ~20uA, which will not meaningfully flatten the cell.
#
# With the divider fitted and no battery attached the pin reads near zero
# through R2, which is how the indicator knows to hide itself. WITHOUT the
# divider IO35 floats and can read anything -- there is no internal pulldown
# on 34-39 -- so fit it before trusting the number.
#
# Calibrate once: meter the pack, compare with the Battery Voltage sensor,
# and adjust battery_divider by the ratio between them. Resistor tolerance
# is the whole error here.
substitutions:
  battery_divider: "2.0"
  # Below this, assume no pack is connected and hide the indicator.
  battery_absent_v: "2.5"

esp32:
  board: esp32dev
  flash_size: 4MB
  framework:
    type: esp-idf

# Overrides packages/base.yaml. 0 disables the UART entirely so the logger
# does not fight the BH1750 for IO1/IO3.
logger:
  level: INFO
  baud_rate: 0

# ESPHome's default MQTT unique_id generator is "legacy", which builds
# "ESP" + component_type + object_id and includes neither the device name
# nor the MAC. Two boards running the same package set therefore publish
# byte-identical unique_ids -- "ESPsensorwater_temperature" on both -- and
# Home Assistant silently drops the second registration. The symptom is
# entities that never appear, with no error anywhere, and renaming the
# device does not help because the name was never part of the id.
#
# Only the chemistry sensors got through, being the sole entities the
# other board does not also have.
#
# "mac" generates MAC + component_type + hash(friendly_name), which is
# unique per board. Set here rather than in base.yaml on purpose: changing
# it on the C6 would regenerate every one of its unique_ids, orphaning its
# existing entities and their history.
mqtt:
  discovery_unique_id_generator: mac

spi:
  # Display bus (HSPI pins). MISO is wired but the panel never talks back;
  # it is here because the driver expects a complete bus.
  - id: display_bus
    clk_pin: GPIO14
    mosi_pin: GPIO13
    miso_pin:
      # GPIO12 is a strapping pin (MTDI selects flash voltage at reset).
      # That is the board's own wiring, not a choice made here, and the
      # panel never drives MISO -- so the warning is noise.
      number: GPIO12
      ignore_strapping_warning: true
  # Touch is on its own bus, not shared: the CYD wires XPT2046 to a
  # completely separate set of pins rather than to HSPI.
  - id: touch_bus
    clk_pin: GPIO25
    mosi_pin: GPIO32
    miso_pin: GPIO39

output:
  - platform: ledc
    id: backlight_output
    pin: GPIO21

light:
  - platform: monochromatic
    id: display_backlight
    name: "Display Backlight"
    output: backlight_output
    restore_mode: ALWAYS_ON
    default_transition_length: 250ms

# Tap anywhere to kill or restore the backlight. A lit 2.8" panel next to
# a tank is bright in a dark room, and this is the only physical control
# the enclosure exposes. Coordinates are ignored, so no calibration needed.
touchscreen:
  - platform: xpt2046
    id: tank_touch
    spi_id: touch_bus
    cs_pin: GPIO33
    interrupt_pin: GPIO36
    update_interval: 50ms
    threshold: 400
    # swap_xy here too, and for a different reason than the display's.
    #
    # Touchscreen::add_raw_touch_position_ swaps the axes BEFORE storing
    # x_raw/y_raw, so the (616, 3578) reported by the diagnostic was
    # already swapped -- the digitiser actually read (3578, 616). Reading
    # that pair as if it were unswapped is what made "no transform" look
    # right; it is not.
    #
    # Worked through with the real algorithm, tapping HOME:
    #   swap        -> x_raw=616, y_raw=3578
    #   normalise x -> (616-280)/3580  = 0.094 -> x = 0.094*320 = 30
    #   normalise y -> (3578-340)/3520 = 0.920 -> y = 0.920*240 = 221
    # (30, 221) is inside HOME's box: x 8-74, y 208-232.
    #
    # Note the calibration pairs are applied AFTER the swap, so x_min/x_max
    # bound the digitiser's y axis and vice versa. Do not "fix" that.
    transform:
      swap_xy: true
      mirror_x: false
      mirror_y: false
    # Stock CYD calibration. These now matter: LVGL hit-tests real
    # coordinates against real widgets, where before any press anywhere
    # just toggled the backlight.
    calibration:
      x_min: 280
      x_max: 3860
      y_min: 340
      y_max: 3860
    # Reports where the driver thinks each press landed. Tap the nav
    # buttons and compare against their coordinates -- HOME is x 8-74,
    # SET 80-146, WATER 152-218, all at y 208-232.
    #
    # This publishes to an entity rather than logging. The previous
    # version used logger.log, which defaults to DEBUG while this board
    # runs the logger at INFO, so it printed nothing and the calibration
    # question stayed open for as long as the diagnostic looked present.
    # An entity can be read over HTTP with no log stream and no guessing
    # about levels.
    on_touch:
      - text_sensor.template.publish:
          id: last_touch
          state: !lambda |-
            char b[56];
            snprintf(b, sizeof(b), "x=%d y=%d (raw %d,%d)",
                     touch.x, touch.y, touch.x_raw, touch.y_raw);
            return {b};

text_sensor:
  - platform: template
    name: "Last Touch"
    id: last_touch
    entity_category: diagnostic

sensor:
  - platform: adc
    pin: GPIO35
    id: batt_voltage
    name: "Battery Voltage"
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    entity_category: diagnostic
    accuracy_decimals: 2
    attenuation: 12db
    update_interval: 60s
    filters:
      - multiply: ${battery_divider}
      # A pack under load sags on every screen redraw; the median is what
      # makes the percentage stop jittering between refreshes.
      - median:
          window_size: 5
          send_every: 1
          send_first_at: 1

  - platform: template
    id: batt_pct
    name: "Battery Level"
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 60s
    lambda: |-
      const float v = id(batt_voltage).state;
      if (isnan(v) || v < ${battery_absent_v}) return {};
      // Single-cell LiPo resting curve. Voltage maps to charge very
      // non-linearly -- the pack sits near 3.7V for most of its life and
      // then falls off a cliff -- so a straight line from 3.0 to 4.2
      // would read ~50% when the cell is nearly flat.
      static const float V[] = {3.30f, 3.40f, 3.50f, 3.60f, 3.65f, 3.70f,
                                3.75f, 3.80f, 3.85f, 3.90f, 3.95f, 4.00f,
                                4.05f, 4.10f, 4.15f, 4.20f};
      static const float P[] = {  0.0f,  5.0f, 11.0f, 20.0f, 27.0f, 35.0f,
                                 42.0f, 50.0f, 58.0f, 65.0f, 72.0f, 80.0f,
                                 85.0f, 90.0f, 95.0f,100.0f};
      const int n = sizeof(V) / sizeof(V[0]);
      if (v <= V[0]) return 0.0f;
      if (v >= V[n - 1]) return 100.0f;
      for (int i = 1; i < n; i++) {
        if (v < V[i]) {
          const float f = (v - V[i - 1]) / (V[i] - V[i - 1]);
          return P[i - 1] + f * (P[i] - P[i - 1]);
        }
      }
      return 100.0f;

  - platform: template
    id: batt_hours
    name: "Battery Runtime"
    unit_of_measurement: "h"
    state_class: measurement
    entity_category: diagnostic
    accuracy_decimals: 1
    update_interval: 60s
    lambda: |-
      if (isnan(id(batt_rate_pph)) || id(batt_rate_pph) <= 0.5f) return {};
      if (isnan(id(batt_pct).state)) return {};
      return id(batt_pct).state / id(batt_rate_pph);

globals:
  - id: batt_pct_prev
    type: float
    restore_value: false
    initial_value: 'NAN'
  - id: batt_prev_t
    type: uint32_t
    restore_value: false
    initial_value: '0'
  # Percent per hour, positive while discharging. Restored so a panel that
  # reboots does not forget everything it learned about the discharge rate
  # and go back to showing no estimate for half an hour.
  - id: batt_rate_pph
    type: float
    restore_value: true
    initial_value: 'NAN'
  - id: batt_charging
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: batt_v_prev
    type: float
    restore_value: false
    initial_value: 'NAN'

binary_sensor:
  - platform: template
    name: "Battery Charging"
    device_class: battery_charging
    entity_category: diagnostic
    lambda: "return id(batt_charging);"

font:
  # LVGL references these by id. Glyph sets stay tight -- a 44px face with
  # the full alphabet is a lot of flash for characters nothing renders.
  #
  # A character that is rendered but absent here does NOT fail the build.
  # LVGL draws a placeholder box and the config looks fine, so the only
  # symptom is a square on the panel. Three shipped that way: '&' in the
  # WATER & MODEL header, '/' in "uS/cm" and "F/h", and '+' on the setpoint
  # button and the %+ drift sign.
  #
  # When adding or editing any rendered string, check every character in it
  # against the face it will use -- including signs a printf conversion can
  # emit ("%+.2f" produces '+' as well as '-') and the separators inside
  # unit strings. Which face a label uses may come from a style rather than
  # a text_font: the caption style is font_sm.
  - file: "gfonts://Roboto@700"
    id: font_xl
    size: 44
    # '+' for the setpoint button; '-' already covers its partner.
    glyphs: "0123456789.-+"
  # The Water & Model cards carry a caption and a sub-line as well as the
  # number, which font_xl (52px line box) cannot fit in a card that also
  # has to leave room for two more rows below it. font_xl stays as it is
  # for the home page, where the temperature is the headline and owns the
  # card on its own.
  - file: "gfonts://Roboto@700"
    id: font_lg
    size: 27
    glyphs: "0123456789.-"
  - file: "gfonts://Roboto@700"
    id: font_md
    size: 18
    glyphs: "0123456789.-+/&% ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz°"
  - file: "gfonts://Roboto@500"
    id: font_sm
    size: 13
    glyphs: "0123456789.-+/&% ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz°"

display:
  - platform: mipi_spi
    id: tank_display
    # Board preset: supplies data_rate, cs_pin GPIO15 and dc_pin GPIO2,
    # both already flagged ignore_strapping_warning. Using it instead of
    # hand-rolled ili9xxx pins is not just tidier -- mipi_spi supports
    # buffer_size, and ili9xxx does not. See the RAM note below.
    #
    # IF THE PANEL IS BLANK, GARBLED OR COLOUR-INVERTED, THIS LINE IS WHY.
    # "CYD" covers several boards that differ only in display controller,
    # and the seller's listing is not evidence. ESPHome's presets split
    # them by USB connector:
    #   ESP32-2432S028        Micro USB      ILI9341   <- listing claims this
    #   ESP32-2432S028-7789   USB-C + Micro  ST7789V
    #   ESP32-2432S028-9342   USB-C + Micro  ILI9342
    # The photographed board has USB-C, which points at one of the lower
    # two, while the listing says ILI9341. Cheap clones mislabel routinely
    # and this cannot be settled without the hardware in hand, so start
    # with the listing's claim and swap this one string if it comes up
    # wrong. That one-line swap is the other reason to be on mipi_spi.
    model: ESP32-2432S028
    spi_id: display_bus
    # Landscape is done HERE, in the panel's own MADCTL, not in LVGL.
    #
    # LVGL's rotation: 90 leaves the display reporting its native 240x320
    # and rotates in software -- mipi_spi does not advertise hardware
    # rotation, so LVGL cannot delegate it (only it8951 and epaper_spi do).
    # The touchscreen takes its dimensions from the display, so touch came
    # back in portrait while every widget was laid out in landscape: a tap
    # on HOME reported x=217 y=294, and a y of 294 cannot exist on a
    # 240-tall canvas. No mirror_/swap_ setting fixes that -- they flip and
    # swap axes, they do not rescale 240 into 320 -- and the clamp in
    # Touchscreen::normalize_ rules out stretching it via calibration.
    #
    # swap_xy ALONE. This is MADCTL MV, the standard ILI9341 landscape
    # value. The three settings here replace the model's defaults outright
    # rather than adding to them (get_base_transform takes config over
    # defaults), and this driver defaults to mirror_x=True for portrait --
    # so writing swap_xy + mirror_x yields MV|MX, which is a transpose
    # plus a mirror. That is a reflection, not a rotation, and it renders
    # the UI unusable. The ILI9341 set is: MX portrait, MV landscape,
    # MY portrait-180, MX|MY|MV landscape-180.
    #
    # MV keeps the same physical orientation the LVGL-rotated build had:
    # HOME's centre lands at physical column 220, row 41, which is where
    # the measured tap (raw 3578, 616) fell. The 180 variant would put it
    # in the opposite corner.
    #
    # Rotating here is also free -- the display controller does it, not
    # the CPU, on a board with no PSRAM.
    # Declaring a transform means declaring dimensions too. These are the
    # size AFTER the swap, not the panel's native 240x320: ESPHome swaps
    # the model's native geometry when swap_xy is set and then checks the
    # declared size against it, so 240x320 here fails validation with
    # "Invalid offsets" (it computes a negative pad).
    dimensions:
      width: 320
      height: 240
    transform:
      swap_xy: true
      mirror_x: false
      mirror_y: false
    # Same reasoning as the C6 board: a full redraw is expensive and water
    # temperature does not move in a second.
    update_interval: 5s
    # The lambda paints every pixel itself, so the automatic pre-frame
    # clear is a wasted full-screen fill.
    auto_clear_enabled: false
    # 50%, NOT 100% -- and this is the whole reason for the driver switch.
    # A full 320*240*2 = 154kB framebuffer does not fit: this board has no
    # PSRAM, and the build leaves roughly 125kB of the tracked DRAM segment
    # once statics are placed, before Wi-Fi and MQTT take theirs. ili9xxx
    # allocates all 154kB in one go with no partial-buffer mode, and on
    # failure calls mark_failed() -- the screen simply never appears while
    # every other component runs fine. mipi_spi renders in stripes instead.
    # LVGL keeps its own draw buffer on top of this, so this one only has
    # to be big enough to flush a stripe.
    buffer_size: 25%

# ---------------------------------------------------------------------
# LVGL UI. Only this board -- the C6's hand-drawn screen is untouched and
# stays exactly as it is.
#
# Why LVGL here and not there: this panel is 320x240 with a touchscreen,
# and LVGL brings real compositing -- gradients, alpha, anti-aliased
# rounded corners, shadows -- none of which the raw display API can do.
# The C6 has a 320x172 strip, no touch, and a layout already tuned to be
# read across a room; LVGL there would cost flash and buy nothing.
# ---------------------------------------------------------------------
lvgl:
  displays: [tank_display]
  touchscreens: [tank_touch]
  # Without PSRAM this is the knob that matters. LVGL warns if it cannot
  # allocate; 12% of 320x240x2 is ~18kB, which draws in bands.
  buffer_size: 12%
  # Native panel is 240x320 portrait; 90 gives 320x240 landscape with the
  # USB-C edge on the left.
  bg_color: 0x0B1220

  style_definitions:
    # One card style, reused. Soft shadow and a 14px radius are what make
    # this read as a modern UI rather than boxes -- both are genuine LVGL
    # compositing, not shapes faking it.
    - id: card
      bg_color: 0x141F30
      bg_grad_color: 0x0F1826
      bg_grad_dir: VER
      bg_opa: COVER
      radius: 14
      border_width: 0
      shadow_width: 10
      shadow_offset_y: 3
      shadow_color: 0x000000
      shadow_opa: 60%
      pad_all: 8
    - id: caption
      text_font: font_sm
      text_color: 0x7C8AA0

  # Drawn above every page, so the battery is visible wherever you are
  # without three copies of it drifting out of sync. Sits in the strip to
  # the right of the nav buttons, which end at x=218.
  #
  # Built from plain objects rather than a font glyph on purpose: the font
  # sets here are trimmed to the characters actually used, and a missing
  # glyph renders as a box with no build error. A rectangle cannot go
  # missing, and it can be filled proportionally, which a glyph cannot.
  top_layer:
    widgets:
      - obj:
          id: batt_box
          x: 226
          y: 206
          width: 88
          height: 28
          bg_opa: TRANSP
          border_width: 0
          pad_all: 0
          scrollable: false
          clickable: false
          hidden: true
          widgets:
            # body outline
            - obj:
                x: 0
                y: 5
                width: 26
                height: 14
                radius: 3
                bg_opa: TRANSP
                border_width: 2
                border_color: 0x7C8AA0
                pad_all: 0
                scrollable: false
                clickable: false
            # charge fill -- width set from the percentage each tick
            - obj:
                id: batt_fill
                x: 2
                y: 7
                width: 22
                height: 10
                radius: 1
                bg_color: 0x3ECF6E
                bg_opa: COVER
                border_width: 0
                pad_all: 0
                scrollable: false
                clickable: false
            # terminal nub
            - obj:
                x: 26
                y: 9
                width: 3
                height: 6
                radius: 1
                bg_color: 0x7C8AA0
                bg_opa: COVER
                border_width: 0
                pad_all: 0
                scrollable: false
                clickable: false
            - label:
                id: batt_text
                x: 33
                y: 6
                width: 55
                text: ""
                text_font: font_sm
                text_color: 0xF2F6FC

  pages:
    - id: page_home
      bg_color: 0x0B1220
      bg_grad_color: 0x101B2B
      bg_grad_dir: VER
      bg_opa: COVER
      widgets:
        # ---- header ------------------------------------------------
        - label:
            id: hdr_title
            x: 14
            y: 10
            text: "AQUARIUM"
            text_font: font_sm
            text_color: 0x5A6b83
        - label:
            id: hdr_light
            x: 110
            y: 10
            width: 100
            text_align: CENTER
            text: "LIGHT --"
            text_font: font_sm
            text_color: 0x5A6b83

        # ---- link status, top right --------------------------------
        # Wi-Fi fan and an ESP-NOW broadcast symbol. Green connected, red
        # not. Drawn as arcs rather than glyphs for the same reason as the
        # battery: the font sets here are trimmed to the characters in use
        # and a missing glyph renders as a box with no build error.
        #
        # The two are genuinely independent. ESP-NOW is peer to peer, so
        # the panel keeps its tank data with Wi-Fi down -- red Wi-Fi and
        # green radio is a working panel, not a fault. The reverse, green
        # Wi-Fi and red radio, means the controller is unreachable and the
        # numbers on screen are stale.
        - arc:
            id: wifi_a3
            x: 246
            y: 8
            width: 24
            height: 24
            start_angle: 225
            end_angle: 315
            arc_width: 3
            min_value: 0
            max_value: 100
            value: 0
            adjustable: false
            clickable: false
        - arc:
            id: wifi_a2
            x: 250
            y: 12
            width: 16
            height: 16
            start_angle: 225
            end_angle: 315
            arc_width: 3
            min_value: 0
            max_value: 100
            value: 0
            adjustable: false
            clickable: false
        - obj:
            id: wifi_dot
            x: 256
            y: 18
            width: 5
            height: 5
            radius: 3
            bg_opa: COVER
            border_width: 0
            pad_all: 0
            scrollable: false
            clickable: false

        - arc:
            id: now_left
            x: 282
            y: 10
            width: 20
            height: 20
            start_angle: 135
            end_angle: 225
            arc_width: 3
            min_value: 0
            max_value: 100
            value: 0
            adjustable: false
            clickable: false
        - arc:
            id: now_right
            x: 282
            y: 10
            width: 20
            height: 20
            start_angle: 315
            end_angle: 45
            arc_width: 3
            min_value: 0
            max_value: 100
            value: 0
            adjustable: false
            clickable: false
        - obj:
            id: now_dot
            x: 289
            y: 17
            width: 6
            height: 6
            radius: 3
            bg_opa: COVER
            border_width: 0
            pad_all: 0
            scrollable: false
            clickable: false

        # ---- temperature arc ---------------------------------------
        - arc:
            id: temp_arc
            x: 12
            y: 34
            width: 168
            height: 168
            start_angle: 135
            end_angle: 45
            min_value: 0
            max_value: 100
            value: 50
            adjustable: false
            arc_width: 12
            arc_color: 0x1B2739
            indicator:
              arc_width: 12
              arc_color: 0x3ECF6E
              arc_rounded: true
        - label:
            id: temp_value
            x: 12
            y: 92
            width: 168
            text_align: CENTER
            text: "--.-"
            text_font: font_xl
            text_color: 0xF2F6FC
        - label:
            id: temp_unit
            x: 12
            y: 140
            width: 168
            text_align: CENTER
            text: "\u00b0F"
            text_font: font_sm
            text_color: 0x7C8AA0
        - label:
            id: temp_state
            x: 12
            y: 162
            width: 168
            text_align: CENTER
            text: "STARTING"
            text_font: font_md
            text_color: 0x3ECF6E

        # ---- right column: target ----------------------------------
        - obj:
            id: card_target
            x: 190
            y: 34
            width: 118
            height: 52
            styles: card
            widgets:
              - label:
                  x: 0
                  y: 0
                  text: "TARGET"
                  styles: caption
              - label:
                  id: target_value
                  x: 0
                  y: 15
                  text: "--.-"
                  text_font: font_md
                  text_color: 0x00C8FF

        # ---- right column: heater ----------------------------------
        - obj:
            id: card_heat
            x: 190
            y: 92
            width: 118
            height: 52
            styles: card
            widgets:
              - label:
                  x: 0
                  y: 10
                  text: "HEATER"
                  styles: caption
              - label:
                  id: heat_value
                  x: 56
                  y: 7
                  width: 46
                  text_align: RIGHT
