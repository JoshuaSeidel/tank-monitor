# Waveshare ESP32-S3-Touch-LCD-4.3 -- 800x480 panel for the large tank.
#
# Display-only, like the CYD and the round AMOLED: no probes, no relays, no
# control loop. It subscribes to the controller's BLE telemetry and renders
# it, so the tank stays regulated whatever this board is doing.
#
# Pair with packages/base.yaml, packages/webui.yaml, packages/chemistry.yaml
# and packages/ble_link_panel_v3.yaml. NOT ble_link_panel.yaml and NOT
# remote_display.yaml -- all three define the same ids and collide.
#
# ---------------------------------------------------------------
# Why lambda drawing and not LVGL
# ---------------------------------------------------------------
# The other two panels use LVGL. This one does not, deliberately: the tank
# view is a one-point-perspective interior drawn from live geometry, and
# LVGL has no path primitives. Doing it in LVGL would mean a baked PNG that
# cannot respond to data.
#
# rpi_dpi_rgb extends display.FULL_DISPLAY_SCHEMA, so pages: and lambda:
# are both available -- verified against ESPHome 2026.8.2. pages: and
# lambda: are cv.Exclusive, hence pages.
#
# COST: auto_clear plus a full redraw is ~384k pixel writes plus a ~768 KB
# PSRAM flush, measured in tens of milliseconds. At the 1s update_interval
# below that is a few percent duty and entirely fine. If it ever tears,
# the escape hatch is auto_clear_enabled: false and dirty-region redraw.
#
# ---------------------------------------------------------------
# Pins -- verified, not assumed
# ---------------------------------------------------------------
# From Waveshare's own reference and cross-checked against a published
# working ESPHome config. Getting an RGB data pin wrong does not error: the
# panel comes up blank or colour-shifted, which is indistinguishable from a
# dead backlight.
#
#   DE 5   PCLK 7   HSYNC 46   VSYNC 3
#   R: 1, 2, 42, 41, 40          (5 bits)
#   G: 39, 0, 45, 48, 47, 21     (6 bits)
#   B: 14, 38, 18, 17, 10        (5 bits)
#   I2C: SDA 8, SCL 9            GT911 touch + CH422G expander
#   GT911 INT 4, RST via CH422G pin 1
#   Display enable CH422G pin 2, display reset CH422G pin 3
#
# GPIO0, 3, 45 and 46 are strapping pins on the S3 and are used here
# because the panel's routing gives no choice -- hence the explicit
# ignore_strapping_warning on each. That is the board's design, not a
# shortcut.
#
# PSRAM IS MANDATORY: the framebuffer is 800*480*2 = 768 KB and cannot live
# in internal RAM. Octal mode at 80MHz, because the RGB peripheral streams
# the whole buffer every frame and quad PSRAM cannot keep up -- the symptom
# is horizontal tearing that looks like a bad ribbon cable.

# Physical layout of the tank, in inches, so page 2 draws the hardware where
# it actually is. Override in the wrapper. Everything on the back wall is
# placed from these -- change the width and every position rescales.
substitutions:
  tank_width_in:     "48"    # interior width -- standard 75 gal is 48 x 18 x 21
  heater_inset_in:   "4"     # each heater this far in from its end
  spray_bar_len_in:  "12"    # centred on the back wall
  intake_from_left_in: "1"   # intake pipe, measured from the LEFT end
  # "true": two heaters, two probes, the L-R gradient -- the 75's layout.
  # "false": one heater, one probe; the half/gradient cards show heater and
  # fan duty and the light level instead. Pasted into the lambdas as a C++
  # bool, so it must be exactly true or false.
  dual_system: "true"
  # The header on every page. f_small's glyph set: letters, digits, space
  # and .,:-+/%° only -- an apostrophe would silently not draw.
  tank_title: "Display Tank"
  # Single-system only (dual_system "false"). The heater sits at
  # heater_inset_in from the LEFT; the probe and the rim-clipped cooling
  # fan are placed from the left as well.
  probe_from_left_in: "10"
  fan_from_left_in:   "16"
  # Interior height, inches. Single-system only: the drawing takes its
  # proportions from width:height. The 75 keeps its fixed frame.
  tank_height_in: "21"
  # "true": a dual sponge filter -- two sponges on one lift tube -- standing
  # on the substrate instead of the intake and spray bar. Centred at
  # sponge_from_left_in, sponge_spacing_in centre to centre.
  sponge_filters: "false"
  sponge_from_left_in: "12"
  sponge_spacing_in: "4.5"

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 8MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESPTOOLPY_FLASHMODE_QIO: y
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: y

psram:
  mode: octal
  speed: 80MHz

# See boards/xiao-esp32s3.yaml for the full story: ESPHome's default
# "legacy" unique_id generator omits the device name, so this panel's
# entities would collide with another board's in Home Assistant --
# silently, with nothing in the log.
mqtt:
  discovery_unique_id_generator: mac

i2c:
  sda: GPIO8
  scl: GPIO9
  scan: true

# The panel's reset, enable and touch-reset lines are not on the ESP32 at
# all -- they hang off this expander. Without it the display never leaves
# reset and the screen stays black with a perfectly valid config.
# The CH422G has no configurable address -- it answers on a fixed set of
# I2C addresses and the component handles that itself, so `address:` is not
# an option here.
ch422g:
  - id: io_ex

display:
  - platform: rpi_dpi_rgb
    id: tank_display
    # 5s: the controller notifies every 5s, so nothing changes faster than
    # that. Redrawing at 1s was pure waste -- and a full redraw here costs
    # ~2.4s, not the ~30ms first estimated, because every primitive on this
    # driver lands as ONE esp_lcd call PER PIXEL (see the frect helper).
    update_interval: 5s
    # NEVER auto-clear on an RGB panel. The peripheral streams the
    # framebuffer to the glass continuously, so a clear-then-redraw is
    # watched live: black, then a top-to-bottom paint, every cycle. Instead
    # each region repaints its own background before its content, and the
    # only full clear is the first frame and a page change -- see
    # panel_dirty.
    auto_clear_enabled: false
    on_page_change:
      - lambda: id(panel_dirty) = true;
    color_order: RGB
    pclk_frequency: 14MHz
    dimensions:
      width: 800
      height: 480
    de_pin: GPIO5
    pclk_pin: GPIO7
    hsync_pin:
      number: GPIO46
      ignore_strapping_warning: true
    vsync_pin:
      number: GPIO3
      ignore_strapping_warning: true
    hsync_back_porch: 10
    hsync_front_porch: 20
    hsync_pulse_width: 10
    vsync_back_porch: 10
    vsync_front_porch: 10
    vsync_pulse_width: 10
    data_pins:
      red: [GPIO1, GPIO2, GPIO42, GPIO41, GPIO40]
      green:
        - GPIO39
        - number: GPIO0
          ignore_strapping_warning: true
        - number: GPIO45
          ignore_strapping_warning: true
        - GPIO48
        - GPIO47
        - GPIO21
      blue: [GPIO14, GPIO38, GPIO18, GPIO17, GPIO10]
    reset_pin:
      ch422g: io_ex
      number: 3
    enable_pin:
      ch422g: io_ex
      number: 2

    pages:
      # ===========================================================
      # PAGE 1 -- MAIN. Radial band gauge plus the numbers you act on.
      # ===========================================================
      - id: page_main
        lambda: |-
          float *SLOTS = id(p1_last);
          enum { SLOT_CLOCK = 0, SLOT_T, SLOT_SP, SLOT_STATE, SLOT_TB, SLOT_G, SLOT_PH, SLOT_TDS,
                 SLOT_HEAT, SLOT_FAN, SLOT_LINK, SLOT_BLE, SLOT_AUX, SLOT_CO2, SLOT_AIR };
          const Color BG(7, 11, 15), CARD(26, 32, 40), HAIR(42, 50, 60);
          const Color INK(255, 255, 255), INK2(185, 194, 204), MUTED(111, 123, 136);
          const Color BLUE(57, 135, 229), ORANGE(217, 89, 38), HEAT(255, 138, 92);
          const Color GOOD(12, 163, 12), BAD(208, 59, 59), TRACK(30, 37, 46), AQUA(25, 158, 112);

          // ---- bulk fill ----
          // rpi_dpi_rgb::draw_pixel_at issues one esp_lcd_panel_draw_bitmap
          // call per pixel, and every base-class primitive is built on it.
          // A full screen is 384,000 driver calls (~2.4s). This writes one
          // prepared row per call: a card is ~124 calls, a clear 480.
          auto frect = [&](int x, int y, int w, int h, Color c) {
            if (w <= 0 || h <= 0) return;
            static uint16_t row[800];
            if (w > 800) w = 800;
            const uint16_t px = convert_big_endian(display::ColorUtil::color_to_565(c));
            for (int i = 0; i < w; i++) row[i] = px;
            for (int j = 0; j < h; j++)
              it.draw_pixels_at(x, y + j, w, 1, (const uint8_t *) row,
                                display::COLOR_ORDER_RGB, display::COLOR_BITNESS_565,
                                true, 0, 0, 0);
          };
          auto rr = [&](int x, int y, int w, int h, int r, Color c) {
            frect(x + r, y, w - 2 * r, h, c);
            frect(x, y + r, w, h - 2 * r, c);
            it.filled_circle(x + r, y + r, r, c);
            it.filled_circle(x + w - r - 1, y + r, r, c);
            it.filled_circle(x + r, y + h - r - 1, r, c);
            it.filled_circle(x + w - r - 1, y + h - r - 1, r, c);
          };

          // ---- change detection ----
          // Nothing on this panel repaints unless ITS value changed. Each
          // element owns a slot in a per-page array of last-drawn values;
          // it compares, and if equal, does nothing. `full` (first frame or
          // a page change) overrides every slot. The RGB peripheral streams
          // the framebuffer to the glass continuously, so any repaint is
          // visible as a blip -- the only way to not see it is not to do it.
          const bool full = id(panel_dirty);
          if (full) { frect(0, 0, 800, 480, BG); id(panel_dirty) = false; }
          // Quantise to display precision so 74.104 -> 74.101 is not a change.
          auto q = [](float v, float m) { return std::isnan(v) ? -99999.0f : roundf(v * m) / m; };
          auto changed = [&](float *slots, int i, float key) {
            if (!full && slots[i] == key) return false;
            slots[i] = key;
            return true;
          };

          // ---- clock: its own slot, so it repaints once a minute ----
          {
            auto now = id(sntp_time).now();
            const float mkey = now.is_valid() ? (float) (now.hour * 60 + now.minute) : -1.0f;
            if (changed(SLOTS, SLOT_CLOCK, mkey)) {
              frect(700, 6, 90, 30, BG);
              if (now.is_valid())
                it.strftime(782, 20, id(f_small), INK2, TextAlign::CENTER_RIGHT, "%H:%M", now);
              else
                it.print(782, 20, id(f_small), MUTED, TextAlign::CENTER_RIGHT, "--:--");
            }
          }

          // ---- static chrome: once per page show ----
          if (full) {
            it.print(20, 20, id(f_small), INK2, TextAlign::CENTER_LEFT, "${tank_title}");
            it.print(612, 20, id(f_micro), MUTED, TextAlign::CENTER_LEFT, "BLE");
            it.print(668, 20, id(f_micro), MUTED, TextAlign::CENTER_LEFT, "LINK");
            frect(0, 432, 800, 1, HAIR);
            frect(718, 454, 18, 6, BLUE);
            it.filled_circle(750, 457, 3, TRACK);
            it.filled_circle(768, 457, 3, TRACK);
          }
          // Two status dots, each its own slot. Chips moved left so the
          // clock at 782 no longer lands on "LINK".
          if (changed(SLOTS, SLOT_BLE, id(ble_connected).state ? 1.0f : 0.0f))
            it.filled_circle(600, 20, 4, id(ble_connected).state ? GOOD : BAD);
          if (changed(SLOTS, SLOT_LINK, id(controller_link).state ? 1.0f : 0.0f))
            it.filled_circle(656, 20, 4, id(controller_link).state ? GOOD : BAD);

          // ---- values ----
          const float sp_c = id(r_setpoint_c);
          const float sp_f = std::isnan(sp_c) ? NAN : sp_c * 9.0f / 5.0f + 32.0f;
          const float t_c = id(water_temp).state;
          const float t_f = std::isnan(t_c) ? NAN : t_c * 9.0f / 5.0f + 32.0f;
          const float tb_c = id(water_temp_b).state;
          const float tb_f = std::isnan(tb_c) ? NAN : tb_c * 9.0f / 5.0f + 32.0f;
          const float g = id(temp_gradient).state;
          const int state = id(r_fault) ? 3 : id(r_heat_on) ? 1 : id(r_fan_on) ? 2 : 0;

          // ---- gauge card: one region, three inputs ----
          {
            const bool c1 = changed(SLOTS, SLOT_T, q(t_f, 10));
            const bool c2 = changed(SLOTS, SLOT_SP, q(sp_f, 10));
            const bool c3 = changed(SLOTS, SLOT_STATE, (float) state);
            if (c1 || c2 || c3) {
              rr(18, 46, 296, 380, 15, CARD);
              const float lo = std::isnan(sp_f) ? 72.0f : sp_f - 2.0f;
              const float hi = std::isnan(sp_f) ? 76.0f : sp_f + 2.0f;
              const int CX = 166, CY = 222, R_IN = 86, R_OUT = 102;
              for (int a = 135; a <= 405; a++)
                it.line_at_angle(CX, CY, a, R_IN, R_OUT, TRACK);
              if (!std::isnan(t_f)) {
                float frac = (t_f - lo) / (hi - lo);
                if (frac < 0.0f) frac = 0.0f;
                if (frac > 1.0f) frac = 1.0f;
                const int end = 135 + (int) (270.0f * frac);
                for (int a = 135; a <= end; a++) {
                  const float p = (a - 135) / 270.0f;
                  Color seg = p < 0.5f
                    ? Color((int) (57 + (127 - 57) * p * 2), (int) (135 + (139 - 135) * p * 2),
                            (int) (229 + (150 - 229) * p * 2))
                    : Color((int) (127 + (217 - 127) * (p - 0.5f) * 2),
                            (int) (139 + (89 - 139) * (p - 0.5f) * 2),
                            (int) (150 + (38 - 150) * (p - 0.5f) * 2));
                  it.line_at_angle(CX, CY, a, R_IN, R_OUT, seg);
                }
              }
              it.line_at_angle(CX, CY, 270, R_OUT + 2, R_OUT + 12, INK);
              if (std::isnan(t_f)) it.print(CX, CY - 6, id(f_hero), MUTED, TextAlign::CENTER, "--.-");
              else it.printf(CX, CY - 6, id(f_hero), INK, TextAlign::CENTER, "%.1f", t_f);
              it.print(CX + 92, CY - 24, id(f_small), MUTED, TextAlign::CENTER, "F");
              if (state == 3)      it.print(CX, CY + 52, id(f_micro), BAD, TextAlign::CENTER, "SAFETY TRIPPED");
              else if (state == 1) it.print(CX, CY + 52, id(f_micro), HEAT, TextAlign::CENTER, "HEATING");
              else if (state == 2) it.print(CX, CY + 52, id(f_micro), BLUE, TextAlign::CENTER, "COOLING");
              else                 it.print(CX, CY + 52, id(f_micro), MUTED, TextAlign::CENTER, "IDLE");
              if (std::isnan(sp_f)) it.print(CX, CY + 78, id(f_small), MUTED, TextAlign::CENTER, "Setpoint --");
              else it.printf(CX, CY + 78, id(f_small), MUTED, TextAlign::CENTER, "Setpoint %.1f", sp_f);
            }
          }

          // ---- tiles: each repaints only itself ----
          auto tile = [&](int slot, float m, int x, int y, int w, int h, const char *label,
                          float v, const char *fmt, const char *unit, Color vc) {
            if (!changed(SLOTS, slot, q(v, m))) return;
            rr(x, y, w, h, 15, CARD);
            it.print(x + 16, y + 22, id(f_micro), MUTED, TextAlign::CENTER_LEFT, label);
            if (std::isnan(v)) {
              it.print(x + 16, y + h / 2 + 8, id(f_big), MUTED, TextAlign::CENTER_LEFT, "--");
            } else {
              it.printf(x + 16, y + h / 2 + 8, id(f_big), vc, TextAlign::CENTER_LEFT, fmt, v);
              it.print(x + 16 + 96, y + h / 2 + 14, id(f_small), MUTED, TextAlign::CENTER_LEFT, unit);
            }
          };
          if (!${dual_system}) {
            // One heater, one probe: no halves and no gradient to show, so
            // the same three cards carry the relays' duty and the light.
            tile(SLOT_TB,  1, 326,  46, 224, 124, "HEATER DUTY", id(r_heat), "%.0f", "%", HEAT);
            tile(SLOT_AUX, 1, 558,  46, 224, 124, "FAN DUTY",    id(r_fan),  "%.0f", "%", BLUE);
            tile(SLOT_G,   1, 326, 178, 456, 124, "LIGHT", id(tank_lux).state, "%.0f", "lx", INK);
          } else {
          tile(SLOT_TB, 10, 558, 46, 224, 124, "RIGHT HALF", tb_f, "%.1f", "F", INK);
          {
            // Left half shows the same t_f the gauge does, but the gauge
            // already consumed SLOT_T this frame, so this tile keeps its own
            // last-drawn key in a static rather than sharing the slot.
            static float last_left = -99999.0f;
            const float k = q(t_f, 10);
            if (full || last_left != k) {
              last_left = k;
              rr(326, 46, 224, 124, 15, CARD);
              it.print(342, 68, id(f_micro), MUTED, TextAlign::CENTER_LEFT, "LEFT HALF");
              if (std::isnan(t_f)) it.print(342, 116, id(f_big), MUTED, TextAlign::CENTER_LEFT, "--");
              else { it.printf(342, 116, id(f_big), INK, TextAlign::CENTER_LEFT, "%.1f", t_f);
                     it.print(438, 122, id(f_small), MUTED, TextAlign::CENTER_LEFT, "F"); }
            }
          }

          if (changed(SLOTS, SLOT_G, q(g, 100))) {
            rr(326, 178, 456, 124, 15, CARD);
            it.print(342, 200, id(f_micro), MUTED, TextAlign::CENTER_LEFT, "GRADIENT  L - R");
            if (std::isnan(g)) {
              it.print(342, 248, id(f_big), MUTED, TextAlign::CENTER_LEFT, "--");
            } else {
              it.printf(342, 248, id(f_big), g >= 0 ? HEAT : BLUE, TextAlign::CENTER_LEFT, "%+.2f", g);
              it.print(450, 254, id(f_small), MUTED, TextAlign::CENTER_LEFT, "F");
              const int bx = 342, by = 278, bw = 424;
              frect(bx, by, bw, 5, TRACK);
              float gc = g; if (gc > 1.0f) gc = 1.0f; if (gc < -1.0f) gc = -1.0f;
              const int half = bw / 2, len = (int) (half * (gc < 0 ? -gc : gc));
              if (gc >= 0) frect(bx + half, by, len, 5, ORANGE);
              else         frect(bx + half - len, by, len, 5, BLUE);
              frect(bx + half, by - 4, 2, 13, MUTED);
            }
          }
          }
          tile(SLOT_PH,  100, 326, 310, 224, 116, "PH",  id(water_ph).state, "%.2f", "", INK);
          tile(SLOT_TDS,   1, 558, 310, 224, 116, "TDS", id(tds_mean).state, "%.0f", "ppm", INK);

          // ---- relay pills ----
          auto pill = [&](int slot, int x, const char *txt, bool on, Color c) {
            if (!changed(SLOTS, slot, on ? 1.0f : 0.0f)) return;
            rr(x, 444, 108, 26, 13, on ? Color(52, 30, 20) : CARD);
            it.filled_circle(x + 14, 457, 4, on ? c : MUTED);
            it.print(x + 26, 457, id(f_micro), on ? c : MUTED, TextAlign::CENTER_LEFT, txt);
          };
          pill(SLOT_HEAT, 18,  "HEATER", id(r_heat_on), HEAT);
          pill(SLOT_FAN,  134, "FANS",   id(r_fan_on),  BLUE);
          // A controller with CO2 and bubbler outlets reports them (r_co2 /
          // r_air >= 0); one without draws no pill for them.
          if (id(r_co2) >= 0) pill(SLOT_CO2, 250, "CO2", id(r_co2) == 1, AQUA);
          if (id(r_air) >= 0) pill(SLOT_AIR, 366, "AIR", id(r_air) == 1, BLUE);

      # ===========================================================
      # PAGE 2 -- VESSEL. One-point perspective interior.
      # ===========================================================
      # Geometry is derived, not drawn: front opening, a vanishing point and
      # one depth scale produce the back wall, floor and both side panes.
      # Depth haze is precomputed blends against a known background -- there
      # is no alpha in this API. The tank repaints only when the heater
      # state changes (the glow); the readouts and rail cards each own a slot.
      - id: page_vessel
        lambda: |-
          float *SLOTS = id(p2_last);
          enum { SLOT_CLOCK = 0, SLOT_TA, SLOT_TB, SLOT_G, SLOT_GH, SLOT_GI, SLOT_HEAT, SLOT_FAN,
                 SLOT_FAN_ON };
          const Color BG(7, 11, 15), CARD(26, 32, 40), HAIR(42, 50, 60);
          const Color INK(255, 255, 255), INK2(185, 194, 204), MUTED(111, 123, 136);
          const Color BLUE(57, 135, 229), ORANGE(217, 89, 38), HEAT(255, 138, 92);
          const Color GOOD(12, 163, 12), BAD(208, 59, 59), TRACK(30, 37, 46), AQUA(25, 158, 112);

          // ---- bulk fill ----
          // rpi_dpi_rgb::draw_pixel_at issues one esp_lcd_panel_draw_bitmap
          // call per pixel, and every base-class primitive is built on it.
          // A full screen is 384,000 driver calls (~2.4s). This writes one
          // prepared row per call: a card is ~124 calls, a clear 480.
          auto frect = [&](int x, int y, int w, int h, Color c) {
            if (w <= 0 || h <= 0) return;
            static uint16_t row[800];
            if (w > 800) w = 800;
            const uint16_t px = convert_big_endian(display::ColorUtil::color_to_565(c));
            for (int i = 0; i < w; i++) row[i] = px;
            for (int j = 0; j < h; j++)
              it.draw_pixels_at(x, y + j, w, 1, (const uint8_t *) row,
                                display::COLOR_ORDER_RGB, display::COLOR_BITNESS_565,
                                true, 0, 0, 0);
          };
          auto rr = [&](int x, int y, int w, int h, int r, Color c) {
            frect(x + r, y, w - 2 * r, h, c);
            frect(x, y + r, w, h - 2 * r, c);
            it.filled_circle(x + r, y + r, r, c);
            it.filled_circle(x + w - r - 1, y + r, r, c);
            it.filled_circle(x + r, y + h - r - 1, r, c);
            it.filled_circle(x + w - r - 1, y + h - r - 1, r, c);
          };

          // ---- change detection ----
          // Nothing on this panel repaints unless ITS value changed. Each
          // element owns a slot in a per-page array of last-drawn values;
          // it compares, and if equal, does nothing. `full` (first frame or
          // a page change) overrides every slot. The RGB peripheral streams
          // the framebuffer to the glass continuously, so any repaint is
          // visible as a blip -- the only way to not see it is not to do it.
          const bool full = id(panel_dirty);
          if (full) { frect(0, 0, 800, 480, BG); id(panel_dirty) = false; }
          // Quantise to display precision so 74.104 -> 74.101 is not a change.
          auto q = [](float v, float m) { return std::isnan(v) ? -99999.0f : roundf(v * m) / m; };
          auto changed = [&](float *slots, int i, float key) {
            if (!full && slots[i] == key) return false;
            slots[i] = key;
            return true;
          };

          // ---- clock: its own slot, so it repaints once a minute ----
          {
            auto now = id(sntp_time).now();
            const float mkey = now.is_valid() ? (float) (now.hour * 60 + now.minute) : -1.0f;
            if (changed(SLOTS, SLOT_CLOCK, mkey)) {
              frect(700, 6, 90, 30, BG);
              if (now.is_valid())
                it.strftime(782, 20, id(f_small), INK2, TextAlign::CENTER_RIGHT, "%H:%M", now);
              else
                it.print(782, 20, id(f_small), MUTED, TextAlign::CENTER_RIGHT, "--:--");
            }
          }
          auto mix = [](Color a, Color b, float t) {
            return Color((int) (a.r + (b.r - a.r) * t), (int) (a.g + (b.g - a.g) * t),
                         (int) (a.b + (b.b - a.b) * t));
          };

          if (full) {
            it.print(20, 20, id(f_small), INK2, TextAlign::CENTER_LEFT, "${tank_title}");
            // Labels sit under the hardware they name, so they are placed
            // from the same inch->pixel mapping the tank uses (see below).
            {
              const float ppi = (446.0f - 130.0f) / ${tank_width_in};
              const int hx_a = 130 + (int) (${heater_inset_in} * ppi);
              const int hx_b = 446 - (int) (${heater_inset_in} * ppi);
              const int ix   = 130 + (int) (${intake_from_left_in} * ppi);
              if (${dual_system}) {
                it.print(ix,   418, id(f_micro), MUTED, TextAlign::CENTER, "INTAKE");
                it.print(hx_a, 404, id(f_micro), MUTED, TextAlign::CENTER, "HTR L");
                it.print(288,  404, id(f_micro), MUTED, TextAlign::CENTER, "PROBES  |  SPRAY BAR");
                it.print(hx_b, 404, id(f_micro), MUTED, TextAlign::CENTER, "HTR R");
              } else {
                // Two rows, alternating, so neighbours on a narrow tank do
                // not print over each other.
                const int px = 130 + (int) (${probe_from_left_in} * ppi);
                const int fx = 130 + (int) (${fan_from_left_in} * ppi);
                it.print(hx_a, 404, id(f_micro), MUTED, TextAlign::CENTER, "HEATER");
                it.print(px,   418, id(f_micro), MUTED, TextAlign::CENTER, "PROBE");
                it.print(fx,   404, id(f_micro), MUTED, TextAlign::CENTER, "FAN");
                if (${sponge_filters}) {
                  it.print(130 + (int) (${sponge_from_left_in} * ppi), 404, id(f_micro), MUTED,
                           TextAlign::CENTER, "SPONGE FILTER");
                } else {
                  it.print(ix,  418, id(f_micro), MUTED, TextAlign::CENTER, "INTAKE");
                  it.print(288, 404, id(f_micro), MUTED, TextAlign::CENTER, "SPRAY BAR");
                }
              }
            }
            frect(0, 432, 800, 1, HAIR);
            it.filled_circle(722, 457, 3, TRACK);
            frect(740, 454, 18, 6, BLUE);
            it.filled_circle(772, 457, 3, TRACK);
          }

          const float ta_c = id(water_temp).state, tb_c = id(water_temp_b).state;
          const float ta_f = std::isnan(ta_c) ? NAN : ta_c * 9.0f / 5.0f + 32.0f;
          const float tb_f = std::isnan(tb_c) ? NAN : tb_c * 9.0f / 5.0f + 32.0f;
          const float g = id(temp_gradient).state;
          const float gh = id(r_grad_heating), gi = id(r_grad_idle);

          // ---- the tank: only when the glow needs to change ----
          // Both evaluated every frame: || would skip the fan's slot update
          // whenever the heater had already changed. The fan is only drawn
          // on a single-system tank, so the 75 never repaints for it.
          const bool heat_changed = changed(SLOTS, SLOT_HEAT, id(r_heat_on) ? 1.0f : 0.0f);
          const bool fan_changed = !${dual_system} &&
                                   changed(SLOTS, SLOT_FAN_ON, id(r_fan_on) ? 1.0f : 0.0f);
          const bool tank_redraw = heat_changed || fan_changed;
          // Top of the front glass. Fixed on the 75; on a single-system tank
          // it comes from the tank's width:height, on a 528 px wide opening.
          const int TANK_TOP = ${dual_system} ? 56
              : 386 - std::min(330, std::max(150, (int) (528.0f * ${tank_height_in} / ${tank_width_in})));
          if (tank_redraw) {
            // ---- tank geometry ----
            // The 75 keeps its fixed frame. A single-system tank is drawn to
            // its own width:height (TANK_TOP), standing on the same floor
            // line, and the back wall is the front scaled 0.6 about the
            // vanishing point -- which is exactly how 104/302 fall out of
            // 56/386.
            const int FX0 = 24, FY0 = TANK_TOP, FX1 = 552, FY1 = 386;   // front opening
            const int vpy = FY0 + (int) ((FY1 - FY0) * 120.0f / 330.0f);
            const int BX0 = 130, BX1 = 446;                              // back wall
            const int BY0 = ${dual_system} ? 104 : vpy + (int) ((FY0 - vpy) * 0.6f);
            const int BY1 = ${dual_system} ? 302 : vpy + (int) ((FY1 - vpy) * 0.6f);
            const Color WATER(20, 74, 106);
            // Every height below was laid out on the 75's frame. These carry
            // a y from that frame onto this one: vy for anything on the back
            // wall, fy for the front glass. Both are the identity on the 75.
            auto vy = [&](int y) { return BY0 + (int) ((y - 104) * (float) (BY1 - BY0) / 198.0f); };
            auto fy = [&](int y) { return FY0 + (int) ((y - 56) * (float) (FY1 - FY0) / 330.0f); };
            const float fs = (float) (FY1 - FY0) / 330.0f;

            // Every quad below is drawn as ONE bulk span per row. filled_triangle
            // is per-pixel on this driver and the two panes alone were ~55k
            // calls; as spans they are ~330.
            //
            // Water surface seen from below: a trapezoid narrowing toward the
            // back wall.
            for (int y = FY0; y < BY0; y++) {
              const float p = (float) (y - FY0) / (BY0 - FY0);
              const int xl = (int) (FX0 + (BX0 - FX0) * p);
              const int xr = (int) (FX1 + (BX1 - FX1) * p);
              frect(xl, y, xr - xl, 1, mix(Color(120, 200, 226), Color(90, 170, 200), p));
            }
            // Side panes: for each row, the pane spans from the front edge to
            // the back edge's x at that height. Above the back wall's top and
            // below its bottom the inner edge follows the surface/floor.
            for (int y = FY0; y < FY1; y++) {
              int inner_l, inner_r;
              if (y < BY0) {           // between surface and back-wall top
                const float p = (float) (y - FY0) / (BY0 - FY0);
                inner_l = (int) (FX0 + (BX0 - FX0) * p);
                inner_r = (int) (FX1 + (BX1 - FX1) * p);
              } else if (y < BY1) {    // alongside the back wall
                inner_l = BX0; inner_r = BX1;
              } else {                 // between back-wall bottom and floor
                const float p = (float) (y - BY1) / (FY1 - BY1);
                inner_l = (int) (BX0 + (FX0 - BX0) * p);
                inner_r = (int) (BX1 + (FX1 - BX1) * p);
              }
              frect(FX0, y, inner_l - FX0, 1, Color(14, 44, 64));
              frect(inner_r, y, FX1 - inner_r, 1, Color(14, 44, 64));
            }
            // Back wall, lit from above.
            for (int y = BY0; y < BY1; y++) {
              const float p = (float) (y - BY0) / (BY1 - BY0);
              frect(BX0, y, BX1 - BX0, 1, mix(Color(58, 144, 184), Color(12, 47, 71), p));
            }

            // Substrate: black sand cap over Stratum, banked up at the back.
            const int SFY = fy(356), SBY = vy(296);
            for (int y = SBY; y <= FY1; y++) {
              const float p = (float) (y - SBY) / (FY1 - SBY);
              const int xl = (int) (BX0 + (FX0 - BX0) * p);
              const int xr = (int) (BX1 + (FX1 - BX1) * p);
              frect(xl, y, xr - xl, 1, mix(Color(53, 67, 78), Color(36, 36, 42), p));
            }
            // Cross-section through the front glass: 1.5in sand over 2in Stratum.
            const int sand = (int) (12 * fs), soil = (int) (16 * fs);
            frect(FX0, SFY, FX1 - FX0, sand, Color(38, 38, 44));
            frect(FX0, SFY + sand, FX1 - FX0, soil, Color(45, 34, 24));
            frect(FX0, SFY + sand, FX1 - FX0, 1, Color(74, 58, 42));

            // Inch -> pixel on the back wall. The back wall spans BX0..BX1 and
            // represents the tank's full interior width.
            const float ppi = (float) (BX1 - BX0) / ${tank_width_in};
            const int   cxm = (BX0 + BX1) / 2;

            const Color HOSE(31, 63, 80);

            // Spray bar: centred, ${spray_bar_len_in} in long, fed from its middle
            // by a pipe down from the rim. Not on a sponge-filtered tank.
            if (!${sponge_filters}) {
              const int half = (int) (${spray_bar_len_in} * ppi / 2.0f);
              frect(cxm - 4, BY0, 8, vy(118) - BY0, HOSE);
              frect(cxm - half, vy(118), 2 * half, 8, Color(23, 67, 90));
              for (int x = cxm - half + 8; x <= cxm + half - 8; x += 14)
                it.filled_circle(x, vy(128), 2, Color(58, 125, 153));
            }

            // Intake, ${intake_from_left_in} in from the LEFT end: a tube from
            // the rim down to about half depth, and a slotted strainer that
            // hangs well clear of the substrate. It is a thing hung from the
            // rim, not a bar standing on the floor.
            if (!${sponge_filters}) {
              const int ix = BX0 + (int) (${intake_from_left_in} * ppi);
              frect(ix - 4, BY0, 8, vy(226) - BY0, Color(18, 48, 63));
              frect(ix - 3, BY0, 1, vy(226) - BY0, Color(46, 88, 108));   // highlight
              // Strainer: wider cylinder, slotted, rounded off at the bottom.
              frect(ix - 8, vy(226), 16, vy(260) - vy(226), Color(24, 58, 74));
              for (int y = vy(231); y < vy(258); y += 5)
                frect(ix - 6, y, 12, 1, Color(58, 125, 153));
              it.filled_circle(ix, vy(260), 8, Color(24, 58, 74));
            }

            // Heaters: vertical, one near each end.
            // Glow is nested filled_circle in precomputed blends -- the
            // background here is the known back-wall colour, so no alpha.
            auto heater = [&](int cx, bool on) {
              // Glow as four stepped ellipses drawn row-by-row. filled_circle is
              // per-pixel; nine nested ones per heater were ~40k calls each.
              if (on) {
                const int rs[4] = {54, 40, 27, 14};
                for (int k = 0; k < 4; k++) {
                  const int r = rs[k];
                  const Color c = mix(WATER, Color(255, 122, 60), 0.42f * (1.0f - r / 54.0f));
                  for (int dy = -r; dy <= r; dy++) {
                    const int half = (int) sqrtf((float) (r * r - dy * dy));
                    // Clip to the back wall: the heaters sit near the ends
                    // and the glow would otherwise paint onto the side panes.
                    const int x0 = std::max(cx - half, BX0), x1 = std::min(cx + half, BX1);
                    frect(x0, vy(216) + dy, x1 - x0, 1, c);
                  }
                }
              }
              frect(cx - 6, vy(150), 12, vy(258) - vy(150), Color(45, 77, 95));
              frect(cx - 4, vy(166), 8, vy(250) - vy(166), on ? Color(232, 130, 63) : Color(70, 86, 96));
            };
            // ${heater_inset_in} in from each end -- near the corners, not inboard.
            // A single-system tank has the left one only.
            heater(BX0 + (int) (${heater_inset_in} * ppi), id(r_heat_on));
            if (${dual_system})
              heater(BX1 - (int) (${heater_inset_in} * ppi), id(r_heat_on));

            // Probes: mirrored inboard, lateral to each heater.
            auto probe = [&](int cx) {
              frect(cx - 4, vy(172), 8, vy(238) - vy(172), Color(38, 54, 63));
              it.filled_circle(cx, vy(242), 6, Color(74, 163, 240));
            };
            if (${dual_system}) { probe(250); probe(326); }
            else probe(BX0 + (int) (${probe_from_left_in} * ppi));

            // Dual sponge filter: two foam cylinders on one base, their tops
            // joined by a T into a single lift tube, the airline down into it
            // from the rim. Drawn after the heater so its glow stays behind.
            if (${sponge_filters}) {
              const int cx = BX0 + (int) (${sponge_from_left_in} * ppi);
              const int off = (int) (${sponge_spacing_in} * ppi / 2.0f);   // centre to each sponge
              const int w = std::max(20, (int) (3.0f * ppi));                // ~3 in foam
              const int top = vy(226), bot = vy(300), tee = top - 14, lift = vy(132);
              const Color CAP(40, 52, 58), FOAM(46, 58, 54), PORE(30, 38, 36);
              const Color TUBE(70, 120, 140), SHINE(120, 175, 195);
              frect(cx + 6, BY0, 2, lift - BY0, Color(150, 170, 180));        // airline
              frect(cx - 4, lift, 8, tee - lift, TUBE);                        // lift tube
              frect(cx - 3, lift, 1, tee - lift, SHINE);
              for (int y = lift + 8; y < tee - 4; y += 12)                     // bubbles
                it.filled_circle(cx, y, 2, Color(190, 225, 240));
              frect(cx - off - 4, tee, 2 * off + 8, 7, TUBE);                  // the T
              frect(cx - off - 4, tee, 2 * off + 8, 1, SHINE);
              for (int sx : {cx - off, cx + off}) {
                frect(sx - 4, tee + 7, 8, top - 6 - tee - 7, TUBE);            // riser
                frect(sx - w / 2 - 2, top - 6, w + 4, 6, CAP);
                frect(sx - w / 2, top, w, bot - top, FOAM);
                for (int y = top + 5; y < bot - 2; y += 7)
                  for (int x = sx - w / 2 + 4 + ((y / 7) & 1) * 3; x < sx + w / 2 - 2; x += 6)
                    frect(x, y, 2, 2, PORE);
              }
              frect(cx - off - w / 2 - 4, bot, 2 * off + w + 8, 5, CAP);      // shared base
            }

            // Cooling fan clipped to the back rim, blowing across the
            // surface. Blue while it runs. Single-system only: the 75 has
            // its fans off the drawing.
            if (!${dual_system}) {
              const int fx = BX0 + (int) (${fan_from_left_in} * ppi), fy = BY0 - 30;
              const Color BODY(40, 52, 60);
              frect(fx - 3, BY0 - 4, 6, 18, BODY);          // clip over the glass
              frect(fx - 2, fy + 10, 4, BY0 - 4 - fy - 10, BODY);   // arm
              it.filled_circle(fx, fy, 15, BODY);
              it.filled_circle(fx, fy, 12, id(r_fan_on) ? Color(57, 135, 229) : Color(70, 86, 96));
              for (int a = 45; a < 405; a += 90)
                it.line_at_angle(fx, fy, a, 3, 11, BODY);
              it.filled_circle(fx, fy, 3, BODY);
            }

            // Rimless glass: thin bright edges, no plastic chrome.
            const Color EDGE(143, 196, 220);
            it.rectangle(FX0, FY0, FX1 - FX0, FY1 - FY0, EDGE);
            it.line(FX1, FY0, BX1, BY0, EDGE);
            it.line(BX1, BY0, BX1, BY1, EDGE);
            it.line(BX1, BY1, FX1, FY1, EDGE);
            it.line(FX0, FY0, BX0, BY0, EDGE);
            it.line(BX0, BY0, BX0, BY1, EDGE);
            it.line(BX0, BY1, FX0, FY1, EDGE);
            it.line(BX0, BY0, BX1, BY0, EDGE);
            frect(282, FY0, 13, BY0 - FY0, Color(168, 216, 236));

          }

          // Callouts sit on the glass, so a tank repaint takes them with it.
          auto callout = [&](int slot, int x, int y, float v) {
            const bool mine = changed(SLOTS, slot, q(v, 10));
            if (!mine && !tank_redraw) return;
            rr(x, y, 84, 32, 8, Color(6, 10, 14));
            it.rectangle(x, y, 84, 32, HAIR);
            if (std::isnan(v)) it.print(x + 42, y + 16, id(f_med), MUTED, TextAlign::CENTER, "--");
            else it.printf(x + 42, y + 16, id(f_med), INK, TextAlign::CENTER, "%.1f", v);
          };
          // Single-system: the one readout sits over the one probe.
          callout(SLOT_TA, ${dual_system} ? 176
                  : 130 + (int) (${probe_from_left_in} * (446.0f - 130.0f) / ${tank_width_in}) - 42,
                  ${dual_system} ? 70 : std::max(44, TANK_TOP - 40), ta_f);
          if (${dual_system}) callout(SLOT_TB, 330, 70, tb_f);

          // ---- right rail: three independent cards ----
          {
            // Temperature card also shows the heating state, so it listens
            // to both. Its own slot is SLOT_TA -- already consumed by the
            // callout above -- so key it on a static instead.
            static float last_rail = -99999.0f;
            const float k = q(ta_f, 10) + (id(r_heat_on) ? 100000.0f : 0.0f);
            if (full || last_rail != k) {
              last_rail = k;
              rr(568, 56, 214, 112, 15, CARD);
              it.print(584, 78, id(f_micro), MUTED, TextAlign::CENTER_LEFT, "WATER TEMPERATURE");
              if (std::isnan(ta_f)) it.print(584, 124, id(f_big), MUTED, TextAlign::CENTER_LEFT, "--.-");
              else it.printf(584, 124, id(f_big), INK, TextAlign::CENTER_LEFT, "%.1f", ta_f);
              it.print(584, 152, id(f_micro), id(r_heat_on) ? HEAT : MUTED,
                       TextAlign::CENTER_LEFT, id(r_heat_on) ? "HEATING" : "IDLE");
            }
          }
          if (!${dual_system}) {
            // No gradient on one probe: the two lower cards are the relays.
            if (changed(SLOTS, SLOT_G, q(id(r_heat), 1))) {
              rr(568, 178, 214, 96, 15, CARD);
              it.print(584, 200, id(f_micro), MUTED, TextAlign::CENTER_LEFT, "HEATER DUTY");
              if (std::isnan(id(r_heat))) it.print(584, 240, id(f_big), MUTED, TextAlign::CENTER_LEFT, "--");
              else it.printf(584, 240, id(f_big), HEAT, TextAlign::CENTER_LEFT, "%.0f%%", id(r_heat));
            }
            if (changed(SLOTS, SLOT_FAN, q(id(r_fan), 1))) {
              rr(568, 284, 214, 102, 15, CARD);
              it.print(584, 306, id(f_micro), MUTED, TextAlign::CENTER_LEFT, "FAN DUTY");
              if (std::isnan(id(r_fan))) it.print(584, 352, id(f_big), MUTED, TextAlign::CENTER_LEFT, "--");
              else it.printf(584, 352, id(f_big), BLUE, TextAlign::CENTER_LEFT, "%.0f%%", id(r_fan));
            }
          } else {
          if (changed(SLOTS, SLOT_G, q(g, 100))) {
            rr(568, 178, 214, 96, 15, CARD);
            it.print(584, 200, id(f_micro), MUTED, TextAlign::CENTER_LEFT, "GRADIENT  L - R");
            if (std::isnan(g)) it.print(584, 240, id(f_big), MUTED, TextAlign::CENTER_LEFT, "--");
            else it.printf(584, 240, id(f_big), g >= 0 ? HEAT : BLUE, TextAlign::CENTER_LEFT, "%+.2f", g);
          }
          {
            const bool c1 = changed(SLOTS, SLOT_GH, q(gh, 100));
            const bool c2 = changed(SLOTS, SLOT_GI, q(gi, 100));
            if (c1 || c2) {
              rr(568, 284, 214, 102, 15, CARD);
              it.print(584, 306, id(f_micro), MUTED, TextAlign::CENTER_LEFT, "HEATING / IDLE");
              if (std::isnan(gh)) it.print(584, 340, id(f_med), MUTED, TextAlign::CENTER_LEFT, "--");
              else it.printf(584, 340, id(f_med), INK2, TextAlign::CENTER_LEFT, "%+.2f", gh);
              if (std::isnan(gi)) it.print(584, 368, id(f_med), MUTED, TextAlign::CENTER_LEFT, "--");
              else it.printf(584, 368, id(f_med), MUTED, TextAlign::CENTER_LEFT, "%+.2f", gi);
            }
          }
          }

      # ===========================================================
      # PAGE 3 -- CHEMISTRY. Native graph component.
      # ===========================================================
      - id: page_chem
        lambda: |-
          float *SLOTS = id(p3_last);
          enum { SLOT_CLOCK = 0, SLOT_PH, SLOT_TM, SLOT_TDS, SLOT_LUX, SLOT_SWING, SLOT_CONF,
                 SLOT_GH, SLOT_KH, SLOT_AGE, SLOT_LINK };
          const Color BG(7, 11, 15), CARD(26, 32, 40), HAIR(42, 50, 60);
          const Color INK(255, 255, 255), INK2(185, 194, 204), MUTED(111, 123, 136);
          const Color BLUE(57, 135, 229), ORANGE(217, 89, 38), HEAT(255, 138, 92);
          const Color GOOD(12, 163, 12), BAD(208, 59, 59), TRACK(30, 37, 46), AQUA(25, 158, 112);

          // ---- bulk fill ----
          // rpi_dpi_rgb::draw_pixel_at issues one esp_lcd_panel_draw_bitmap
          // call per pixel, and every base-class primitive is built on it.
          // A full screen is 384,000 driver calls (~2.4s). This writes one
          // prepared row per call: a card is ~124 calls, a clear 480.
          auto frect = [&](int x, int y, int w, int h, Color c) {
            if (w <= 0 || h <= 0) return;
            static uint16_t row[800];
            if (w > 800) w = 800;
            const uint16_t px = convert_big_endian(display::ColorUtil::color_to_565(c));
            for (int i = 0; i < w; i++) row[i] = px;
            for (int j = 0; j < h; j++)
              it.draw_pixels_at(x, y + j, w, 1, (const uint8_t *) row,
                                display::COLOR_ORDER_RGB, display::COLOR_BITNESS_565,
                                true, 0, 0, 0);
          };
          auto rr = [&](int x, int y, int w, int h, int r, Color c) {
            frect(x + r, y, w - 2 * r, h, c);
            frect(x, y + r, w, h - 2 * r, c);
            it.filled_circle(x + r, y + r, r, c);
            it.filled_circle(x + w - r - 1, y + r, r, c);
            it.filled_circle(x + r, y + h - r - 1, r, c);
            it.filled_circle(x + w - r - 1, y + h - r - 1, r, c);
          };

          // ---- change detection ----
          // Nothing on this panel repaints unless ITS value changed. Each
          // element owns a slot in a per-page array of last-drawn values;
          // it compares, and if equal, does nothing. `full` (first frame or
          // a page change) overrides every slot. The RGB peripheral streams
          // the framebuffer to the glass continuously, so any repaint is
          // visible as a blip -- the only way to not see it is not to do it.
          const bool full = id(panel_dirty);
          if (full) { frect(0, 0, 800, 480, BG); id(panel_dirty) = false; }
          // Quantise to display precision so 74.104 -> 74.101 is not a change.
          auto q = [](float v, float m) { return std::isnan(v) ? -99999.0f : roundf(v * m) / m; };
          auto changed = [&](float *slots, int i, float key) {
            if (!full && slots[i] == key) return false;
            slots[i] = key;
            return true;
          };

          // ---- clock: its own slot, so it repaints once a minute ----
          {
            auto now = id(sntp_time).now();
            const float mkey = now.is_valid() ? (float) (now.hour * 60 + now.minute) : -1.0f;
            if (changed(SLOTS, SLOT_CLOCK, mkey)) {
              frect(700, 6, 90, 30, BG);
              if (now.is_valid())
                it.strftime(782, 20, id(f_small), INK2, TextAlign::CENTER_RIGHT, "%H:%M", now);
              else
                it.print(782, 20, id(f_small), MUTED, TextAlign::CENTER_RIGHT, "--:--");
            }
          }

          if (full) {
            it.print(20, 20, id(f_small), INK2, TextAlign::CENTER_LEFT, "${tank_title}");
            frect(0, 432, 800, 1, HAIR);
            it.filled_circle(722, 457, 3, TRACK);
            it.filled_circle(740, 457, 3, TRACK);
            frect(758, 454, 18, 6, BLUE);
          }

          // ---- pH card ----
          // A single-system tank has no pH probe; the card shows the last
          // manual water test instead (its age is under GH/KH below).
          const float ph = id(water_ph).state;
          if (!${dual_system}) {
            if (changed(SLOTS, SLOT_PH, (float) (id(chem_stamp) % 1000003u))) {
              rr(18, 46, 380, 250, 15, CARD);
              it.print(36, 68, id(f_micro), MUTED, TextAlign::CENTER_LEFT, "LAST WATER TEST");
              auto row = [&](int y, const char *label, float v, const char *fmt, const char *unit) {
                it.print(36, y, id(f_small), INK2, TextAlign::CENTER_LEFT, label);
                if (std::isnan(v)) it.print(250, y, id(f_med), MUTED, TextAlign::CENTER_RIGHT, "--");
                else it.printf(250, y, id(f_med), INK, TextAlign::CENTER_RIGHT, fmt, v);
                it.print(262, y, id(f_micro), MUTED, TextAlign::CENTER_LEFT, unit);
              };
              row(112, "pH",      id(chem_ph),  "%.1f", "");
              row(158, "Ammonia", id(chem_nh3), "%.2f", "ppm");
              row(204, "Nitrite", id(chem_no2), "%.2f", "ppm");
              row(250, "Nitrate", id(chem_no3), "%.0f", "ppm");
            }
          } else
          if (changed(SLOTS, SLOT_PH, q(ph, 100))) {
            rr(18, 46, 380, 250, 15, CARD);
            it.print(36, 68, id(f_micro), MUTED, TextAlign::CENTER_LEFT, "PH  24 HOURS");
            if (std::isnan(ph)) it.print(36, 110, id(f_big), MUTED, TextAlign::CENTER_LEFT, "--");
            else it.printf(36, 110, id(f_big), INK, TextAlign::CENTER_LEFT, "%.2f", ph);
            it.graph(36, 140, id(ph_graph), BLUE);
            it.print(36, 276, id(f_micro), MUTED, TextAlign::CENTER_LEFT, "PH");
          }

          // ---- TDS card ----
          const float tm = id(tds_mean).state;
          if (changed(SLOTS, SLOT_TM, q(tm, 1))) {
            rr(410, 46, 372, 250, 15, CARD);
            it.print(428, 68, id(f_micro), MUTED, TextAlign::CENTER_LEFT, "TDS  24 HOURS");
            if (std::isnan(tm)) it.print(428, 110, id(f_big), MUTED, TextAlign::CENTER_LEFT, "--");
            else it.printf(428, 110, id(f_big), INK, TextAlign::CENTER_LEFT, "%.0f", tm);
            it.print(516, 116, id(f_small), MUTED, TextAlign::CENTER_LEFT, "ppm");
            it.graph(428, 140, id(tds_graph), BLUE);
            it.print(428, 276, id(f_micro), MUTED, TextAlign::CENTER_LEFT, "MEAN VS RAW");
          }

          // ---- strip ----
          // GH/KH come over MQTT, not BLE, and carry their age. Older than
          // 48h is not a reading to act on: value goes muted, age goes red.
          char agebuf[20];
          bool chem_stale = true;
          float agekey = -1.0f;
          {
            auto n = id(sntp_time).now();
            if (id(chem_stamp) == 0) {
              snprintf(agebuf, sizeof(agebuf), "never");
            } else if (!n.is_valid()) {
              snprintf(agebuf, sizeof(agebuf), "no clock");
            } else {
              const uint32_t age = (uint32_t) n.timestamp - id(chem_stamp);
              if (age < 3600)        { snprintf(agebuf, sizeof(agebuf), "%um ago", (unsigned) (age / 60));   agekey = age / 60; }
              else if (age < 172800) { snprintf(agebuf, sizeof(agebuf), "%uh ago", (unsigned) (age / 3600)); agekey = 1000 + age / 3600; }
              else                   { snprintf(agebuf, sizeof(agebuf), "%ud ago", (unsigned) (age / 86400)); agekey = 2000 + age / 86400; }
              chem_stale = age > 172800;
            }
          }
          const bool age_changed = changed(SLOTS, SLOT_AGE, agekey);

          auto small = [&](int slot, float m, int x, const char *label, float v, const char *fmt,
                           Color c, const char *sub) {
            const bool mine = changed(SLOTS, slot, q(v, m));
            if (!mine && !(sub != nullptr && age_changed)) return;
            rr(x, 306, 120, 118, 15, CARD);
            it.print(x + 14, 328, id(f_micro), MUTED, TextAlign::CENTER_LEFT, label);
            if (std::isnan(v)) it.print(x + 14, 372, id(f_big), MUTED, TextAlign::CENTER_LEFT, "--");
            else it.printf(x + 14, 372, id(f_big), c, TextAlign::CENTER_LEFT, fmt, v);
            if (sub != nullptr)
              it.print(x + 14, 404, id(f_micro), chem_stale ? BAD : MUTED, TextAlign::CENTER_LEFT, sub);
          };
          const Color CHEM = chem_stale ? MUTED : INK2;
          small(SLOT_GH,    1, 18,  "GH PPM",     id(chem_gh), "%.0f", CHEM, agebuf);
          small(SLOT_KH,    1, 146, "KH PPM",     id(chem_kh), "%.0f", CHEM, agebuf);
          small(SLOT_TDS,   1, 274, "TDS RAW",    id(tds).state, "%.0f", INK2, nullptr);
          small(SLOT_LUX,   1, 402, "LUX",        id(tank_lux).state, "%.0f", INK2, nullptr);
          small(SLOT_SWING, 100, 530, "SWING F",
                std::isnan(id(r_swing_c)) ? NAN : id(r_swing_c) * 9.0f / 5.0f, "%.2f", INK2, nullptr);
          small(SLOT_CONF,  1, 658, "CONFIDENCE", id(r_confidence), "%.0f", INK2, nullptr);

          // Link age text at bottom-left: keyed on its 30s bucket.
          if (changed(SLOTS, SLOT_LINK, (float) (id(r_stamp_ms) / 30000))) {
            frect(18, 446, 300, 22, BG);
            it.print(20, 457, id(f_micro), MUTED, TextAlign::CENTER_LEFT, id(link_age).state.c_str());
          }

globals:
  # True until the first frame has painted, and set again on every page
  # change. Each page lambda does one full clear when it sees this, then
  # lowers it. Not restored: after a reboot the framebuffer is garbage and
  # must be cleared regardless.
  # The controller's CO2 and bubbler outlets, from packages/ble_chem_panel:
  # -1 not fitted (and on any panel that never hears of them), 0 off, 1 on.
  - id: r_co2
    type: int
    restore_value: false
    initial_value: '-1'
  - id: r_air
    type: int
    restore_value: false
    initial_value: '-1'
  - id: panel_dirty
    type: bool
    restore_value: false
    initial_value: 'true'
  # Last-drawn value per element, per page. Not restored: the framebuffer
  # is garbage after a reboot and panel_dirty forces a full paint anyway.
  - id: p1_last
    type: float[15]
    restore_value: false
  - id: p2_last
    type: float[9]
    restore_value: false
  - id: p3_last
    type: float[11]
    restore_value: false

# Touch. Tap the right half for the next page, left half for the previous.
# Page dots on every page show where you are, so there is a visible
# affordance rather than a hidden gesture.
touchscreen:
  - platform: gt911
    id: tank_touch
    display: tank_display
    interrupt_pin: GPIO4
    reset_pin:
      ch422g: io_ex
      number: 1
    # on_touch, NOT on_release: verified against the component, on_release
    # is registered with no trigger arguments at all, so `touch` does not
    # exist in its scope. Firing on press also makes the panel feel
    # immediate rather than waiting for lift.
    on_touch:
      - lambda: |-
          // Debounce: the GT911 can report one tap as several touch
          // events, and each would be a page.
          static uint32_t last = 0;
          if (millis() - last < 400) return;
          last = millis();
          if (touch.x > 400) id(tank_display).show_next_page();
          else               id(tank_display).show_prev_page();
          // The page change raised panel_dirty; paint it NOW rather than
          // at the next 5s tick, or a tap feels like nothing happened.
          id(tank_display).update();

# 24 hours at the 5s notify rate is far more samples than 380px of width can
# show, so the component decimates. Held in RAM and lost on reboot -- this is
# the at-a-glance view; Home Assistant owns the real history.
graph:
  - id: ph_graph
    sensor: water_ph
    duration: 24h
    width: 344
    height: 120
    border: false
    x_grid: 6h
    y_grid: 0.2
  # Two traces on ONE axis -- never a second scale. Raw is the de-emphasised
  # series and the hourly mean is the accent, matching the convention that
  # glance values are smoothed and diagnostics are raw. A single TDS sample
  # off this probe is honest about nothing; showing both is what makes the
  # spread visible rather than implied.
  - id: tds_graph
    duration: 24h
    width: 336
    height: 120
    border: false
    x_grid: 6h
    y_grid: 50
    traces:
      - sensor: tds_mean
        line_thickness: 2
        color: graph_mean
      - sensor: tds
        line_thickness: 1
        color: graph_raw

color:
  - id: graph_mean
    red: 22%
    green: 53%
    blue: 90%
  - id: graph_raw
    red: 44%
    green: 48%
    blue: 53%

# GLYPH SETS ARE TRIMMED TO SAVE FLASH, and a missing glyph fails SILENTLY
# at runtime rather than at compile. Every character any lambda above can
# print must appear here -- including the minus and plus that %+.2f emits.
font:
  - file: "gfonts://Inter@600"
    id: f_micro
    size: 13
    glyphs: "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789 .,:-+/%°"
  - file: "gfonts://Inter@500"
    id: f_small
    size: 17
    glyphs: "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789 .,:-+/%°"
  - file: "gfonts://Inter@600"
    id: f_med
    size: 24
    glyphs: "0123456789 .,:-+°"
  - file: "gfonts://Inter@600"
    id: f_big
    size: 38
    # % for the single-system heater/fan duty cards.
    glyphs: "0123456789 .,:-+°%"
  - file: "gfonts://Inter@600"
    id: f_hero
    size: 78
    glyphs: "0123456789.-"
