# Elecrow CrowPanel Advanced 10.1" (ESP32-P4 + ESP32-C6), 1024x600 IPS,
# GT911 touch. Also sold on Amazon under the IDEAQUX brand. Hardware only:
# the UI is packages/panel_p4_ui.yaml, the data is panel_p4_tank.yaml (x2)
# and panel_p4_feeds.yaml.
#
# Sources, cross-checked: Elecrow's own repo (github.com/Elecrow-RD/
# CrowPanel-Advanced-10.1inch-ESP32-P4-HMI-AI-Display-1024x600-IPS-Touch-Screen):
# its official ESPHome example (example/V1.0/ESPHome) and the V1.2 hardware
# driver guide compiled from the schematics (Eagle_SCH&PCB/1.2/readme.md);
# vespassassina/crowpanel-ha (9", same family, on real hardware); and
# espcontrol-community-devices PR #156 (10.1", EK79007 panel = ESPHome's
# WAVESHARE-...-7B preset, which Elecrow's own example uses too).
#
# ---------------------------------------------------------------------
# ESPHome version
# ---------------------------------------------------------------------
# Needs 2026.10.0 or later: older versions lack parts of the P4 support
# (min_version below makes that a compile error, not a boot loop).
#
# ---------------------------------------------------------------------
# The radio is a separate chip
# ---------------------------------------------------------------------
# The P4 has no radio. Wi-Fi AND Bluetooth come from the on-board C6 over
# SDIO (ESP-Hosted). Elecrow ships the C6 with ESP-Hosted's stock slave
# firmware (2.12.3 as of their 2026-04-08 release; early V1.0 boards had
# 2.11.7), and that build has Bluetooth on by default (BT_ENABLED,
# ESP_HOSTED_CP_BT). ESPHome 2026.10.1's host library is esp_hosted
# 2.12.13, the same series, so Wi-Fi and BLE should both come up as shipped.
# Even so, press Install on the "C6 Radio Firmware" update entity once after
# first boot: it flashes the C6 from the P4 over SDIO (no cable) with
# ESPHome's 2.12.13 build, so the two halves match exactly. The manifest
# only offers versions <= the host library, so they cannot mismatch.
# If BLE does not come up on the factory firmware, this update is the fix.
#
# The slave's BT_LE_MAX_CONNECTIONS default is 3. This panel uses 2, one per
# tank.
#
# ---------------------------------------------------------------------
# Two things that differ between boards and must be right
# ---------------------------------------------------------------------
# 1. BOARD REVISION (silkscreen V1.0 / V1.1 / V1.2). The SDIO data pins are
#    in opposite order on V1.0. Wrong order = boot loop right after flashing.
#    Default below is V1.1/V1.2, confirmed by Elecrow's V1.2 guide (P4
#    GPIO14/15/16/17 = C6 D3/D2/D1/D0). For V1.0 set c6_d0..d3 to
#    GPIO14,15,16,17, which is exactly what Elecrow's V1.0 ESPHome example uses.
# 2. P4 CHIP REVISION. Default "true": engineering-sample silicon (v1.x).
#    Elecrow ships v1.3 even on V1.2 boards: the owner's V1.2 (bought Oct
#    2026) is marked FEF0 on the manufacturing-code line, and Espressif's
#    errata ("Chip Revision Identification") maps the 2nd letter E to v1.3;
#    Elecrow's own example sets true as well. A "false" build only accepts
#    v3.01+, so on this chip the bootloader refuses the app and the screen
#    stays fully dark with nothing on the USB port (the refusal prints on
#    UART0). A "true" build only accepts v0.0-v1.99. Read the 4-character
#    manufacturing code on the chip: 2nd letter E = v1.3 (true), G = v3.1 and
#    F = v3.0 (false). ESPHome caps engineering samples at 360 MHz.

substitutions:
  engineering_sample: "true"
  c6_d0: GPIO17
  c6_d1: GPIO16
  c6_d2: GPIO15
  c6_d3: GPIO14

esphome:
  min_version: 2026.10.0

esp32:
  variant: esp32p4
  engineering_sample: ${engineering_sample}
  # 400 MHz is still marked experimental in 2026.10 (esphome#13425).
  cpu_frequency: 360MHz
  flash_size: 16MB
  framework:
    type: esp-idf
    advanced:
      execute_from_psram: true
    sdkconfig_options:
      # Keeps ESP-Hosted's buffers out of internal RAM, which the display
      # and LVGL need. Engineering samples roll back without it.
      CONFIG_ESP_HOSTED_MEMPOOL_PREFER_SPIRAM: y
      # TLS (the C6 firmware download, MQTT) allocates from PSRAM too. This
      # panel runs more at once than any confirmed CrowPanel config (BLE to
      # two tanks, MQTT, web server, LVGL), on a v1.x chip with little
      # internal RAM; espcontrol's confirmed V1.2 config does the same.
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: y
      # The ESP-Hosted task stack in PSRAM too. ESPHome only sets this for
      # esp_hosted 3.x; 2026.10 uses 2.12.x, so it is set by hand, as in
      # espcontrol's confirmed V1.2 config.
      CONFIG_ESP_HOSTED_DFLT_TASK_FROM_SPIRAM: y

# Logs on UART0 = J1, the USB-C port labelled UART0 (CH340K bridge on
# GPIO37/38), per Elecrow's V1.2 hardware guide and their ESPHome example.
# The other USB-C port (J16, labelled USB) is the P4's USB 2.0 OTG: the ROM
# can flash through it with BOOT held, but nothing logs there once the app
# runs. The P4's USB-Serial-JTAG (GPIO24/25) is not wired to either
# connector on this board, so ESPHome's P4 default would log nowhere.
# macOS 26 needs WCH's CH34x driver for J1 to enumerate. Once on Wi-Fi the
# logs are also on MQTT (tank-monitor-panel/debug).
logger:
  hardware_uart: UART0

psram:
  mode: hex
  speed: 200MHz

# P4 internal LDOs. LDO3 2.5 V feeds the MIPI-DSI PHY. LDO4 feeds VDDPST_5
# (the LCD-reset pull-up and the I2C level shifters, per the V1.2 schematic).
# Elecrow's ESP-IDF code asks for 3.3 V there, but every ESPHome config
# confirmed on these boards either sets 2.5 V (Elecrow's own V1.1/V1.2
# example, homeassistant_espscreen #116) or leaves it out (espcontrol,
# crowpanel-ha), so this follows the proven ESPHome configs.
esp_ldo:
  - channel: 3
    voltage: 2.5V
  - channel: 4
    voltage: 2.5V

esp32_hosted:
  variant: esp32c6
  # Transport buffers and the hosted task in PSRAM (as espcontrol's V1.2).
  use_psram: true
  active_high: true
  reset_pin: GPIO32
  cmd_pin: GPIO19
  clk_pin: GPIO18
  d0_pin: ${c6_d0}
  d1_pin: ${c6_d1}
  d2_pin: ${c6_d2}
  d3_pin: ${c6_d3}

# Wi-Fi/lwIP buffers in PSRAM (merges into packages/base.yaml's wifi:).
wifi:
  use_psram: true

http_request:
  verify_ssl: true

update:
  - platform: esp32_hosted
    name: "C6 Radio Firmware"
    type: http
    source: https://esphome.github.io/esp-hosted-firmware/manifest/esp32c6.json
    update_interval: 24h

esp32_ble:
  # Two tanks + one spare. The C6's stock limit is 3.
  max_connections: 3

esp32_ble_tracker:
  scan_parameters:
    # Only ever looking for two known MACs. Passive scanning does not
    # transmit, which matters on a radio shared with the Wi-Fi station.
    active: false
    interval: 1100ms
    window: 100ms

i2c:
  - id: bus_a
    sda: GPIO45
    scl: GPIO46
    frequency: 400kHz

output:
  # GPIO29 was meant to gate the backlight supply, but its MOSFET (Q11,
  # AO3401) is marked NC on the V1.0, V1.1 and V1.2 schematics and R184 ties
  # the backlight straight to 5 V: on these boards it does nothing. Driven
  # high while lit, as every working config does, in case a later revision
  # fits it. A dark screen is never this pin.
  - platform: gpio
    id: backlight_power
    pin: GPIO29
  - platform: ledc
    id: backlight_pwm
    pin: GPIO31
    # From Elecrow's IDF sample; no audible whine.
    frequency: 30kHz

light:
  - platform: monochromatic
    id: backlight
    name: "Display Backlight"
    output: backlight_pwm
    restore_mode: ALWAYS_ON
    default_transition_length: 400ms
    on_turn_on:
      - output.turn_on: backlight_power
    on_turn_off:
      - output.turn_off: backlight_power

display:
  - platform: mipi_dsi
    id: main_display
    # EK79007, 1024x600: the same panel and init sequence as this preset.
    model: WAVESHARE-ESP32-P4-WIFI6-TOUCH-LCD-7B
    reset_pin: GPIO41
    dimensions:
      width: 1024
      height: 600
    color_order: RGB
    update_interval: never
    auto_clear_enabled: false

touchscreen:
  - platform: gt911
    id: main_touch
    i2c_id: bus_a
    display: main_display
    reset_pin: GPIO40
    interrupt_pin: GPIO42
    # Start after the display, as espcontrol's config confirmed on a 10.1"
    # V1.2 does: bringing the DSI panel up can disturb a GT911 that is
    # already initialised.
    setup_priority: -200
    # Every touch in the log (INFO, so it reaches the web log and MQTT):
    # the quickest way to tell "no touches arrive" from "touches land in
    # the wrong place". Raw = the GT911's own axes, x/y = after rotation.
    on_touch:
      - logger.log:
          level: INFO
          format: "touch x=%d y=%d (raw %d,%d)"
          args: [touch.x, touch.y, touch.x_raw, touch.y_raw]

binary_sensor:
  # Whether the GT911 came up. A failed controller is otherwise silent: the
  # screen draws fine and taps just do nothing.
  - platform: template
    name: "Touch Controller OK"
    entity_category: diagnostic
    lambda: "return !id(main_touch)->is_failed();"

# ---------------------------------------------------------------------
# Battery (STC8H1K08 housekeeping MCU)
# ---------------------------------------------------------------------
# The single-cell charger (TP4059) and the battery ADC sit behind a small
# STC8 microcontroller, which the P4 reads over the touch I2C bus (STC8
# P1.4/P1.5 -> R118/R119 0R -> I2C1_SDA/SCL_3V3 -> level shifter -> GPIO45/46,
# V1.2 schematic). Elecrow's stock firmware reads it ("stc8 read battery info
# fail", "bat_level = %d %%", "bat_state = %d" in esp_brookesia_demo.bin).
#
# Protocol, as implemented by hermes-gadget-sdk (firmware/drivers/
# stc8_battery.cpp) and matching the stock firmware's log order: address
# 0x2F, one register read per byte, registers 0-11:
#   0-3  ADC voltage, mV, u32 little-endian
#   4-7  battery voltage, mV, u32 LE (100k/39k divider on VBAT)
#   8    charge level, %
#   9    state: 1 = charging, 4 = error. Other codes are not documented
#        anywhere public; the raw code is published (Battery State) and the
#        raw record is logged on change, so the rest can be read off the
#        board while plugging and unplugging the charger.
# Nobody has published a validation of this layout on hardware; treat the
# numbers as unverified until they match the stock firmware's display.
globals:
  - id: batt_mv
    type: float
    restore_value: false
    initial_value: 'NAN'
  - id: batt_pct
    type: float
    restore_value: false
    initial_value: 'NAN'
  - id: batt_state
    type: int
    restore_value: false
    initial_value: '-1'

interval:
  - interval: 30s
    then:
      - lambda: |-
          uint8_t raw[12];
          for (uint8_t reg = 0; reg < 12; reg++) {
            if (id(bus_a)->write_readv(0x2F, &reg, 1, &raw[reg], 1) != i2c::ERROR_OK) {
              static bool warned = false;
              if (!warned) ESP_LOGW("battery", "STC8 at 0x2F not answering (register %u)", reg);
              warned = true;
              id(batt_mv) = NAN; id(batt_pct) = NAN; id(batt_state) = -1;
              return;
            }
          }
          static uint8_t last[12] = {0};
          if (memcmp(last, raw, 12) != 0) {
            memcpy(last, raw, 12);
            ESP_LOGI("battery", "STC8 raw: %02X %02X %02X %02X | %02X %02X %02X %02X | %u%% | state %u | %02X %02X",
                     raw[0], raw[1], raw[2], raw[3], raw[4], raw[5], raw[6], raw[7], raw[8], raw[9], raw[10], raw[11]);
          }
          const uint32_t mv = raw[4] | (raw[5] << 8) | (raw[6] << 16) | ((uint32_t) raw[7] << 24);
          id(batt_mv) = mv <= 5000 ? (float) mv : NAN;
          id(batt_pct) = raw[8] <= 100 ? (float) raw[8] : NAN;
          id(batt_state) = raw[9];

sensor:
  - platform: template
    name: "Battery Voltage"
    unit_of_measurement: "V"
    device_class: voltage
    accuracy_decimals: 2
    update_interval: 60s
    lambda: "return std::isnan(id(batt_mv)) ? NAN : id(batt_mv) / 1000.0f;"
  - platform: template
    name: "Battery"
    unit_of_measurement: "%"
    device_class: battery
    accuracy_decimals: 0
    update_interval: 60s
    lambda: "return id(batt_pct);"
  - platform: template
    name: "Battery State"
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 60s
    lambda: "return id(batt_state) < 0 ? NAN : (float) id(batt_state);"

# ---------------------------------------------------------------------
# Speaker
# ---------------------------------------------------------------------
# NS4263B amplifier fed straight from the P4's I2S (GPIO21 LRCLK, GPIO22
# BCLK, GPIO23 DOUT); GPIO30 enables it, active low (V1.2 guide; same wiring
# crowpanel-ha runs on a V1.2 9"). The amp hisses when left on, so it is on
# only while a sound plays.
i2s_audio:
  - id: i2s_spk
    i2s_lrclk_pin: GPIO21
    i2s_bclk_pin: GPIO22

speaker:
  - platform: i2s_audio
    id: panel_speaker
    i2s_audio_id: i2s_spk
    i2s_dout_pin: GPIO23
    dac_type: external
    channel: mono

rtttl:
  id: panel_rtttl
  speaker: panel_speaker
  gain: 0.6
  on_finished_playback:
    - delay: 300ms
    - if:
        condition:
          lambda: "return !id(panel_rtttl).is_playing();"
        then:
          - switch.turn_off: speaker_amp

# Alert chime: played by packages/panel_p4_feeds.yaml when a NEW alert
# arrives (not the retained ones the broker replays on reconnect). Critical:
# three urgent beeps, always. Warning: a soft two-note chime, skipped while
# the panel is in night mode. "Alert Chime" in Home Assistant mutes both.
script:
  - id: alert_chime
    mode: restart
    parameters:
      critical: bool
    then:
      - if:
          condition:
            lambda: "return id(chime_enabled).state && (critical || !id(night_on));"
          then:
            - switch.turn_on: speaker_amp
            - delay: 50ms
            - rtttl.play:
                id: panel_rtttl
                rtttl: !lambda |-
                  return critical ? std::string("crit:d=8,o=6,b=200:a,p,a,p,a,2p,a,p,a,p,a")
                                  : std::string("warn:d=4,o=5,b=140:c6,8p,g5");

switch:
  - platform: template
    id: chime_enabled
    name: "Alert Chime"
    icon: "mdi:volume-high"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
  - platform: gpio
    id: speaker_amp
    name: "Speaker Amp"
    entity_category: diagnostic
    restore_mode: ALWAYS_OFF
    pin:
      number: GPIO30
      inverted: true

# Both tanks share one sun (see the controller configs): south-central PA.
# Used for night mode and the dawn/dusk times on the detail screens.
sun:
  id: sun_pa
  latitude: 39.8
  longitude: -76.7
