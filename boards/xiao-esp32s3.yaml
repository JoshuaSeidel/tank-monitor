# Seeed XIAO ESP32-S3 -- controller (sensors + relays), headless.
#
# WHY THIS BOARD
# Measured, not assumed: this firmware plus pH plus a BLE server compiles at
# 33.7% flash here against 97.8% on the C6, which does not fit at all. The
# 8MB part gets a 3.93MB app partition with dual OTA against the C6's 1.8MB.
# Dual-core also puts the BLE stack off the app loop; the C6 is single core.
#
# WHAT THIS FILE OWES THE SHARED PACKAGES -- the whole board contract:
#   one_wire bus                 -> the DS18B20
#   i2c bus                      -> BH1750, and an ADS1115/OLED later
#   adc sensor id: tds_voltage   -> packages/sensors.yaml
#   adc sensor id: ph_voltage    -> packages/ph.yaml
#   output id: heater_output     -> the controller's heater
#   output id: fan_output        -> the controller's fan
#
# PIN BUDGET -- the opposite of the C6's problem.
# ESP32-S3 ADC1 is GPIO1-10 and this board breaks out GPIO1-9, so EVERY
# exposed pin is ADC1-capable. ADC2 is unusable while WiFi is on, which is
# what made the C6 so cramped; here it never comes up.
#
# WIRE BY THE SILKSCREEN COLUMN. The XIAO is labelled D0-D10 on the board and
# those numbers are NOT the GPIO numbers -- D3 is GPIO4, D8 is GPIO7. Wiring
# to the pad whose printed number matches a GPIO in this config lands on the
# wrong pin, and every symptom of that is silent: a probe on the wrong ADC
# reads plausible nonsense rather than failing.
#
#   signal              SILKSCREEN   GPIO
#   TDS analog          D1           2      ADC1
#   pH analog           D3           4      ADC1
#   DS18B20 data        D5           6      + 4.7k pull-up
#   I2C SDA (BH1750)    D6           43
#   I2C SCL             D7           44
#   heater relay IN+    D8           7
#   fan relay IN+       D9           8
#
# Spare: D0 (GPIO1, ADC1 -- free for ORP), D4 (GPIO5), D10 (GPIO9, ADC1).
# D2 = GPIO3 is left EMPTY on purpose: it is an ESP32-S3 STRAPPING PIN
# ({0, 3, 45, 46}) and nothing should hold it high or low at boot.
#
# I2C is on D6/D7 = GPIO43/44, which are U0TXD/U0RXD. That is fine here: this
# board has native USB, so the logger runs over USB_SERIAL_JTAG and UART0 is
# free. The S3 routes I2C through the GPIO matrix, so any pin works.
#
# Full D-label mapping, since only half of it is intuitive:
#   D0=1  D1=2  D2=3  D3=4  D4=5  D5=6  D6=43  D7=44  D8=7  D9=8  D10=9
#
# TWO THINGS DELIBERATELY NOT DECIDED HERE, see BLE-MIGRATION-PLAN.md:
#   - An ADS1115 for pH. The S3's internal ADC is likely not good enough for
#     a ~100 MOhm electrode at +/-0.1. If adopted, pH moves off GPIO2 onto
#     the I2C bus and GPIO2 frees up.
#   - A small I2C OLED. This board is headless, and on the C6 the local
#     screen is the last readout standing when WiFi, HA and the panel are
#     all down. Worth a few dollars to not lose that.

esp32:
  board: seeed_xiao_esp32s3
  variant: esp32s3
  flash_size: 8MB
  framework:
    type: esp-idf

# ESPHome's default MQTT unique_id generator is "legacy": "ESP" + component
# type + object_id, with NO device name and no MAC in it. So this board's
# "Water Temperature" generates a unique_id byte-identical to the C6's, and
# Home Assistant refuses to register a second entity with a unique_id it
# already holds -- silently, with nothing in the log. The symptom is that
# only the entities the OTHER board does not have ever appear.
#
# This lives in the BOARD FILE, not the wrapper. The wrapper is the one file
# not pulled from git, and putting load-critical config there has silently
# failed four times in this project now.
mqtt:
  discovery_unique_id_generator: mac


one_wire:
  - platform: gpio
    # Silkscreen D5. Needs a 4.7k pull-up to 3V3 -- without it the bus never
    # pulls high and the scan reports "No devices, can't auto-select address",
    # which is indistinguishable from the probe being on the wrong pin.
    pin: GPIO6

i2c:
  # Silkscreen D6 / D7.
  sda: GPIO43
  scl: GPIO44
  scan: true

sensor:
  # Raw TDS probe voltage. Internal only; packages/sensors.yaml does the maths.
  - platform: adc
    # Silkscreen D1.
    pin: GPIO2
    id: tds_voltage
    update_interval: 500ms
    attenuation: 12db
    raw: false
    internal: true
    filters:
      # The probe output is AC-excited and noisy; median rejects spikes
      # without lagging a value that moves over minutes anyway.
      - median:
          window_size: 20
          send_every: 20
          send_first_at: 20

  # pH electrode. See the ADS1115 note above -- this pin is provisional.
  - platform: adc
    # Silkscreen D3. NOT D2: that is GPIO3, an S3 strapping pin, and a pH
    # board idling near 1.5 V would hold it at an indeterminate level at boot.
    pin: GPIO4
    id: ph_voltage
    update_interval: 1s
    attenuation: 12db
    raw: false
    internal: true
    filters:
      - median:
          window_size: 10
          send_every: 5
          send_first_at: 5

output:
  # Time-proportional over a 15 minute window. These are mechanical relay
  # contacts: a shorter window would give finer control at the cost of
  # burning through switching cycles. Pinned full-on or full-off costs
  # nothing, so the wear only happens at partial duty.
  - platform: slow_pwm
    id: heater_output
    # Silkscreen D8.
    pin: GPIO7
    period: 900s

  - platform: slow_pwm
    id: fan_output
    # Silkscreen D9.
    pin: GPIO8
    period: 900s
