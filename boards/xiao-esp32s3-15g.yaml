# Seeed XIAO ESP32-S3 -- KAIDEN'S 15 GAL. Headless controller.
#
# The old nano XIAO, reused. Same silicon and the same pad layout as
# boards/xiao-esp32s3.yaml, but a different tank, so its own file: that one
# carries a second probe, a pH probe and the nano's physics, and its NVS
# calibration belongs to different water. Do NOT point this tank's wrapper
# at the plain xiao file.
#
# Pairs with the 4.3" Waveshare panel (tank-monitor-15g-panel-remote.yaml),
# the one the 75 used before the P4 wall panel replaced it. That panel
# speaks payload v3 only, so this controller loads packages/ble_link_v3.yaml
# and supplies the v3 fields it does not have as "not fitted" -- see the
# bottom of this file.
#
# PAD LABELS ARE NOT GPIO NUMBERS. Wire by the silkscreen column.
#   D0=1  D1=2  D2=3  D3=4  D4=5  D5=6  D6=43  D7=44  D8=7  D9=8  D10=9
#
#   signal              SILKSCREEN   GPIO   wire
#   TDS analog          D0           1      yellow
#   CO2 solenoid IN+    D4           5      green  (3rd relay outlet)
#   DS18B20 data        D5           6      orange
#   I2C SDA (BH1750)    D6           43     white
#   I2C SCL (BH1750)    D7           44     brown
#   heater relay IN+    D8           7      purple
#   fan relay IN+       D9           8      blue
#   bubbler IN+         D10          9      (8th wire; 4th relay outlet)
#   pH analog           D3           4      wired; reads only when a probe is fitted
#
# Spare: D1 (GPIO2, ADC1).
#
# This is the SECOND XIAO on this tank (2026-11-06): the first stopped
# enumerating on USB. Same pads as before except TDS, which moved from D1
# to D0 to match how this one was wired. A new chip is a new BLE MAC: read
# "Controller BLE MAC" after flashing and update the panel wrapper.
# D2 = GPIO3 stays EMPTY: it is an S3 strapping pin and nothing may hold it
# at a level during boot.
#
# pH IS ON, WITH OR WITHOUT A PROBE. The wire on D3 (GPIO4, ADC1) is read
# all the time, so fitting a probe later needs no reflash: land the pH
# board's analog out on that wire and it starts reading.
#
# Telling "no probe" from a reading: an open ADC pin floats and wanders
# through voltages a real probe produces, so GPIO4's internal pull-down is
# switched on (see on_boot below). With nothing attached the pin sits at
# 0 V; a pH board's op-amp output overrides ~45k without noticing. Under
# 0.15 V is taken as "no probe" -- ph_voltage goes NaN, Water pH goes
# unknown, "pH Probe" reads disconnected, and the web page and panel show
# the last water test where pH would be. Until a probe is fitted, insulate
# the wire's far end so it cannot touch the relay box's supply.
#
# BH1750: ADDR floating or to GND = 0x23, which is what packages/sensors.yaml
# expects. Never splice ADDR to VCC by hand -- that splice shorted the 3V3
# rail on the 75 build, twice.
#
# WHAT THIS FILE OWES THE SHARED PACKAGES -- the board contract:
#   one_wire bus                 -> dallas_temp in packages/sensors.yaml
#   i2c bus                      -> bh1750 (tank_lux) in packages/sensors.yaml
#   adc sensor id: tds_voltage   -> packages/sensors.yaml
#   output id: heater_output     -> packages/control.yaml
#   output id: fan_output        -> packages/control.yaml
#   switch id: co2_relay, bubbler_relay -> packages/co2_bubbler.yaml
#   adc sensor id: ph_voltage    -> packages/ph.yaml (Water pH)
#   water_temp_b, temp_gradient,
#   grad_ema_heating, grad_ema_idle  -> packages/ble_link_v3.yaml

esp32:
  board: seeed_xiao_esp32s3
  variant: esp32s3
  flash_size: 8MB
  framework:
    type: esp-idf

# No mqtt: block. This tank has no Home Assistant and no broker;
# packages/standalone.yaml removes MQTT entirely.

# One probe, one bus. With a single bus the address-less dallas_temp in
# packages/sensors.yaml binds to it without an !extend.
one_wire:
  - platform: gpio
    id: onewire_a
    # Silkscreen D5. No external pull-up needed: the gpio one_wire driver
    # asserts the chip's internal pull-up (~45k) on every reset and bit read.
    # Fine for one probe on a short cable; a marginal bus shows up as CRC
    # errors in the log, and a 4.7k from D5 to 3V3 is the fix if it does.
    pin: GPIO6

# Kaiden's tank: ~15 gal, one heater, mesh lid or open top, open room.
# First-boot defaults only -- the Tank Volume, Heater Power, Tank Cover and
# Tank Placement entities change them from Home Assistant and persist.
#
# heater_power is a guess: the heater's rating is unknown and 50 W is the
# common size for this tank. Read the label and correct the Heater Power
# entity; a wrong value only slows the model down while it learns.
#
# Mesh lid counts as open_top: mesh stops jumpers, not evaporation, and
# evaporation is what the cover setting models.
tank_controller:
  tank_volume: 15
  heater_power: 50
  tank_cover: open_top
  tank_placement: open_room

i2c:
  # Silkscreen D6 / D7. GPIO43/44 are U0TXD/U0RXD, free because the logger
  # runs over native USB.
  sda: GPIO43
  scl: GPIO44
  scan: true

sensor:
  # Raw TDS probe voltage. Internal only; packages/sensors.yaml does the maths.
  - platform: adc
    # Silkscreen D0. ADC1, like every pad but D6/D7 on this board.
    pin: GPIO1
    id: tds_voltage
    update_interval: 500ms
    attenuation: 12db
    raw: false
    internal: true
    filters:
      # The probe output is AC-excited and noisy; median rejects spikes
      # without lagging a value that moves over minutes anyway.
      - median:
          window_size: 20
          send_every: 20
          send_first_at: 20

  # ---------------------------------------------------------------
  # v3 fields this tank does not have
  # ---------------------------------------------------------------
  # The v3 frame is fixed at 20 fields and the panel rejects any other
  # count, so the fields for a second probe and pH must exist. They are
  # declared here with no source: their state stays NaN, the link sends the
  # -999 sentinel, and the panel shows "--" -- the protocol's own way of
  # saying "not fitted". Internal, so Home Assistant never sees an entity
  # that cannot have a value.
  - platform: template
    id: water_temp_b
    internal: true
    update_interval: never
  - platform: template
    id: temp_gradient
    internal: true
    update_interval: never
  # pH board voltage. packages/ph.yaml turns it into Water pH.
  - platform: adc
    # Silkscreen D3.
    pin: GPIO4
    id: ph_voltage
    update_interval: 1s
    attenuation: 12db
    raw: false
    internal: true
    filters:
      - median:
          window_size: 10
          send_every: 5
          send_first_at: 5
      # The pull-down holds an empty pin at 0 V. No real pH board output
      # gets this low (pH 14 is still ~0.4 V), so this is "no probe".
      - lambda: 'return x < 0.15f ? NAN : x;'

globals:
  - id: grad_ema_heating
    type: float
    restore_value: false
    initial_value: 'NAN'
  - id: grad_ema_idle
    type: float
    restore_value: false
    initial_value: 'NAN'

# Time-proportional over a 15 minute period (components/time_proportioning).
# Mechanical relay contacts: a shorter period buys finer control with
# switching wear. Pinned fully on or off costs nothing.
#
# packages/control.yaml defines heater_relay and fan_relay but does not
# publish them; these state_change_actions do. Without them the Heater and
# Fan entities read off forever while the tank regulates.
output:
  - platform: time_proportioning
    id: heater_output
    # Silkscreen D8.
    pin: GPIO7
    period: 900s
    state_change_action:
      - binary_sensor.template.publish:
          id: heater_relay
          state: !lambda "return state;"

  - platform: time_proportioning
    id: fan_output
    # Silkscreen D9.
    pin: GPIO8
    period: 900s
    state_change_action:
      - binary_sensor.template.publish:
          id: fan_relay
          state: !lambda "return state;"

# BUILD GUARD, as on boards/xiao-esp32s3.yaml: reading id(ble_tx) makes a
# build without packages/ble_link_v3.yaml fail at compile instead of
# producing a controller that runs the tank and advertises nothing.
text_sensor:
  - platform: template
    name: "Link Payload"
    icon: "mdi:code-string"
    entity_category: diagnostic
    update_interval: 60s
    lambda: 'return {id(ble_tx)};'

# ---------------------------------------------------------------
# CO2 solenoid and bubbler -- the relay box's 3rd and 4th outlets
# ---------------------------------------------------------------
# Same active-high relay module as the heater and fan: voltage on IN+
# closes the outlet. The schedule that drives these is
# packages/co2_bubbler.yaml; the pins are here because they are the board's.
#
# Boot states are the safe ones, whatever was running before: CO2 OFF (gas
# with no one watching is the dangerous failure) and the bubbler ON (air
# is never the dangerous failure). The schedule sets both properly within
# 30 s of the clock being known.
switch:
  - platform: gpio
    id: co2_relay
    name: "CO2"
    icon: "mdi:molecule-co2"
    # Silkscreen D4.
    pin: GPIO5
    restore_mode: ALWAYS_OFF
  - platform: gpio
    id: bubbler_relay
    name: "Bubbler"
    icon: "mdi:chart-bubble"
    # Silkscreen D10.
    pin: GPIO9
    restore_mode: ALWAYS_ON

binary_sensor:
  # Whether a pH probe is answering on D3. The web page shows pH and its
  # calibration only while this is on.
  - platform: template
    name: "pH Probe"
    icon: "mdi:test-tube"
    device_class: connectivity
    entity_category: diagnostic
    lambda: 'return !std::isnan(id(ph_voltage).state);'

esphome:
  on_boot:
    # After every component's setup, so the ADC has configured the pin.
    priority: -100
    then:
      - lambda: |-
          gpio_pullup_dis(GPIO_NUM_4);
          gpio_pulldown_en(GPIO_NUM_4);

# pH comes with the board, not the wrapper: the wrapper is the one file not
# pulled from git, and a probe fitted later must work without editing it.
packages:
  ph: !include ../packages/ph.yaml

# ---------------------------------------------------------------
# Relay identification test -- OFF unless the wrapper turns it on
# ---------------------------------------------------------------
# For finding which wire went to which outlet without Wi-Fi, a web page or
# even a working USB log. Put this in the WRAPPER's substitutions, flash,
# watch the relay box, then set it back to "false" and flash again:
#   relay_test: "true"
# From 20 s after boot, three rounds of: relay 1 clicks ONCE, pause; relay 2
# TWICE, pause; relay 3 three times; relay 4 four times. The count is the
# relay -- 1 heater (D8), 2 fan (D9), 3 CO2 (D4), 4 bubbler (D10) -- and
# each step is also logged at WARN. UNPLUG THE HEATER AND CO2 from the
# outlets first: the test switches them regardless of temperature or
# schedule. It drives the pins directly, so neither the controller nor the
# CO2 schedule fights it, and puts CO2 and the bubbler back as their
# switches say when it ends.
substitutions:
  relay_test: "false"

interval:
  - interval: 1s
    then:
      - lambda: |-
          if (!${relay_test}) return;
          struct Relay { gpio_num_t pin; const char *what; };
          static const Relay R[4] = {
              {GPIO_NUM_7, "relay 1 HEATER  (D8, purple)"},
              {GPIO_NUM_8, "relay 2 FAN     (D9, blue)"},
              {GPIO_NUM_5, "relay 3 CO2     (D4, green)"},
              {GPIO_NUM_9, "relay 4 BUBBLER (D10)"}};
          static int t = -20;  // seconds since the test began; starts 20 s after boot
          t++;
          if (t < 0) return;
          // One round: relay k gets 2k seconds of 1 s on / 1 s off (k clicks)
          // and then a 4 s pause. 6 + 8 + 10 + 12 = 36 s a round, three rounds.
          const int ROUND = 36, ROUNDS = 3;
          if (t == 0) {
            ESP_LOGW("relay_test", "RELAY TEST: count the clicks -- 1 heater, 2 fan, 3 CO2, 4 bubbler");
            for (auto &r : R) gpio_set_level(r.pin, 0);
          }
          if (t >= ROUND * ROUNDS) {
            if (t == ROUND * ROUNDS) {
              for (auto &r : R) gpio_set_level(r.pin, 0);
              gpio_set_level(GPIO_NUM_5, id(co2_relay).state);
              gpio_set_level(GPIO_NUM_9, id(bubbler_relay).state);
              ESP_LOGW("relay_test", "RELAY TEST done. Set relay_test back to \"false\" and reflash.");
            }
            return;
          }
          int s = t % ROUND;
          for (int k = 0; k < 4; k++) {
            const int seg = 2 * (k + 1) + 4;
            if (s >= seg) { s -= seg; continue; }
            const bool on = s < 2 * (k + 1) && s % 2 == 0;
            gpio_set_level(R[k].pin, on);
            if (on) ESP_LOGW("relay_test", "round %d: %s click %d of %d", t / ROUND + 1, R[k].what, s / 2 + 1, k + 1);
            break;
          }
