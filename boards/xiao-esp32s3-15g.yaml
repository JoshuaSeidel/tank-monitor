# Seeed XIAO ESP32-S3 -- KAIDEN'S 15 GAL. Headless controller.
#
# The old nano XIAO, reused. Same silicon and the same pad layout as
# boards/xiao-esp32s3.yaml, but a different tank, so its own file: that one
# carries a second probe, a pH probe and the nano's physics, and its NVS
# calibration belongs to different water. Do NOT point this tank's wrapper
# at the plain xiao file.
#
# Pairs with the 4.3" Waveshare panel (tank-monitor-15g-panel-remote.yaml),
# the one the 75 used before the P4 wall panel replaced it. That panel
# speaks payload v3 only, so this controller loads packages/ble_link_v3.yaml
# and supplies the v3 fields it does not have as "not fitted" -- see the
# bottom of this file.
#
# PAD LABELS ARE NOT GPIO NUMBERS. Wire by the silkscreen column.
#   D0=1  D1=2  D2=3  D3=4  D4=5  D5=6  D6=43  D7=44  D8=7  D9=8  D10=9
#
#   signal              SILKSCREEN   GPIO   wire
#   TDS analog          D1           2      purple
#   (pH, reserved)      D3           4      blue   -- NOT configured, see below
#   DS18B20 data        D5           6      yellow
#   I2C SDA (BH1750)    D6           43     orange
#   I2C SCL (BH1750)    D7           44     brown
#   heater relay IN+    D8           7      white
#   fan relay IN+       D9           8      (seventh wire)
#
# Spare: D0 (GPIO1), D4 (GPIO5), D10 (GPIO9).
# D2 = GPIO3 stays EMPTY: it is an S3 strapping pin and nothing may hold it
# at a level during boot.
#
# THE pH WIRE. Blue runs to D3 and stops there. Nothing in this config
# touches GPIO4, so the pin is an unconfigured input and the wire is inert
# -- insulate the far end so it cannot reach the relay's supply. To fit a
# probe later: add packages/ph.yaml to the wrapper, delete the water_ph
# placeholder at the bottom of this file, and add an adc sensor
# `id: ph_voltage` on GPIO4 exactly as boards/xiao-esp32s3.yaml has it.
#
# BH1750: ADDR floating or to GND = 0x23, which is what packages/sensors.yaml
# expects. Never splice ADDR to VCC by hand -- that splice shorted the 3V3
# rail on the 75 build, twice.
#
# WHAT THIS FILE OWES THE SHARED PACKAGES -- the board contract:
#   one_wire bus                 -> dallas_temp in packages/sensors.yaml
#   i2c bus                      -> bh1750 (tank_lux) in packages/sensors.yaml
#   adc sensor id: tds_voltage   -> packages/sensors.yaml
#   output id: heater_output     -> packages/control.yaml
#   output id: fan_output        -> packages/control.yaml
#   water_temp_b, temp_gradient, water_ph,
#   grad_ema_heating, grad_ema_idle  -> packages/ble_link_v3.yaml

esp32:
  board: seeed_xiao_esp32s3
  variant: esp32s3
  flash_size: 8MB
  framework:
    type: esp-idf

# See boards/xiao-esp32s3.yaml. The default "legacy" unique_id generator has
# no device name in it, so this board's "Water Temperature" would collide
# with every other controller's and Home Assistant would silently drop it.
mqtt:
  discovery_unique_id_generator: mac

# One probe, one bus. With a single bus the address-less dallas_temp in
# packages/sensors.yaml binds to it without an !extend.
one_wire:
  - platform: gpio
    id: onewire_a
    # Silkscreen D5. No external pull-up needed: the gpio one_wire driver
    # asserts the chip's internal pull-up (~45k) on every reset and bit read.
    # Fine for one probe on a short cable; a marginal bus shows up as CRC
    # errors in the log, and a 4.7k from D5 to 3V3 is the fix if it does.
    pin: GPIO6

# Kaiden's tank: ~15 gal, one heater, mesh lid or open top, open room.
# First-boot defaults only -- the Tank Volume, Heater Power, Tank Cover and
# Tank Placement entities change them from Home Assistant and persist.
#
# heater_power is a guess: the heater's rating is unknown and 50 W is the
# common size for this tank. Read the label and correct the Heater Power
# entity; a wrong value only slows the model down while it learns.
#
# Mesh lid counts as open_top: mesh stops jumpers, not evaporation, and
# evaporation is what the cover setting models.
tank_controller:
  tank_volume: 15
  heater_power: 50
  tank_cover: open_top
  tank_placement: open_room

i2c:
  # Silkscreen D6 / D7. GPIO43/44 are U0TXD/U0RXD, free because the logger
  # runs over native USB.
  sda: GPIO43
  scl: GPIO44
  scan: true

sensor:
  # Raw TDS probe voltage. Internal only; packages/sensors.yaml does the maths.
  - platform: adc
    # Silkscreen D1.
    pin: GPIO2
    id: tds_voltage
    update_interval: 500ms
    attenuation: 12db
    raw: false
    internal: true
    filters:
      # The probe output is AC-excited and noisy; median rejects spikes
      # without lagging a value that moves over minutes anyway.
      - median:
          window_size: 20
          send_every: 20
          send_first_at: 20

  # ---------------------------------------------------------------
  # v3 fields this tank does not have
  # ---------------------------------------------------------------
  # The v3 frame is fixed at 20 fields and the panel rejects any other
  # count, so the fields for a second probe and pH must exist. They are
  # declared here with no source: their state stays NaN, the link sends the
  # -999 sentinel, and the panel shows "--" -- the protocol's own way of
  # saying "not fitted". Internal, so Home Assistant never sees an entity
  # that cannot have a value.
  - platform: template
    id: water_temp_b
    internal: true
    update_interval: never
  - platform: template
    id: temp_gradient
    internal: true
    update_interval: never
  # Delete this one when packages/ph.yaml is added -- ph.yaml defines
  # water_ph itself and the two would collide.
  - platform: template
    id: water_ph
    internal: true
    update_interval: never

globals:
  - id: grad_ema_heating
    type: float
    restore_value: false
    initial_value: 'NAN'
  - id: grad_ema_idle
    type: float
    restore_value: false
    initial_value: 'NAN'

# Time-proportional over a 15 minute period (components/time_proportioning).
# Mechanical relay contacts: a shorter period buys finer control with
# switching wear. Pinned fully on or off costs nothing.
#
# packages/control.yaml defines heater_relay and fan_relay but does not
# publish them; these state_change_actions do. Without them the Heater and
# Fan entities read off forever while the tank regulates.
output:
  - platform: time_proportioning
    id: heater_output
    # Silkscreen D8.
    pin: GPIO7
    period: 900s
    state_change_action:
      - binary_sensor.template.publish:
          id: heater_relay
          state: !lambda "return state;"

  - platform: time_proportioning
    id: fan_output
    # Silkscreen D9.
    pin: GPIO8
    period: 900s
    state_change_action:
      - binary_sensor.template.publish:
          id: fan_relay
          state: !lambda "return state;"

# BUILD GUARD, as on boards/xiao-esp32s3.yaml: reading id(ble_tx) makes a
# build without packages/ble_link_v3.yaml fail at compile instead of
# producing a controller that runs the tank and advertises nothing.
text_sensor:
  - platform: template
    name: "Link Payload"
    icon: "mdi:code-string"
    entity_category: diagnostic
    update_interval: 60s
    lambda: 'return {id(ble_tx)};'
