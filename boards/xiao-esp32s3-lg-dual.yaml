# Seeed XIAO ESP32-S3 -- LARGE TANK, DUAL SYSTEMS. Headless controller.
#
# WHY THIS FILE EXISTS SEPARATELY FROM boards/xiao-esp32s3.yaml
# Same silicon, same pad labels, different wet side. The "-lg-dual" suffix
# is the whole point: two heaters sharing one load, two temperature probes,
# two light sensors, and pH/TDS moved off the internal ADC onto an ADS1115.
# Do NOT merge this back into the plain xiao file -- that one runs the
# 12-13 gal tank, and its NVS calibration belongs to different water.
#
# NOTHING IN THIS FILE CHANGES ANY SHARED PACKAGE. Every addition is local
# to this board, including the one !extend below, which only applies to a
# config that includes this file. Boards that do not include it are
# bit-identical to before this file existed.
#
# The two devices MUST carry different device_name values in their wrappers.
# That name sets the MQTT topic prefix, the discovery object ids, the mDNS
# hostname and the fallback AP name all at once; two boards answering to one
# name overwrite each other's Home Assistant entities as fast as they appear.
#
# PAD LABELS ARE NOT GPIO NUMBERS. The XIAO is silkscreened D0-D10 and D3 is
# GPIO4, D8 is GPIO7. Wiring to the pad whose printed number matches a GPIO
# below lands on the wrong pin, and every symptom of that is silent.
#   D0=1  D1=2  D2=3  D3=4  D4=5  D5=6  D6=43  D7=44  D8=7  D9=8  D10=9
#
#   signal                    SILKSCREEN   GPIO
#   1-Wire bus A (control)    D5           6      + 4.7k pull-up
#   1-Wire bus B (crosscheck) D0           1      + 4.7k pull-up
#   I2C SDA                   D6           43
#   I2C SCL                   D7           44
#   Heater A control          D8           7
#   Heater B control          D4           5
#   Fan control               D9           8
#   Leak sensor (floor)       ADS1115 A2   -- no XIAO pad; see below
#   TDS probe                 ADS1115 A0
#   pH probe                  ADS1115 A3   -- A1 died 2026-09-24; see below
#
# Spare: D1 (GPIO2), D3 (GPIO4), D10 (GPIO9) -- all ADC1, all free because
# pH and TDS now live on the ADS1115. D2 = GPIO3 stays EMPTY: it is an S3
# strapping pin and nothing may hold it at a level during boot.
#
# WHAT THIS FILE OWES THE SHARED PACKAGES -- the board contract:
#   one_wire bus                 -> dallas_temp in packages/sensors.yaml
#   i2c bus                      -> BH1750 + ADS1115
#   sensor id: tds_voltage       -> packages/sensors.yaml
#   sensor id: ph_voltage        -> packages/ph.yaml
#   output id: heater_output     -> packages/control.yaml
#   output id: fan_output        -> packages/control.yaml

# Side labels. Probe A and heater A are the SAME half of the tank, probe B
# and heater B the other -- that pairing is the whole point of two probes
# here, and it is a wiring fact this file cannot verify. Override these in
# the wrapper with the physical arrangement ("Left"/"Right", "Front"/"Back")
# so the Home Assistant entities are self-documenting.
#
# packages/sensors.yaml owns the name "Water Temperature" for probe A and
# cannot be relabelled from here, so: the UNSUFFIXED temperature is side A.
substitutions:
  side_a_name: "A"
  side_b_name: "B"
  # The two I2C pads. Overridable from the wrapper for exactly one reason:
  # if SDA and SCL were landed the other way round on the XIAO, swapping
  # these two values is a reflash instead of a desolder. Everything else
  # about the bus is unchanged.
  i2c_sda: "43"     # D6
  i2c_scl: "44"     # D7
  # What "I2C Devices" expects to find: "addr label, addr label, ...".
  # A wrapper that leaves the lux sensors off (see tank-monitor-lg-remote)
  # trims this to the ADS1115 alone, so the diagnostic reports a healthy
  # bus as healthy instead of naming two sensors that were never fitted.
  i2c_expect: "0x48 ADS1115, 0x23 lux ${side_a_name}, 0x5C lux ${side_b_name}"
  # Leak sensor thresholds, volts on A2. Measured on this tank: wet reads
  # 2.0-2.7 V; dry on the bench 0.0 V; dry on sealed hardwood beside the
  # heater cords 0.2-0.5 V, wandering. So: wet above 1.2, dry again below
  # 0.8, and the gap between is hysteresis -- a reading that hovers around
  # one line cannot chatter across both.
  leak_on_v:  "1.2"
  leak_off_v: "0.8"

esp32:
  board: seeed_xiao_esp32s3
  variant: esp32s3
  flash_size: 8MB
  framework:
    type: esp-idf

# See boards/xiao-esp32s3.yaml for the full story. Short version: ESPHome's
# default "legacy" unique_id generator omits the device name, so this board's
# "Water Temperature" would collide with the other controller's and Home
# Assistant would silently refuse the second one.
mqtt:
  discovery_unique_id_generator: mac

# ---------------------------------------------------------------
# Two 1-Wire buses, one probe each -- deliberately not one bus with two
# ---------------------------------------------------------------
# Two DS18B20 on a shared bus must each carry an explicit `address:`, and
# packages/sensors.yaml defines its probe WITHOUT one (correctly -- it is
# the single-probe case, and changing it would alter every existing board).
# Giving each probe its own bus means neither needs an address, so the
# shared package drops in unmodified.
#
# It is also better engineering for a cross-check: a shorted or flooded
# probe takes down its own bus and nothing else. On a shared bus one bad
# probe silences both, which is the exact moment you most want the other.
#
# Declaration order does NOT disambiguate. Verified against ESPHome
# 2026.8.2: with two buses declared, sensors.yaml's address-less probe
# fails config with "Too many candidates found for 'one_wire_id'". It is
# bound explicitly by the !extend in the sensor block below.
one_wire:
  - platform: gpio
    id: onewire_a
    pin: GPIO6      # D5 -- control probe. 4.7k pull-up to 3V3.
  - platform: gpio
    id: onewire_b
    pin: GPIO1      # D0 -- cross-check probe. 4.7k pull-up to 3V3.

# One bus, three devices: the ADS1115 next to the board and two BH1750s at
# opposite ends of a 48" tank, so each SDA/SCL pair is a 4-5 ft run. I2C
# was designed for inches; what limits it is bus capacitance against the
# clock's rise time. At the 50kHz default a run this long is marginal and
# fails in the worst way -- occasional bit errors that read as a lux value,
# not as an error. At 10kHz the rise-time budget is five times wider and
# ordinary twisted pair covers several metres. Cost: a BH1750 read takes
# ~4 ms instead of ~1 ms, once every 30 s. Nothing here needs faster.
#
# Keep the pair away from the heater cords and the relay module -- slowing
# the clock buys capacitance margin, not noise immunity.
i2c:
  id: bus_a
  sda: ${i2c_sda}
  scl: ${i2c_scl}
  scan: true
  frequency: 10kHz

# I2C bus autopsy, run BEFORE the driver claims the pins (BUS priority is
# 1000; this is 1001). Two questions the scan cannot answer, because the
# scan enables the chip's own pull-ups and so cannot tell a wire that
# reaches a powered device from a wire that reaches nothing:
#
#   ext-pullup  With the chip's ~45k pull-DOWN on and nothing else, a pin
#               reads 0. If it reads 1 something out there is pulling it
#               up -- the breakout's own 10k to its VDD. So "yes" means
#               the wire reaches a device that has power. "no" means an
#               open wire or a dead VDD; the ESP32 cannot tell which.
#   drives-low  Open-drain low, read back. Anything but 0 is a line tied
#               hard to 3V3 (a jumper on the wrong pin).
#
# Stashed in a global and appended to "I2C Devices", so it reaches Home
# Assistant without a serial cable. Numeric pin substitutions on purpose:
# a lambda needs a number, and "GPIO43" is not one.
esphome:
  on_boot:
    # Re-apply the persisted mode once the controller exists (LATE = -100;
    # this runs after it). A restored Cycling stays warm across a reboot.
    - priority: -200
      then:
        - script.execute: apply_mode
    - priority: 1001
      then:
        - lambda: |-
            const gpio_num_t pins[2] = {(gpio_num_t) ${i2c_sda}, (gpio_num_t) ${i2c_scl}};
            const char *names[2] = {"SDA", "SCL"};
            std::string r;
            for (int i = 0; i < 2; i++) {
              gpio_config_t c{};
              c.pin_bit_mask = 1ULL << pins[i];
              c.mode = GPIO_MODE_INPUT;
              c.pull_up_en = GPIO_PULLUP_DISABLE;
              c.pull_down_en = GPIO_PULLDOWN_ENABLE;
              c.intr_type = GPIO_INTR_DISABLE;
              gpio_config(&c);
              delayMicroseconds(200);
              const int ext = gpio_get_level(pins[i]);
              c.mode = GPIO_MODE_INPUT_OUTPUT_OD;
              c.pull_up_en = GPIO_PULLUP_ENABLE;
              c.pull_down_en = GPIO_PULLDOWN_DISABLE;
              gpio_config(&c);
              gpio_set_level(pins[i], 0);
              delayMicroseconds(200);
              const int low = gpio_get_level(pins[i]);
              gpio_set_level(pins[i], 1);
              delayMicroseconds(200);
              const int high = gpio_get_level(pins[i]);
              char b[64];
              snprintf(b, sizeof(b), "%s%s ext-pullup %s, drives-low %s, releases %s",
                       i ? "; " : "", names[i], ext ? "yes" : "NO",
                       low == 0 ? "yes" : "NO", high ? "yes" : "NO");
              r += b;
            }
            id(i2c_autopsy) = r;
            ESP_LOGI("i2c", "autopsy: %s", r.c_str());

# The cross-check probe below is also the controller's veto: if the two
# probes disagree by more than the band for five minutes the heater goes
# off (control.yaml's "Probes Disagree"). Distinct from "Probe Disagreement"
# further down, which is the instantaneous gradient against its own
# threshold -- that one tells you about the tank, this one stops the heater.
tank_controller:
  cross_check: water_temp_b
  # Eight degrees, not control.yaml's two. On a 48" tank the two probes sit
  # 40" apart with a heater beside each; a real gradient of a degree or
  # two is a MEASUREMENT here (see "Temperature Gradient"), not a fault.
  # The veto exists for a probe that is lying -- the flooded DS18B20 of
  # 2026-09-14 read half the water temperature, 35 degF off -- and 8 degF
  # catches that with room to spare while never firing on the tank itself.
  # First-boot default only: the controller persists the band, and the
  # "Probe Disagreement Band" entity (raised to 15 below) changes it live.
  disagreement_band: 8.0
  # Hard high cutout raised for cycling. control.yaml's 82 degF sits above
  # anything the 70-80 slider allows but BELOW a cycling target, and the
  # setpoint is clamped to the cutout. 88 degF is still nowhere near what
  # troubles glass, silicone or a Jager; it is a backstop on the water,
  # not a limit on the target.
  max_temperature: 88.0

# ---------------------------------------------------------------
# ADS1115 -- pH and TDS off the internal ADC
# ---------------------------------------------------------------
# 0x48 = ADDR tied to GND. No clash with the BH1750s at 0x23 and 0x5C.
#
# POWER IT FROM 3.3V, NOT 5V. Two independent reasons:
#   - Its I2C logic threshold is 0.7*VDD. At VDD=5V that is 3.5V and the
#     XIAO only drives 3.3V, so highs are marginal and it fails
#     intermittently rather than cleanly.
#   - Absolute max analog input is VDD+0.3V. A 3.3V rail caps safe input at
#     ~3.6V; make sure the Gravity boards cannot swing above that.
#
# Continuous mode is OFF (the default). With two channels multiplexed on one
# hub, continuous conversion returns the previous channel's reading.
ads1115:
  - address: 0x48

sensor:
  # Bind the shared package's probe to bus A.
  #
  # This !extend lives in the BOARD FILE and not the wrapper on purpose. The
  # wrapper is the one file not pulled from git, and load-critical config has
  # silently gone missing from it four times in this project. The board that
  # grew a second bus is the board that owes the binding.
  #
  # It also scopes the change correctly: !extend only applies to configs
  # that include THIS file, so sensors.yaml keeps behaving exactly as it
  # always has for every other board.
  - id: !extend water_temp
    one_wire_id: onewire_a
  # Two probes, two names. sensors.yaml calls the published one "Water
  # Temperature" because on a one-probe board that is all it is; here it
  # is one end of the tank and says so. The entity id follows the name, so
  # Home Assistant sees ..._water_temperature_left, not the unsuffixed one.
  - id: !extend water_temp_f
    name: "Water Temperature ${side_a_name}"

  # Raw TDS probe voltage. Internal only; packages/sensors.yaml does the
  # maths and owns the published entity.
  - platform: ads1115
    multiplexer: 'A0_GND'
    # 4.096, NOT the 2.048 that looks like it fits. The Gravity TDS board
    # swings to ~2.3V and the pH board to ~3V; at 2.048 both clip at the top
    # of their range and the symptom is a reading that tracks fine in the
    # middle and flattens at exactly the extremes you make decisions on.
    gain: 4.096
    id: tds_voltage
    update_interval: 500ms
    internal: true
    filters:
      # The probe output is noisy; median rejects spikes without lagging a
      # value that moves over minutes anyway.
      - median:
          window_size: 20
          send_every: 20
          send_first_at: 20

  # pH electrode buffer output -> packages/ph.yaml.
  #
  # A3, NOT A1. On 2026-09-24 the pH channel died mid-run: 13.5 hours into
  # an uninterrupted session, with nobody near the tank, A1 stopped being
  # driven and drifted to the rail -- -0.32 V, then 0.78, 2.46, 2.91, 2.99
  # over about forty seconds. That slow charge toward VDD is a floating ADC
  # input, not an amplifier output, which snaps. A0 and A2 kept reading
  # correctly throughout on the same chip, same bus, same config, and the
  # board never rebooted, so neither the ADS1115 nor this file was the
  # cause. That leaves the A1 pin itself: absolute max input here is
  # VDD+0.3V ~= 3.6 V and the Gravity pH board swings to ~3 V, so the
  # headroom an ESD hit or a relay transient has to eat through is 600 mV.
  #
  # A3 was the only unused channel. If pH reads correctly here, A1 is dead
  # and stays unused; if it drifts to the rail on A3 too, the fault is
  # upstream in the signal wire or the Gravity board and the ADS1115 is
  # cleared. Either answer is worth one line.
  - platform: ads1115
    multiplexer: 'A3_GND'
    gain: 4.096
    id: ph_voltage
    update_interval: 1s
    internal: true
    filters:
      - median:
          window_size: 10
          send_every: 5
          send_first_at: 5

  # Floor leak sensor under the stand -- a Level Sense LS-2600. Not a bare
  # pair of tabs: there is a transistor behind them, and the datasheet
  # describes it as "open circuit when dry, roughly 1.4 MOhm when wet",
  # polarised, red to +V and the other wire (black on this unit,
  # white on some) to the input. It SOURCES current when
  # wet, so the input wants a pull-DOWN and reads 0V dry, up when wet.
  # That 1.4M is why a pull-UP arrangement fails here: against any sane
  # pull-up the wet and dry voltages land within a volt of each other.
  #
  # Everything is on the ADS1115 breakout, none of it on the XIAO:
  #
  #   red   -> breakout VDD (3V3)      2.2M  between A2 and breakout GND
  #   black -> A2                      100nF between A2 and breakout GND
  #
  # Dry: 0V. Wet: the sensor's ~1.4M against 2.2M in parallel with the
  # ADC's own ~6M input impedance gives ~1.8V; with very clean water
  # (higher sensor resistance) it falls toward 1V, with tank water it
  # rises. Anything from 1M to 4.7M works for the pull-down. The cap is
  # because a megohm node on 6 ft of cable is an antenna without one.
  #
  # 3V3 is below the sensor's rated 5-12V. An emitter follower does not
  # care, and 3V3 keeps the output under the ADS1115's VDD+0.3V absolute
  # maximum with no series resistor -- at 5V a wet sensor can put 4V+ on
  # A2 and that is a dead ADC. If it will not wake at 3V3 (Leak Sensor
  # Voltage stays at 0 with the tabs wet), the fallback is red on the
  # XIAO's 5V pad with 1M in series between black and A2.
  - platform: ads1115
    multiplexer: 'A2_GND'
    gain: 4.096
    id: leak_voltage
    name: "Leak Sensor Voltage"
    unit_of_measurement: "V"
    accuracy_decimals: 2
    entity_category: diagnostic
    update_interval: 2s
    filters:
      - median:
          window_size: 5
          send_every: 5
          send_first_at: 3

  # ---------------------------------------------------------------
  # Cross-check temperature probe
  # ---------------------------------------------------------------
  # NOT a second control input. packages/control.yaml regulates on
  # water_temp alone, and that is deliberate: two independent loops on one
  # body of water mislearn each other's heat as ambient bias.
  #
  # This probe exists to answer two questions the control probe cannot:
  # "is the control probe still telling the truth" and "does this tank
  # actually have a gradient".
  - platform: dallas_temp
    one_wire_id: onewire_b
    internal: true
    id: water_temp_b
    update_interval: 10s
    accuracy_decimals: 2
    filters:
      # No filter_out: nan. A stale cross-check reading is worse than none
      # -- it would keep agreeing with a control probe that has died.
      - median:
          window_size: 5
          send_every: 1
          send_first_at: 1
      # Probe B gets its OWN offset. A DS18B20 is +/-0.5 degC absolute and
      # the control loop holds +/-0.3 degF, so two uncalibrated probes can
      # read nearly a degree apart in identical water. Cross-calibrate both
      # in the same cup before trusting any gradient number below.
      - lambda: return x + id(cal_temp_offset_b_c);

  - platform: template
    name: "Water Temperature ${side_b_name}"
    unit_of_measurement: "°F"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 30s
    lambda: |-
      if (std::isnan(id(water_temp_b).state)) return {};
      return id(water_temp_b).state * 9.0f / 5.0f + 32.0f;

  # SIGNED gradient, side A minus side B. Positive means the A half is
  # warmer. The sign is the actionable half of this number -- absolute value
  # tells you a gradient exists, the sign tells you which end to aim
  # circulation at. That matters here because the canister draws from one
  # side, so the two halves are not hydraulically equivalent even with
  # identical heat going into each.
  #
  # Log this for a week before believing in a hot spot: under ~0.3 degF
  # there is nothing to chase (and you cannot resolve less than that with
  # two DS18B20 anyway), over ~1 degF you have a circulation problem that
  # more heaters would mask rather than fix.
  - platform: template
    name: "Temperature Gradient"
    id: temp_gradient
    unit_of_measurement: "°F"
    icon: "mdi:thermometer-lines"
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 30s
    lambda: |-
      const float a = id(water_temp).state;
      const float b = id(water_temp_b).state;
      if (std::isnan(a) || std::isnan(b)) return {};
      return (a - b) * 9.0f / 5.0f;

  # ---------------------------------------------------------------
  # Splitting the gradient by cause
  # ---------------------------------------------------------------
  # A gradient that appears ONLY while the heaters run is a mixing problem:
  # heat is not leaving the end it is injected at. A gradient that persists
  # while they are idle is an ambient problem: one end of the tank is losing
  # heat to a cold wall, window or floor. Those have completely different
  # fixes, and the raw gradient cannot tell them apart.
  #
  # With both elements on the same duty, the heating figure is also the
  # heater-failure detector. If one element dies or its relay stops closing,
  # its half stops receiving heat and this number walks away from zero and
  # stays there while the idle figure does not.
  - platform: template
    name: "Gradient While Heating"
    unit_of_measurement: "°F"
    icon: "mdi:thermometer-lines"
    entity_category: diagnostic
    accuracy_decimals: 2
    update_interval: 60s
    lambda: |-
      // Expire rather than publish stale. If the tank has not been in this
      // regime recently the honest answer is "unavailable", not a figure
      // from last week presented as current -- the same reasoning that
      // keeps filter_out: nan off the probe in packages/sensors.yaml.
      const uint32_t t = id(grad_heating_ms);
      if (t == 0) return {};
      if (millis() - t > 21600000UL) return {};
      if (std::isnan(id(grad_ema_heating))) return {};
      return id(grad_ema_heating);

  - platform: template
    name: "Gradient While Idle"
    unit_of_measurement: "°F"
    icon: "mdi:thermometer-lines"
    entity_category: diagnostic
    accuracy_decimals: 2
    update_interval: 60s
    lambda: |-
      const uint32_t t = id(grad_idle_ms);
      if (t == 0) return {};
      if (millis() - t > 21600000UL) return {};
      if (std::isnan(id(grad_ema_idle))) return {};
      return id(grad_ema_idle);

  # Second light sensor. ADDR tied to 3V3 = 0x5C; floating/GND = 0x23, which
  # packages/sensors.yaml already claims. Two is the hard ceiling for BH1750
  # on one bus -- the part has exactly these two addresses.
  #
  # Both sensors are 4-5 ft from the board, which is why the bus runs at
  # 10kHz (see i2c: above). If one still comes and goes in the log, the
  # next step is a differential extender (PCA9615) at each end, not a
  # faster clock or a thicker wire.
  - platform: bh1750
    name: "Tank Light Level ${side_b_name}"
    id: tank_lux_b
    address: 0x5C
    update_interval: 30s
    accuracy_decimals: 0
    filters:
      - filter_out: nan

binary_sensor:
  # Per-element contact state. control.yaml's "Heater" is the pair; these
  # are the individual relays, and seeing them out of lockstep means a relay
  # is not following its drive.
  - platform: template
    id: heater_a_relay
    name: "Heater ${side_a_name}"
    device_class: running
    icon: "mdi:radiator"

  - platform: template
    id: heater_b_relay
    name: "Heater ${side_b_name}"
    device_class: running
    icon: "mdi:radiator"

  # Fires when the probes disagree by more than the configured band. That is
  # either a real gradient, a dead heater, or a probe drifting out of
  # calibration -- all three are things you want to be told about rather
  # than discover in the data months later.
  - platform: template
    name: "Probe Disagreement"
    id: probe_disagreement
    device_class: problem
    entity_category: diagnostic
    lambda: |-
      if (std::isnan(id(temp_gradient).state)) return {};
      return fabsf(id(temp_gradient).state) > id(cal_gradient_alarm_f);

  # Wet = the sensor sources into the pull-down = the voltage rises. Two
  # thresholds (substitutions above): above leak_on_v is wet, below
  # leak_off_v is dry, and in between the answer is "whatever it was" --
  # returning an empty optional leaves the state alone. That band is what
  # stops a floor that reads 0.4 V on a humid night from flickering the
  # alarm; a 0.5 V single threshold did exactly that on 2026-09-17.
  #
  # The delays are the debounce on top. A splash that bridges the tabs for
  # a few seconds is not a leak; a leak does not un-bridge them in ten.
  - platform: template
    name: "Leak"
    id: leak_floor
    device_class: moisture
    lambda: |-
      const float v = id(leak_voltage).state;
      if (std::isnan(v)) return {};
      if (v > ${leak_on_v}f) return true;
      if (v < ${leak_off_v}f) return false;
      return {};
    filters:
      - delayed_on: 5s
      - delayed_off: 10s

# ---------------------------------------------------------------
# Heaters: ONE loop, TWO relays, BOTH heating together
# ---------------------------------------------------------------
# Equal duty to both elements, simultaneously, always. NOT staged.
#
# Staging (A carries low demand alone, B joins above a threshold) delivers
# heat more smoothly in TIME -- 150W pulsing instead of 300W. That is the
# wrong trade for this tank, because it necessarily puts all the low-demand
# heat into one half. The canister draws from a single side, so flow is
# already directional; stacking a heat asymmetry on top of a flow asymmetry
# manufactures exactly the gradient the second probe exists to detect.
#
# Even injection wins. The 300W-vs-150W pulse difference is invisible
# against a thermal time constant measured in hours. The gradient it would
# create is not.
#
# packages/control.yaml takes a single `heater:` FloatOutput and its RLS
# model carries exactly one heater term (phi = [heater, fan, T-TREF, light,
# 1]). heater_output satisfies that contract and the pair behaves as one
# 300W actuator whose combined gain the model learns as a unit.
#
# The two relays stay separate rather than being ganged onto one GPIO: it
# costs a pin this board has spare, and it keeps the ability to cut one
# element independently if a relay welds or an element fails.
output:
  - platform: slow_pwm
    id: heater_a_pwm
    pin: GPIO7        # D8
    period: 900s
    # False is already the ESPHome default (verified in slow_pwm/output.py,
    # 2026.8.2) -- stated explicitly because it matters more here than
    # anywhere else in this repo: it keeps the two windows PHASE-LOCKED. They start together at boot and
    # are always written in the same lambda below, so equal duty means both
    # elements are energised over the same part of each window. Letting the
    # cycles restart independently would drift them apart and, at partial
    # duty, alternate the halves -- reintroducing precisely the side-to-side
    # asymmetry this design exists to avoid.
    restart_cycle_on_state_change: false
    # packages/control.yaml defines heater_relay and fan_relay but does NOT
    # publish them -- its comment says outright they are "published from
    # slow_pwm's state_change_action in the board file". Without these the
    # entities sit at the false seeded on_boot forever, and Home Assistant
    # shows a heater that never runs while the tank regulates perfectly.
    state_change_action:
      - lambda: id(heater_a_closed) = state;
      - binary_sensor.template.publish:
          id: heater_relay
          # OR, not AND: this entity answers "is heat being delivered". A
          # failed element is not its job -- Gradient While Heating covers
          # that, and the per-side sensors below show the pair in lockstep.
          state: !lambda "return id(heater_a_closed) || id(heater_b_closed);"
      - binary_sensor.template.publish:
          id: heater_a_relay
          state: !lambda "return state;"

  - platform: slow_pwm
    id: heater_b_pwm
    pin: GPIO5        # D4
    period: 900s
    restart_cycle_on_state_change: false
    state_change_action:
      - lambda: id(heater_b_closed) = state;
      - binary_sensor.template.publish:
          id: heater_relay
          state: !lambda "return id(heater_a_closed) || id(heater_b_closed);"
      - binary_sensor.template.publish:
          id: heater_b_relay
          state: !lambda "return state;"

  # NOT inverted. The D-1585TL relay outlet module is active-high -- apply
  # voltage to the control terminal and the relay closes. The cheap bare
  # boards are active-low; this is not one of those, and `inverted: true`
  # here would run every duty cycle exactly backwards.
  - platform: slow_pwm
    id: fan_output
    pin: GPIO8        # D9
    period: 900s
    restart_cycle_on_state_change: false
    state_change_action:
      - binary_sensor.template.publish:
          id: fan_relay
          state: !lambda "return state;"

  - platform: template
    id: heater_output
    type: float
    write_action:
      - lambda: |-
          const float d = clamp(state, 0.0f, 1.0f);
          // From nothing to something -- Filling released, or a call for
          // heat after coasting -- closes the relays NOW. slow_pwm decides
          // at the start of each 900 s window whether the contacts close,
          // so a demand that arrives mid-window would otherwise wait out
          // the rest of it: up to fifteen minutes of "heating" with both
          // relays open. Only this edge restarts the window. A duty that
          // merely changes mid-window keeps its place in it, because
          // restarting on every 30 s adjustment would hold the contacts
          // closed for as long as the duty kept creeping up.
          if (id(heater_demand) <= 0.0f && d > 0.0f) {
            id(heater_a_pwm).restart_cycle();
            id(heater_b_pwm).restart_cycle();
          }
          id(heater_demand) = d;
          // Same duty, same instant, both halves of the tank. If these ever
          // diverge in effect, the gradient sensors above are what tell you.
          id(heater_a_pwm).set_level(d);
          id(heater_b_pwm).set_level(d);

interval:
  # Gradient accumulation. 30s matches the probes' publish cadence; k=0.01
  # is roughly a 50 minute time constant, which is short against the tank's
  # thermal time constant of hours but long enough to reject probe noise.
  - interval: 30s
    then:
      - lambda: |-
          const float a = id(water_temp).state;
          const float b = id(water_temp_b).state;
          if (std::isnan(a) || std::isnan(b)) return;
          const float g = (a - b) * 9.0f / 5.0f;
          const float k = 0.01f;

          // Three-way, not two. "demand > 0" would bin a 2% duty cycle --
          // 18 seconds of contact per 15 minute window -- as heating, and
          // dilute the heating average with what is effectively idle data.
          // Samples in the ambiguous middle are DISCARDED rather than
          // forced into a bin they would corrupt.
          const float d = id(heater_demand);
          if (d >= 0.05f) {
            float &e = id(grad_ema_heating);
            e = std::isnan(e) ? g : (k * g + (1.0f - k) * e);
            id(grad_heating_ms) = millis();
          } else if (d <= 0.0f) {
            float &e = id(grad_ema_idle);
            e = std::isnan(e) ? g : (k * g + (1.0f - k) * e);
            id(grad_idle_ms) = millis();
          }

# ---------------------------------------------------------------
# Tank mode: Normal / Filling / Cycling
# ---------------------------------------------------------------
# Three things a new tank is, in order. The controller does the work
# (set_hold, set_setpoint_override); this is the switch on the wall.
#
#   Filling   Every output held off and nothing judged. Probes in air read
#             room temperature and disagree; a Jager out of water must not
#             be powered; the learner must not watch any of it. Releasing
#             the hold re-anchors the model and caps heat while it settles,
#             because it is new water.
#   Cycling   Regulates on "Cycling Target" instead of "Target Temperature"
#             without touching it, so the owner's number is still there when
#             the tank is done. Everything else -- fan, learning, faults --
#             runs as normal.
#   Normal    The setpoint entity, as on every other board.
select:
  - platform: template
    name: "Tank Mode"
    id: tank_mode_select
    icon: "mdi:fishbowl-outline"
    entity_category: config
    options: ["Normal", "Filling", "Cycling"]
    # Reads the global back rather than keeping its own copy -- one owner,
    # same reason the setpoint number reads the controller.
    lambda: |-
      switch (id(tank_mode)) {
        case 1: return {"Filling"};
        case 2: return {"Cycling"};
        default: return {"Normal"};
      }
    update_interval: 30s
    set_action:
      - lambda: |-
          id(tank_mode) = (x == "Filling") ? 1 : (x == "Cycling") ? 2 : 0;
      - script.execute: apply_mode

script:
  - id: apply_mode
    mode: restart
    then:
      - lambda: |-
          // A restored Filling is a Filling nobody is standing at.
          if (id(tank_mode) == 1 && millis() < 15000) id(tank_mode) = 0;
          const int m = id(tank_mode);
          id(controller).set_hold(m == 1);
          id(controller).set_setpoint_override(
              m == 2 ? (id(cycling_target_f) - 32.0f) * 5.0f / 9.0f : NAN);
          id(tank_mode_select).publish_state(m == 1 ? "Filling" : m == 2 ? "Cycling" : "Normal");

globals:
  # Result of the boot-time bus autopsy (see esphome: on_boot above).
  - id: i2c_autopsy
    type: std::string
    restore_value: false
    initial_value: '""'
  # Mirrors the demand handed to heater_output so the gradient metrics can
  # tell heating from idle. Not restored: it is a live value, and a stale
  # one after reboot would mis-bin the first sample.
  - id: heater_demand
    type: float
    restore_value: false
    initial_value: '0.0'

  # Gradient EMAs. Restored, because these are long-baseline averages and
  # throwing them away on every OTA would restart the diagnosis from zero.
  - id: grad_ema_heating
    type: float
    restore_value: true
    initial_value: 'NAN'
  - id: grad_ema_idle
    type: float
    restore_value: true
    initial_value: 'NAN'

  # Freshness stamps for the two EMAs. NOT restored: millis() restarts at
  # zero on boot, so a restored timestamp would be meaningless. Zero means
  # "no sample in this boot yet", which reads as unavailable -- honest,
  # because a restored average has no provenance in the current session.
  - id: grad_heating_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: grad_idle_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'

  # Live contact state, so either relay's action can publish the pair's OR.
  - id: heater_a_closed
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: heater_b_closed
    type: bool
    restore_value: false
    initial_value: 'false'

  - id: cal_temp_offset_b_c
    type: float
    restore_value: true
    initial_value: '0.0'
  - id: cal_gradient_alarm_f
    type: float
    restore_value: true
    initial_value: '1.0'

  # Cycling target, degF. 82: nitrifying bacteria double fastest in the low
  # 80s, and 82 is the top of what an empty tank's equipment shrugs at.
  - id: cycling_target_f
    type: float
    restore_value: true
    initial_value: '82.0'
  # 0 normal, 1 filling, 2 cycling. Restored, so a reboot mid-cycle stays
  # warm. Filling is NOT restored: apply_mode maps a restored 1 back to
  # normal, because a controller that reboots with its outputs held off
  # and nobody at the tank is a cold tank by morning.
  - id: tank_mode
    type: int
    restore_value: true
    initial_value: '0'

number:
  # The veto band's ceiling. control.yaml caps the entity at 5 degF, which
  # is right for a one-probe board and wrong for this one -- see the
  # disagreement_band comment on the controller above.
  - id: !extend probe_disagreement_band
    max_value: 15.0
  # Same reason as the probe's name: two offsets, two names.
  - id: !extend cal_temp_offset_num
    name: "Cal Temp Offset ${side_a_name}"

  - platform: template
    name: "Cycling Target"
    id: cycling_target_num
    icon: "mdi:bacteria-outline"
    entity_category: config
    unit_of_measurement: "°F"
    device_class: temperature
    min_value: 78.0
    max_value: 86.0
    step: 0.5
    update_interval: 60s
    lambda: "return id(cycling_target_f);"
    set_action:
      - lambda: id(cycling_target_f) = x;
      - script.execute: apply_mode

  - platform: template
    name: "Cal Temp Offset ${side_b_name}"
    id: cal_temp_offset_b_num
    icon: "mdi:thermometer-plus"
    entity_category: config
    min_value: -5.0
    max_value: 5.0
    step: 0.1
    unit_of_measurement: "°F"
    update_interval: 60s
    # Celsius on the inside like every other temperature in this project,
    # Fahrenheit on the face because that is what a human reads.
    lambda: "return id(cal_temp_offset_b_c) * 9.0f / 5.0f;"
    set_action:
      - lambda: id(cal_temp_offset_b_c) = x * 5.0f / 9.0f;

  - platform: template
    name: "Gradient Alarm Threshold"
    id: cal_gradient_alarm_num
    icon: "mdi:thermometer-alert"
    entity_category: config
    min_value: 0.1
    max_value: 5.0
    step: 0.1
    unit_of_measurement: "°F"
    update_interval: 60s
    lambda: "return id(cal_gradient_alarm_f);"
    set_action:
      - lambda: id(cal_gradient_alarm_f) = x;

text_sensor:
  # BUILD GUARD -- see boards/xiao-esp32s3.yaml for the incident this exists
  # because of. id(ble_tx) is defined ONLY in packages/ble_link.yaml, so
  # building this board without that file fails at compile rather than
  # producing a controller that runs the tank perfectly and advertises
  # nothing for the panel to connect to.
  - platform: template
    name: "Link Payload"
    icon: "mdi:code-string"
    entity_category: diagnostic
    update_interval: 60s
    lambda: 'return {id(ble_tx)};'

  # Which of the three I2C devices answer, re-probed every minute and
  # published to Home Assistant. The boot-time scan says the same thing
  # once, on a serial console, before WiFi is even up -- which is no use
  # to someone at the tank with a phone and no meter. This is the same
  # probe the scan uses (a zero-length transaction to the address), so
  # "ok" here is exactly "Found device" there.
  #
  # The failure word is the diagnosis, and it is worth reading closely:
  #   no ack    the bus works, nobody answered at that address. All three:
  #             SDA/SCL swapped at the XIAO (try the i2c_sda/i2c_scl
  #             substitutions the other way round) or the devices are
  #             unpowered. One: that device's wire, or lux B's ADDR jumper.
  #   timeout   the bus is stuck -- a line will not move. SDA and SCL
  #             bridged (solder between the ADS1115 header pins is the
  #             classic), or a line tied hard to 3V3 (lux B's ADDR->VCC
  #             jumper touching SDA).
  # The sensor components only try at boot; after fixing a wire this line
  # goes green within a minute, the readings come back after a restart.
  - platform: template
    name: "I2C Devices"
    id: i2c_devices
    icon: "mdi:transit-connection-variant"
    entity_category: diagnostic
    update_interval: 60s
    lambda: |-
      // "${i2c_expect}" -> (addr, label) pairs. Parsed each call; it is
      // three short strings once a minute.
      static const char *spec = "${i2c_expect}";
      std::string out;
      bool all_ok = true;
      const char *p = spec;
      while (*p) {
        while (*p == ' ' || *p == ',') p++;
        if (!*p) break;
        char *end = nullptr;
        const uint8_t addr = (uint8_t) strtol(p, &end, 0);
        p = end;
        while (*p == ' ') p++;
        std::string what;
        while (*p && *p != ',') what += *p++;
        while (!what.empty() && what.back() == ' ') what.pop_back();
        const auto err = id(bus_a).write_readv(addr, nullptr, 0, nullptr, 0);
        if (!out.empty()) out += ", ";
        out += what;
        switch (err) {
          case i2c::ERROR_OK:               out += " ok"; break;
          case i2c::ERROR_NOT_ACKNOWLEDGED: out += " no ack"; all_ok = false; break;
          case i2c::ERROR_TIMEOUT:          out += " TIMEOUT"; all_ok = false; break;
          default:                          out += " error"; all_ok = false; break;
        }
      }
      // Something expected is missing: sweep every address, so a device
      // that is present but at the WRONG address (ADS1115 with ADDR on
      // VDD is 0x49, floating is anyone's guess) shows up by name of
      // where it is, instead of as one more "no ack". ~120 ms at 10kHz,
      // once a minute, only while something is wrong.
      if (!all_ok) {
        std::string found;
        for (uint8_t a = 0x08; a < 0x78; a++) {
          if (id(bus_a).write_readv(a, nullptr, 0, nullptr, 0) != i2c::ERROR_OK) continue;
          char b[8];
          snprintf(b, sizeof(b), "%s0x%02X", found.empty() ? "" : " ", a);
          found += b;
        }
        out += found.empty() ? "; bus sweep: nothing" : "; bus sweep found: " + found;
        if (!id(i2c_autopsy).empty()) out += "; at boot: " + id(i2c_autopsy);
      }
      return out;
