# LARGE TANK controller -- XIAO ESP32-S3, dual heaters, dual probes.
# Put THIS file in the ESPHome dashboard. Nothing else lives locally except
# secrets.yaml, so a push to main is all the next build needs.
#
# ---------------------------------------------------------------------
# This is the SECOND tank, not a replacement for the first
# ---------------------------------------------------------------------
# tank-monitor-xiao-remote.yaml runs the 12-13 gal tank and is untouched by
# any of this. Both boards are XIAO ESP32-S3 and both are called "the S3" in
# conversation, which is exactly how the wrong board file gets flashed --
# this one loads boards/xiao-esp32s3-LG-DUAL.yaml. Check the filename.
#
# ---------------------------------------------------------------------
# PAYLOAD v3, and why it is a different file
# ---------------------------------------------------------------------
# packages/ble_link_v3.yaml, NOT ble_link.yaml. v3 carries the second probe,
# the gradient and pH; v2 does not have room and its parser rejects any
# frame that is not exactly 15 fields.
#
# The 12-gal system stays on v2 and the round panel keeps working. The two
# systems never meet -- different controllers, different BLE MACs, different
# panels. Do NOT "upgrade" the other wrapper to v3 unless you are reflashing
# the round panel in the same sitting: a v3 controller talking to a v2 panel
# regulates the tank perfectly and shows a blank screen.
#
# ---------------------------------------------------------------------
# device_name
# ---------------------------------------------------------------------
# Deployed as tank-monitor-75-gallon, and Home Assistant is wired to that:
# the log-manual-test script, both dashboards and the chemistry automation
# all address entities as tank_monitor_75_gallon_*. Renaming the device
# re-registers 60-odd entities under a new prefix and orphans every one of
# those references.
#
# Must not collide with tank-monitor-s3, -s3mini, -round, -v2 or -w32. The
# name sets the MQTT topic prefix, discovery object ids, mDNS hostname and
# the fallback AP name all at once; two devices answering to one name
# overwrite each other's Home Assistant entities as fast as they appear.
#
# ---------------------------------------------------------------------
# side_a_name / side_b_name -- set these to the real tank
# ---------------------------------------------------------------------
# Probe A and heater A are one half of the tank, B and B the other. That
# pairing is a WIRING FACT the board file cannot verify, and if the labels
# are backwards every gradient reading points at the wrong end.
#
# Both probes carry their side's name: "Water Temperature Left" and
# "Water Temperature Right" with the values below, and so do the two
# calibration offsets and the two heater relays. Set the names to match
# how you actually mounted them.
#
# ---------------------------------------------------------------------
# Tank Mode -- Normal / Filling / Cycling
# ---------------------------------------------------------------------
# A select entity on the controller, not a Home Assistant helper. Filling
# holds every output off and judges nothing (probes in air, heaters maybe
# too); Cycling regulates on "Cycling Target" (default 82 F) without
# touching "Target Temperature"; Normal is the setpoint as usual. Filling
# does not survive a reboot on purpose. Cycling does.
substitutions:
  device_name: tank-monitor-75-gallon
  friendly_name: Tank Monitor 75 Gallon

  # ---- REPLACE with the physical arrangement ----
  # Heater A + probe A are inboard on the back wall, left of the centre
  # feed. Heater B + probe B are the mirror. If you mounted them the other
  # way round, swap these rather than rewiring.
  side_a_name: "Left"
  side_b_name: "Right"

  # ---- I2C pads. Only touch these if SDA/SCL went on the wrong way ----
  # Default is SDA on D6, SCL on D7. If the "I2C Devices" diagnostic says
  # "no ack" for everything, swap the two values here and reflash before
  # reaching for the iron.
  # i2c_sda: "44"
  # i2c_scl: "43"

  # ---- NO LUX SENSORS, for now (2026-09-17) ----
  # Both BH1750 runs shorted the 3V3 rail on the bench and the tank went
  # live without them. The controller treats a missing light reading as
  # "light = 0" and everything else is unaffected; what is lost is the
  # thermal model's light-gain term and any future automation keyed off
  # MEASURED light. The three pieces below are one change: this line, and
  # the sensor: block at the bottom. To fit the lux sensors later, delete
  # all three and reflash -- the board file has been lux-capable all along.
  i2c_expect: "0x48 ADS1115"

packages:
  tank_monitor:
    url: https://github.com/JoshuaSeidel/tank-monitor
    ref: main
    files:
      - packages/base.yaml
      - packages/webui.yaml
      - packages/control.yaml
      - packages/sensors.yaml
      - packages/ph.yaml
      # BLE v3, not v2, and NEVER espnow_link.yaml alongside it. A device
      # running WiFi + ESP-NOW + BLE lost its link and then its web server
      # on the CYD.
      - packages/ble_link_v3.yaml
      - boards/xiao-esp32s3-lg-dual.yaml
    # refresh defaults to 1d, which would silently build yesterday's config.
    refresh: 0s

# ---------------------------------------------------------------------
# CALIBRATION IS PER-BOARD AND DOES NOT TRANSFER
# ---------------------------------------------------------------------
# ph_v_high and ph_v_low are volts read through THIS board's converter, and
# this board reads pH on an ADS1115 rather than the internal ADC. Do not
# copy them from tank-monitor-xiao-remote.yaml -- measure them here, against
# buffer. See packages/ph.yaml for the procedure.
#
# Each voltage travels with the pH it was measured at: ph_cal_high with
# ph_v_high, ph_cal_low with ph_v_low. Record the pair or the volts mean
# nothing. THIS board is calibrated against the NIST set (9.18 / 6.86) with
# 4.00 kept back as the independent check -- they bracket a tank at 7.x,
# where the old 7.00 / 4.00 pair would have extrapolated.
#
# The same applies to cal_tds_k and the two temperature offsets, which live
# in NVS rather than here: they survive a flash and will be silently wrong
# on new hardware. The C6 -> S3 swap moved TDS by ~30% for exactly this
# reason. Recalibrate before trusting any reading.
#
# substitutions:
#   ph_cal_high: "9.18"
#   ph_v_high: "1.1480"
#   ph_cal_low: "6.86"
#   ph_v_low: "1.5480"

# ---- LUX COMES FROM THE LIGHT POD, OVER BLE ----
# There is still no lux sensor on THIS board's I2C bus -- that is what
# i2c_expect: "0x48 ADS1115" above is saying, and it stays true. Both
# BH1750s are dropped from the build so they are not two failed components
# at every boot.
#
# Instead tank-monitor-light-pod (boards/xiao-esp32s3-light-pod.yaml) reads
# a BH1750 a few inches from its own MCU and pushes the value here over BLE,
# connecting once a minute to write it and disconnecting again. Peer to
# peer: no broker, no Home Assistant, no router. The light-gain term is a
# control input, so it must not depend on anything that can be down.
#
# The id is unchanged, so every consumer downstream is untouched --
# control.yaml's `illuminance: tank_lux`, slot 5 of the v3 BLE payload to
# the panel, and the web page all just read this id.
sensor:
  - id: !remove tank_lux
  - id: !remove tank_lux_b

  # Believed only while it is FRESH. The pod pushes every 60 s; three
  # missed pushes and this goes NaN, which the controller already treats
  # as "light = 0" -- the behaviour this board has had all along with no
  # sensor at all. Without the timeout, a pod that died at noon would feed
  # the thermal model one frozen sunny number through every night that
  # followed, and the model would learn from it.
  - platform: template
    name: "Tank Light Level"
    id: tank_lux
    unit_of_measurement: lx
    device_class: illuminance
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 30s
    lambda: |-
      if (id(rx_lux_ms) == 0) return {};                      // nothing ever heard
      if (millis() - id(rx_lux_ms) > 180000) return {};       // 3 missed pushes
      return id(rx_lux);

  # So a silently dead link is visible rather than inferred from a blank
  # tile -- the same reason the panel carries a link age.
  - platform: template
    name: "Light Link Age"
    id: lux_link_age
    unit_of_measurement: s
    device_class: duration
    state_class: measurement
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 30s
    lambda: |-
      if (id(rx_lux_ms) == 0) return {};
      return (millis() - id(rx_lux_ms)) / 1000.0f;
