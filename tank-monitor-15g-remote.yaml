# KAIDEN'S 15 GAL controller -- the old nano XIAO ESP32-S3, reused.
# Put THIS in the ESPHome dashboard.
#
# Heater, fan, CO2 solenoid, bubbler, one temperature probe, TDS, BH1750
# lux, and pH on D3 -- configured now, reading unknown until a probe is
# fitted, so fitting one needs no reflash (see the board file).
#
# NO HOME ASSISTANT. Everything this tank keeps, it keeps itself: the
# controller holds 24 h and 30 days of history and the water-test log in
# flash, and serves the whole tank -- live pages like the panel's, charts,
# tests, settings, calibration and diagnostics -- on its own web page at
# http://tank-monitor-15-gallon.local/ (or its IP). Firmware updates are
# uploaded on that page.
#
# Wi-Fi is Kaiden's: add standalone_wifi_ssid / standalone_wifi_password
# to secrets.yaml (see packages/standalone.yaml).
#
# Everything below packages: is pulled from git on every build; this wrapper
# is the one file that is not, so nothing load-critical lives here.
#
# device_name is load-bearing: mDNS host, the AP name and the BLE model all
# derive from it. This board last ran as tank-monitor-s3, which now belongs
# to the nano's all-in-one. Must not collide with any other tank-monitor-*.
#
# The panel needs this board's BLE MAC. After the first flash, read
# "Controller BLE MAC" on the Diagnostics page (or the boot log line
# "[esp32_ble:...] ESP-IDF BLE MAC address: ...") and put it in
# tank-monitor-15g-panel-remote.yaml as s3_ble_mac.
substitutions:
  device_name: tank-monitor-15-gallon
  friendly_name: Tank Monitor 15 Gallon

packages:
  tank_monitor:
    url: https://github.com/JoshuaSeidel/tank-monitor
    ref: main
    files:
      - packages/base.yaml
      - packages/webui.yaml
      - packages/control.yaml
      - packages/sensors.yaml
      # v3, because the 4.3" panel this tank inherits speaks nothing else.
      # The board file supplies the second-probe and pH fields as not fitted.
      - packages/ble_link_v3.yaml
      - packages/standalone_controller.yaml
      - boards/xiao-esp32s3-15g.yaml
      # After the board file, as on the panel: a later package's
      # substitutions win, so nothing can override the tank's layout.
      - packages/layout_15g.yaml
      # CO2 solenoid and bubbler schedule, on the device. Ships with the
      # CO2 schedule OFF -- turn it on from the web page.
      - packages/co2_bubbler.yaml
      # LAST: removes MQTT and sets Kaiden's Wi-Fi.
      - packages/standalone.yaml
    # refresh defaults to 1d, which would silently build yesterday's config.
    refresh: 0s
