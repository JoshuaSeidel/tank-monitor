# KAIDEN'S 15 GAL panel -- Waveshare ESP32-S3-Touch-LCD-4.3, 800x480.
# Put THIS file in the ESPHome dashboard.
#
# The 4.3" panel the 75 used until the P4 wall panel replaced it, reflashed
# for the 15 gal. Pairs with tank-monitor-15g-remote.yaml over BLE, payload
# v3, plus a second characteristic carrying the newest water test. No Home
# Assistant and no MQTT: the panel needs Wi-Fi only for its clock.
#
# What it draws comes from packages/layout_15g.yaml, the same file the
# controller's web page draws from.
#
# Put a FAT32 micro-SD card in the TF slot: it keeps history for good,
# backs up the controller's settings every night and keeps a copy of every
# firmware build (packages/sd_archive_panel.yaml). Everything else works
# without one.
#
# ---------------------------------------------------------------------
# s3_ble_mac -- the 15 gal controller's BLE address
# ---------------------------------------------------------------------
# The value below is what this XIAO reported as the nano controller on
# 2026-10-06 (the AMOLED wrapper's s3_ble_mac then). It is the same chip,
# so it should be the same address -- but confirm it against the 15 gal
# controller's "Controller BLE MAC" (its web page, Diagnostics) after its
# first flash. A wrong MAC compiles cleanly and then never connects.
#
# device_name must not collide with tank-monitor-15-gallon, -75g,
# -75-gallon, -s3, -panel or any other tank-monitor-*.
substitutions:
  device_name: tank-monitor-15g
  friendly_name: Tank Monitor 15G Panel
  s3_ble_mac: "E0:72:A1:F7:D6:86"

packages:
  tank_monitor:
    url: https://github.com/JoshuaSeidel/tank-monitor
    ref: main
    files:
      - packages/base.yaml
      # Display-only: this REPLACES control.yaml and sensors.yaml. Loading
      # either alongside it collides on every id.
      - packages/ble_link_panel_v3.yaml
      # Water tests from the controller over BLE -- in place of
      # packages/chemistry.yaml, which takes them from Home Assistant.
      - packages/ble_chem_panel.yaml
      - packages/layout_15g.yaml
      - boards/waveshare-esp32s3-lcd-43.yaml
      # The SD card: forever-history, nightly backups, firmware copies.
      - packages/sd_archive_panel.yaml
      # LAST: removes MQTT and sets Kaiden's Wi-Fi.
      - packages/standalone.yaml
    refresh: 0s
