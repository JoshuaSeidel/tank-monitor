# Thin wrapper for the CYD (ESP32-2432S028R, 2.8" ILI9341) build.
#
# Identical to tank-monitor-remote.yaml except for the board file on the
# last line. Everything above it -- Wi-Fi, MQTT, the tank_controller and
# every sensor -- is shared, so a control-loop change lands on both boards
# from one push.
#
# device_name MUST differ from the C6's if both boards run at once. It is
# not cosmetic: it sets the MQTT topic prefix, the discovery object ids,
# the mDNS hostname and the fallback AP name all at once. Two devices
# answering to "tank-monitor" publish to identical topics and overwrite
# each other's Home Assistant entities as fast as they appear -- which
# looks like entities silently going missing, not like a name clash.
#
# Secrets are NOT affected. base.yaml references fixed keys
# (tank_monitor_mqtt_username and friends) rather than deriving them from
# device_name, so both boards share one Wi-Fi, MQTT and OTA identity with
# nothing to add to secrets.yaml.
#
# Change this if you renamed the device; it only has to be unique.
substitutions:
  device_name: tank-monitor-v2
  friendly_name: Tank Monitor v2
packages:
  tank_monitor:
    url: https://github.com/JoshuaSeidel/tank-monitor
    ref: main
    files:
      - packages/base.yaml
      - packages/webui.yaml
      - packages/control.yaml
      - packages/sensors.yaml
      - packages/chemistry.yaml
      - packages/migrate.yaml
      - boards/cyd-esp32-2432s028r.yaml
    refresh: 0s
